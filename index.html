."}, {"who": "Lily", "g": "f", "en": "That's kind of exciting, but also a little scary if you think about it.", "vi": "Nghe cũng khá thú vị, nhưng cũng hơi đáng sợ nếu nghĩ kỹ."}, {"who": "Mia", "g": "f", "en": "Why scary? I think it would be amazing to meet another civilization.", "vi": "Sao lại đáng sợ? Mình thấy sẽ tuyệt vời nếu được gặp một nền văn minh khác."}, {"who": "Lily", "g": "f", "en": "What if they're way more advanced than us? That could be a problem.", "vi": "Lỡ họ tiên tiến hơn chúng ta nhiều thì sao? Đó có thể là một vấn đề."}, {"who": "Jake", "g": "m", "en": "Ha, you've been watching too many movies. Most scientists just want to find microbes, not monsters.", "vi": "Ha, cậu xem phim nhiều quá rồi. Hầu hết nhà khoa học chỉ muốn tìm vi sinh vật thôi, không phải quái vật."}, {"who": "Mia", "g": "f", "en": "Microbes would still be a huge discovery, though.", "vi": "Nhưng tìm ra vi sinh vật cũng đã là một khám phá rất lớn rồi."}, {"who": "Jake", "g": "m", "en": "For sure. It would prove Earth isn't special at all.", "vi": "Chắc chắn rồi. Nó sẽ chứng minh Trái Đất chẳng có gì đặc biệt cả."}, {"who": "Lily", "g": "f", "en": "I guess we'll just have to wait and see what the new telescopes find.", "vi": "Chắc chúng ta chỉ còn cách chờ xem những kính thiên văn mới tìm ra được gì thôi."}], "vocab": [{"w": "universe", "f": ["universe", "universes"], "pos": "n", "ipa": "ˈjuːnɪvɜːrs", "vi": "vũ trụ", "ex": "Scientists are still trying to understand how the universe began.", "exVi": "Các nhà khoa học vẫn đang cố tìm hiểu vũ trụ bắt đầu như thế nào."}, {"w": "planet", "f": ["planet", "planets"], "pos": "n", "ipa": "ˈplænɪt", "vi": "hành tinh", "ex": "Mars is the fourth planet from the sun.", "exVi": "Sao Hỏa là hành tinh thứ tư tính từ mặt trời."}, {"w": "discover", "f": ["discover", "discovers", "discovered", "discovering"], "pos": "v", "ipa": "dɪˈskʌvər", "vi": "khám phá, phát hiện", "ex": "They discovered a new planet last year.", "exVi": "Họ đã phát hiện ra một hành tinh mới vào năm ngoái."}, {"w": "alien", "f": ["alien", "aliens"], "pos": "n", "ipa": "ˈeɪliən", "vi": "người ngoài hành tinh", "ex": "The movie is about aliens visiting Earth.", "exVi": "Bộ phim nói về người ngoài hành tinh đến thăm Trái Đất."}, {"w": "telescope", "f": ["telescope", "telescopes"], "pos": "n", "ipa": "ˈtelɪskoʊp", "vi": "kính thiên văn", "ex": "We used a telescope to look at the moon.", "exVi": "Chúng tôi dùng kính thiên văn để nhìn mặt trăng."}, {"w": "gravity", "f": ["gravity"], "pos": "n", "ipa": "ˈɡrævɪti", "vi": "trọng lực", "ex": "Gravity is what keeps us on the ground.", "exVi": "Trọng lực là thứ giữ chúng ta ở trên mặt đất."}, {"w": "atmosphere", "f": ["atmosphere", "atmospheres"], "pos": "n", "ipa": "ˈætməsfɪər", "vi": "khí quyển", "ex": "Earth's atmosphere protects us from harmful rays.", "exVi": "Khí quyển Trái Đất bảo vệ chúng ta khỏi các tia có hại."}, {"w": "explore", "f": ["explore", "explores", "explored", "exploring"], "pos": "v", "ipa": "ɪkˈsplɔːr", "vi": "khám phá, thám hiểm", "ex": "Humans have always wanted to explore space.", "exVi": "Con người luôn muốn khám phá không gian."}, {"w": "advanced", "f": ["advanced"], "pos": "adj", "ipa": "ədˈvænst", "vi": "tiên tiến", "ex": "That country has very advanced technology.", "exVi": "Đất nước đó có công nghệ rất tiên tiến."}, {"w": "signal", "f": ["signal", "signals"], "pos": "n", "ipa": "ˈsɪɡnəl", "vi": "tín hiệu", "ex": "They received a strange signal from space.", "exVi": "Họ nhận được một tín hiệu lạ từ không gian."}], "grammar": [{"title": "Might/May để diễn tả khả năng", "formula": "S + might/may + động từ nguyên mẫu", "use": "Dùng khi nói về điều có thể xảy ra nhưng chưa chắc chắn. 'Might' và 'may' gần như giống nhau về nghĩa trong văn nói hằng ngày.", "examples": [{"en": "There might be life on other planets.", "vi": "Có thể có sự sống trên các hành tinh khác."}, {"en": "It may rain later, so bring an umbrella.", "vi": "Có thể trời sẽ mưa sau đó, nên mang theo ô."}, {"en": "She might not come to the party tonight.", "vi": "Có thể tối nay cô ấy sẽ không đến bữa tiệc."}]}, {"title": "So sánh hơn với 'too...for'", "formula": "S + tobe + too + tính từ + for + noun/to V", "use": "Dùng để nói một điều gì đó vượt quá mức cho phép hoặc mức có thể. Rất hay dùng trong văn nói tự nhiên.", "examples": [{"en": "The universe is too big for us to fully understand.", "vi": "Vũ trụ quá rộng lớn để chúng ta hiểu hết được."}, {"en": "This box is too heavy for me to carry alone.", "vi": "Cái hộp này quá nặng để tôi tự mang một mình."}, {"en": "It's too late to call her now.", "vi": "Bây giờ gọi cho cô ấy thì quá trễ rồi."}]}], "phrases": [{"p": "out of this world", "vi": "tuyệt vời, phi thường (nghĩa bóng)", "ex": "The view from the mountain top was out of this world.", "exVi": "Khung cảnh từ đỉnh núi đẹp không tưởng.", "ctx": "Thân mật, dùng để khen ngợi điều gì đó cực kỳ tuyệt vời."}, {"p": "who knows", "vi": "ai mà biết được", "ex": "Who knows what we'll discover in space next?", "exVi": "Ai mà biết được tiếp theo chúng ta sẽ khám phá ra điều gì trong không gian?", "ctx": "Thân mật, dùng khi không chắc chắn về điều gì đó."}, {"p": "it's anyone's guess", "vi": "chẳng ai biết chắc, đoán mò thôi", "ex": "Whether aliens exist is anyone's guess at this point.", "exVi": "Người ngoài hành tinh có tồn tại hay không thì đến giờ vẫn chỉ là đoán mò.", "ctx": "Trung tính, dùng khi không có câu trả lời rõ ràng."}, {"p": "keep an open mind", "vi": "giữ đầu óc cởi mở, không phán xét vội", "ex": "You should keep an open mind about things science hasn't explained yet.", "exVi": "Bạn nên giữ đầu óc cởi mở về những điều khoa học chưa giải thích được.", "ctx": "Trung tính, thường dùng khi khuyên ai đó."}, {"p": "far-fetched", "vi": "khó tin, xa vời thực tế", "ex": "The idea of aliens visiting Earth sounds far-fetched to some people.", "exVi": "Ý tưởng người ngoài hành tinh ghé thăm Trái Đất nghe khó tin với một số người.", "ctx": "Trung tính, dùng khi nói một ý tưởng khó xảy ra."}, {"p": "over the moon", "vi": "cực kỳ vui mừng, sung sướng", "ex": "Scientists were over the moon when they found the new planet.", "exVi": "Các nhà khoa học vui mừng khôn xiết khi tìm ra hành tinh mới.", "ctx": "Thân mật, dùng để diễn tả cảm xúc rất vui."}, {"p": "a long shot", "vi": "khả năng thấp, cơ hội mong manh", "ex": "Finding another Earth is a long shot, but scientists keep trying.", "exVi": "Việc tìm ra một Trái Đất khác là khả năng rất thấp, nhưng các nhà khoa học vẫn cố gắng.", "ctx": "Trung tính, dùng khi nói về điều khó xảy ra."}, {"p": "in the blink of an eye", "vi": "trong nháy mắt, rất nhanh", "ex": "Technology has changed in the blink of an eye over the last decade.", "exVi": "Công nghệ đã thay đổi trong nháy mắt suốt thập kỷ qua.", "ctx": "Thân mật, nhấn mạnh tốc độ nhanh."}, {"p": "hard to wrap your head around", "vi": "khó mà hiểu nổi, khó hình dung", "ex": "The size of the universe is hard to wrap your head around.", "exVi": "Kích thước của vũ trụ thật khó mà hình dung nổi.", "ctx": "Thân mật, dùng khi một điều gì đó quá phức tạp hoặc to lớn để hiểu."}, {"p": "time will tell", "vi": "thời gian sẽ trả lời", "ex": "Whether we ever meet aliens, only time will tell.", "exVi": "Liệu chúng ta có bao giờ gặp người ngoài hành tinh hay không, chỉ thời gian mới trả lời được.", "ctx": "Trung tính, dùng khi kết quả chỉ có thể biết trong tương lai."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Scientists (1)___ that many stars have planets around them.", "o": ["believes", "believe", "believed"], "a": 1, "why": "Chủ ngữ 'scientists' số nhiều, hiện tại đơn dùng 'believe'."}, {"t": "The universe is (2)___ big for us to fully understand.", "o": ["so", "too", "very"], "a": 1, "why": "Cấu trúc 'too...for...to' diễn tả 'quá... để...'."}, {"t": "They found a planet that (3)___ be in the habitable zone.", "o": ["might", "must", "can"], "a": 0, "why": "'Might' diễn tả khả năng có thể xảy ra, chưa chắc chắn."}, {"t": "No signal has ever (4)___ proven to come from aliens.", "o": ["be", "being", "been"], "a": 2, "why": "Thì hiện tại hoàn thành bị động: has/have + been + V3."}, {"t": "If we find life, it (5)___ change how we see the universe.", "o": ["will", "would", "did"], "a": 0, "why": "Câu điều kiện loại 1: If + hiện tại đơn, S + will + V."}, {"t": "New telescopes are (6)___ built right now.", "o": ["be", "being", "been"], "a": 1, "why": "Bị động thì hiện tại tiếp diễn: is/are + being + V3."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Jake said the idea (1)___ far-fetched to some people.", "o": ["sound", "sounds", "sounded"], "a": 1, "why": "Câu tường thuật hiện tại đơn giữ nguyên khi sự thật vẫn đúng: 'sounds'."}, {"t": "Mia asked Jake (2)___ he really believed in aliens.", "o": ["if", "that", "what"], "a": 0, "why": "Câu hỏi Yes/No trong câu tường thuật dùng 'if' hoặc 'whether'."}, {"t": "Lily thought meeting aliens (3)___ be a little scary.", "o": ["might", "might to", "might been"], "a": 0, "why": "'Might' theo sau là động từ nguyên mẫu không 'to'."}, {"t": "Whether aliens exist is anyone's (4)___.", "o": ["guessed", "guess", "guessing"], "a": 1, "why": "Thành ngữ cố định 'anyone's guess' dùng danh từ 'guess'."}, {"t": "Only time will (5)___ if we ever find them.", "o": ["tell", "says", "told"], "a": 0, "why": "Sau 'will' dùng động từ nguyên mẫu: 'tell'."}, {"t": "You should keep an open (6)___ about things science can't explain.", "o": ["mind", "minds", "minded"], "a": 0, "why": "Thành ngữ cố định 'keep an open mind' dùng số ít 'mind'."}]}]}, {"id": "B1-HEALTH-001", "topic": "HEALTH", "n": 1, "level": "B1", "title": "Getting a Good Night's Sleep", "titleVi": "Có một giấc ngủ ngon", "passage": [{"en": "Sleep is one of the most important things for our health, but many of us don't get enough of it.", "vi": "Giấc ngủ là một trong những điều quan trọng nhất cho sức khỏe, nhưng nhiều người trong chúng ta không ngủ đủ."}, {"en": "Doctors usually recommend that adults sleep between seven and nine hours every night.", "vi": "Bác sĩ thường khuyên người lớn nên ngủ từ bảy đến chín tiếng mỗi đêm."}, {"en": "When you don't sleep enough, it's harder to focus and your mood can get worse.", "vi": "Khi bạn ngủ không đủ, sẽ khó tập trung hơn và tâm trạng cũng có thể tệ đi."}, {"en": "Over time, poor sleep can even affect your heart and your immune system.", "vi": "Về lâu dài, ngủ kém thậm chí có thể ảnh hưởng đến tim và hệ miễn dịch của bạn."}, {"en": "So what can we actually do to sleep better?", "vi": "Vậy chúng ta thực sự có thể làm gì để ngủ ngon hơn?"}, {"en": "First, try to go to bed and wake up at the same time every day, even on weekends.", "vi": "Trước tiên, hãy cố gắng đi ngủ và thức dậy vào cùng một giờ mỗi ngày, kể cả cuối tuần."}, {"en": "This helps your body build a natural rhythm, so falling asleep becomes easier.", "vi": "Điều này giúp cơ thể bạn hình thành một nhịp sinh học tự nhiên, nên việc chìm vào giấc ngủ sẽ dễ dàng hơn."}, {"en": "Second, avoid looking at your phone right before bed.", "vi": "Thứ hai, tránh nhìn vào điện thoại ngay trước khi đi ngủ."}, {"en": "The bright light from the screen can trick your brain into thinking it's still daytime.", "vi": "Ánh sáng chói từ màn hình có thể đánh lừa não bạn nghĩ rằng vẫn còn là ban ngày."}, {"en": "Try reading a book or listening to quiet music instead.", "vi": "Hãy thử đọc sách hoặc nghe nhạc nhẹ nhàng thay vào đó."}, {"en": "Third, be careful with caffeine, especially in the afternoon.", "vi": "Thứ ba, hãy cẩn thận với caffeine, đặc biệt là vào buổi chiều."}, {"en": "A cup of coffee at four in the afternoon can still keep you awake at midnight.", "vi": "Một tách cà phê lúc bốn giờ chiều vẫn có thể khiến bạn tỉnh táo đến tận nửa đêm."}, {"en": "It also helps to keep your bedroom cool, dark and quiet.", "vi": "Việc giữ phòng ngủ mát mẻ, tối và yên tĩnh cũng rất hữu ích."}, {"en": "If your mind is full of worries, try writing them down before bed instead of thinking about them all night.", "vi": "Nếu đầu óc bạn đầy lo lắng, hãy thử viết chúng ra trước khi ngủ thay vì suy nghĩ suốt đêm."}, {"en": "Good sleep doesn't happen by accident; it comes from small habits you repeat every day.", "vi": "Giấc ngủ ngon không tự nhiên mà có; nó đến từ những thói quen nhỏ bạn lặp lại mỗi ngày."}, {"en": "Once you build those habits, you will probably feel more energetic and focused during the day.", "vi": "Một khi bạn xây dựng được những thói quen đó, bạn sẽ có thể cảm thấy tràn đầy năng lượng và tập trung hơn vào ban ngày."}], "dialogue": [{"who": "Sam", "g": "m", "en": "You look really tired today, Anna. Did you sleep okay?", "vi": "Trông hôm nay cậu mệt lắm, Anna. Cậu ngủ ổn không?"}, {"who": "Anna", "g": "f", "en": "Not really. I tossed and turned for hours last night.", "vi": "Không hẳn. Tối qua mình trằn trọc mãi không ngủ được."}, {"who": "Sam", "g": "m", "en": "That sounds rough. Do you know why?", "vi": "Nghe khó chịu thật đấy. Cậu có biết vì sao không?"}, {"who": "Anna", "g": "f", "en": "I think it's because I was on my phone until really late.", "vi": "Mình nghĩ là do mình dùng điện thoại đến tận khuya."}, {"who": "Sam", "g": "m", "en": "Yeah, that light from the screen really messes with your sleep.", "vi": "Đúng vậy, ánh sáng từ màn hình thật sự làm rối loạn giấc ngủ của cậu."}, {"who": "Anna", "g": "f", "en": "I know, but it's so hard to put it down before bed.", "vi": "Mình biết, nhưng thật khó để bỏ điện thoại xuống trước khi ngủ."}, {"who": "Sam", "g": "m", "en": "Maybe try reading a book instead? It works for me.", "vi": "Hay là thử đọc sách thay vào đó? Cách đó có hiệu quả với mình."}, {"who": "Anna", "g": "f", "en": "That's a good idea. I also drink coffee way too late in the day.", "vi": "Ý hay đấy. Mình cũng hay uống cà phê quá trễ trong ngày."}, {"who": "Sam", "g": "m", "en": "Ah, that would definitely keep you awake at night.", "vi": "À, cái đó chắc chắn sẽ khiến cậu tỉnh táo vào ban đêm."}, {"who": "Anna", "g": "f", "en": "I guess I need a proper bedtime routine.", "vi": "Chắc mình cần một thói quen đi ngủ đàng hoàng."}, {"who": "Sam", "g": "m", "en": "Same time every night helps a lot. My body just knows when to shut down now.", "vi": "Đi ngủ cùng giờ mỗi tối giúp ích rất nhiều. Cơ thể mình bây giờ tự biết khi nào cần 'tắt máy'."}, {"who": "Anna", "g": "f", "en": "I'm honestly exhausted just talking about how tired I am.", "vi": "Nói thật là chỉ nói về việc mình mệt thôi mình cũng thấy kiệt sức rồi."}, {"who": "Sam", "g": "m", "en": "Ha! Well, tonight, try turning your phone off an hour early.", "vi": "Ha! Thôi thì tối nay thử tắt điện thoại sớm một tiếng xem sao."}, {"who": "Anna", "g": "f", "en": "I'll give it a try. I really need to catch up on sleep this weekend.", "vi": "Mình sẽ thử xem. Mình thật sự cần ngủ bù vào cuối tuần này."}, {"who": "Sam", "g": "m", "en": "Good luck! Let me know if it works.", "vi": "Chúc may mắn! Nhớ báo mình biết nếu nó có hiệu quả nhé."}], "vocab": [{"w": "exhausted", "f": ["exhausted"], "pos": "adj", "ipa": "ɪɡˈzɔːstɪd", "vi": "kiệt sức", "ex": "I felt completely exhausted after the long trip.", "exVi": "Tôi cảm thấy hoàn toàn kiệt sức sau chuyến đi dài."}, {"w": "routine", "f": ["routine", "routines"], "pos": "n", "ipa": "ruːˈtiːn", "vi": "thói quen, lịch trình", "ex": "Having a bedtime routine helps you sleep better.", "exVi": "Có một thói quen trước khi ngủ giúp bạn ngủ ngon hơn."}, {"w": "caffeine", "f": ["caffeine"], "pos": "n", "ipa": "kæˈfiːn", "vi": "caffeine (chất kích thích trong cà phê)", "ex": "Too much caffeine can keep you awake at night.", "exVi": "Quá nhiều caffeine có thể khiến bạn tỉnh táo vào ban đêm."}, {"w": "immune system", "f": ["immune system"], "pos": "n", "ipa": "ɪˈmjuːn ˈsɪstəm", "vi": "hệ miễn dịch", "ex": "Good sleep keeps your immune system strong.", "exVi": "Ngủ ngon giúp hệ miễn dịch của bạn khỏe mạnh."}, {"w": "focus", "f": ["focus", "focuses", "focused", "focusing"], "pos": "v", "ipa": "ˈfoʊkəs", "vi": "tập trung", "ex": "It's hard to focus when you're tired.", "exVi": "Rất khó để tập trung khi bạn mệt."}, {"w": "habit", "f": ["habit", "habits"], "pos": "n", "ipa": "ˈhæbɪt", "vi": "thói quen", "ex": "Drinking water in the morning is a healthy habit.", "exVi": "Uống nước vào buổi sáng là một thói quen tốt cho sức khỏe."}, {"w": "rhythm", "f": ["rhythm", "rhythms"], "pos": "n", "ipa": "ˈrɪðəm", "vi": "nhịp điệu", "ex": "Your body has its own natural sleep rhythm.", "exVi": "Cơ thể bạn có nhịp ngủ tự nhiên riêng của nó."}, {"w": "mood", "f": ["mood", "moods"], "pos": "n", "ipa": "muːd", "vi": "tâm trạng", "ex": "Not sleeping enough can put you in a bad mood.", "exVi": "Ngủ không đủ có thể khiến bạn có tâm trạng xấu."}, {"w": "screen", "f": ["screen", "screens"], "pos": "n", "ipa": "skriːn", "vi": "màn hình", "ex": "Try to avoid screens before going to bed.", "exVi": "Hãy cố gắng tránh nhìn màn hình trước khi đi ngủ."}, {"w": "relax", "f": ["relax", "relaxes", "relaxed", "relaxing"], "pos": "v", "ipa": "rɪˈlæks", "vi": "thư giãn", "ex": "Reading a book helps me relax before bed.", "exVi": "Đọc sách giúp tôi thư giãn trước khi ngủ."}], "grammar": [{"title": "Should/Shouldn't để đưa ra lời khuyên", "formula": "S + should/shouldn't + động từ nguyên mẫu", "use": "Dùng để khuyên ai đó nên hoặc không nên làm gì. Đây là cách đưa lời khuyên tự nhiên và lịch sự nhất trong tiếng Anh hằng ngày.", "examples": [{"en": "You should go to bed earlier tonight.", "vi": "Tối nay bạn nên đi ngủ sớm hơn."}, {"en": "You shouldn't drink coffee in the afternoon.", "vi": "Bạn không nên uống cà phê vào buổi chiều."}, {"en": "We should turn off our phones before bed.", "vi": "Chúng ta nên tắt điện thoại trước khi ngủ."}]}, {"title": "Thì hiện tại hoàn thành với 'for' và 'since'", "formula": "S + have/has + V3 + for/since + thời gian", "use": "Dùng để nói về một hành động bắt đầu trong quá khứ và vẫn tiếp tục đến hiện tại. 'For' dùng với khoảng thời gian, 'since' dùng với mốc thời gian.", "examples": [{"en": "I haven't slept well for three days.", "vi": "Tôi đã ngủ không ngon suốt ba ngày nay."}, {"en": "She has had trouble sleeping since last month.", "vi": "Cô ấy đã gặp khó khăn khi ngủ kể từ tháng trước."}, {"en": "We've had this bad habit for years.", "vi": "Chúng tôi đã có thói quen xấu này nhiều năm rồi."}]}], "phrases": [{"p": "hit the hay", "vi": "đi ngủ", "ex": "I'm exhausted, so I'm going to hit the hay early tonight.", "exVi": "Mình kiệt sức rồi nên tối nay sẽ đi ngủ sớm.", "ctx": "Rất thân mật, dùng giữa bạn bè."}, {"p": "toss and turn", "vi": "trằn trọc, không ngủ được", "ex": "I tossed and turned all night because of the noise outside.", "exVi": "Mình trằn trọc cả đêm vì tiếng ồn bên ngoài.", "ctx": "Trung tính, dùng khi mô tả giấc ngủ không yên."}, {"p": "sleep like a log", "vi": "ngủ say như chết", "ex": "After the hike, I slept like a log for ten hours.", "exVi": "Sau chuyến leo núi, mình ngủ say như chết suốt mười tiếng.", "ctx": "Thân mật, dùng để khen giấc ngủ ngon."}, {"p": "catch some Z's", "vi": "chợp mắt một chút, tranh thủ ngủ", "ex": "I'm going to catch some Z's before the meeting.", "exVi": "Mình sẽ chợp mắt một chút trước cuộc họp.", "ctx": "Rất thân mật, hay dùng trong văn nói."}, {"p": "an early bird", "vi": "người dậy sớm", "ex": "My dad is an early bird; he wakes up at five every day.", "exVi": "Bố mình là người dậy sớm; ông ấy thức dậy lúc năm giờ mỗi ngày.", "ctx": "Trung tính, dùng để mô tả tính cách."}, {"p": "a night owl", "vi": "cú đêm, người thức khuya", "ex": "She's a night owl and works best after midnight.", "exVi": "Cô ấy là cú đêm và làm việc hiệu quả nhất sau nửa đêm.", "ctx": "Trung tính, dùng để mô tả tính cách."}, {"p": "wind down", "vi": "thư giãn, làm dịu lại trước khi ngủ", "ex": "I like to wind down with some music before bed.", "exVi": "Mình thích thư giãn với chút âm nhạc trước khi ngủ.", "ctx": "Trung tính, dùng khi nói về việc chuẩn bị đi ngủ."}, {"p": "recharge your batteries", "vi": "nạp lại năng lượng", "ex": "A good weekend of sleep really helps me recharge my batteries.", "exVi": "Một cuối tuần ngủ ngon thật sự giúp mình nạp lại năng lượng.", "ctx": "Thân mật, thường dùng khi nói về nghỉ ngơi."}, {"p": "run on empty", "vi": "kiệt sức, hết năng lượng nhưng vẫn phải hoạt động", "ex": "I've been running on empty all week because of bad sleep.", "exVi": "Cả tuần nay mình kiệt sức nhưng vẫn phải gồng lên vì ngủ không đủ.", "ctx": "Thân mật, dùng khi rất mệt mỏi."}, {"p": "catch up on sleep", "vi": "ngủ bù", "ex": "I plan to catch up on sleep this weekend.", "exVi": "Mình định ngủ bù vào cuối tuần này.", "ctx": "Trung tính, dùng phổ biến trong văn nói."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Doctors recommend that adults (1)___ seven to nine hours of sleep.", "o": ["get", "gets", "getting"], "a": 0, "why": "Sau 'recommend that' dùng động từ nguyên mẫu (subjunctive), không chia."}, {"t": "You (2)___ look at your phone right before bed.", "o": ["shouldn't", "don't should", "not should"], "a": 0, "why": "Phủ định của 'should' là 'shouldn't'."}, {"t": "I haven't slept well (3)___ three days.", "o": ["since", "for", "from"], "a": 1, "why": "'For' dùng với khoảng thời gian (three days)."}, {"t": "Bright light can (4)___ your brain into thinking it's daytime.", "o": ["trick", "tricks", "tricked"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu."}, {"t": "Good sleep doesn't happen by accident; it (5)___ from small habits.", "o": ["come", "coming", "comes"], "a": 2, "why": "Chủ ngữ 'it' số ít, hiện tại đơn thêm 's': comes."}, {"t": "If you build good habits, you (6)___ feel more energetic.", "o": ["will", "would", "did"], "a": 0, "why": "Câu điều kiện loại 1: If + hiện tại đơn, S + will + V."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Anna said she (1)___ and turned all night.", "o": ["toss", "tosses", "tossed"], "a": 2, "why": "Kể lại chuyện đã xảy ra, dùng quá khứ đơn: tossed."}, {"t": "Sam is an early bird, but Anna is more of a night (2)___.", "o": ["owl", "bird", "cat"], "a": 0, "why": "Thành ngữ cố định 'a night owl' chỉ người thức khuya."}, {"t": "She has had trouble sleeping (3)___ last month.", "o": ["for", "since", "ago"], "a": 1, "why": "'Since' dùng với mốc thời gian (last month)."}, {"t": "He likes to (4)___ down with music before bed.", "o": ["wind", "winds", "winded"], "a": 0, "why": "Cụm động từ 'wind down' giữ nguyên dạng nguyên mẫu sau 'to'."}, {"t": "I really need to catch up (5)___ sleep this weekend.", "o": ["on", "in", "at"], "a": 0, "why": "Cụm cố định 'catch up on sleep' dùng giới từ 'on'."}, {"t": "By the time she got home, she was completely (6)___.", "o": ["exhaust", "exhausted", "exhausting"], "a": 1, "why": "Dùng tính từ đuôi -ed để mô tả cảm giác của người: exhausted."}]}]}, {"id": "B1-ENTERTAINMENT-001", "topic": "ENTERTAINMENT", "n": 1, "level": "B1", "title": "Why Do We Love a Good Movie?", "titleVi": "Vì sao chúng ta thích một bộ phim hay?", "passage": [{"en": "Almost everyone has a favorite movie that they can watch again and again.", "vi": "Hầu như ai cũng có một bộ phim yêu thích mà họ có thể xem đi xem lại."}, {"en": "But have you ever wondered why a good story can make us laugh, cry, or jump in our seats?", "vi": "Nhưng bạn đã bao giờ tự hỏi vì sao một câu chuyện hay có thể khiến chúng ta cười, khóc, hay giật mình chưa?"}, {"en": "Experts say that stories help our brains understand the world and other people's feelings.", "vi": "Các chuyên gia nói rằng những câu chuyện giúp não bộ chúng ta hiểu thế giới và cảm xúc của người khác."}, {"en": "When we watch a character struggle and finally succeed, we feel proud, almost as if it happened to us.", "vi": "Khi xem một nhân vật vật lộn rồi cuối cùng thành công, chúng ta cảm thấy tự hào, gần như thể điều đó xảy ra với chính mình."}, {"en": "That's why a great movie can stay in our memory for years.", "vi": "Đó là lý do một bộ phim hay có thể ở lại trong ký ức chúng ta suốt nhiều năm."}, {"en": "Movies also give us a break from our own lives for a couple of hours.", "vi": "Phim ảnh còn cho chúng ta một khoảng nghỉ khỏi cuộc sống của chính mình trong vài tiếng đồng hồ."}, {"en": "During that time, we can travel to another country, another time, or even another planet.", "vi": "Trong khoảng thời gian đó, chúng ta có thể đến một đất nước khác, một thời đại khác, hay thậm chí một hành tinh khác."}, {"en": "Music plays a huge role too, even if we don't notice it consciously.", "vi": "Âm nhạc cũng đóng vai trò rất lớn, dù chúng ta không nhận ra một cách có ý thức."}, {"en": "A scary scene feels much scarier with the right music behind it.", "vi": "Một cảnh đáng sợ sẽ cảm thấy đáng sợ hơn nhiều khi có đúng loại nhạc phía sau."}, {"en": "Some people prefer books over movies because books let their imagination fill in the details.", "vi": "Một số người thích đọc sách hơn xem phim vì sách cho phép trí tưởng tượng của họ tự điền vào các chi tiết."}, {"en": "Others love music the most, because a song can bring back a whole memory in just a few seconds.", "vi": "Một số khác lại yêu âm nhạc nhất, vì một bài hát có thể gợi lại cả một ký ức chỉ trong vài giây."}, {"en": "There is no single 'best' form of entertainment; it really depends on the person.", "vi": "Không có một hình thức giải trí nào là 'tốt nhất' duy nhất; điều đó thực sự phụ thuộc vào từng người."}, {"en": "What matters most is that stories, in any form, connect us to other people.", "vi": "Điều quan trọng nhất là những câu chuyện, dưới bất kỳ hình thức nào, đều kết nối chúng ta với người khác."}, {"en": "Talking about a movie or a book with a friend can create a bond that lasts a long time.", "vi": "Nói chuyện về một bộ phim hay một cuốn sách với bạn bè có thể tạo ra một mối gắn kết kéo dài lâu."}, {"en": "So the next time you cry during a movie, don't feel embarrassed.", "vi": "Vậy nên lần tới khi bạn khóc trong lúc xem phim, đừng thấy ngại."}, {"en": "It just means the story did exactly what it was made to do.", "vi": "Điều đó chỉ có nghĩa là câu chuyện đã làm đúng những gì nó được tạo ra để làm."}], "dialogue": [{"who": "Emma", "g": "f", "en": "Have you seen the new movie everyone's talking about?", "vi": "Cậu xem bộ phim mới mà mọi người đang bàn tán chưa?"}, {"who": "Noah", "g": "m", "en": "Not yet! Is it really as good as people say?", "vi": "Chưa! Nó có thực sự hay như người ta nói không?"}, {"who": "Emma", "g": "f", "en": "Honestly, I cried three times. The story is beautiful.", "vi": "Thật lòng thì mình khóc tận ba lần. Câu chuyện đẹp lắm."}, {"who": "Noah", "g": "m", "en": "Wow, okay, now I really want to watch it this weekend.", "vi": "Wow, được rồi, giờ mình thực sự muốn xem nó vào cuối tuần này."}, {"who": "Emma", "g": "f", "en": "You should. The music alone gave me goosebumps.", "vi": "Cậu nên xem. Chỉ riêng phần nhạc thôi cũng đã khiến mình nổi da gà."}, {"who": "Noah", "g": "m", "en": "I actually prefer reading the book first, if there is one.", "vi": "Thật ra mình thích đọc sách trước, nếu có sách."}, {"who": "Emma", "g": "f", "en": "There is! But honestly, the movie stands on its own.", "vi": "Có đấy! Nhưng thật lòng, bộ phim vẫn hay dù không đọc sách."}, {"who": "Noah", "g": "m", "en": "I just love using my imagination while reading.", "vi": "Mình chỉ thích dùng trí tưởng tượng của mình khi đọc thôi."}, {"who": "Emma", "g": "f", "en": "That makes sense. Movies kind of decide everything for you.", "vi": "Nghe cũng có lý. Phim ảnh kiểu như quyết định mọi thứ thay cậu vậy."}, {"who": "Noah", "g": "m", "en": "Exactly. With a book, every reader imagines something different.", "vi": "Chính xác. Với một cuốn sách, mỗi người đọc lại tưởng tượng ra một điều khác nhau."}, {"who": "Emma", "g": "f", "en": "Still, there's something special about watching a story with friends.", "vi": "Dù vậy, xem một câu chuyện cùng bạn bè cũng có gì đó rất đặc biệt."}, {"who": "Noah", "g": "m", "en": "True. We could watch it together and I'll read the book after.", "vi": "Đúng vậy. Bọn mình có thể xem cùng nhau và mình sẽ đọc sách sau."}, {"who": "Emma", "g": "f", "en": "Deal! Let's watch it Friday night.", "vi": "Đồng ý! Tối thứ Sáu xem nhé."}, {"who": "Noah", "g": "m", "en": "Perfect. I'll bring the popcorn.", "vi": "Tuyệt. Mình sẽ mang bắp rang."}, {"who": "Emma", "g": "f", "en": "And I'll bring the tissues, just in case.", "vi": "Còn mình sẽ mang khăn giấy, phòng khi cần."}], "vocab": [{"w": "character", "f": ["character", "characters"], "pos": "n", "ipa": "ˈkærɪktər", "vi": "nhân vật", "ex": "The main character in the movie is a young doctor.", "exVi": "Nhân vật chính trong phim là một bác sĩ trẻ."}, {"w": "imagination", "f": ["imagination"], "pos": "n", "ipa": "ɪˌmædʒɪˈneɪʃən", "vi": "trí tưởng tượng", "ex": "Reading books helps children develop their imagination.", "exVi": "Đọc sách giúp trẻ em phát triển trí tưởng tượng."}, {"w": "scene", "f": ["scene", "scenes"], "pos": "n", "ipa": "siːn", "vi": "cảnh (trong phim)", "ex": "That scene was so scary I couldn't watch it.", "exVi": "Cảnh đó đáng sợ đến mức tôi không xem nổi."}, {"w": "soundtrack", "f": ["soundtrack", "soundtracks"], "pos": "n", "ipa": "ˈsaʊndtræk", "vi": "nhạc phim", "ex": "The soundtrack of that movie is beautiful.", "exVi": "Nhạc phim của bộ phim đó rất đẹp."}, {"w": "embarrassed", "f": ["embarrassed"], "pos": "adj", "ipa": "ɪmˈbærəst", "vi": "ngại ngùng, xấu hổ", "ex": "I felt embarrassed when I cried in the cinema.", "exVi": "Tôi thấy ngại khi khóc trong rạp chiếu phim."}, {"w": "bond", "f": ["bond", "bonds"], "pos": "n", "ipa": "bɑːnd", "vi": "mối gắn kết", "ex": "Watching movies together created a strong bond between them.", "exVi": "Việc cùng xem phim đã tạo ra một mối gắn kết bền chặt giữa họ."}, {"w": "entertainment", "f": ["entertainment"], "pos": "n", "ipa": "ˌentərˈteɪnmənt", "vi": "sự giải trí", "ex": "Movies are a popular form of entertainment.", "exVi": "Phim ảnh là một hình thức giải trí phổ biến."}, {"w": "stand on its own", "f": ["stand on its own", "stands on its own"], "pos": "phrase", "ipa": "stænd ɒn ɪts oʊn", "vi": "tự nó đã đủ hay, không cần dựa vào cái khác", "ex": "The movie stands on its own, even without the book.", "exVi": "Bộ phim tự nó đã hay rồi, dù không cần đọc sách."}, {"w": "goosebumps", "f": ["goosebumps"], "pos": "n", "ipa": "ˈɡuːsbʌmps", "vi": "nổi da gà", "ex": "That song gives me goosebumps every time.", "exVi": "Bài hát đó lần nào cũng khiến tôi nổi da gà."}, {"w": "struggle", "f": ["struggle", "struggles", "struggled", "struggling"], "pos": "v", "ipa": "ˈstrʌɡəl", "vi": "vật lộn, đấu tranh", "ex": "The main character struggles to find her way home.", "exVi": "Nhân vật chính vật lộn để tìm đường về nhà."}], "grammar": [{"title": "Even if / even though", "formula": "Even if/even though + mệnh đề", "use": "'Even if' dùng cho tình huống giả định, chưa chắc xảy ra. 'Even though' dùng cho sự thật đã biết. Cả hai đều nhấn mạnh sự tương phản.", "examples": [{"en": "The movie stands on its own, even without the book.", "vi": "Bộ phim tự nó đã hay rồi, dù không cần sách."}, {"en": "Even though I was tired, I finished the whole series in one night.", "vi": "Dù mệt, tôi vẫn xem hết cả series trong một đêm."}, {"en": "Even if you don't like sad movies, you should try this one.", "vi": "Dù bạn không thích phim buồn, bạn cũng nên thử xem bộ này."}]}, {"title": "So + tính từ + that + kết quả", "formula": "S + tobe + so + adj + that + mệnh đề kết quả", "use": "Dùng để nhấn mạnh mức độ của một tính chất và kết quả của nó. Rất phổ biến trong văn nói.", "examples": [{"en": "That scene was so scary that I couldn't watch it.", "vi": "Cảnh đó đáng sợ đến mức tôi không xem nổi."}, {"en": "The story was so touching that everyone in the room cried.", "vi": "Câu chuyện cảm động đến mức mọi người trong phòng đều khóc."}, {"en": "The movie was so long that we took a break in the middle.", "vi": "Bộ phim dài đến mức chúng tôi phải nghỉ giữa chừng."}]}], "phrases": [{"p": "on the edge of my seat", "vi": "hồi hộp đến nghẹt thở", "ex": "That thriller kept me on the edge of my seat the whole time.", "exVi": "Bộ phim giật gân đó khiến mình hồi hộp nghẹt thở suốt.", "ctx": "Thân mật, dùng khi nói về phim/truyện gay cấn."}, {"p": "a tear-jerker", "vi": "phim/truyện lấy nước mắt", "ex": "Bring tissues, this movie is a real tear-jerker.", "exVi": "Nhớ mang khăn giấy, phim này lấy nước mắt lắm đấy.", "ctx": "Thân mật, dùng để mô tả phim buồn."}, {"p": "can't put it down", "vi": "không thể ngừng đọc/xem", "ex": "This book is so good, I can't put it down.", "exVi": "Cuốn sách này hay đến mức mình không thể ngừng đọc.", "ctx": "Thân mật, thường dùng cho sách nhưng cũng dùng được cho phim/series."}, {"p": "binge-watch", "vi": "xem liên tục nhiều tập một lúc", "ex": "We binge-watched the whole series in one weekend.", "exVi": "Bọn mình xem một mạch hết cả series trong một cuối tuần.", "ctx": "Thân mật, rất phổ biến khi nói về xem phim/series."}, {"p": "a plot twist", "vi": "tình tiết bất ngờ, cú twist", "ex": "Nobody saw that plot twist coming.", "exVi": "Không ai đoán được cú twist đó cả.", "ctx": "Trung tính, dùng khi bàn về nội dung phim."}, {"p": "steal the show", "vi": "chiếm trọn spotlight, diễn hay nhất", "ex": "The supporting actor totally stole the show.", "exVi": "Diễn viên phụ đó thực sự đã chiếm trọn spotlight.", "ctx": "Thân mật, dùng để khen một diễn viên hay phần trình diễn."}, {"p": "it's not my cup of tea", "vi": "không hợp gu của tôi", "ex": "Horror movies are just not my cup of tea.", "exVi": "Phim kinh dị không hợp gu của mình.", "ctx": "Thân mật, dùng khi lịch sự nói mình không thích gì đó."}, {"p": "word of mouth", "vi": "truyền miệng, lời giới thiệu từ người khác", "ex": "I found out about the movie through word of mouth.", "exVi": "Mình biết đến bộ phim đó qua lời truyền miệng.", "ctx": "Trung tính, dùng khi nói về cách biết đến điều gì đó."}, {"p": "blow me away", "vi": "làm tôi choáng ngợp, ấn tượng mạnh", "ex": "The ending completely blew me away.", "exVi": "Cái kết khiến mình choáng ngợp hoàn toàn.", "ctx": "Thân mật, dùng khi rất ấn tượng."}, {"p": "a guilty pleasure", "vi": "sở thích 'xấu hổ' nhưng vẫn thích", "ex": "Cheesy romance movies are my guilty pleasure.", "exVi": "Phim tình cảm sến súa là sở thích 'xấu hổ mà vẫn thích' của mình.", "ctx": "Thân mật, dùng khi thừa nhận thích điều gì đó hơi ngại."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Even (1)___ I was tired, I finished the movie.", "o": ["if", "though", "that"], "a": 1, "why": "'Even though' dùng cho sự thật đã xảy ra (tôi đã mệt)."}, {"t": "The scene was (2)___ scary that I couldn't watch it.", "o": ["so", "such", "very"], "a": 0, "why": "Cấu trúc 'so + adj + that' diễn tả mức độ và kết quả."}, {"t": "Stories help our brains (3)___ other people's feelings.", "o": ["understand", "understands", "understanding"], "a": 0, "why": "Sau 'help' dùng động từ nguyên mẫu (không 'to')."}, {"t": "Music plays a huge role, even if we don't (4)___ it.", "o": ["notice", "noticed", "notices"], "a": 0, "why": "Sau 'don't' dùng động từ nguyên mẫu."}, {"t": "That song always (5)___ me goosebumps.", "o": ["give", "gives", "giving"], "a": 1, "why": "Chủ ngữ 'that song' số ít, hiện tại đơn thêm 's': gives."}, {"t": "Talking about a movie can (6)___ a bond between friends.", "o": ["create", "creates", "created"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Emma said she (1)___ three times during the movie.", "o": ["cry", "cries", "cried"], "a": 2, "why": "Kể lại chuyện đã xảy ra, dùng quá khứ đơn: cried."}, {"t": "Noah prefers reading the book (2)___ watching the movie.", "o": ["than", "to", "from"], "a": 1, "why": "Cấu trúc 'prefer A to B' dùng giới từ 'to'."}, {"t": "The movie (3)___ on its own, even without the book.", "o": ["stand", "stands", "standing"], "a": 1, "why": "Chủ ngữ 'the movie' số ít, hiện tại đơn: stands."}, {"t": "They decided to watch it together and he (4)___ read the book after.", "o": ["will", "would", "did"], "a": 0, "why": "Dự định trong tương lai gần, dùng 'will'."}, {"t": "That actor really (5)___ the show in the last scene.", "o": ["stole", "steal", "stealing"], "a": 0, "why": "Kể lại việc đã xảy ra trong phim, dùng quá khứ đơn: stole."}, {"t": "Horror movies are just not my cup of (6)___.", "o": ["coffee", "tea", "water"], "a": 1, "why": "Thành ngữ cố định 'not my cup of tea'."}]}]}, {"id": "B1-DAILY-001", "topic": "DAILY", "n": 1, "level": "B1", "title": "Packing for a Weekend Trip", "titleVi": "Chuẩn bị đồ cho chuyến đi cuối tuần", "passage": [{"en": "Packing for a trip sounds simple, but many people still forget something important.", "vi": "Chuẩn bị đồ cho một chuyến đi nghe có vẻ đơn giản, nhưng nhiều người vẫn quên mất điều gì đó quan trọng."}, {"en": "The first step is to check the weather at your destination before you start packing.", "vi": "Bước đầu tiên là kiểm tra thời tiết ở nơi bạn sẽ đến trước khi bắt đầu chuẩn bị đồ."}, {"en": "There's nothing worse than bringing only shorts and finding out it's freezing cold.", "vi": "Không có gì tệ hơn việc chỉ mang theo quần short rồi phát hiện ra trời lạnh cóng."}, {"en": "Next, make a simple list instead of trying to remember everything in your head.", "vi": "Tiếp theo, hãy lập một danh sách đơn giản thay vì cố nhớ mọi thứ trong đầu."}, {"en": "A list saves you from running back into the house five times before you leave.", "vi": "Một danh sách giúp bạn khỏi phải chạy ngược vào nhà năm lần trước khi đi."}, {"en": "For a short weekend trip, you really don't need to bring your whole closet.", "vi": "Với một chuyến đi cuối tuần ngắn, bạn thực sự không cần mang theo cả tủ đồ của mình."}, {"en": "A good rule is to lay out everything you planned to bring, then remove half of it.", "vi": "Một quy tắc hay là xếp hết những gì bạn định mang ra, rồi bỏ bớt một nửa."}, {"en": "Don't forget the boring but important things, like your phone charger and any medicine you take.", "vi": "Đừng quên những thứ nhàm chán nhưng quan trọng, như sạc điện thoại và bất kỳ loại thuốc nào bạn đang dùng."}, {"en": "It also helps to keep important documents, like your ID, in the same place every time.", "vi": "Việc giữ các giấy tờ quan trọng, như chứng minh thư, ở cùng một chỗ mỗi lần cũng rất hữu ích."}, {"en": "Rolling your clothes instead of folding them can save a surprising amount of space.", "vi": "Cuộn quần áo lại thay vì gấp có thể tiết kiệm một lượng không gian đáng ngạc nhiên."}, {"en": "If you're flying, remember that liquids usually need to be in small bottles.", "vi": "Nếu bạn đi máy bay, hãy nhớ là chất lỏng thường phải để trong chai nhỏ."}, {"en": "It's also smart to keep one change of clothes in your carry-on bag, just in case.", "vi": "Cũng khôn ngoan khi giữ một bộ quần áo thay trong túi xách tay, để phòng trường hợp cần thiết."}, {"en": "Many travelers say the biggest mistake is packing 'just in case' items they never actually use.", "vi": "Nhiều người đi du lịch nói rằng sai lầm lớn nhất là mang theo những món đồ 'để phòng khi cần' mà chẳng bao giờ dùng đến."}, {"en": "After a few trips, you'll start to know exactly what you always need.", "vi": "Sau vài chuyến đi, bạn sẽ bắt đầu biết chính xác mình luôn cần những gì."}, {"en": "Packing light also makes the whole trip feel more relaxed from the very first minute.", "vi": "Đóng gói đồ gọn nhẹ cũng khiến cả chuyến đi cảm thấy thoải mái hơn ngay từ phút đầu tiên."}, {"en": "In the end, the goal isn't a perfect suitcase; it's simply being ready to enjoy the trip.", "vi": "Cuối cùng, mục tiêu không phải là một chiếc vali hoàn hảo; đơn giản là sẵn sàng tận hưởng chuyến đi."}], "dialogue": [{"who": "Chloe", "g": "f", "en": "Are you all packed for the trip tomorrow?", "vi": "Cậu chuẩn bị đồ xong cho chuyến đi ngày mai chưa?"}, {"who": "Leo", "g": "m", "en": "Not yet, actually. I always leave it until the last minute.", "vi": "Thật ra là chưa. Mình lúc nào cũng để đến phút cuối mới làm."}, {"who": "Chloe", "g": "f", "en": "You should really make a list. It saves so much time.", "vi": "Cậu nên lập danh sách đi. Nó tiết kiệm rất nhiều thời gian đấy."}, {"who": "Leo", "g": "m", "en": "I know, I know. I just never remember to do it.", "vi": "Mình biết, mình biết. Chỉ là mình chẳng bao giờ nhớ để làm thôi."}, {"who": "Chloe", "g": "f", "en": "Did you check the weather at least?", "vi": "Vậy cậu kiểm tra thời tiết chưa?"}, {"who": "Leo", "g": "m", "en": "No! Is it going to be cold there?", "vi": "Chưa! Ở đó có lạnh không?"}, {"who": "Chloe", "g": "f", "en": "Pretty cold at night, actually. Bring a jacket.", "vi": "Ban đêm khá lạnh đấy. Mang theo áo khoác nhé."}, {"who": "Leo", "g": "m", "en": "Good thing you told me. I would've only packed t-shirts.", "vi": "May mà cậu nói cho mình biết. Không thì mình chỉ mang mỗi áo thun thôi."}, {"who": "Chloe", "g": "f", "en": "Also, don't forget your phone charger this time.", "vi": "À, lần này đừng quên sạc điện thoại nữa nhé."}, {"who": "Leo", "g": "m", "en": "Ha, that happened one time and you never let me forget it.", "vi": "Ha, chuyện đó xảy ra có một lần thôi mà cậu chẳng bao giờ để mình quên được."}, {"who": "Chloe", "g": "f", "en": "Because it was a whole trip with a dead phone!", "vi": "Vì đó là cả một chuyến đi với chiếc điện thoại hết pin đấy!"}, {"who": "Leo", "g": "m", "en": "Fair enough. I'll pack tonight, I promise.", "vi": "Được rồi, công nhận. Tối nay mình sẽ chuẩn bị đồ, mình hứa."}, {"who": "Chloe", "g": "f", "en": "Roll your clothes, by the way. It saves so much space.", "vi": "À nhân tiện, cuộn quần áo lại nhé. Tiết kiệm không gian lắm đấy."}, {"who": "Leo", "g": "m", "en": "Really? I always just fold everything.", "vi": "Thật hả? Mình lúc nào cũng chỉ gấp thôi."}, {"who": "Chloe", "g": "f", "en": "Try it, you'll be surprised how much more fits.", "vi": "Thử đi, cậu sẽ bất ngờ vì đồ vừa được nhiều hơn hẳn đấy."}], "vocab": [{"w": "destination", "f": ["destination", "destinations"], "pos": "n", "ipa": "ˌdestɪˈneɪʃən", "vi": "điểm đến", "ex": "Our destination is a small town near the beach.", "exVi": "Điểm đến của chúng tôi là một thị trấn nhỏ gần biển."}, {"w": "suitcase", "f": ["suitcase", "suitcases"], "pos": "n", "ipa": "ˈsuːtkeɪs", "vi": "vali", "ex": "My suitcase was too heavy to carry alone.", "exVi": "Chiếc vali của tôi quá nặng để tự mang một mình."}, {"w": "charger", "f": ["charger", "chargers"], "pos": "n", "ipa": "ˈtʃɑːrdʒər", "vi": "bộ sạc", "ex": "Don't forget your phone charger.", "exVi": "Đừng quên bộ sạc điện thoại của bạn."}, {"w": "document", "f": ["document", "documents"], "pos": "n", "ipa": "ˈdɑːkjumənt", "vi": "giấy tờ, tài liệu", "ex": "Keep your travel documents in one bag.", "exVi": "Giữ giấy tờ đi du lịch của bạn trong một túi."}, {"w": "carry-on", "f": ["carry-on", "carry-ons"], "pos": "n", "ipa": "ˈkæri ɑːn", "vi": "hành lý xách tay", "ex": "I always keep my medicine in my carry-on bag.", "exVi": "Tôi luôn để thuốc của mình trong túi xách tay."}, {"w": "roll", "f": ["roll", "rolls", "rolled", "rolling"], "pos": "v", "ipa": "roʊl", "vi": "cuộn lại", "ex": "Try rolling your clothes to save space.", "exVi": "Hãy thử cuộn quần áo lại để tiết kiệm không gian."}, {"w": "pack light", "f": ["pack light"], "pos": "phrase", "ipa": "pæk laɪt", "vi": "đóng gói gọn nhẹ", "ex": "I always try to pack light for short trips.", "exVi": "Tôi luôn cố gắng đóng gói gọn nhẹ cho những chuyến đi ngắn."}, {"w": "freezing", "f": ["freezing"], "pos": "adj", "ipa": "ˈfriːzɪŋ", "vi": "lạnh cóng", "ex": "It was freezing outside, so I wore two jackets.", "exVi": "Bên ngoài lạnh cóng nên tôi mặc hai áo khoác."}, {"w": "remind", "f": ["remind", "reminds", "reminded", "reminding"], "pos": "v", "ipa": "rɪˈmaɪnd", "vi": "nhắc nhở", "ex": "Can you remind me to bring my charger?", "exVi": "Cậu có thể nhắc mình mang sạc không?"}, {"w": "relaxed", "f": ["relaxed"], "pos": "adj", "ipa": "rɪˈlækst", "vi": "thoải mái", "ex": "Packing early makes the trip feel more relaxed.", "exVi": "Chuẩn bị đồ sớm khiến chuyến đi cảm thấy thoải mái hơn."}], "grammar": [{"title": "Would have + V3 (giả định về quá khứ)", "formula": "S + would have + V3", "use": "Dùng để nói về điều đáng lẽ đã xảy ra nhưng thực tế không xảy ra, thường dùng trong văn nói khi nói về một tình huống giả định trong quá khứ.", "examples": [{"en": "I would've only packed t-shirts if you hadn't told me.", "vi": "Mình đáng lẽ đã chỉ mang mỗi áo thun nếu cậu không nói cho mình biết."}, {"en": "She would have missed the flight if she hadn't hurried.", "vi": "Cô ấy đáng lẽ đã lỡ chuyến bay nếu không vội vàng."}, {"en": "We would have gotten lost without the map.", "vi": "Chúng tôi đáng lẽ đã bị lạc nếu không có bản đồ."}]}, {"title": "Imperative (câu mệnh lệnh) để đưa lời khuyên thân mật", "formula": "Động từ nguyên mẫu + ... / Don't + động từ nguyên mẫu + ...", "use": "Dùng để đưa lời khuyên hoặc chỉ dẫn một cách trực tiếp, thân mật, rất phổ biến giữa bạn bè.", "examples": [{"en": "Bring a jacket, it's cold at night.", "vi": "Mang theo áo khoác, ban đêm lạnh lắm."}, {"en": "Don't forget your charger this time.", "vi": "Lần này đừng quên sạc nhé."}, {"en": "Roll your clothes to save space.", "vi": "Cuộn quần áo lại để tiết kiệm không gian."}]}], "phrases": [{"p": "just in case", "vi": "để phòng khi, phòng hờ", "ex": "I always bring an extra shirt, just in case.", "exVi": "Mình luôn mang thêm một cái áo, để phòng khi cần.", "ctx": "Thân mật, rất phổ biến trong văn nói hằng ngày."}, {"p": "at the last minute", "vi": "vào phút chót", "ex": "He always packs at the last minute.", "exVi": "Anh ấy lúc nào cũng chuẩn bị đồ vào phút chót.", "ctx": "Trung tính, dùng khi làm gì đó muộn, gần deadline."}, {"p": "fair enough", "vi": "công nhận, hợp lý đấy", "ex": "Fair enough, I'll pack tonight then.", "exVi": "Công nhận, vậy tối nay mình sẽ chuẩn bị đồ.", "ctx": "Thân mật, dùng khi đồng ý sau khi nghe lý lẽ của ai đó."}, {"p": "good thing", "vi": "may mà", "ex": "Good thing you reminded me about the charger.", "exVi": "May mà cậu nhắc mình về sạc điện thoại.", "ctx": "Thân mật, dùng khi may mắn tránh được điều gì đó."}, {"p": "in one bag", "vi": "gọn trong một túi", "ex": "I managed to fit everything in one bag.", "exVi": "Mình đã xếp vừa mọi thứ gọn trong một túi.", "ctx": "Trung tính, dùng khi nói về việc đóng gói gọn gàng."}, {"p": "run back", "vi": "chạy ngược lại (để lấy đồ quên)", "ex": "I had to run back inside for my passport.", "exVi": "Mình phải chạy ngược vào trong để lấy hộ chiếu.", "ctx": "Thân mật, dùng khi quên đồ và phải quay lại lấy."}, {"p": "double-check", "vi": "kiểm tra lại lần nữa cho chắc", "ex": "Always double-check your bag before leaving the house.", "exVi": "Luôn kiểm tra lại túi đồ trước khi ra khỏi nhà.", "ctx": "Trung tính, dùng khi khuyên ai đó cẩn thận hơn."}, {"p": "travel light", "vi": "đi du lịch gọn nhẹ", "ex": "I've learned to travel light after so many trips.", "exVi": "Mình đã học được cách đi du lịch gọn nhẹ sau bao nhiêu chuyến đi.", "ctx": "Trung tính, dùng khi nói về phong cách đóng gói."}, {"p": "you never know", "vi": "biết đâu được, không lường trước được", "ex": "Bring an umbrella, you never know.", "exVi": "Mang theo ô nhé, biết đâu được.", "ctx": "Thân mật, dùng khi khuyên chuẩn bị cho tình huống bất ngờ."}, {"p": "cut it close", "vi": "làm sát giờ, suýt trễ", "ex": "We cut it close and almost missed the train.", "exVi": "Bọn mình làm sát giờ quá, suýt lỡ chuyến tàu.", "ctx": "Thân mật, dùng khi thời gian rất gấp."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "You (1)___ check the weather before you pack.", "o": ["should", "would", "must to"], "a": 0, "why": "'Should' dùng để đưa lời khuyên."}, {"t": "If you hadn't told me, I (2)___ only packed t-shirts.", "o": ["would have", "will have", "would"], "a": 0, "why": "Câu điều kiện loại 3: would have + V3, nói về giả định trong quá khứ."}, {"t": "(3)___ forget your charger this time.", "o": ["Don't", "Not", "No"], "a": 0, "why": "Câu mệnh lệnh phủ định: Don't + động từ nguyên mẫu."}, {"t": "Rolling your clothes can (4)___ a lot of space.", "o": ["save", "saves", "saved"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu."}, {"t": "It's smart to keep one change of clothes, just in (5)___.", "o": ["time", "case", "fact"], "a": 1, "why": "Thành ngữ cố định 'just in case'."}, {"t": "After a few trips, you'll (6)___ what you always need.", "o": ["know", "knows", "knowing"], "a": 0, "why": "Sau 'will' dùng động từ nguyên mẫu."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Chloe told Leo that he (1)___ really make a list.", "o": ["should", "shall", "must to"], "a": 0, "why": "'Should' dùng để đưa lời khuyên trong câu tường thuật."}, {"t": "Leo said he always left packing until the last (2)___.", "o": ["minute", "minutes", "min"], "a": 0, "why": "Thành ngữ cố định 'at the last minute' dùng số ít 'minute'."}, {"t": "It's going to be pretty cold, so (3)___ a jacket.", "o": ["bring", "brings", "brought"], "a": 0, "why": "Câu mệnh lệnh dùng động từ nguyên mẫu: bring."}, {"t": "That happened one time and she never lets him (4)___ it.", "o": ["forget", "forgets", "forgot"], "a": 0, "why": "Sau 'let' dùng động từ nguyên mẫu không 'to'."}, {"t": "Try rolling your clothes, you'll be (5)___ how much fits.", "o": ["surprise", "surprised", "surprising"], "a": 1, "why": "Tính từ đuôi -ed mô tả cảm giác của người: surprised."}, {"t": "They cut it (6)___ and almost missed the train.", "o": ["close", "closed", "closely"], "a": 0, "why": "Thành ngữ cố định 'cut it close'."}]}]}, {"id": "B1-SPORTS-001", "topic": "SPORTS", "n": 1, "level": "B1", "title": "Why People Love Watching Sports", "titleVi": "Vì sao người ta thích xem thể thao", "passage": [{"en": "Every weekend, millions of people sit down to watch their favorite team play.", "vi": "Mỗi cuối tuần, hàng triệu người ngồi xuống để xem đội bóng yêu thích của mình thi đấu."}, {"en": "For many fans, watching a match isn't just entertainment; it feels like part of their life.", "vi": "Với nhiều người hâm mộ, xem một trận đấu không chỉ là giải trí; nó giống như một phần cuộc sống của họ."}, {"en": "Some people wear the same lucky shirt every game, hoping it will help their team win.", "vi": "Một số người mặc cùng một chiếc áo may mắn ở mọi trận đấu, hy vọng nó sẽ giúp đội của họ thắng."}, {"en": "Scientists say that cheering for a team can actually release the same chemicals as falling in love.", "vi": "Các nhà khoa học nói rằng việc cổ vũ cho một đội thực sự có thể giải phóng những chất hóa học giống như khi yêu."}, {"en": "That's part of why losing a big match can feel so painful.", "vi": "Đó là một phần lý do vì sao thua một trận đấu lớn có thể cảm thấy đau đến vậy."}, {"en": "Sports also bring people together in a way few other things can.", "vi": "Thể thao còn kết nối con người theo một cách mà rất ít điều khác làm được."}, {"en": "Strangers in a stadium hug each other after a goal, even though they've never met before.", "vi": "Những người lạ trong sân vận động ôm nhau sau một bàn thắng, dù họ chưa từng gặp nhau trước đó."}, {"en": "Families often bond over sports too, passing their love for a team down through generations.", "vi": "Các gia đình cũng thường gắn kết qua thể thao, truyền tình yêu dành cho một đội bóng qua nhiều thế hệ."}, {"en": "Watching sports can also teach us lessons that apply to everyday life.", "vi": "Xem thể thao còn có thể dạy chúng ta những bài học áp dụng được vào cuộc sống hằng ngày."}, {"en": "We see players get knocked down again and again, yet they keep getting back up.", "vi": "Chúng ta thấy các cầu thủ bị quật ngã hết lần này đến lần khác, nhưng họ vẫn tiếp tục đứng dậy."}, {"en": "That kind of determination can be inspiring, even for someone sitting on their couch at home.", "vi": "Kiểu quyết tâm đó có thể truyền cảm hứng, kể cả với người đang ngồi trên ghế sofa ở nhà."}, {"en": "Of course, not everyone enjoys watching sports, and that's completely fine too.", "vi": "Tất nhiên, không phải ai cũng thích xem thể thao, và điều đó cũng hoàn toàn bình thường."}, {"en": "Some people would rather play a sport themselves than watch it on a screen.", "vi": "Một số người thà tự chơi một môn thể thao còn hơn là xem nó qua màn hình."}, {"en": "Either way, sport gives people something exciting to talk about the next day.", "vi": "Dù thế nào, thể thao cũng cho con người một điều thú vị để bàn tán vào ngày hôm sau."}, {"en": "A single match can create a memory that friends talk about for years.", "vi": "Một trận đấu duy nhất có thể tạo ra một ký ức mà bạn bè nhắc lại suốt nhiều năm."}, {"en": "In the end, that shared excitement might be the real reason people keep coming back.", "vi": "Cuối cùng, sự phấn khích được chia sẻ đó có lẽ mới là lý do thật sự khiến người ta cứ quay lại xem."}], "dialogue": [{"who": "Ryan", "g": "m", "en": "Did you watch the game last night? It was insane!", "vi": "Cậu xem trận đấu tối qua chưa? Điên rồ luôn!"}, {"who": "Sofia", "g": "f", "en": "No, I missed it! What happened?", "vi": "Chưa, mình bỏ lỡ mất! Có chuyện gì vậy?"}, {"who": "Ryan", "g": "m", "en": "They scored in the very last minute. The whole stadium went crazy.", "vi": "Họ ghi bàn ngay phút cuối cùng. Cả sân vận động phát điên lên."}, {"who": "Sofia", "g": "f", "en": "No way! I can't believe I missed that.", "vi": "Không thể nào! Mình không thể tin là mình đã bỏ lỡ điều đó."}, {"who": "Ryan", "g": "m", "en": "I actually jumped off the couch and scared my dog.", "vi": "Mình thật sự nhảy dựng khỏi ghế sofa và làm con chó của mình sợ hết hồn."}, {"who": "Sofia", "g": "f", "en": "Ha! I'm not really a sports person, but that sounds exciting.", "vi": "Ha! Mình không phải kiểu người mê thể thao, nhưng nghe cũng thú vị đấy."}, {"who": "Ryan", "g": "m", "en": "You should watch a match with us sometime. It's a whole experience.", "vi": "Cậu nên xem một trận đấu cùng bọn mình lúc nào đó. Nó là cả một trải nghiệm."}, {"who": "Sofia", "g": "f", "en": "Maybe. I just never understood why people get so emotional over it.", "vi": "Có lẽ. Mình chỉ chưa bao giờ hiểu tại sao người ta lại xúc động vì nó đến vậy."}, {"who": "Ryan", "g": "m", "en": "Honestly, it's like your team becomes part of your identity.", "vi": "Thật lòng thì đội của cậu giống như trở thành một phần bản sắc của cậu vậy."}, {"who": "Sofia", "g": "f", "en": "That's interesting. I never thought about it that way.", "vi": "Nghe thú vị đấy. Mình chưa bao giờ nghĩ theo hướng đó."}, {"who": "Ryan", "g": "m", "en": "Plus, everyone in the stadium becomes friends for ninety minutes.", "vi": "Với lại, mọi người trong sân vận động trở thành bạn bè trong chín mươi phút."}, {"who": "Sofia", "g": "f", "en": "Okay, that part actually sounds really nice.", "vi": "Được rồi, phần đó nghe thật sự dễ chịu đấy."}, {"who": "Ryan", "g": "m", "en": "Come with us next weekend. You don't even need to understand the rules.", "vi": "Đi cùng bọn mình cuối tuần tới đi. Cậu thậm chí không cần hiểu luật."}, {"who": "Sofia", "g": "f", "en": "Alright, fine. I'll give it a try.", "vi": "Được rồi, thôi được. Mình sẽ thử xem."}, {"who": "Ryan", "g": "m", "en": "You won't regret it, I promise.", "vi": "Cậu sẽ không hối hận đâu, mình hứa."}], "vocab": [{"w": "stadium", "f": ["stadium", "stadiums"], "pos": "n", "ipa": "ˈsteɪdiəm", "vi": "sân vận động", "ex": "The stadium was full before the match even started.", "exVi": "Sân vận động đã kín chỗ trước cả khi trận đấu bắt đầu."}, {"w": "score", "f": ["score", "scores", "scored", "scoring"], "pos": "v", "ipa": "skɔːr", "vi": "ghi điểm, ghi bàn", "ex": "He scored the winning goal in the last minute.", "exVi": "Anh ấy ghi bàn thắng quyết định vào phút cuối."}, {"w": "fan", "f": ["fan", "fans"], "pos": "n", "ipa": "fæn", "vi": "người hâm mộ", "ex": "She's a huge fan of the national team.", "exVi": "Cô ấy là fan cuồng của đội tuyển quốc gia."}, {"w": "cheer", "f": ["cheer", "cheers", "cheered", "cheering"], "pos": "v", "ipa": "tʃɪər", "vi": "cổ vũ", "ex": "The whole crowd cheered when he scored.", "exVi": "Cả đám đông cổ vũ khi anh ấy ghi bàn."}, {"w": "determination", "f": ["determination"], "pos": "n", "ipa": "dɪˌtɜːrmɪˈneɪʃən", "vi": "sự quyết tâm", "ex": "Her determination to win inspired the whole team.", "exVi": "Sự quyết tâm giành chiến thắng của cô ấy đã truyền cảm hứng cho cả đội."}, {"w": "stadium chant", "f": ["chant", "chants"], "pos": "n", "ipa": "tʃænt", "vi": "tiếng hô cổ vũ", "ex": "The fans sang a chant during the whole match.", "exVi": "Các fan hát vang tiếng hô cổ vũ suốt cả trận đấu."}, {"w": "identity", "f": ["identity", "identities"], "pos": "n", "ipa": "aɪˈdentɪti", "vi": "bản sắc, danh tính", "ex": "For some people, their team is part of their identity.", "exVi": "Với một số người, đội bóng của họ là một phần bản sắc của họ."}, {"w": "inspire", "f": ["inspire", "inspires", "inspired", "inspiring"], "pos": "v", "ipa": "ɪnˈspaɪər", "vi": "truyền cảm hứng", "ex": "Watching him play inspired me to start running.", "exVi": "Xem anh ấy thi đấu đã truyền cảm hứng cho tôi bắt đầu chạy bộ."}, {"w": "knocked down", "f": ["knocked down", "knock down"], "pos": "phrase", "ipa": "nɒkt daʊn", "vi": "bị quật ngã, bị đánh gục", "ex": "Players get knocked down but keep getting back up.", "exVi": "Các cầu thủ bị quật ngã nhưng vẫn tiếp tục đứng dậy."}, {"w": "crowd", "f": ["crowd", "crowds"], "pos": "n", "ipa": "kraʊd", "vi": "đám đông", "ex": "The crowd went silent after the injury.", "exVi": "Đám đông im lặng sau chấn thương đó."}], "grammar": [{"title": "Thì hiện tại hoàn thành với 'never' (kinh nghiệm)", "formula": "S + have/has + never + V3", "use": "Dùng để nói về một trải nghiệm chưa từng xảy ra tính đến hiện tại. Rất phổ biến khi kể về những điều mới lạ.", "examples": [{"en": "They hug each other, even though they've never met before.", "vi": "Họ ôm nhau, dù họ chưa từng gặp nhau trước đó."}, {"en": "I've never watched a live match before.", "vi": "Tôi chưa từng xem một trận đấu trực tiếp trước đây."}, {"en": "She's never been to a stadium in her life.", "vi": "Cô ấy chưa từng đến sân vận động trong đời."}]}, {"title": "Would rather + động từ nguyên mẫu", "formula": "S + would rather + V (nguyên mẫu) + than + V", "use": "Dùng để diễn tả sự ưu tiên, thích điều này hơn điều kia. 'Would rather' theo sau là động từ nguyên mẫu, không phải 'to V'.", "examples": [{"en": "Some people would rather play a sport than watch it.", "vi": "Một số người thà tự chơi thể thao còn hơn xem nó."}, {"en": "I'd rather stay home tonight than go to the party.", "vi": "Tối nay tôi thà ở nhà còn hơn đi dự tiệc."}, {"en": "She'd rather walk than take the bus.", "vi": "Cô ấy thà đi bộ còn hơn đi xe buýt."}]}], "phrases": [{"p": "go crazy", "vi": "phát điên lên (vì phấn khích)", "ex": "The whole stadium went crazy after the goal.", "exVi": "Cả sân vận động phát điên lên sau bàn thắng đó.", "ctx": "Thân mật, dùng khi rất phấn khích."}, {"p": "no way", "vi": "không thể nào, không đời nào", "ex": "No way! I can't believe they won.", "exVi": "Không thể nào! Mình không thể tin là họ đã thắng.", "ctx": "Rất thân mật, dùng khi ngạc nhiên."}, {"p": "on the edge of your seat", "vi": "hồi hộp đến nghẹt thở", "ex": "That match kept us on the edge of our seats.", "exVi": "Trận đấu đó khiến chúng tôi hồi hộp nghẹt thở.", "ctx": "Thân mật, dùng khi rất kịch tính, gay cấn."}, {"p": "give it a try", "vi": "thử xem sao", "ex": "I've never liked sports, but I'll give it a try.", "exVi": "Mình chưa bao giờ thích thể thao, nhưng mình sẽ thử xem sao.", "ctx": "Thân mật, dùng khi đồng ý thử điều gì mới."}, {"p": "down to the wire", "vi": "kịch tính đến phút chót", "ex": "The match went down to the wire.", "exVi": "Trận đấu kịch tính đến tận phút chót.", "ctx": "Trung tính, dùng khi kết quả chưa rõ ràng đến gần cuối."}, {"p": "root for", "vi": "cổ vũ, ủng hộ (một đội)", "ex": "Which team are you rooting for?", "exVi": "Cậu đang cổ vũ cho đội nào?", "ctx": "Thân mật, phổ biến trong ngữ cảnh thể thao."}, {"p": "a home run", "vi": "thành công lớn, cú ghi điểm ngoạn mục (nghĩa bóng)", "ex": "That new player has been a home run for the team.", "exVi": "Cầu thủ mới đó đã là một thành công lớn cho đội.", "ctx": "Thân mật, gốc từ bóng chày nhưng dùng rộng để khen thành công."}, {"p": "neck and neck", "vi": "sát nút, ngang sức ngang tài", "ex": "The two teams were neck and neck until the final minute.", "exVi": "Hai đội ngang sức ngang tài cho đến tận phút cuối.", "ctx": "Trung tính, dùng khi hai bên ngang ngửa nhau."}, {"p": "you won't regret it", "vi": "cậu sẽ không hối hận đâu", "ex": "Come watch the game with us, you won't regret it.", "exVi": "Đi xem trận đấu cùng bọn mình đi, cậu sẽ không hối hận đâu.", "ctx": "Thân mật, dùng khi rủ rê, thuyết phục ai đó."}, {"p": "get back up", "vi": "đứng dậy sau khi vấp ngã", "ex": "No matter how many times he fell, he got back up.", "exVi": "Dù ngã bao nhiêu lần, anh ấy vẫn đứng dậy.", "ctx": "Trung tính, thường dùng theo nghĩa bóng về sự kiên trì."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "They hug each other, even though they've (1)___ met before.", "o": ["never", "ever", "already"], "a": 0, "why": "'Never' kết hợp với hiện tại hoàn thành diễn tả 'chưa từng'."}, {"t": "Some people would (2)___ play a sport than watch it.", "o": ["rather", "better", "prefer"], "a": 0, "why": "Cấu trúc cố định 'would rather...than'."}, {"t": "Cheering for a team can (3)___ the same chemicals as love.", "o": ["release", "releases", "released"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu."}, {"t": "Players get knocked down but keep (4)___ back up.", "o": ["get", "gets", "getting"], "a": 2, "why": "Sau 'keep' dùng V-ing: keep getting."}, {"t": "A single match can create a memory friends talk (5)___ for years.", "o": ["about", "of", "on"], "a": 0, "why": "Cụm động từ cố định 'talk about'."}, {"t": "That kind of determination can be (6)___ for anyone.", "o": ["inspire", "inspiring", "inspired"], "a": 1, "why": "Tính từ đuôi -ing mô tả tính chất của sự việc: inspiring."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Ryan said the whole stadium (1)___ crazy after the goal.", "o": ["go", "goes", "went"], "a": 2, "why": "Kể lại chuyện đã xảy ra, dùng quá khứ đơn: went."}, {"t": "Sofia said she wasn't really a sports (2)___.", "o": ["person", "persons", "people"], "a": 0, "why": "Danh từ ghép 'sports person' dùng số ít 'person'."}, {"t": "Ryan told her the match went down to the (3)___.", "o": ["wire", "end", "last"], "a": 0, "why": "Thành ngữ cố định 'down to the wire'."}, {"t": "She agreed to (4)___ it a try next weekend.", "o": ["give", "gives", "gave"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: give."}, {"t": "Which team is your brother (5)___ for this year?", "o": ["rooting", "root", "rooted"], "a": 0, "why": "Thì hiện tại tiếp diễn: is/are + V-ing: rooting."}, {"t": "Ryan promised she (6)___ regret coming to the match.", "o": ["won't", "doesn't", "isn't"], "a": 0, "why": "Câu tường thuật giữ nguyên thì tương lai phủ định: won't."}]}]}, {"id": "B1-SCIENCE-002", "topic": "SCIENCE", "n": 2, "level": "B1", "title": "Why Do We Dream?", "titleVi": "Vì sao chúng ta mơ?", "passage": [{"en": "Almost everyone dreams, even people who say they never remember any of it.", "vi": "Hầu như ai cũng mơ, kể cả những người nói rằng họ chẳng bao giờ nhớ được gì cả."}, {"en": "On average, a person dreams for about two hours every single night.", "vi": "Trung bình, một người mơ khoảng hai tiếng mỗi đêm."}, {"en": "Most dreams happen during a stage of sleep called REM sleep, when our eyes move quickly.", "vi": "Hầu hết các giấc mơ xảy ra trong giai đoạn ngủ gọi là REM, khi mắt chúng ta chuyển động nhanh."}, {"en": "During this stage, the brain becomes almost as active as when we're awake.", "vi": "Trong giai đoạn này, não bộ trở nên hoạt động gần như lúc chúng ta tỉnh táo."}, {"en": "So why does the brain create these strange stories while we sleep?", "vi": "Vậy tại sao não bộ lại tạo ra những câu chuyện kỳ lạ này trong khi chúng ta ngủ?"}, {"en": "Scientists don't fully agree, but they have a few strong theories.", "vi": "Các nhà khoa học không hoàn toàn thống nhất, nhưng họ có vài giả thuyết mạnh."}, {"en": "One theory says dreams help our brain sort through the day's memories.", "vi": "Một giả thuyết cho rằng giấc mơ giúp não bộ sắp xếp lại những ký ức trong ngày."}, {"en": "The brain decides which memories to keep and which ones to throw away.", "vi": "Não bộ quyết định giữ lại ký ức nào và bỏ đi ký ức nào."}, {"en": "Another theory suggests dreams let us practice dealing with danger in a safe way.", "vi": "Một giả thuyết khác cho rằng giấc mơ cho phép chúng ta luyện tập cách đối phó với nguy hiểm một cách an toàn."}, {"en": "That might explain why so many dreams involve being chased or falling.", "vi": "Điều đó có thể giải thích vì sao rất nhiều giấc mơ liên quan đến việc bị đuổi hoặc bị ngã."}, {"en": "A third theory says dreams simply help process strong emotions from our waking life.", "vi": "Một giả thuyết thứ ba nói rằng giấc mơ đơn giản là giúp xử lý những cảm xúc mạnh từ cuộc sống lúc thức."}, {"en": "That's why we often dream about people or situations connected to how we felt that day.", "vi": "Đó là lý do chúng ta thường mơ về những người hoặc tình huống liên quan đến cảm giác của mình trong ngày."}, {"en": "Interestingly, some people can learn to control their dreams, which is called lucid dreaming.", "vi": "Điều thú vị là một số người có thể học cách điều khiển giấc mơ của mình, gọi là mơ tỉnh táo."}, {"en": "In a lucid dream, the dreamer knows they are dreaming and can sometimes change what happens.", "vi": "Trong một giấc mơ tỉnh táo, người mơ biết mình đang mơ và đôi khi có thể thay đổi những gì xảy ra."}, {"en": "Even without a perfect answer, one thing is clear: dreaming seems to matter for our mental health.", "vi": "Dù không có câu trả lời hoàn hảo, một điều rõ ràng là: giấc mơ dường như quan trọng đối với sức khỏe tinh thần của chúng ta."}, {"en": "People who don't get enough REM sleep often struggle more with memory and mood the next day.", "vi": "Những người không ngủ đủ giấc REM thường gặp khó khăn hơn về trí nhớ và tâm trạng vào ngày hôm sau."}], "dialogue": [{"who": "Ben", "g": "m", "en": "I had the weirdest dream last night. I was flying over my old school.", "vi": "Tối qua mình có một giấc mơ kỳ lạ nhất. Mình đang bay trên trường cũ của mình."}, {"who": "Mia", "g": "f", "en": "Ha, flying dreams are so common. I get those sometimes too.", "vi": "Ha, mơ bay là kiểu mơ rất phổ biến đấy. Mình cũng thỉnh thoảng mơ vậy."}, {"who": "Ben", "g": "m", "en": "Do you know why we even dream in the first place?", "vi": "Cậu có biết tại sao chúng ta lại mơ ngay từ đầu không?"}, {"who": "Mia", "g": "f", "en": "Not exactly, but I read it might help sort out our memories.", "vi": "Không hẳn, nhưng mình đọc được là nó có thể giúp sắp xếp lại ký ức của mình."}, {"who": "Ben", "g": "m", "en": "Interesting. I also dream about being chased a lot.", "vi": "Thú vị đấy. Mình cũng hay mơ bị ai đó đuổi theo."}, {"who": "Mia", "g": "f", "en": "That's apparently really common too. Something about practicing for danger.", "vi": "Hình như kiểu đó cũng rất phổ biến. Có liên quan đến việc luyện tập đối phó nguy hiểm."}, {"who": "Ben", "g": "m", "en": "That actually makes sense. My brain must think I need the practice.", "vi": "Nghe cũng có lý đấy. Chắc não mình nghĩ mình cần luyện tập thật."}, {"who": "Mia", "g": "f", "en": "Have you ever heard of lucid dreaming?", "vi": "Cậu từng nghe về mơ tỉnh táo chưa?"}, {"who": "Ben", "g": "m", "en": "Yeah! Where you know you're dreaming and can control it, right?", "vi": "Có! Là kiểu cậu biết mình đang mơ và có thể điều khiển nó, đúng không?"}, {"who": "Mia", "g": "f", "en": "Exactly. I've tried it a few times but never quite got it.", "vi": "Đúng vậy. Mình đã thử vài lần nhưng chưa bao giờ thành công hẳn."}, {"who": "Ben", "g": "m", "en": "I'd love to try that. Imagine controlling your own dream world.", "vi": "Mình rất muốn thử cái đó. Tưởng tượng điều khiển được cả thế giới trong mơ của mình."}, {"who": "Mia", "g": "f", "en": "Right? Apparently you have to check if you're dreaming during the day too.", "vi": "Đúng không? Nghe nói cậu phải kiểm tra xem mình có đang mơ hay không ngay cả ban ngày nữa."}, {"who": "Ben", "g": "m", "en": "That sounds a bit strange, but I might give it a try.", "vi": "Nghe hơi lạ, nhưng chắc mình sẽ thử xem."}, {"who": "Mia", "g": "f", "en": "Let me know if it works! I'm curious now.", "vi": "Nhớ cho mình biết nếu nó có hiệu quả nhé! Giờ mình tò mò rồi đấy."}, {"who": "Ben", "g": "m", "en": "Will do. Maybe I'll fly over my old school again on purpose.", "vi": "Sẽ làm. Biết đâu mình sẽ cố tình bay trên trường cũ của mình lần nữa."}], "vocab": [{"w": "dream", "f": ["dream", "dreams", "dreamed", "dreaming"], "pos": "n/v", "ipa": "driːm", "vi": "giấc mơ; mơ", "ex": "I had a strange dream last night.", "exVi": "Tối qua tôi có một giấc mơ kỳ lạ."}, {"w": "memory", "f": ["memory", "memories"], "pos": "n", "ipa": "ˈmeməri", "vi": "trí nhớ, ký ức", "ex": "Sleep helps our brain sort through memories.", "exVi": "Giấc ngủ giúp não bộ sắp xếp lại ký ức."}, {"w": "chase", "f": ["chase", "chases", "chased", "chasing"], "pos": "v", "ipa": "tʃeɪs", "vi": "đuổi theo", "ex": "I dreamed that someone was chasing me.", "exVi": "Tôi mơ thấy có ai đó đang đuổi theo mình."}, {"w": "theory", "f": ["theory", "theories"], "pos": "n", "ipa": "ˈθɪəri", "vi": "giả thuyết, học thuyết", "ex": "Scientists have a few theories about why we dream.", "exVi": "Các nhà khoa học có vài giả thuyết về lý do chúng ta mơ."}, {"w": "emotion", "f": ["emotion", "emotions"], "pos": "n", "ipa": "ɪˈmoʊʃən", "vi": "cảm xúc", "ex": "Dreams may help us process strong emotions.", "exVi": "Giấc mơ có thể giúp chúng ta xử lý những cảm xúc mạnh."}, {"w": "control", "f": ["control", "controls", "controlled", "controlling"], "pos": "v", "ipa": "kənˈtroʊl", "vi": "điều khiển, kiểm soát", "ex": "Some people can control their dreams.", "exVi": "Một số người có thể điều khiển giấc mơ của mình."}, {"w": "aware", "f": ["aware"], "pos": "adj", "ipa": "əˈweər", "vi": "nhận thức được, ý thức được", "ex": "In a lucid dream, you're aware that you're dreaming.", "exVi": "Trong một giấc mơ tỉnh táo, bạn nhận thức được rằng mình đang mơ."}, {"w": "curious", "f": ["curious"], "pos": "adj", "ipa": "ˈkjʊəriəs", "vi": "tò mò", "ex": "I've always been curious about dreams.", "exVi": "Tôi luôn tò mò về những giấc mơ."}, {"w": "struggle", "f": ["struggle", "struggles", "struggled", "struggling"], "pos": "v", "ipa": "ˈstrʌɡəl", "vi": "gặp khó khăn, vật lộn", "ex": "People struggle more with memory when they don't sleep enough.", "exVi": "Người ta gặp khó khăn hơn về trí nhớ khi ngủ không đủ giấc."}, {"w": "on purpose", "f": ["on purpose"], "pos": "phrase", "ipa": "ɒn ˈpɜːrpəs", "vi": "cố tình, có chủ đích", "ex": "He flew over his school on purpose in the dream.", "exVi": "Anh ấy cố tình bay trên trường học của mình trong giấc mơ."}], "grammar": [{"title": "Might + động từ nguyên mẫu (khả năng, dựa trên suy luận)", "formula": "S + might + V (nguyên mẫu)", "use": "Dùng để suy đoán một điều gì đó có thể là lý do hoặc kết quả, dựa trên thông tin đã biết.", "examples": [{"en": "That might explain why we dream about falling.", "vi": "Điều đó có thể giải thích vì sao chúng ta mơ về việc bị ngã."}, {"en": "She might be dreaming right now.", "vi": "Có thể cô ấy đang mơ ngay lúc này."}, {"en": "It might help to write your dreams down.", "vi": "Có thể sẽ hữu ích nếu bạn viết giấc mơ của mình ra."}]}, {"title": "Câu bị động với 'is called'", "formula": "S + is/are + called + tên gọi", "use": "Dùng để giới thiệu tên gọi chính thức của một sự vật, hiện tượng. Rất phổ biến khi giải thích khái niệm mới.", "examples": [{"en": "This is called lucid dreaming.", "vi": "Cái này được gọi là mơ tỉnh táo."}, {"en": "That stage of sleep is called REM sleep.", "vi": "Giai đoạn ngủ đó được gọi là giấc ngủ REM."}, {"en": "The process is called memory consolidation.", "vi": "Quá trình đó được gọi là củng cố trí nhớ."}]}], "phrases": [{"p": "in the first place", "vi": "ngay từ đầu", "ex": "Why do we even dream in the first place?", "exVi": "Tại sao chúng ta lại mơ ngay từ đầu?", "ctx": "Trung tính, dùng khi hỏi về nguyên nhân gốc rễ."}, {"p": "makes sense", "vi": "nghe hợp lý, có lý", "ex": "That actually makes sense now that you explain it.", "exVi": "Nghe hợp lý đấy khi cậu giải thích như vậy.", "ctx": "Thân mật, dùng khi đồng ý điều gì đó hợp lý."}, {"p": "give it a try", "vi": "thử xem sao", "ex": "I might give lucid dreaming a try.", "exVi": "Mình có thể sẽ thử mơ tỉnh táo xem sao.", "ctx": "Thân mật, dùng khi định thử điều gì mới."}, {"p": "sort through", "vi": "sắp xếp, lọc qua", "ex": "Dreams may help us sort through our memories.", "exVi": "Giấc mơ có thể giúp chúng ta sắp xếp lại ký ức.", "ctx": "Trung tính, dùng khi nói về việc xử lý, phân loại thông tin."}, {"p": "apparently", "vi": "nghe nói là, hình như", "ex": "Apparently, flying dreams are really common.", "exVi": "Nghe nói là mơ bay rất phổ biến.", "ctx": "Trung tính, dùng khi chia sẻ thông tin nghe được."}, {"p": "I'm curious now", "vi": "giờ mình tò mò rồi đấy", "ex": "Tell me more, I'm curious now.", "exVi": "Kể thêm cho mình đi, giờ mình tò mò rồi đấy.", "ctx": "Thân mật, dùng khi muốn nghe thêm."}, {"p": "never quite got it", "vi": "chưa bao giờ làm được hẳn, chưa thành thạo", "ex": "I tried yoga for years but never quite got it.", "exVi": "Mình tập yoga nhiều năm nhưng chưa bao giờ thành thạo hẳn.", "ctx": "Thân mật, dùng khi thử điều gì đó nhưng chưa thành công trọn vẹn."}, {"p": "sounds a bit strange", "vi": "nghe hơi lạ", "ex": "That sounds a bit strange, but let's try it.", "exVi": "Nghe hơi lạ đấy, nhưng thử xem sao.", "ctx": "Thân mật, dùng khi một ý tưởng nghe khác thường."}, {"p": "let me know", "vi": "cho mình biết nhé", "ex": "Let me know if the trick works for you.", "exVi": "Cho mình biết nhé nếu mẹo đó có hiệu quả với cậu.", "ctx": "Thân mật, dùng khi nhờ ai đó phản hồi lại."}, {"p": "struggle with", "vi": "gặp khó khăn với", "ex": "He struggles with remembering his dreams.", "exVi": "Anh ấy gặp khó khăn trong việc nhớ lại giấc mơ của mình.", "ctx": "Trung tính, dùng khi nói về khó khăn cụ thể."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Most dreams happen during a stage (1)___ REM sleep.", "o": ["call", "calls", "called"], "a": 2, "why": "Bị động: is/are + called để giới thiệu tên gọi."}, {"t": "That (2)___ explain why we dream about falling.", "o": ["might", "must", "can't"], "a": 0, "why": "'Might' dùng để suy đoán khả năng."}, {"t": "The brain decides which memories (3)___ keep.", "o": ["to", "for", "of"], "a": 0, "why": "Cấu trúc 'decide + to V' (quyết định làm gì)."}, {"t": "Some people can learn (4)___ control their dreams.", "o": ["to", "for", "of"], "a": 0, "why": "Sau 'learn' dùng 'to V'."}, {"t": "People who don't sleep enough often (5)___ with memory.", "o": ["struggle", "struggles", "struggled"], "a": 0, "why": "Chủ ngữ số nhiều 'people', hiện tại đơn: struggle."}, {"t": "In a lucid dream, the dreamer (6)___ that they are dreaming.", "o": ["know", "knows", "knowing"], "a": 1, "why": "Chủ ngữ 'the dreamer' số ít, hiện tại đơn thêm 's': knows."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Ben said he (1)___ the weirdest dream the night before.", "o": ["have", "has", "had"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: had."}, {"t": "Mia said flying dreams (2)___ really common.", "o": ["is", "are", "were"], "a": 1, "why": "Sự thật hiển nhiên vẫn giữ thì hiện tại: are."}, {"t": "Ben asked Mia (3)___ she had heard of lucid dreaming.", "o": ["if", "that", "what"], "a": 0, "why": "Câu hỏi Yes/No trong tường thuật dùng 'if'."}, {"t": "Mia said she had tried it but never quite (4)___ it.", "o": ["get", "gets", "got"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: got."}, {"t": "He might fly over his old school (5)___ purpose again.", "o": ["at", "on", "in"], "a": 1, "why": "Thành ngữ cố định 'on purpose'."}, {"t": "Let (6)___ know if the trick works for you.", "o": ["I", "me", "my"], "a": 1, "why": "Thành ngữ cố định 'let me know'."}]}]}, {"id": "B1-DAILY-002", "topic": "DAILY", "n": 2, "level": "B1", "title": "Cooking Dinner After a Long Day", "titleVi": "Nấu bữa tối sau một ngày dài", "passage": [{"en": "After a long day at work, cooking dinner can feel like the last thing anyone wants to do.", "vi": "Sau một ngày dài làm việc, nấu bữa tối có thể cảm thấy như điều cuối cùng ai cũng muốn làm."}, {"en": "Still, eating a home-cooked meal is usually healthier and cheaper than ordering food.", "vi": "Dù vậy, ăn một bữa tự nấu tại nhà thường tốt cho sức khỏe hơn và rẻ hơn so với gọi đồ ăn."}, {"en": "The trick is finding ways to make cooking feel less like a chore.", "vi": "Bí quyết là tìm cách khiến việc nấu ăn cảm thấy bớt giống một việc vặt nặng nề."}, {"en": "One simple idea is to plan your meals for the whole week in advance.", "vi": "Một ý tưởng đơn giản là lên kế hoạch bữa ăn cho cả tuần từ trước."}, {"en": "That way, you don't have to stand in front of the fridge every night wondering what to cook.", "vi": "Như vậy, bạn không phải đứng trước tủ lạnh mỗi tối tự hỏi nên nấu gì."}, {"en": "Another trick is to cook a bigger batch and save the extra for the next day.", "vi": "Một mẹo khác là nấu một mẻ lớn hơn và để dành phần dư cho ngày hôm sau."}, {"en": "This way, some nights you barely need to cook at all.", "vi": "Như vậy, có những tối bạn hầu như không cần nấu gì cả."}, {"en": "Keeping a few simple ingredients at home also makes a big difference.", "vi": "Việc giữ sẵn vài nguyên liệu đơn giản trong nhà cũng tạo ra khác biệt lớn."}, {"en": "Eggs, rice, and frozen vegetables can turn into a decent meal in fifteen minutes.", "vi": "Trứng, cơm và rau đông lạnh có thể trở thành một bữa ăn tạm ổn chỉ trong mười lăm phút."}, {"en": "Music or a podcast can also make cooking feel much more enjoyable.", "vi": "Âm nhạc hoặc podcast cũng có thể khiến việc nấu ăn trở nên thú vị hơn nhiều."}, {"en": "Cooking with a family member or roommate turns a chore into quality time together.", "vi": "Nấu ăn cùng người thân hoặc bạn cùng phòng biến việc vặt thành khoảng thời gian chất lượng bên nhau."}, {"en": "Of course, some nights, ordering food is simply the right choice, and that's completely okay.", "vi": "Tất nhiên, có những tối, gọi đồ ăn đơn giản là lựa chọn hợp lý, và điều đó hoàn toàn ổn."}, {"en": "The goal isn't to cook every single night; it's just to make cooking easier when you do it.", "vi": "Mục tiêu không phải là nấu ăn mỗi tối; mà đơn giản là làm cho việc nấu ăn dễ dàng hơn khi bạn làm."}, {"en": "Over time, cooking can actually become a relaxing part of the evening instead of a stressful task.", "vi": "Theo thời gian, nấu ăn thực sự có thể trở thành một phần thư giãn của buổi tối thay vì một việc căng thẳng."}, {"en": "Many people even say cooking helps them switch off from work thoughts.", "vi": "Nhiều người thậm chí nói rằng nấu ăn giúp họ ngừng nghĩ về công việc."}, {"en": "So the next time you're too tired to cook, remember: even a simple meal still counts.", "vi": "Vậy nên lần tới khi bạn quá mệt để nấu ăn, hãy nhớ: dù chỉ là một bữa ăn đơn giản cũng vẫn tính."}], "dialogue": [{"who": "Olivia", "g": "f", "en": "What are you making for dinner tonight?", "vi": "Tối nay cậu nấu gì vậy?"}, {"who": "Daniel", "g": "m", "en": "Honestly, I'm too tired to cook. Probably just ordering pizza.", "vi": "Thật lòng thì mình mệt quá không nấu nổi. Chắc là đặt pizza thôi."}, {"who": "Olivia", "g": "f", "en": "I get it. I almost did the same thing.", "vi": "Mình hiểu mà. Mình suýt cũng làm y vậy."}, {"who": "Daniel", "g": "m", "en": "What changed your mind?", "vi": "Cái gì khiến cậu đổi ý vậy?"}, {"who": "Olivia", "g": "f", "en": "I remembered I had leftover rice, so I just made fried rice with eggs.", "vi": "Mình nhớ ra là còn cơm nguội, nên mình làm cơm chiên với trứng thôi."}, {"who": "Daniel", "g": "m", "en": "That sounds easy enough, actually.", "vi": "Nghe cũng dễ đấy chứ."}, {"who": "Olivia", "g": "f", "en": "It really is. Fifteen minu
