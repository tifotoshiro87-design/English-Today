<!DOCTYPE html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nói tiếng Anh">
<meta name="theme-color" content="#0B7A85">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B7A85'/%3E%3Ctext x='50' y='64' font-size='52' font-family='Arial,sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B7A85'/%3E%3Ctext x='50' y='64' font-size='52' font-family='Arial,sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22N%C3%B3i%20ti%E1%BA%BFng%20Anh%20nh%C6%B0%20ng%C6%B0%E1%BB%9Di%20b%E1%BA%A3n%20x%E1%BB%A9%22%2C%22short_name%22%3A%22N%C3%B3i%20ti%E1%BA%BFng%20Anh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F2F6F7%22%2C%22theme_color%22%3A%22%230B7A85%22%7D">
<title>Nói tiếng Anh như người bản xứ – 3 cấp độ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --ink:#16303A; --muted:#566E7A; --line:#D3DFE4;
  --brand:#0B7A85; --brand-ink:#FFFFFF; --brand-soft:#DDF1F3;
  --hi:#FFE7A0; --ok:#1B8558; --ok-soft:#DCF3E7; --bad:#C23B3B; --bad-soft:#FBE2E2; --warn-soft:#FFF1CF;
  --s0:#DDF1F3; --s1:#FFF0CC; --s2:#EADFF7; --s3:#E1F2D9;
  --shadow:0 1px 2px rgba(22,48,58,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F181C; --surface:#172329; --ink:#E6EFF2; --muted:#98AEB8; --line:#2B3C44;
    --brand:#4CC4CE; --brand-ink:#08262A; --brand-soft:#173A40;
    --hi:#5B4B14; --ok:#4CC58F; --ok-soft:#153427; --bad:#F08585; --bad-soft:#3B1C1C; --warn-soft:#3A3212;
    --s0:#173A40; --s1:#3A3212; --s2:#2E2545; --s3:#22381A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F181C; --surface:#172329; --ink:#E6EFF2; --muted:#98AEB8; --line:#2B3C44;
  --brand:#4CC4CE; --brand-ink:#08262A; --brand-soft:#173A40;
  --hi:#5B4B14; --ok:#4CC58F; --ok-soft:#153427; --bad:#F08585; --bad-soft:#3B1C1C; --warn-soft:#3A3212;
  --s0:#173A40; --s1:#3A3212; --s2:#2E2545; --s3:#22381A; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;overflow-wrap:break-word;word-break:break-word;min-width:0}
img,svg,video,canvas{max-width:100%}
.opts,.tabs,.lvsw,.nav{min-width:0}
.opt,.tabs button,.lvsw button,.nav button{min-width:0;overflow-wrap:break-word;word-break:break-word;white-space:normal}
.bub,.bub .ln,.bub .ln>*,.turn{min-width:0;max-width:100%}
.vw,.vw>*{min-width:0}
.wd{overflow-wrap:break-word;word-break:break-word}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;font-size:1rem;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,.w:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
p{margin:.3rem 0}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto;padding:0 .9rem 5rem}
.composer-fixed{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:.6rem .9rem calc(.6rem + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.composer-in{max-width:720px;margin:0 auto}
body.has-composer .wrap{padding-bottom:11rem}

/* top bar */
.top-in{max-width:720px;margin:0 auto;padding:.6rem .9rem .3rem}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.navbar-in{max-width:720px;margin:0 auto;padding:.4rem .9rem}
.brand{display:flex;align-items:center;gap:.6rem}
.lv{background:var(--brand);color:var(--brand-ink);font-weight:800;border-radius:.6rem;padding:.15rem .55rem;font-size:.95rem}
.ttl{font-weight:800;font-size:1.05rem;line-height:1.2}
.sub{color:var(--muted);font-size:.8rem}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.nav button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:.7rem;font-weight:600;font-size:.82rem;padding:.3rem .2rem}
.nav button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lvsw{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin:.4rem 0 .1rem}
.lvsw button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:.7rem;font-weight:700;font-size:.85rem;padding:.2rem}
.lvsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvsw button .soon{display:block;font-weight:500;font-size:.72rem;opacity:.7}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.9rem;margin:.8rem 0;box-shadow:var(--shadow);overflow-wrap:break-word;word-break:break-word;max-width:100%}
.h2{font-size:1.25rem;font-weight:800;margin:1.1rem 0 .4rem}
.h3{font-size:1.05rem;font-weight:800;margin:.2rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border-radius:.8rem;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.block{display:flex;width:100%}
.btn.on{background:var(--brand-soft);border-color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.4rem;margin:.4rem 0}
.bar{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.back{background:none;border:0;color:var(--brand);font-weight:700;min-height:44px;padding:0 .2rem}

/* lists */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.7rem .9rem;margin:.5rem 0;min-height:64px}
.item .num{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center}
.item .t{font-weight:700;line-height:1.3}
.item .d{font-size:.85rem;color:var(--muted)}
.item .go{margin-left:auto;color:var(--muted);font-size:1.3rem}
.item.done .num{background:var(--ok);color:#fff}
.item.soon{opacity:.6}

/* speaker button */
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk svg{width:22px;height:22px;fill:currentColor}
.spk .ic-stop,.btn-all .ic-stop{display:none}
.spk.playing{background:var(--brand);color:var(--brand-ink)}
.spk.playing .ic-play,.btn-all.playing .ic-play{display:none}
.spk.playing .ic-stop,.btn-all.playing .ic-stop{display:block}
.btn-all.playing{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin:.6rem 0}
.tabs button{grid-column:span 2;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:.8rem;font-weight:600;font-size:.88rem;line-height:1.2;padding:.3rem .3rem}
.tabs button:nth-child(-n+2){grid-column:span 3}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* passage */
.row{display:flex;gap:.55rem;align-items:flex-start;padding:.55rem .4rem;border-bottom:1px solid var(--line);border-radius:.6rem}
.row:last-child{border-bottom:0}
.row.now{background:var(--hi)}
.row .tx{flex:1;min-width:0}
.en{font-size:1.02rem}
.vi{color:var(--muted);font-size:.92rem}
.w{border-bottom:2px dotted var(--brand);cursor:pointer;touch-action:manipulation}
.para{font-size:1.08rem;line-height:1.9;margin-top:.5rem;overflow-wrap:break-word;word-break:break-word}
.para.vi{color:var(--muted);font-size:.98rem;line-height:1.75;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.8rem;overflow-wrap:break-word;word-break:break-word}
.sen{border-radius:.35rem;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sen.now{background:var(--hi)}

/* dialogue */
.turn{display:flex;flex-direction:column;margin:.7rem 0;width:94%}
.turn.r{margin-left:auto;align-items:flex-end}.turn.r .bub{align-self:stretch}.turn:not(.r) .bub{align-self:stretch}
.turn .who{font-weight:800;font-size:.85rem;margin:0 .5rem .15rem}
.bub{border-radius:1.1rem;padding:.55rem .75rem;border:1px solid var(--line)}
.turn.k0 .bub{background:var(--s0)} .turn.k1 .bub{background:var(--s1)} .turn.k2 .bub{background:var(--s2)} .turn.k3 .bub{background:var(--s3)}
.turn.now .bub{outline:3px solid var(--hi)}
.bub .ln{display:flex;gap:.5rem;align-items:flex-start}
.bub .vi{margin-top:.25rem}

/* vocab */
.vw{display:flex;gap:.6rem;align-items:center}
.vw .wd{font-weight:800;font-size:1.15rem}
.pos{background:var(--brand-soft);color:var(--brand);border-radius:.5rem;padding:0 .4rem;font-size:.8rem;font-weight:700;margin-left:.3rem}
.ipa{color:var(--muted);font-size:.95rem}
.exr{display:flex;gap:.5rem;align-items:flex-start;margin-top:.35rem}
.exr>div{min-width:0;flex:1 1 auto;overflow-wrap:break-word;word-break:break-word}
.formula{background:var(--warn-soft);border-radius:.7rem;padding:.5rem .7rem;font-weight:700;margin:.4rem 0}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:.6rem;padding:.05rem .5rem;font-size:.82rem;font-weight:600}

/* speaking */
.emma{display:flex;gap:.7rem;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem}
.msg{border-radius:1rem;padding:.6rem .8rem;margin:.6rem 0;border:1px solid var(--line);background:var(--surface);overflow-wrap:break-word;word-break:break-word;max-width:100%}
.msg.me{background:var(--brand-soft);margin-left:12%}
.msg.girl{margin-right:6%}
.fb-sec{border-radius:.8rem;padding:.5rem .7rem;margin:.4rem 0;background:var(--bg);overflow-wrap:break-word;word-break:break-word}
.fb-sec.okc{background:var(--ok-soft)} .fb-sec.badc{background:var(--bad-soft)}
.fb-sec ul{margin:.2rem 0 0;padding-left:1.2rem}
textarea{width:100%;min-height:90px;font:inherit;font-size:1.05rem;padding:.7rem;border-radius:.8rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.mic{width:100%;min-height:76px;border-radius:1.2rem;border:0;background:var(--brand);color:var(--brand-ink);font-size:1.2rem;font-weight:800}
.mic.live{background:var(--bad);color:#fff}
.info{background:var(--warn-soft);border-radius:.8rem;padding:.6rem .8rem;margin:.6rem 0}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* quiz */
.qtext{line-height:1.9;font-size:1.05rem}
.blank{background:var(--warn-soft);border-radius:.4rem;padding:0 .3rem;font-weight:700}
.filled{border-radius:.4rem;padding:0 .3rem;font-weight:700}
.filled.ok{background:var(--ok-soft);color:var(--ok)}
.filled.bad{background:var(--bad-soft);color:var(--bad)}
.qb{border-top:1px solid var(--line);padding:.6rem 0}
.qn{font-weight:800;margin-bottom:.3rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.opt{min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:.8rem;font-weight:600;padding:.2rem .3rem;line-height:1.2;word-break:break-word}
.opt b{color:var(--brand)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:.4rem;font-size:.92rem}
.why.okc{color:var(--ok)} .why.badc{color:var(--bad)}
.result{text-align:center}
.result .big{font-size:2rem;font-weight:800}

/* settings */
.vrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.vrow .nm{flex:1 1 12rem;min-width:0;font-weight:600;font-size:.95rem;word-break:break-word}
.vrow .btn{min-height:44px;padding:.3rem .7rem;font-size:.9rem}
.badge{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:.5rem;padding:0 .4rem;font-size:.75rem;font-weight:700;margin-left:.3rem}

/* overlays */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:.6rem .8rem calc(.8rem + env(safe-area-inset-bottom,0px));display:none}
#sheet.on{display:block}
#sheet .in{max-width:720px;margin:0 auto;background:var(--surface);border:2px solid var(--brand);border-radius:1.1rem;padding:.8rem .9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#notice{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + .5rem);z-index:50;display:none;padding:0 .8rem}
#notice.on{display:block}
#notice .in{max-width:720px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:.9rem;padding:.7rem .9rem;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" role="dialog" aria-live="polite"></div>
<div id="notice" role="alert"><div class="in" id="noticeTx"></div></div>
<script>
function boot(DATA){
'use strict';

var BUILD_VER = '2026-10-06.1';
var LEVELS = DATA.levels;
function levelByKey(k){ for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].key===k) return LEVELS[i]; return LEVELS[0]; }
var curLevelKey='B1';
try{ curLevelKey = window.localStorage.getItem('eng.level') || 'B1'; }catch(e){}
if(!levelByKey(curLevelKey)) curLevelKey='B1';
var LV = levelByKey(curLevelKey);
var KEY, mem, store, settings, learned, scores;
function loadLevelStore(){
  KEY = 'eng.' + String(LV.key).toLowerCase() + '.';
  mem = {};
  store = {
    get:function(k,d){ try{ var v=window.localStorage.getItem(KEY+k); if(v===null) return (k in mem)?mem[k]:d; return JSON.parse(v); }catch(e){ return (k in mem)?mem[k]:d; } },
    set:function(k,v){ mem[k]=v; try{ window.localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }
  };
  settings = Object.assign({theme:'auto',font:0,rate:0.9,voiceF:'',voiceM:'',reader:'f'}, store.get('settings',{}) || {});
  learned = store.get('learned',{}) || {};
  scores = store.get('scores',{}) || {};
}
loadLevelStore();
function saveSettings(){ store.set('settings',settings); }
function switchLevel(key){
  if(key===LV.key) return;
  LV = levelByKey(key); curLevelKey = LV.key;
  try{ window.localStorage.setItem('eng.level', LV.key); }catch(e){}
  loadLevelStore(); applySettings(); reloadLessons();
  S={view:'home',topic:null,lesson:null,tab:0,trans:false};
  QS=null; SP={id:null,turns:[],mode:'type',draft:'',busy:false,micMsg:'',err:'',ctl:null};
  stopSpeak(); render(); try{ window.scrollTo(0,0); }catch(e){}
}

var app = document.getElementById('app');
var FONTS = [18,21,24];
function applySettings(){
  var r=document.documentElement;
  r.setAttribute('data-theme', settings.theme);
  r.style.fontSize = (FONTS[settings.font]||18)+'px';
}
applySettings();

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function qs(s,r){ return (r||document).querySelector(s); }
function qsa(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

var MSG = {
  noTTS:'Máy của bạn chưa hỗ trợ đọc thành tiếng. Hãy mở bằng Safari (iPhone) hoặc Chrome/Edge (Windows).',
  noVoice:'Máy bạn chưa có giọng đọc tiếng Anh. iPhone: Cài đặt > Trợ năng > Nội dung được đọc > Giọng nói. Windows: Cài đặt > Thời gian & ngôn ngữ > Giọng nói.',
  tapAgain:'Bấm lại nút loa một lần nữa để nghe nhé.',
  noMic:'Máy bạn chưa hỗ trợ nói vào micro. Bạn bấm “Viết” để gõ câu tiếng Anh nhé. iPhone dùng Safari; Windows dùng Chrome hoặc Edge.',
  micDenied:'Chưa được cấp quyền micro. iPhone: Cài đặt > Safari > Micro. Windows: bấm biểu tượng ổ khóa cạnh địa chỉ trang rồi cho phép micro. Hoặc bấm “Viết” để gõ chữ.',
  micNoSpeech:'Mình chưa nghe thấy giọng nói. Bạn bấm micro và nói lại nhé.',
  micFail:'Micro chưa hoạt động lúc này. Bạn thử lại hoặc bấm “Viết” để gõ chữ nhé.'
};

var noticeT=null;
function notice(msg,ms){
  var n=document.getElementById('notice'); document.getElementById('noticeTx').textContent=msg; n.classList.add('on');
  clearTimeout(noticeT); noticeT=setTimeout(function(){ n.classList.remove('on'); }, ms||6000);
}

/* ---------- lessons ---------- */
var TOPICS = DATA.topics;
var topicIdx = {}; TOPICS.forEach(function(t,i){ topicIdx[t.key]=i; });
var LESSONS;
function reloadLessons(){
  LESSONS = DATA.lessons.filter(function(l){ return l.level===LV.key; }).sort(function(a,b){ return (topicIdx[a.topic]-topicIdx[b.topic]) || (a.n-b.n); });
}
reloadLessons();
function lessonById(id){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].id===id) return LESSONS[i]; return null; }
function topicByKey(k){ return TOPICS[topicIdx[k]]; }
function lessonsOf(k){ return LESSONS.filter(function(l){ return l.topic===k; }); }
function learnedCount(){ var c=0; LESSONS.forEach(function(l){ if(learned[l.id]) c++; }); return c; }
function nextLesson(){ for(var i=0;i<LESSONS.length;i++) if(!learned[LESSONS[i].id]) return LESSONS[i]; return null; }
function nextInTopic(L){ var a=lessonsOf(L.topic); for(var i=0;i<a.length;i++) if(a[i].id===L.id) return a[i+1]||null; return null; }

/* ---------- voices ---------- */
var FEM = 'samantha karen moira tessa fiona victoria allison ava susan zira hazel aria jenny michelle libby sonia natasha clara emily olivia kate serena joanna salli kimberly ivy amy emma nicole catherine heather linda zoe veena holly mia maisie shelley sandy flo female nancy jane ashley sara elizabeth evelyn mary denise ayanna leah lucy eva ellen lily megan ruth stephanie claire jessica joan joanne matilda molly rachel sophia grandma karen'.split(' ');
var MAL = 'daniel alex fred tom aaron arthur gordon rishi oliver nathan evan david mark george richard james guy ryan davis brian christopher eric roger steffan andrew ethan jason matthew joey justin kevin russell reed rocko male neil liam thomas jacob ronald sean tony william henry jack john paul jim lewis luke alfie connor harry mitchell noah ronan eddy grandpa'.split(' ');
var NOVELTY = /(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|junior|kathy|bruce|vicki|agnes|princess)/i;
/* Giọng họ Eloquence của Apple (Eddy, Flo, Reed, Rocko, Sandy, Shelley, Grandma, Grandpa) đọc to cả mã điều khiển trên iPhone khi đổi tốc độ, nên loại bỏ hoàn toàn */
var ELOQ = /(eloquence|(^|[^a-z])(eddy|flo|reed|rocko|sandy|shelley|grandma|grandpa)([^a-z]|$))/i;
var GOOD = 'samantha ava allison susan nicky evan nathan daniel karen moira tessa serena oliver zoe aria jenny guy'.split(' ');
var groups = {f:[],m:[],u:[]}, byName = {}, voicesTotal = 0, enTotal = 0;
function hasTTS(){ return ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance!=='undefined'; }
function classify(v){
  var nm=(v.name||'').toLowerCase(), toks=nm.split(/[^a-z]+/), g='u', i;
  if(toks.indexOf('female')>-1) g='f'; else if(toks.indexOf('male')>-1) g='m';
  else{ for(i=0;i<toks.length;i++){ if(FEM.indexOf(toks[i])>-1){g='f';break;} } if(g==='u'){ for(i=0;i<toks.length;i++){ if(MAL.indexOf(toks[i])>-1){g='m';break;} } } }
  var q=0;
  /* Giọng Siri (iPhone) là chuẩn tham chiếu người dùng chọn, nên luôn xếp lên đầu danh sách trên iPhone */
  if(/siri/i.test(v.name)) q+=10;
  if(/premium/i.test(v.name)) q+=3;
  if(/enhanced/i.test(v.name)) q+=2;
  if(/neural|natural|online/i.test(v.name)) q+=2;
  if(v.localService===false) q+=1;
  if(/google/i.test(v.name)) q+=1;
  if(toks.some(function(t){ return GOOD.indexOf(t)>-1; })) q+=.6;
  if(/^en[-_]US$/i.test(v.lang)) q+=.5; else if(/^en[-_]GB$/i.test(v.lang)) q+=.4;
  return {v:v,g:g,q:q,name:v.name,lang:v.lang};
}
function refreshVoices(){
  if(!hasTTS()) return;
  var all=[]; try{ all=window.speechSynthesis.getVoices()||[]; }catch(e){}
  voicesTotal=all.length;
  var seen={}, g={f:[],m:[],u:[]}, n=0; byName={};
  all.forEach(function(v){
    if(!/^en([-_]|$)/i.test(v.lang||'')) return;
    if(NOVELTY.test(v.name||'')) return;
    if(ELOQ.test((v.name||'')+' '+(v.voiceURI||''))) return;
    var k=v.name+'|'+v.lang; if(seen[k]) return; seen[k]=1;
    var c=classify(v); g[c.g].push(c); byName[v.name]=v; n++;
  });
  ['f','m','u'].forEach(function(k){ g[k].sort(function(a,b){ return (b.q-a.q) || a.name.localeCompare(b.name); }); });
  groups=g; enTotal=n;
}
function voiceFor(g){
  var want = g==='m' ? settings.voiceM : settings.voiceF;
  if(want && byName[want]) return byName[want];
  var list = g==='m' ? groups.m : groups.f;
  if(list.length) return list[0].v;
  var any = groups.f[0]||groups.m[0]||groups.u[0];
  return any ? any.v : null;
}
if(hasTTS()){
  refreshVoices();
  try{ window.speechSynthesis.onvoiceschanged=function(){ refreshVoices(); if(S && S.view==='settings') render(); }; }catch(e){}
  var tries=0, iv=setInterval(function(){ tries++; refreshVoices(); if(enTotal>0||tries>12){ clearInterval(iv); if(S.view==='settings') render(); } },500);
}

/* ---------- speech (English only) ---------- */
var token=0, UTT=[], wd=null, unlocked=false;
var NUM1=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var NUM10=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function say3(n){
  var s='';
  if(n>=100){ s+=NUM1[Math.floor(n/100)]+' hundred'; n%=100; if(n) s+=' '; }
  if(n>=20){ s+=NUM10[Math.floor(n/10)]; if(n%10) s+='-'+NUM1[n%10]; }
  else if(n>0) s+=NUM1[n];
  return s;
}
/* đổi số thành chữ để trình đọc không đọc rời từng chữ số, tránh đọc sai/lẫn trong câu */
function numToWords(n){
  n=Math.round(n);
  if(n===0) return 'zero';
  if(n<0) return 'minus '+numToWords(-n);
  if(n>=1000000000) return 'a very large number';
  var parts=[];
  if(n>=1000000){ parts.push(say3(Math.floor(n/1000000))+' million'); n%=1000000; }
  if(n>=1000){ parts.push(say3(Math.floor(n/1000))+' thousand'); n%=1000; }
  if(n>0) parts.push(say3(n));
  return parts.join(' ');
}
function clean(t){
  var s=String(t==null?'':t);
  s=s.replace(/<[^>]*>/g,' ');
  s=s.replace(/\(\s*\d+\s*\)\s*_+/g,' blank ').replace(/_{2,}/g,' blank ');
  try{ s=s.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2B00-\u2BFF\u2190-\u21FF\u2705\u274C]/gu,' '); }catch(e){}
  s=s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,', ');
  s=s.replace(/&/g,' and ');
  /* $12.50 -> "12 dollars and 50 cents"; $12 -> "12 dollars" */
  s=s.replace(/\$\s*(\d[\d,]*)(?:\.(\d{1,2}))?/g,function(m,a,b){
    var d=parseInt(a.replace(/,/g,''),10); var out=numToWords(d)+' dollar'+(d===1?'':'s');
    if(b){ var c=parseInt(b.length===1?b+'0':b,10); if(c>0) out+=' and '+numToWords(c)+' cent'+(c===1?'':'s'); }
    return out;
  });
  /* 25% -> "25 percent" */
  s=s.replace(/(\d[\d,]*)\s*%/g,function(m,a){ return numToWords(parseInt(a.replace(/,/g,''),10))+' percent'; });
  /* các số nguyên độc lập còn lại (ví dụ trong câu trắc nghiệm) đổi sang chữ để đọc trơn tru */
  s=s.replace(/\b\d{1,9}\b/g,function(m){ return numToWords(parseInt(m,10)); });
  s=s.replace(/[\u0250-\u02FF\u0300-\u036F]/g,'').replace(/[\/\[\]{}<>|*#~^=+\\]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function clearPlaying(){
  qsa('.spk.playing,.btn-all.playing').forEach(function(el){ el.classList.remove('playing'); });
  qsa('.now').forEach(function(el){ el.classList.remove('now'); });
}
/* trả về true nếu lúc gọi đang có tiếng đọc dở */
function stopSpeak(){
  token++; clearInterval(wd); UTT=[];
  var busy=false;
  try{ if(hasTTS()){ var sy=window.speechSynthesis; busy=!!(sy.speaking||sy.pending); sy.cancel(); } }catch(e){}
  clearPlaying();
  return busy;
}
/* Mở khóa âm thanh của iPhone bằng một câu im lặng trong lần chạm đầu tiên */
function unlockTTS(){
  if(unlocked||!hasTTS()) return; unlocked=true;
  try{ var u=new window.SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }catch(e){}
}
function markNow(id){
  qsa('.now').forEach(function(el){ el.classList.remove('now'); });
  if(!id) return; var r=document.getElementById(id);
  if(r){ r.classList.add('now'); try{ var bb=r.getBoundingClientRect(); if(bb.top<110||bb.bottom>window.innerHeight-20) r.scrollIntoView({block:'center'}); }catch(e){} }
}
function speakItems(items, opts){
  opts=opts||{};
  if(!hasTTS()){ notice(MSG.noTTS); return; }
  var wasOn = opts.btn && opts.btn.classList.contains('playing');
  var busy=stopSpeak();
  if(wasOn) return;                       // bấm lần nữa = dừng
  unlocked=true;
  var tok=token;
  refreshVoices();
  if(voicesTotal>0 && enTotal===0){ notice(MSG.noVoice,9000); return; }
  if(opts.btn) opts.btn.classList.add('playing');
  var syn=window.speechSynthesis;
  function run(){
    if(tok!==token) return;
    try{ if(syn.paused) syn.resume(); }catch(e){}
    var list=[]; UTT=list;
    items.forEach(function(it,i){
      var text=clean(it.text); if(!text) return;
      var u=new window.SpeechSynthesisUtterance(text);
      var v = it.voice || voiceFor(it.g||settings.reader);
      if(v){ u.voice=v; u.lang=v.lang; } else { u.lang='en-US'; }
      u.rate=settings.rate;
      u.onstart=function(){ if(tok===token) markNow(opts.rows&&opts.rows[i]); };
      u.onend=function(){ if(tok===token && u===list[list.length-1]) clearPlaying(); };
      u.onerror=function(e){
        if(tok!==token) return; var er=e&&e.error;
        if(er==='not-allowed'){ stopSpeak(); notice(MSG.tapAgain); }
      };
      list.push(u);
    });
    list.forEach(function(u){ try{ syn.speak(u); }catch(err){ stopSpeak(); notice(MSG.noTTS); } });
    /* phòng khi iPhone không báo "đã đọc xong": tự trả nút về trạng thái nghỉ */
    var idle=0, t0=Date.now(); clearInterval(wd);
    wd=setInterval(function(){
      if(tok!==token){ clearInterval(wd); return; }
      if(Date.now()-t0<1500) return;
      if(!syn.speaking && !syn.pending){ idle++; if(idle>=2){ clearInterval(wd); clearPlaying(); } } else idle=0;
    },600);
  }
  /* iPhone hay bỏ qua câu mới nếu vừa hủy câu cũ ngay lập tức, nên chờ một nhịp ngắn */
  if(busy) setTimeout(run,140); else run();
}

function wrapWords(text,L){
  if(!L._re){
    var map={}; L.vocab.forEach(function(v,i){ (v.f||[v.w]).forEach(function(f){ map[f.toLowerCase()]=i; }); });
    var keys=Object.keys(map).sort(function(a,b){ return b.length-a.length; }).map(escRe);
    L._map=map; L._re=new RegExp('\\b('+keys.join('|')+')\\b','gi');
  }
  var re=L._re, out='', last=0, m; re.lastIndex=0;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    out+='<span class="w" role="button" tabindex="0" data-act="word" data-i="'+L._map[m[0].toLowerCase()]+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

function copyText(txt){
  var done=function(){ notice('Đã sao chép. Mở Claude và dán vào ô chat để bắt đầu luyện nói.'); };
  var fallback=function(){
    var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ notice('Chưa sao chép được. Bạn hãy nhấn giữ và sao chép thủ công nhé.'); }
    document.body.removeChild(ta);
  };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,fallback); } else fallback(); }catch(e){ fallback(); }
}

/* quiz */
function tabQuiz(L){
  if(!QS||QS.id!==L.id) QS={id:L.id,p:0,ans:{},done:false,finished:false,cd:0};
  var st=QS, h='<div class="h2" style="margin-top:.4rem">Trắc nghiệm</div>';
  if(st.finished){
    return h+'<div class="card result"><div class="big">Hoàn thành!</div><p>Bạn đã làm hết 3 đoạn của bài này. Bài kế tiếp cùng chủ đề sẽ có khi Claude cập nhật bài học.</p><button type="button" class="btn pri block" data-act="qagain">Làm lại 3 đoạn</button><div style="height:.5rem"></div><button type="button" class="btn block" data-act="topic" data-key="'+esc(L.topic)+'">Về danh sách bài</button></div>';
  }
  var P=L.quiz[st.p], ss=P.sentences;
  var para=ss.map(function(q,i){
    var t=esc(q.t);
    return t.replace(/\((\d+)\)_+/g,function(m,n){
      var a=st.ans[n-1], qq=ss[n-1];
      if(a===undefined) return '<span class="blank">('+n+')___</span>';
      return '<span class="filled '+(a===qq.a?'ok':'bad')+'">('+n+') '+esc(qq.o[a])+'</span>';
    });
  }).join(' ');
  h+='<div class="muted small">Đoạn '+(st.p+1)+'/3 · '+esc(P.title)+'</div>';
  h+='<div class="card"><div style="margin-bottom:.4rem">'+spk(ss.map(function(q){ return q.t; }).join(' '),settings.reader)+'</div><div class="qtext">'+para+'</div></div>';
  var L3=['a','b','c'], answered=0, correct=0;
  ss.forEach(function(q,i){
    var a=st.ans[i]; if(a!==undefined){ answered++; if(a===q.a) correct++; }
    h+='<div class="qb"><div class="qn">'+(i+1)+'/</div><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt'; if(a!==undefined){ if(j===q.a) cls+=' ok'; else if(j===a) cls+=' bad'; }
      h+='<button type="button" class="'+cls+'" data-act="pick" data-n="'+i+'" data-o="'+j+'"'+(a!==undefined?' disabled':'')+'><b>'+L3[j]+'</b>-'+esc(o)+'</button>';
    });
    h+='</div>';
    if(a!==undefined) h+='<div class="why '+(a===q.a?'okc':'badc')+'">'+(a===q.a?'✅ Đúng! ':'❌ Chưa đúng. Đáp án: '+L3[q.a]+'-'+esc(q.o[q.a])+'. ')+esc(q.why)+'</div>';
    h+='</div>';
  });
  if(answered===ss.length){
    st.done=true;
    h+='<div class="card result" id="qres"><div class="big">'+correct+'/'+ss.length+'</div><p>Bạn làm đúng '+correct+' trên '+ss.length+' câu.</p>'+
       '<p class="muted" id="qcd">'+(st.p<2?'Tự chuyển sang đoạn tiếp theo sau '+st.cd+' giây':'Tự chuyển sang bài kế tiếp sau '+st.cd+' giây')+'</p>'+
       '<button type="button" class="btn pri block" data-act="qnext">'+(st.p<2?'Sang đoạn tiếp theo':'Sang bài kế tiếp')+'</button><div style="height:.5rem"></div><button type="button" class="btn block" data-act="qstay">Ở lại xem lại</button></div>';
  }
  return h;
}
function quizPick(n,o){
  var L=lessonById(S.lesson), st=QS; if(!st||st.done||st.ans[n]!==undefined) return;
  st.ans[n]=o; var P=L.quiz[st.p], ss=P.sentences;
  var all=Object.keys(st.ans).length===ss.length;
  if(all){
    var c=0; ss.forEach(function(q,i){ if(st.ans[i]===q.a) c++; });
    scores[L.id+':'+st.p]={c:c,t:ss.length,ts:Date.now()}; store.set('scores',scores);
    st.cd=10;
  }
  var y=window.pageYOffset; renderTab(); try{ window.scrollTo(0,y); }catch(e){}
  if(all){
    var res=document.getElementById('qres'); if(res){ try{ res.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
    clearQT(); qTimer=setInterval(function(){
      if(!QS||S.view!=='lesson'||S.tab!==4){ clearQT(); return; }
      QS.cd--; var el=document.getElementById('qcd');
      if(QS.cd<=0){ clearQT(); quizAdvance(); return; }
      if(el) el.textContent=(QS.p<2?'Tự chuyển sang đoạn tiếp theo sau ':'Tự chuyển sang bài kế tiếp sau ')+QS.cd+' giây';
    },1000);
  }
}
function quizAdvance(){
  clearQT(); stopSpeak();
  var L=lessonById(S.lesson), st=QS; if(!L||!st) return;
  if(st.p<2){ st.p++; st.ans={}; st.done=false; renderTab(); try{ window.scrollTo(0,0); }catch(e){} return; }
  var nx=nextInTopic(L);
  if(nx){ S.lesson=nx.id; S.tab=4; QS={id:nx.id,p:0,ans:{},done:false,finished:false,cd:0}; render(); try{ window.scrollTo(0,0); }catch(e){} notice('Trắc nghiệm của bài kế tiếp: '+nx.title,4000); }
  else{ st.finished=true; renderTab(); try{ window.scrollTo(0,0); }catch(e){} }
}

/* events */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el) return;
  var a=el.getAttribute('data-act');
  if(!unlocked && a!=='say' && a!=='sayall' && a!=='vtry') unlockTTS();
  switch(a){
    case 'switchlv': switchLevel(el.getAttribute('data-lv')); break;
    case 'home': go('home'); break;
    case 'podcast': go('podcast'); break;
    case 'roadmap': go('roadmap'); break;
    case 'settings': go('settings'); break;
    case 'topic': go('topic',{topic:el.getAttribute('data-key')}); break;
    case 'lesson': SP={id:null,turns:[],mode:'type',draft:'',busy:false,micMsg:'',err:'',ctl:null}; go('lesson',{lesson:el.getAttribute('data-id'),tab:0,trans:false}); break;
    case 'tab': stopSpeak(); clearQT(); closeSheet(); S.tab=+el.getAttribute('data-n'); renderTab(); try{ window.scrollTo(0,0); }catch(err){} break;
    case 'trans': S.trans=!S.trans; stopSpeak(); renderTab(); break;
    case 'learn': var L=lessonById(S.lesson); if(L){ if(learned[L.id]) delete learned[L.id]; else learned[L.id]=true; store.set('learned',learned); render(); } break;
    case 'say': var it=SAY[+el.getAttribute('data-i')]; if(it) speakItems([{text:it.text,g:it.g}],{btn:el}); break;
    case 'sayall': var g=SAYALL[+el.getAttribute('data-i')]; if(g) speakItems(g.items,{btn:el,rows:g.rows}); break;
    case 'word': openWord(+el.getAttribute('data-i')); break;
    case 'closesheet': closeSheet(); break;
    case 'theme': settings.theme=el.getAttribute('data-v'); saveSettings(); applySettings(); render(); break;
    case 'font': settings.font=+el.getAttribute('data-v'); saveSettings(); applySettings(); render(); break;
    case 'rate': settings.rate=+el.getAttribute('data-v'); saveSettings(); render(); break;
    case 'reader': settings.reader=el.getAttribute('data-v'); saveSettings(); render(); break;
    case 'revoice': refreshVoices(); render(); break;
    case 'vtry': var c=VREG[+el.getAttribute('data-i')]; if(c) speakItems([{text:'Hello! Nice to meet you. Let\u2019s practice English together.',voice:c.v}],{btn:el}); break;
    case 'vpick': var c2=VREG[+el.getAttribute('data-i')], gg=el.getAttribute('data-g'); if(c2){ if(gg==='m') settings.voiceM=c2.name; else settings.voiceF=c2.name; saveSettings(); var y=window.pageYOffset; render(); try{ window.scrollTo(0,y); }catch(err){} } break;
    case 'stopsp': if(SP.ctl){ try{ SP.ctl.abort(); }catch(err){} } break;
    case 'pick': quizPick(+el.getAttribute('data-n'), +el.getAttribute('data-o')); break;
    case 'qnext': quizAdvance(); break;
    case 'qstay': clearQT(); var cd=document.getElementById('qcd'); if(cd) cd.textContent='Bạn cứ xem lại thoải mái nhé.'; break;
    case 'qagain': QS={id:S.lesson,p:0,ans:{},done:false,finished:false,cd:0}; renderTab(); try{ window.scrollTo(0,0); }catch(err){} break;
  }
});
document.addEventListener('input',function(e){ if(e.target&&e.target.id==='draft') SP.draft=e.target.value; if(e.target&&e.target.id==='fcdraft') FC.draft=e.target.value; });
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('w')){ e.preventDefault(); e.target.click(); } });

render();
window.__app={S:S};
}
(function(){
  function fail(){ document.getElementById('app').textContent='Không tải được dữ liệu bài học. Hãy kiểm tra mạng rồi tải lại trang.'; }
  function get(u){ return fetch(u,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(u); return r.json(); }); }
  get('data/meta.json').then(function(meta){
    return Promise.all(meta.files.map(function(f){ return get('data/lessons/'+f+'.json').catch(function(){ return []; }); }))
      .then(function(p){ meta.lessons=[].concat.apply([],p); boot(meta); });
  }).catch(fail);
})();
</script>
