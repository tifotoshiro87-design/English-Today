yên nhanh gọn."}, {"p": "plan ahead", "vi": "lên kế hoạch trước", "ex": "It's always better to plan ahead for a trip.", "exVi": "Luôn tốt hơn khi lên kế hoạch trước cho một chuyến đi.", "ctx": "Trung tính, dùng khi khuyên chuẩn bị sớm."}, {"p": "not so bad", "vi": "không tệ lắm", "ex": "Packing isn't so bad once you have a list.", "exVi": "Xếp đồ không tệ lắm khi bạn có một danh sách.", "ctx": "Thân mật, dùng khi điều gì đó dễ hơn mong đợi."}, {"p": "almost forgot", "vi": "suýt quên", "ex": "I almost forgot my passport this time.", "exVi": "Lần này mình suýt quên hộ chiếu.", "ctx": "Thân mật, dùng khi vừa kịp nhớ ra điều gì đó."}, {"p": "will do", "vi": "sẽ làm ngay, được rồi sẽ làm", "ex": "Pack a first-aid kit. Will do!", "exVi": "Mang theo túi sơ cứu nhé. Được, mình sẽ làm!", "ctx": "Thân mật, cách trả lời nhanh khi đồng ý làm gì đó."}, {"p": "on the way home", "vi": "trên đường về", "ex": "We bought a lot of souvenirs on the way home.", "exVi": "Chúng tôi đã mua rất nhiều đồ lưu niệm trên đường về.", "ctx": "Trung tính, dùng khi mô tả hành động trong chuyến về."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "You (1)___ have started packing a day ago.", "o": ["should", "would", "could"], "a": 0, "why": "'Should have + V3' diễn tả việc đáng lẽ nên làm nhưng đã không làm."}, {"t": "Rolling clothes (2)___ a lot of space in your suitcase.", "o": ["save", "saves", "saved"], "a": 1, "why": "Chủ ngữ số ít 'rolling clothes' (danh động từ), hiện tại đơn thêm s: saves."}, {"t": "Important documents should always go in your (3)___.", "o": ["carry-on", "luggage", "souvenir"], "a": 0, "why": "'Carry-on' là túi xách tay mang theo người, nơi nên để giấy tờ quan trọng."}, {"t": "Pack some medicine (4)___ you get a headache.", "o": ["just in case", "in case of", "because"], "a": 0, "why": "Cụm 'just in case' + mệnh đề nghĩa là phòng khi."}, {"t": "Leaving some empty space is a good habit, (5)___ for souvenirs.", "o": ["especially", "special", "specially"], "a": 0, "why": "Trạng từ 'especially' nghĩa là đặc biệt là, dùng để nhấn mạnh."}, {"t": "Good packing is about bringing exactly what you (6)___.", "o": ["need", "needs", "needed"], "a": 0, "why": "Chủ ngữ 'you', động từ thường ở hiện tại đơn không thêm s: need."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Sofia said Ethan (1)___ have started packing earlier.", "o": ["should", "shall", "will"], "a": 0, "why": "Giữ nguyên 'should have' trong câu tường thuật vì đây là lời khuyên/trách móc về quá khứ."}, {"t": "She told him to (2)___ a simple list first.", "o": ["make", "makes", "made"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: make."}, {"t": "Ethan admitted he (3)___ forgotten his passport last time.", "o": ["almost", "almost had", "had almost"], "a": 2, "why": "Trạng từ 'almost' đứng giữa trợ động từ 'had' và động từ chính 'forgotten'."}, {"t": "Sofia asked if he (4)___ a first-aid kit.", "o": ["pack", "packs", "had packed"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had packed."}, {"t": "He said he hadn't even (5)___ about that.", "o": ["think", "thought", "thinking"], "a": 1, "why": "Sau 'had' dùng quá khứ phân từ: thought."}, {"t": "Sofia told him to leave some (6)___ for souvenirs.", "o": ["space", "spaces", "spacious"], "a": 0, "why": "Danh từ không đếm được 'space' giữ nguyên số ít."}]}]}, {"id": "B1-HEALTH-004", "topic": "HEALTH", "n": 4, "level": "B1", "title": "Why Posture Matters More Than You Think", "titleVi": "Vì sao tư thế quan trọng hơn bạn nghĩ", "passage": [{"en": "Most people don't think about their posture until something starts to hurt.", "vi": "Hầu hết mọi người không nghĩ về tư thế của mình cho đến khi có chỗ nào đó bắt đầu đau."}, {"en": "With so many of us sitting at desks or looking at phones all day, poor posture has become extremely common.", "vi": "Với việc nhiều người trong chúng ta ngồi bàn làm việc hoặc nhìn điện thoại cả ngày, tư thế xấu đã trở nên cực kỳ phổ biến."}, {"en": "Posture simply means the position your body holds while sitting, standing, or moving.", "vi": "Tư thế đơn giản là vị trí cơ thể bạn giữ khi ngồi, đứng, hoặc di chuyển."}, {"en": "Good posture keeps your bones and joints in their natural alignment.", "vi": "Tư thế tốt giữ cho xương và khớp của bạn ở đúng vị trí tự nhiên."}, {"en": "Poor posture, on the other hand, puts extra pressure on muscles that aren't designed to handle it.", "vi": "Ngược lại, tư thế xấu tạo thêm áp lực lên những cơ không được thiết kế để chịu đựng điều đó."}, {"en": "Over time, this can lead to chronic back pain, neck pain, and even headaches.", "vi": "Theo thời gian, điều này có thể dẫn đến đau lưng mãn tính, đau cổ, và thậm chí là đau đầu."}, {"en": "One of the biggest culprits is something doctors now call 'tech neck'.", "vi": "Một trong những thủ phạm lớn nhất là thứ mà các bác sĩ giờ gọi là 'tech neck' (cổ công nghệ)."}, {"en": "This happens when you constantly look down at a phone or laptop screen.", "vi": "Điều này xảy ra khi bạn liên tục cúi đầu nhìn xuống màn hình điện thoại hoặc laptop."}, {"en": "The human head is heavy, and tilting it forward dramatically increases the strain on your neck.", "vi": "Đầu người khá nặng, và việc nghiêng đầu về phía trước làm tăng đáng kể áp lực lên cổ."}, {"en": "Fortunately, improving your posture doesn't require expensive equipment or hours at the gym.", "vi": "May mắn thay, cải thiện tư thế không đòi hỏi thiết bị đắt tiền hay hàng giờ ở phòng gym."}, {"en": "Simple habits, like raising your screen to eye level, can make a noticeable difference.", "vi": "Những thói quen đơn giản, như nâng màn hình lên ngang tầm mắt, có thể tạo ra sự khác biệt rõ rệt."}, {"en": "Taking short breaks to stand up and stretch every thirty minutes also helps a lot.", "vi": "Việc nghỉ ngắn để đứng dậy và vươn vai mỗi ba mươi phút cũng giúp ích rất nhiều."}, {"en": "Strengthening your core muscles gives your spine better support throughout the day.", "vi": "Tăng cường cơ bụng giúp cột sống của bạn có sự hỗ trợ tốt hơn trong suốt cả ngày."}, {"en": "Many physical therapists recommend simple exercises that take only a few minutes daily.", "vi": "Nhiều nhà vật lý trị liệu khuyên dùng những bài tập đơn giản chỉ mất vài phút mỗi ngày."}, {"en": "Improving posture is rarely quick, but the long-term benefits are well worth the effort.", "vi": "Cải thiện tư thế hiếm khi nhanh chóng, nhưng lợi ích lâu dài hoàn toàn xứng đáng với công sức bỏ ra."}, {"en": "Your future self, free from constant aches, will likely thank you for starting today.", "vi": "Bản thân bạn trong tương lai, không còn những cơn đau nhức liên tục, có lẽ sẽ cảm ơn bạn vì đã bắt đầu từ hôm nay."}], "dialogue": [{"who": "Oliver", "g": "m", "en": "My neck has been killing me lately. I don't know why.", "vi": "Dạo này cổ mình đau kinh khủng. Mình không biết tại sao."}, {"who": "Grace", "g": "f", "en": "How many hours do you spend looking at your phone every day?", "vi": "Mỗi ngày cậu dành bao nhiêu giờ nhìn điện thoại vậy?"}, {"who": "Oliver", "g": "m", "en": "Probably too many, honestly. Why do you ask?", "vi": "Thành thật thì chắc là quá nhiều. Sao cậu hỏi vậy?"}, {"who": "Grace", "g": "f", "en": "That's called tech neck. Looking down all day puts huge strain on your neck.", "vi": "Đó gọi là 'tech neck'. Cúi đầu cả ngày tạo áp lực rất lớn lên cổ cậu đấy."}, {"who": "Oliver", "g": "m", "en": "Really? I never thought my phone could be the problem.", "vi": "Thật hả? Mình chưa bao giờ nghĩ điện thoại lại là vấn đề."}, {"who": "Grace", "g": "f", "en": "Try raising your screen to eye level. It makes a big difference.", "vi": "Thử nâng màn hình lên ngang tầm mắt xem. Nó tạo khác biệt lớn lắm đấy."}, {"who": "Oliver", "g": "m", "en": "That actually sounds easy enough to try. Anything else?", "vi": "Nghe có vẻ dễ làm thử đấy. Còn gì khác không?"}, {"who": "Grace", "g": "f", "en": "Stand up and stretch every thirty minutes if you can.", "vi": "Đứng dậy và vươn vai mỗi ba mươi phút nếu cậu có thể."}, {"who": "Oliver", "g": "m", "en": "I sit for hours without moving sometimes. That's probably not helping.", "vi": "Đôi khi mình ngồi hàng giờ không nhúc nhích. Chắc cái đó không giúp được gì."}, {"who": "Grace", "g": "f", "en": "Definitely not. Your muscles need movement to stay healthy.", "vi": "Chắc chắn là không. Cơ bắp của cậu cần vận động để giữ khỏe mạnh."}, {"who": "Oliver", "g": "m", "en": "What about exercises? Do those really help posture?", "vi": "Còn bài tập thì sao? Chúng có thực sự giúp cải thiện tư thế không?"}, {"who": "Grace", "g": "f", "en": "Yes, especially ones that strengthen your core muscles.", "vi": "Có, đặc biệt là những bài tập giúp tăng cường cơ bụng."}, {"who": "Oliver", "g": "m", "en": "I guess I've been ignoring this for way too long.", "vi": "Chắc mình đã bỏ qua chuyện này quá lâu rồi."}, {"who": "Grace", "g": "f", "en": "Better late than never. Small changes add up over time.", "vi": "Muộn còn hơn không. Những thay đổi nhỏ sẽ cộng dồn theo thời gian."}, {"who": "Oliver", "g": "m", "en": "Thanks, Grace. I'll start today, I promise.", "vi": "Cảm ơn Grace. Mình sẽ bắt đầu từ hôm nay, mình hứa đấy."}, {"who": "Grace", "g": "f", "en": "Your neck will thank you later, trust me.", "vi": "Cổ cậu sẽ cảm ơn cậu sau này, tin mình đi."}], "vocab": [{"w": "posture", "f": ["posture"], "pos": "n", "ipa": "ˈpɑːstʃər", "vi": "tư thế", "ex": "Good posture can prevent back pain.", "exVi": "Tư thế tốt có thể ngăn ngừa đau lưng."}, {"w": "alignment", "f": ["alignment"], "pos": "n", "ipa": "əˈlaɪnmənt", "vi": "sự thẳng hàng, đúng vị trí", "ex": "Good posture keeps your spine in alignment.", "exVi": "Tư thế tốt giữ cho cột sống của bạn thẳng đúng vị trí."}, {"w": "chronic", "f": ["chronic"], "pos": "adj", "ipa": "ˈkrɑːnɪk", "vi": "mãn tính", "ex": "He suffers from chronic back pain.", "exVi": "Anh ấy bị đau lưng mãn tính."}, {"w": "strain", "f": ["strain", "strains", "strained", "straining"], "pos": "n/v", "ipa": "streɪn", "vi": "sự căng thẳng, làm căng (cơ)", "ex": "Looking down puts strain on your neck.", "exVi": "Cúi đầu nhìn xuống tạo áp lực lên cổ của bạn."}, {"w": "core muscles", "f": ["core muscles"], "pos": "n", "ipa": "kɔːr ˈmʌslz", "vi": "cơ bụng (cơ trung tâm)", "ex": "Strong core muscles support your spine.", "exVi": "Cơ bụng khỏe hỗ trợ cột sống của bạn."}, {"w": "stretch", "f": ["stretch", "stretches", "stretched", "stretching"], "pos": "v", "ipa": "stretʃ", "vi": "vươn vai, giãn cơ", "ex": "Take a break to stretch every hour.", "exVi": "Nghỉ để vươn vai mỗi tiếng một lần."}, {"w": "spine", "f": ["spine"], "pos": "n", "ipa": "spaɪn", "vi": "cột sống", "ex": "Sitting badly can hurt your spine over time.", "exVi": "Ngồi sai tư thế có thể làm hại cột sống theo thời gian."}, {"w": "noticeable", "f": ["noticeable"], "pos": "adj", "ipa": "ˈnoʊtɪsəbl", "vi": "rõ rệt, dễ nhận thấy", "ex": "There was a noticeable improvement in his posture.", "exVi": "Có sự cải thiện rõ rệt trong tư thế của anh ấy."}, {"w": "physical therapist", "f": ["physical therapist", "physical therapists"], "pos": "n", "ipa": "ˈfɪzɪkl ˈθerəpɪst", "vi": "nhà vật lý trị liệu", "ex": "A physical therapist taught her some exercises.", "exVi": "Một nhà vật lý trị liệu đã dạy cô ấy vài bài tập."}, {"w": "ache", "f": ["ache", "aches", "ached", "aching"], "pos": "n/v", "ipa": "eɪk", "vi": "cơn đau nhức, đau nhức", "ex": "My back aches after sitting all day.", "exVi": "Lưng mình đau nhức sau khi ngồi cả ngày."}], "grammar": [{"title": "The more... the more... (càng... càng...)", "formula": "The + so sánh hơn + S + V, the + so sánh hơn + S + V", "use": "Dùng để diễn tả hai điều thay đổi cùng nhau — khi điều này tăng, điều kia cũng tăng (hoặc giảm) theo.", "examples": [{"en": "The longer you sit without moving, the worse your posture gets.", "vi": "Bạn càng ngồi lâu mà không di chuyển, tư thế của bạn càng tệ đi."}, {"en": "The more you stretch, the less pain you'll feel.", "vi": "Bạn càng giãn cơ nhiều, bạn sẽ càng ít cảm thấy đau."}, {"en": "The earlier you start, the easier it becomes.", "vi": "Bạn càng bắt đầu sớm, nó sẽ càng dễ dàng hơn."}]}, {"title": "Rarely + đảo ngữ (nhấn mạnh sự hiếm khi)", "formula": "Rarely + trợ động từ + S + V", "use": "Khi 'rarely' đứng đầu câu để nhấn mạnh, cấu trúc câu phải đảo ngữ (trợ động từ lên trước chủ ngữ). Thường dùng trong văn viết trang trọng.", "examples": [{"en": "Rarely do people think about posture until it hurts.", "vi": "Hiếm khi người ta nghĩ về tư thế cho đến khi nó gây đau."}, {"en": "Rarely does improvement happen overnight.", "vi": "Hiếm khi sự cải thiện xảy ra chỉ sau một đêm."}, {"en": "Rarely have I seen such fast progress.", "vi": "Hiếm khi tôi thấy sự tiến bộ nhanh như vậy."}]}], "phrases": [{"p": "killing me", "vi": "đau kinh khủng (nói quá)", "ex": "My back has been killing me all week.", "exVi": "Lưng mình đau kinh khủng cả tuần nay.", "ctx": "Thân mật, dùng để than phiền về cơn đau một cách phóng đại."}, {"p": "makes a big difference", "vi": "tạo ra sự khác biệt lớn", "ex": "Raising your screen makes a big difference.", "exVi": "Nâng màn hình lên tạo ra sự khác biệt lớn.", "ctx": "Trung tính, dùng khi một thay đổi nhỏ mang lại hiệu quả rõ rệt."}, {"p": "better late than never", "vi": "muộn còn hơn không", "ex": "I only started exercising at 40. Better late than never.", "exVi": "Mình mới bắt đầu tập thể dục lúc 40 tuổi. Muộn còn hơn không.", "ctx": "Thân mật, dùng để động viên khi bắt đầu điều gì đó trễ."}, {"p": "add up over time", "vi": "cộng dồn theo thời gian", "ex": "Small habits add up over time.", "exVi": "Những thói quen nhỏ sẽ cộng dồn theo thời gian.", "ctx": "Trung tính, dùng khi nói về hiệu quả tích lũy dần."}, {"p": "thank you later", "vi": "sẽ cảm ơn sau (vì lợi ích lâu dài)", "ex": "Start stretching now, your body will thank you later.", "exVi": "Bắt đầu giãn cơ ngay đi, cơ thể bạn sẽ cảm ơn bạn sau này.", "ctx": "Thân mật, dùng khi khuyên làm gì đó có lợi về lâu dài."}, {"p": "sounds easy enough", "vi": "nghe có vẻ đủ dễ để thử", "ex": "That sounds easy enough, I'll try it tonight.", "exVi": "Nghe có vẻ đủ dễ để thử, mình sẽ thử tối nay.", "ctx": "Thân mật, dùng khi chấp nhận thử một lời khuyên đơn giản."}, {"p": "probably too many", "vi": "chắc là quá nhiều", "ex": "How many hours? Probably too many, honestly.", "exVi": "Bao nhiêu tiếng? Thành thật thì chắc là quá nhiều.", "ctx": "Thân mật, dùng khi thừa nhận một con số không tốt."}, {"p": "well worth it", "vi": "hoàn toàn xứng đáng", "ex": "The effort to fix your posture is well worth it.", "exVi": "Nỗ lực để sửa tư thế hoàn toàn xứng đáng.", "ctx": "Trung tính, dùng khi khẳng định một việc đáng công sức bỏ ra."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "The longer you sit without moving, the (1)___ your posture gets.", "o": ["worse", "worst", "bad"], "a": 0, "why": "Cấu trúc 'the more...the more' dùng so sánh hơn: worse."}, {"t": "Poor posture puts extra pressure on muscles that aren't (2)___ to handle it.", "o": ["design", "designed", "designing"], "a": 1, "why": "Thể bị động: are/aren't + V3: designed."}, {"t": "This can lead to chronic back pain and (3)___ headaches.", "o": ["even", "ever", "still"], "a": 0, "why": "'Even' dùng để nhấn mạnh mức độ nghiêm trọng, thêm vào."}, {"t": "Simple habits can make a (4)___ difference.", "o": ["noticeable", "notice", "noticing"], "a": 0, "why": "Cần tính từ bổ nghĩa cho danh từ 'difference': noticeable."}, {"t": "Rarely (5)___ improvement happen overnight.", "o": ["does", "do", "is"], "a": 0, "why": "Đảo ngữ với 'rarely' + trợ động từ 'does' (chủ ngữ số ít 'improvement')."}, {"t": "Your future self will likely (6)___ you for starting today.", "o": ["thank", "thanks", "thanked"], "a": 0, "why": "Sau 'will' dùng động từ nguyên mẫu: thank."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Grace asked Oliver how many hours he (1)___ on his phone.", "o": ["spend", "spends", "spent"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: spent."}, {"t": "She explained that tech neck (2)___ huge strain on the neck.", "o": ["put", "puts", "was putting"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn: puts."}, {"t": "Oliver admitted he (3)___ never thought his phone was the problem.", "o": ["has", "had", "have"], "a": 1, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had."}, {"t": "Grace suggested that he (4)___ his screen to eye level.", "o": ["raise", "raises", "raised"], "a": 0, "why": "Sau 'suggested that' dùng động từ nguyên thể (subjunctive): raise."}, {"t": "Oliver said he sat for hours (5)___ moving sometimes.", "o": ["without", "with", "for"], "a": 0, "why": "'Without + V-ing' nghĩa là mà không làm gì."}, {"t": "Grace told him small changes (6)___ up over time.", "o": ["add", "adds", "added"], "a": 0, "why": "Câu sự thật chung trong lời tường thuật vẫn giữ hiện tại đơn: add."}]}]}, {"id": "B1-ENTERTAINMENT-004", "topic": "ENTERTAINMENT", "n": 4, "level": "B1", "title": "The Rise of Podcasts", "titleVi": "Sự trỗi dậy của podcast", "passage": [{"en": "Twenty years ago, almost nobody had heard the word 'podcast'.", "vi": "Hai mươi năm trước, hầu như không ai từng nghe đến từ 'podcast'."}, {"en": "Today, millions of people listen to podcasts every single day, often while doing other things.", "vi": "Ngày nay, hàng triệu người nghe podcast mỗi ngày, thường trong lúc đang làm việc khác."}, {"en": "A podcast is simply a series of audio episodes that people can download or stream for free.", "vi": "Podcast đơn giản là một chuỗi các tập âm thanh mà mọi người có thể tải xuống hoặc nghe trực tuyến miễn phí."}, {"en": "Unlike traditional radio, podcasts let listeners choose exactly what they want to hear and when.", "vi": "Khác với radio truyền thống, podcast cho phép người nghe chọn chính xác thứ họ muốn nghe và khi nào."}, {"en": "This flexibility is one of the biggest reasons for their massive popularity.", "vi": "Sự linh hoạt này là một trong những lý do lớn nhất khiến chúng trở nên phổ biến rộng rãi."}, {"en": "People listen to podcasts while commuting, cooking, cleaning, or exercising.", "vi": "Mọi người nghe podcast trong lúc đi làm, nấu ăn, dọn dẹp, hoặc tập thể dục."}, {"en": "There's a podcast for almost every topic imaginable, from true crime to cooking to astrophysics.", "vi": "Có podcast cho hầu như mọi chủ đề có thể tưởng tượng được, từ tội phạm có thật đến nấu ăn đến vật lý thiên văn."}, {"en": "This huge variety means listeners can find content that matches their exact interests.", "vi": "Sự đa dạng khổng lồ này có nghĩa là người nghe có thể tìm thấy nội dung phù hợp chính xác với sở thích của họ."}, {"en": "Many podcasts feature conversations between two or more hosts, which feels relaxed and natural.", "vi": "Nhiều podcast có các cuộc trò chuyện giữa hai hoặc nhiều người dẫn chương trình, mang lại cảm giác thoải mái và tự nhiên."}, {"en": "This casual style makes listeners feel like they're part of a private conversation.", "vi": "Phong cách thoải mái này khiến người nghe cảm thấy như họ đang là một phần của một cuộc trò chuyện riêng tư."}, {"en": "Starting a podcast also requires surprisingly little equipment compared to making a television show.", "vi": "Việc bắt đầu một podcast cũng đòi hỏi thiết bị ít đến bất ngờ so với việc làm một chương trình truyền hình."}, {"en": "A decent microphone and free editing software are often enough to get started.", "vi": "Một chiếc micro tốt và phần mềm chỉnh sửa miễn phí thường là đủ để bắt đầu."}, {"en": "Because of this low barrier, almost anyone with a good idea can launch their own show.", "vi": "Vì rào cản thấp này, hầu như bất kỳ ai có ý tưởng hay cũng có thể ra mắt chương trình của riêng mình."}, {"en": "Some podcasts have grown so popular that they now earn more money than many television shows.", "vi": "Một số podcast đã trở nên phổ biến đến mức giờ đây chúng kiếm được nhiều tiền hơn cả nhiều chương trình truyền hình."}, {"en": "Companies have noticed this trend and now spend huge amounts on podcast advertising.", "vi": "Các công ty đã nhận ra xu hướng này và giờ chi những khoản tiền khổng lồ cho quảng cáo podcast."}, {"en": "Whatever the future holds, it's clear that podcasts have permanently changed how people consume audio content.", "vi": "Dù tương lai ra sao, rõ ràng là podcast đã thay đổi vĩnh viễn cách con người tiếp nhận nội dung âm thanh."}], "dialogue": [{"who": "Liam", "g": "m", "en": "Do you listen to podcasts? I just started getting into them.", "vi": "Cậu có nghe podcast không? Mình vừa mới bắt đầu thích nó."}, {"who": "Zoe", "g": "f", "en": "All the time! I listen while commuting to work every day.", "vi": "Suốt luôn! Mình nghe trong lúc đi làm mỗi ngày."}, {"who": "Liam", "g": "m", "en": "What kind of podcasts do you usually listen to?", "vi": "Cậu thường nghe loại podcast nào vậy?"}, {"who": "Zoe", "g": "f", "en": "Mostly true crime, but I also enjoy comedy ones sometimes.", "vi": "Chủ yếu là tội phạm có thật, nhưng thỉnh thoảng mình cũng thích nghe hài."}, {"who": "Liam", "g": "m", "en": "I didn't know there were so many different topics out there.", "vi": "Mình không biết lại có nhiều chủ đề khác nhau đến vậy."}, {"who": "Zoe", "g": "f", "en": "Honestly, there's a podcast for almost everything these days.", "vi": "Thật lòng thì, giờ gần như có podcast cho mọi thứ."}, {"who": "Liam", "g": "m", "en": "I actually thought about starting one myself someday.", "vi": "Thật ra mình đã nghĩ đến việc tự bắt đầu một podcast nào đó rồi."}, {"who": "Zoe", "g": "f", "en": "You totally should! You don't even need fancy equipment.", "vi": "Cậu nên thử đấy! Cậu còn không cần thiết bị gì cầu kỳ nữa."}, {"who": "Liam", "g": "m", "en": "Really? I assumed it would cost a lot to get started.", "vi": "Thật hả? Mình cứ nghĩ sẽ tốn nhiều tiền để bắt đầu."}, {"who": "Zoe", "g": "f", "en": "Not at all. A decent mic and free software are enough.", "vi": "Không hề. Một micro tốt và phần mềm miễn phí là đủ rồi."}, {"who": "Liam", "g": "m", "en": "That's encouraging. What would make a podcast successful, do you think?", "vi": "Nghe khích lệ đấy. Cậu nghĩ điều gì làm nên một podcast thành công?"}, {"who": "Zoe", "g": "f", "en": "Consistency, I'd say. People keep coming back for new episodes.", "vi": "Mình thì nghĩ là sự đều đặn. Mọi người quay lại vì những tập mới."}, {"who": "Liam", "g": "m", "en": "Makes sense. I guess quitting after a few episodes wouldn't help.", "vi": "Có lý đấy. Chắc là bỏ cuộc sau vài tập thì không giúp ích gì."}, {"who": "Zoe", "g": "f", "en": "Exactly. The casual conversation style also really helps too.", "vi": "Chính xác. Phong cách trò chuyện thoải mái cũng thực sự giúp ích nhiều."}, {"who": "Liam", "g": "m", "en": "Okay, you've convinced me. I might actually try it now.", "vi": "Được rồi, cậu thuyết phục được mình rồi. Mình có thể sẽ thử thật đấy."}, {"who": "Zoe", "g": "f", "en": "Let me know when you do, I'll be your first listener!", "vi": "Khi nào làm thì nói mình nhé, mình sẽ là thính giả đầu tiên của cậu!"}], "vocab": [{"w": "podcast", "f": ["podcast", "podcasts"], "pos": "n", "ipa": "ˈpɑːdkæst", "vi": "podcast (chương trình âm thanh)", "ex": "She listens to a new podcast every week.", "exVi": "Cô ấy nghe một podcast mới mỗi tuần."}, {"w": "episode", "f": ["episode", "episodes"], "pos": "n", "ipa": "ˈepɪsoʊd", "vi": "tập (chương trình)", "ex": "The latest episode was over an hour long.", "exVi": "Tập mới nhất dài hơn một tiếng đồng hồ."}, {"w": "host", "f": ["host", "hosts"], "pos": "n", "ipa": "hoʊst", "vi": "người dẫn chương trình", "ex": "The podcast has two hosts who are old friends.", "exVi": "Podcast đó có hai người dẫn chương trình là bạn thân lâu năm."}, {"w": "stream", "f": ["stream", "streams", "streamed", "streaming"], "pos": "v", "ipa": "striːm", "vi": "nghe/xem trực tuyến", "ex": "You can stream the episode instead of downloading it.", "exVi": "Bạn có thể nghe tập đó trực tuyến thay vì tải xuống."}, {"w": "commute", "f": ["commute", "commutes", "commuted", "commuting"], "pos": "v", "ipa": "kəˈmjuːt", "vi": "đi lại (đi làm/đi học)", "ex": "He listens to podcasts while commuting.", "exVi": "Anh ấy nghe podcast trong lúc đi làm."}, {"w": "variety", "f": ["variety"], "pos": "n", "ipa": "vəˈraɪəti", "vi": "sự đa dạng", "ex": "There's a huge variety of podcasts available.", "exVi": "Có một sự đa dạng rất lớn các podcast hiện có."}, {"w": "casual", "f": ["casual"], "pos": "adj", "ipa": "ˈkæʒuəl", "vi": "thoải mái, không trang trọng", "ex": "The show has a casual, relaxed tone.", "exVi": "Chương trình có giọng điệu thoải mái, nhẹ nhàng."}, {"w": "consistency", "f": ["consistency"], "pos": "n", "ipa": "kənˈsɪstənsi", "vi": "sự đều đặn, nhất quán", "ex": "Consistency is key to building an audience.", "exVi": "Sự đều đặn là chìa khóa để xây dựng lượng khán giả."}, {"w": "equipment", "f": ["equipment"], "pos": "n", "ipa": "ɪˈkwɪpmənt", "vi": "thiết bị", "ex": "You don't need expensive equipment to start.", "exVi": "Bạn không cần thiết bị đắt tiền để bắt đầu."}, {"w": "advertising", "f": ["advertising"], "pos": "n", "ipa": "ˈædvərtaɪzɪŋ", "vi": "quảng cáo", "ex": "Podcast advertising has grown rapidly in recent years.", "exVi": "Quảng cáo podcast đã phát triển nhanh chóng trong những năm gần đây."}], "grammar": [{"title": "Unlike + danh từ (khác với)", "formula": "Unlike + noun, mệnh đề", "use": "Dùng để so sánh sự khác biệt giữa hai thứ, thường đặt đầu câu. Rất phổ biến khi so sánh cái cũ với cái mới.", "examples": [{"en": "Unlike traditional radio, podcasts let listeners choose what to hear.", "vi": "Khác với radio truyền thống, podcast cho phép người nghe chọn thứ để nghe."}, {"en": "Unlike his brother, he loves spicy food.", "vi": "Khác với anh trai mình, anh ấy thích đồ cay."}, {"en": "Unlike last year, sales have improved a lot.", "vi": "Khác với năm ngoái, doanh số đã cải thiện nhiều."}]}, {"title": "Whatever + mệnh đề (dù cho điều gì)", "formula": "Whatever + S + V, mệnh đề chính", "use": "Dùng để nói rằng điều gì đó vẫn đúng bất kể điều kiện hay khả năng nào xảy ra.", "examples": [{"en": "Whatever the future holds, podcasts have changed how we listen.", "vi": "Dù tương lai ra sao, podcast đã thay đổi cách chúng ta nghe."}, {"en": "Whatever you decide, I'll support you.", "vi": "Dù bạn quyết định gì, mình cũng sẽ ủng hộ bạn."}, {"en": "Whatever happens, we should stay calm.", "vi": "Dù chuyện gì xảy ra, chúng ta cũng nên giữ bình tĩnh."}]}], "phrases": [{"p": "get into something", "vi": "bắt đầu thích, bắt đầu đam mê", "ex": "I just got into true crime podcasts.", "exVi": "Mình vừa mới bắt đầu thích podcast tội phạm có thật.", "ctx": "Thân mật, dùng khi mới bắt đầu thích một sở thích."}, {"p": "all the time", "vi": "suốt, liên tục", "ex": "I listen to music all the time.", "exVi": "Mình nghe nhạc suốt luôn.", "ctx": "Thân mật, dùng để nhấn mạnh tần suất cao."}, {"p": "out there", "vi": "ngoài kia, hiện có", "ex": "There are so many good shows out there.", "exVi": "Có rất nhiều chương trình hay ngoài kia.", "ctx": "Thân mật, dùng khi nói về những thứ đang tồn tại rộng rãi."}, {"p": "you totally should", "vi": "cậu nên thử đi (khuyến khích mạnh)", "ex": "You've never tried sushi? You totally should.", "exVi": "Cậu chưa từng ăn sushi à? Cậu nên thử đi.", "ctx": "Thân mật, dùng để khuyến khích ai đó mạnh mẽ."}, {"p": "not at all", "vi": "hoàn toàn không", "ex": "Was it expensive? Not at all.", "exVi": "Có đắt không? Hoàn toàn không.", "ctx": "Trung tính, dùng để phủ định mạnh."}, {"p": "makes sense", "vi": "có lý, hợp lý", "ex": "That makes sense, thanks for explaining.", "exVi": "Nghe có lý đấy, cảm ơn cậu đã giải thích.", "ctx": "Thân mật, dùng khi đồng ý rằng điều gì đó hợp lý."}, {"p": "you've convinced me", "vi": "cậu thuyết phục được tôi rồi", "ex": "Okay, you've convinced me, let's go.", "exVi": "Được rồi, cậu thuyết phục được mình rồi, đi thôi.", "ctx": "Thân mật, dùng khi đồng ý sau khi bị thuyết phục."}, {"p": "let me know", "vi": "cho tôi biết nhé", "ex": "Let me know when the episode is ready.", "exVi": "Cho mình biết khi nào tập đó xong nhé.", "ctx": "Trung tính, dùng để yêu cầu được thông báo sau."}, {"p": "key to something", "vi": "chìa khóa của điều gì đó", "ex": "Consistency is the key to success.", "exVi": "Sự đều đặn là chìa khóa của thành công.", "ctx": "Trung tính, dùng khi nói về yếu tố quan trọng nhất."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "(1)___ traditional radio, podcasts let listeners choose what to hear.", "o": ["Unlike", "Like", "As"], "a": 0, "why": "'Unlike' dùng để nêu sự khác biệt giữa hai thứ."}, {"t": "There's a podcast for almost every topic (2)___.", "o": ["imaginable", "imagine", "imagination"], "a": 0, "why": "Tính từ 'imaginable' nghĩa là có thể tưởng tượng được, bổ nghĩa cho 'topic'."}, {"t": "This casual style makes listeners (3)___ part of a conversation.", "o": ["feel like they're", "feel like they are being", "feel they're being"], "a": 0, "why": "Cụm 'feel like + mệnh đề' tự nhiên nhất trong văn nói."}, {"t": "A decent microphone and free software are often (4)___ to get started.", "o": ["enough", "very", "so"], "a": 0, "why": "'Enough' đứng sau tính từ/danh từ để diễn tả sự đầy đủ."}, {"t": "Some podcasts now earn (5)___ money than many TV shows.", "o": ["more", "most", "much"], "a": 0, "why": "So sánh hơn với danh từ không đếm được 'money': more."}, {"t": "(6)___ the future holds, podcasts have changed how we listen.", "o": ["Whatever", "Whichever", "However"], "a": 0, "why": "'Whatever' dùng để nói dù điều gì xảy ra đi nữa."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Zoe said she listened to podcasts (1)___ commuting to work.", "o": ["while", "during", "for"], "a": 0, "why": "'While + V-ing' nghĩa là trong lúc làm gì."}, {"t": "Liam admitted he (2)___ thought about starting one himself.", "o": ["has", "had", "have"], "a": 1, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had."}, {"t": "Zoe told him he didn't even (3)___ fancy equipment.", "o": ["need", "needs", "needed"], "a": 0, "why": "Sau 'didn't' dùng động từ nguyên mẫu: need."}, {"t": "She said consistency (4)___ what kept listeners coming back.", "o": ["is", "was", "were"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: was."}, {"t": "Liam said that (5)___ sense to him.", "o": ["make", "makes", "made"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: made."}, {"t": "Zoe offered to be his (6)___ listener.", "o": ["first", "firstly", "one"], "a": 0, "why": "Tính từ thứ tự 'first' đứng trước danh từ 'listener'."}]}]}, {"id": "B1-PHRASES-004", "topic": "PHRASES", "n": 4, "level": "B1", "title": "Phrases for Making Plans", "titleVi": "Cụm từ để lên kế hoạch", "passage": [{"en": "Making plans with friends sounds simple, but the language around it is full of small, useful phrases.", "vi": "Lên kế hoạch với bạn bè nghe có vẻ đơn giản, nhưng ngôn ngữ xung quanh nó đầy những cụm từ nhỏ hữu ích."}, {"en": "Native speakers rarely say 'Let's meet at seven o'clock' in a stiff, formal way.", "vi": "Người bản xứ hiếm khi nói 'Let's meet at seven o'clock' theo cách cứng nhắc, trang trọng."}, {"en": "Instead, they use casual expressions that sound relaxed and friendly.", "vi": "Thay vào đó, họ dùng những cách diễn đạt thoải mái, nghe thân thiện hơn."}, {"en": "For example, 'Are you free this weekend?' is a common way to start making plans.", "vi": "Ví dụ, 'Are you free this weekend?' là một cách phổ biến để bắt đầu lên kế hoạch."}, {"en": "If someone wants to suggest an idea, they might say 'How about we grab dinner?'", "vi": "Nếu ai đó muốn đề xuất một ý tưởng, họ có thể nói 'How about we grab dinner?'"}, {"en": "The phrase 'grab' is used often in casual English, meaning to get something quickly.", "vi": "Cụm từ 'grab' thường được dùng trong tiếng Anh thân mật, nghĩa là lấy/ăn gì đó nhanh gọn."}, {"en": "When confirming a plan, people often say 'Sounds good, see you then' to show agreement.", "vi": "Khi xác nhận một kế hoạch, mọi người thường nói 'Sounds good, see you then' để thể hiện sự đồng ý."}, {"en": "Sometimes, plans need to change, and that requires a different set of phrases.", "vi": "Đôi khi, kế hoạch cần thay đổi, và điều đó cần một bộ cụm từ khác."}, {"en": "'Can we push it back an hour?' is a polite way to ask for a later time.", "vi": "'Can we push it back an hour?' là một cách lịch sự để xin dời giờ muộn hơn."}, {"en": "If someone truly can't make it, they might say 'Something came up, can we reschedule?'", "vi": "Nếu ai đó thực sự không thể tham gia, họ có thể nói 'Something came up, can we reschedule?'"}, {"en": "This phrase is polite because it explains there's a reason without going into too much detail.", "vi": "Cụm từ này lịch sự vì nó giải thích có lý do mà không đi vào quá nhiều chi tiết."}, {"en": "Canceling plans completely requires even more care to avoid sounding rude.", "vi": "Hủy kế hoạch hoàn toàn đòi hỏi càng cẩn thận hơn để tránh nghe có vẻ thô lỗ."}, {"en": "'I'm so sorry, but I have to cancel' shows genuine regret while being clear.", "vi": "'I'm so sorry, but I have to cancel' thể hiện sự tiếc nuối chân thành trong khi vẫn rõ ràng."}, {"en": "Learning these small phrases makes everyday conversations feel much more natural.", "vi": "Học những cụm từ nhỏ này khiến những cuộc trò chuyện hằng ngày trở nên tự nhiên hơn nhiều."}, {"en": "Without them, even grammatically correct English can sound stiff or robotic.", "vi": "Nếu không có chúng, dù tiếng Anh đúng ngữ pháp vẫn có thể nghe cứng nhắc hoặc máy móc."}, {"en": "Practicing these phrases regularly is one of the fastest ways to sound more fluent.", "vi": "Luyện tập những cụm từ này thường xuyên là một trong những cách nhanh nhất để nghe trôi chảy hơn."}], "dialogue": [{"who": "Jack", "g": "m", "en": "Hey, are you free this weekend?", "vi": "Này, cuối tuần này cậu rảnh không?"}, {"who": "Mai", "g": "f", "en": "I think so. What's up?", "vi": "Chắc là rảnh. Có chuyện gì vậy?"}, {"who": "Jack", "g": "m", "en": "How about we grab dinner on Saturday?", "vi": "Thứ Bảy mình đi ăn tối không?"}, {"who": "Mai", "g": "f", "en": "Sounds good, see you then! What time works for you?", "vi": "Nghe hay đấy, hẹn gặp cậu lúc đó! Mấy giờ thì tiện cho cậu?"}, {"who": "Jack", "g": "m", "en": "Let's say seven? I'll book a table.", "vi": "Bảy giờ nhé? Mình sẽ đặt bàn."}, {"who": "Mai", "g": "f", "en": "Actually, can we push it back an hour? I have a class until six-thirty.", "vi": "Thật ra, mình dời muộn một tiếng được không? Mình có lớp học đến sáu rưỡi."}, {"who": "Jack", "g": "m", "en": "No problem, eight works fine for me too.", "vi": "Không sao, tám giờ cũng ổn với mình."}, {"who": "Mai", "g": "f", "en": "Great, I'll see you there.", "vi": "Tuyệt, hẹn gặp cậu ở đó."}, {"who": "Jack", "g": "m", "en": "Oh wait, something came up. Can we reschedule to Sunday instead?", "vi": "À khoan, có chuyện phát sinh rồi. Mình dời sang Chủ Nhật được không?"}, {"who": "Mai", "g": "f", "en": "Sure, no worries. Sunday evening works too.", "vi": "Được thôi, không sao đâu. Tối Chủ Nhật cũng ổn với mình."}, {"who": "Jack", "g": "m", "en": "Thanks for understanding. I really appreciate it.", "vi": "Cảm ơn cậu đã thông cảm. Mình thực sự trân trọng điều đó."}, {"who": "Mai", "g": "f", "en": "Of course. These things happen sometimes.", "vi": "Dĩ nhiên rồi. Đôi khi chuyện này vẫn xảy ra mà."}, {"who": "Jack", "g": "m", "en": "Although, actually, I'm so sorry, but I might have to cancel completely.", "vi": "Mặc dù, thật ra, mình thực sự xin lỗi, nhưng có thể mình phải hủy luôn."}, {"who": "Mai", "g": "f", "en": "Oh no, is everything okay?", "vi": "Ôi không, mọi thứ ổn chứ?"}, {"who": "Jack", "g": "m", "en": "Yeah, just a busy week. Let's plan again next weekend.", "vi": "Ừ, chỉ là tuần này bận quá thôi. Chúng ta lên kế hoạch lại vào cuối tuần sau nhé."}, {"who": "Mai", "g": "f", "en": "Deal. Just let me know when you're free.", "vi": "Đồng ý. Khi nào rảnh thì nói mình biết nhé."}], "vocab": [{"w": "grab", "f": ["grab", "grabs", "grabbed", "grabbing"], "pos": "v", "ipa": "ɡræb", "vi": "ăn/lấy nhanh gọn", "ex": "Let's grab lunch before the meeting.", "exVi": "Chúng ta ăn trưa nhanh trước cuộc họp nhé."}, {"w": "reschedule", "f": ["reschedule", "reschedules", "rescheduled", "rescheduling"], "pos": "v", "ipa": "riːˈskedʒuːl", "vi": "dời lịch", "ex": "We had to reschedule the meeting to Friday.", "exVi": "Chúng tôi phải dời cuộc họp sang thứ Sáu."}, {"w": "cancel", "f": ["cancel", "cancels", "cancelled", "cancelling"], "pos": "v", "ipa": "ˈkænsl", "vi": "hủy", "ex": "She had to cancel the trip at the last minute.", "exVi": "Cô ấy phải hủy chuyến đi vào phút chót."}, {"w": "push back", "f": ["push back", "pushes back", "pushed back"], "pos": "v", "ipa": "pʊʃ bæk", "vi": "dời muộn hơn", "ex": "Can we push the meeting back to 3pm?", "exVi": "Chúng ta dời cuộc họp sang 3 giờ chiều được không?"}, {"w": "regret", "f": ["regret", "regrets"], "pos": "n", "ipa": "rɪˈɡret", "vi": "sự tiếc nuối", "ex": "He expressed regret for cancelling so late.", "exVi": "Anh ấy bày tỏ sự tiếc nuối vì hủy quá muộn."}, {"w": "genuine", "f": ["genuine"], "pos": "adj", "ipa": "ˈdʒenjuɪn", "vi": "chân thành, thật lòng", "ex": "Her apology sounded genuine.", "exVi": "Lời xin lỗi của cô ấy nghe rất chân thành."}, {"w": "fluent", "f": ["fluent"], "pos": "adj", "ipa": "ˈfluːənt", "vi": "trôi chảy, lưu loát", "ex": "He sounds very fluent after a year of practice.", "exVi": "Anh ấy nghe rất trôi chảy sau một năm luyện tập."}, {"w": "robotic", "f": ["robotic"], "pos": "adj", "ipa": "roʊˈbɑːtɪk", "vi": "máy móc, cứng nhắc", "ex": "His English sounded a bit robotic at first.", "exVi": "Tiếng Anh của anh ấy nghe hơi máy móc lúc đầu."}, {"w": "appreciate", "f": ["appreciate", "appreciates", "appreciated", "appreciating"], "pos": "v", "ipa": "əˈpriːʃieɪt", "vi": "trân trọng, cảm kích", "ex": "I really appreciate your patience.", "exVi": "Mình thực sự trân trọng sự kiên nhẫn của cậu."}, {"w": "available", "f": ["available"], "pos": "adj", "ipa": "əˈveɪləbl", "vi": "rảnh, có sẵn", "ex": "Are you available on Friday evening?", "exVi": "Cậu có rảnh vào tối thứ Sáu không?"}], "grammar": [{"title": "How about + V-ing (gợi ý làm gì)", "formula": "How about + V-ing / noun?", "use": "Dùng để đưa ra gợi ý một cách thân thiện, thoải mái. Rất phổ biến trong văn nói khi rủ rê, lên kế hoạch.", "examples": [{"en": "How about we grab dinner on Saturday?", "vi": "Thứ Bảy mình đi ăn tối không?"}, {"en": "How about going for a walk later?", "vi": "Lát nữa đi dạo không?"}, {"en": "How about Sunday instead of Saturday?", "vi": "Chủ Nhật thay vì thứ Bảy được không?"}]}, {"title": "Have to + V (bắt buộc phải)", "formula": "S + have to/has to + V", "use": "Dùng để diễn tả một việc bắt buộc phải làm, thường vì hoàn cảnh bên ngoài chứ không phải ý muốn cá nhân.", "examples": [{"en": "I'm so sorry, but I have to cancel.", "vi": "Mình thực sự xin lỗi, nhưng mình phải hủy."}, {"en": "She has to leave early today.", "vi": "Hôm nay cô ấy phải về sớm."}, {"en": "We have to reschedule the trip.", "vi": "Chúng tôi phải dời lịch chuyến đi."}]}], "phrases": [{"p": "are you free", "vi": "bạn có rảnh không", "ex": "Are you free to chat for a minute?", "exVi": "Cậu có rảnh để nói chuyện một chút không?", "ctx": "Thân mật, dùng khi hỏi ai đó có thời gian không."}, {"p": "sounds good", "vi": "nghe hay đấy, được đấy", "ex": "Sounds good, let's do that.", "exVi": "Nghe hay đấy, làm vậy đi.", "ctx": "Thân mật, dùng để đồng ý với một đề xuất."}, {"p": "see you then", "vi": "hẹn gặp lúc đó", "ex": "See you then, don't be late!", "exVi": "Hẹn gặp lúc đó, đừng trễ nhé!", "ctx": "Thân mật, dùng để kết thúc việc xác nhận kế hoạch."}, {"p": "something came up", "vi": "có chuyện phát sinh", "ex": "Sorry, something came up at work.", "exVi": "Xin lỗi, có chuyện phát sinh ở chỗ làm.", "ctx": "Trung tính, cách lịch sự để giải thích lý do mà không nói chi tiết."}, {"p": "no worries", "vi": "không sao đâu", "ex": "No worries, we can meet another time.", "exVi": "Không sao đâu, chúng ta có thể gặp lúc khác.", "ctx": "Thân mật, dùng để trấn an ai đó."}, {"p": "these things happen", "vi": "chuyện này vẫn xảy ra mà", "ex": "Don't worry, these things happen.", "exVi": "Đừng lo, chuyện này vẫn xảy ra mà.", "ctx": "Thân mật, dùng để an ủi khi có sự cố nhỏ."}, {"p": "let's say", "vi": "cứ cho là, chốt là", "ex": "Let's say seven o'clock, does that work?", "exVi": "Chốt là bảy giờ nhé, được không?", "ctx": "Thân mật, dùng khi đề xuất một con số/thời gian cụ thể."}, {"p": "works for me", "vi": "ổn với tôi, hợp với tôi", "ex": "Eight o'clock works for me.", "exVi": "Tám giờ ổn với mình.", "ctx": "Thân mật, dùng để xác nhận một đề xuất phù hợp."}, {"p": "deal", "vi": "đồng ý, thỏa thuận xong", "ex": "Let's meet next week instead. Deal!", "exVi": "Chúng ta gặp vào tuần sau thay vậy nhé. Đồng ý!", "ctx": "Thân mật, dùng để chốt một thỏa thuận."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "'(1)___ about we grab dinner?' is a casual way to suggest a plan.", "o": ["How", "What", "Which"], "a": 0, "why": "Cụm cố định 'How about' dùng để đưa ra gợi ý."}, {"t": "'Sounds good, see you (2)___' shows agreement with a plan.", "o": ["then", "after", "later"], "a": 0, "why": "Cụm cố định 'see you then' nghĩa là hẹn gặp lúc đó."}, {"t": "'Can we push it (3)___ an hour?' is a polite way to ask for a later time.", "o": ["back", "forward", "out"], "a": 0, "why": "Cụm cố định 'push back' nghĩa là dời muộn hơn."}, {"t": "'Something came up' explains a reason (4)___ going into detail.", "o": ["without", "with", "for"], "a": 0, "why": "'Without + V-ing' nghĩa là mà không làm gì."}, {"t": "Learning these phrases makes conversations feel more (5)___.", "o": ["natural", "nature", "naturally"], "a": 0, "why": "Cần tính từ bổ nghĩa cho 'feel': natural."}, {"t": "Practicing phrases is one of the fastest ways to sound more (6)___.", "o": ["fluent", "fluency", "fluently"], "a": 0, "why": "Cần tính từ sau 'sound': fluent."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Jack asked Mai if she (1)___ free that weekend.", "o": ["is", "was", "were"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: was."}, {"t": "Mai said she had a class (2)___ six-thirty.", "o": ["until", "since", "for"], "a": 0, "why": "'Until' nghĩa là cho đến khi, chỉ thời điểm kết thúc."}, {"t": "Jack said something (3)___ up and he had to reschedule.", "o": ["come", "comes", "had come"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had come."}, {"t": "Mai told him not to (4)___, these things happen.", "o": ["worry", "worries", "worried"], "a": 0, "why": "Câu mệnh lệnh sau 'not to': động từ nguyên mẫu worry."}, {"t": "Jack apologized and said he might have (5)___ cancel completely.", "o": ["to", "for", "of"], "a": 0, "why": "Cụm 'have to' + V nguyên mẫu diễn tả sự bắt buộc."}, {"t": "Mai agreed to plan again the (6)___ weekend.", "o": ["next", "last", "this"], "a": 0, "why": "'Next weekend' nghĩa là cuối tuần sau, phù hợp ngữ cảnh."}]}]}, {"id": "B1-SCIENCE-004", "topic": "SCIENCE", "n": 4, "level": "B1", "title": "Why We Dream", "titleVi": "Vì sao chúng ta mơ", "passage": [{"en": "Almost everyone dreams every single night, even if they don't remember it afterward.", "vi": "Hầu như ai cũng mơ mỗi đêm, dù họ không nhớ lại sau đó."}, {"en": "Scientists have studied dreams for over a century, yet many mysteries still remain.", "vi": "Các nhà khoa học đã nghiên cứu giấc mơ hơn một thế kỷ, nhưng vẫn còn nhiều bí ẩn chưa được giải đáp."}, {"en": "Most dreaming happens during a stage of sleep called REM, which stands for rapid eye movement.", "vi": "Hầu hết việc mơ diễn ra trong một giai đoạn giấc ngủ gọi là REM, viết tắt của chuyển động mắt nhanh."}, {"en": "During REM sleep, the brain becomes almost as active as when a person is fully awake.", "vi": "Trong giấc ngủ REM, não bộ hoạt động gần như mạnh như khi một người đang hoàn toàn thức."}, {"en": "Meanwhile, the body stays mostly paralyzed, which stops people from acting out their dreams.", "vi": "Trong khi đó, cơ thể vẫn gần như bị tê liệt, điều này ngăn con người thực hiện hành động trong giấc mơ."}, {"en": "Researchers still debate exactly why humans dream in the first place.", "vi": "Các nhà nghiên cứu vẫn tranh luận về lý do chính xác tại sao con người lại mơ."}, {"en": "One popular theory suggests dreams help the brain process emotions from the day.", "vi": "Một giả thuyết phổ biến cho rằng giấc mơ giúp não bộ xử lý cảm xúc trong ngày."}, {"en": "Another theory proposes that dreaming helps strengthen memories and learning.", "vi": "Một giả thuyết khác đề xuất rằng việc mơ giúp củng cố trí nhớ và việc học."}, {"en": "Some scientists even believe dreams have no clear purpose and are simply a side effect of brain activity.", "vi": "Một số nhà khoa học thậm chí tin rằng giấc mơ không có mục đích rõ ràng và chỉ đơn giản là tác dụng phụ của hoạt động não bộ."}, {"en": "Interestingly, almost everyone experiences a sudden falling sensation at least once while dreaming.", "vi": "Thú vị là, hầu như ai cũng từng trải qua cảm giác rơi đột ngột ít nhất một lần khi mơ."}, {"en": "This is sometimes linked to a hypnic jerk, a sudden muscle twitch as the body relaxes into sleep.", "vi": "Điều này đôi khi liên quan đến hiện tượng giật cơ khi ngủ, một cú giật cơ đột ngột khi cơ thể thả lỏng vào giấc ngủ."}, {"en": "Nightmares, unpleasant dreams that cause fear or anxiety, are also extremely common.", "vi": "Ác mộng, những giấc mơ khó chịu gây sợ hãi hoặc lo lắng, cũng vô cùng phổ biến."}, {"en": "Stress, certain medications, and even specific foods can increase how often nightmares occur.", "vi": "Căng thẳng, một số loại thuốc, và thậm chí một số loại thực phẩm nhất định có thể làm tăng tần suất gặp ác mộng."}, {"en": "On the other hand, some people experience lucid dreams, where they know they are dreaming.", "vi": "Mặt khác, một số người trải qua giấc mơ sáng suốt, nơi họ biết mình đang mơ."}, {"en": "In a lucid dream, a person can sometimes even control what happens next.", "vi": "Trong một giấc mơ sáng suốt, đôi khi một người thậm chí có thể kiểm soát điều gì sẽ xảy ra tiếp theo."}, {"en": "Whether dreams carry hidden meaning or not, they remain one of the most fascinating parts of being human.", "vi": "Dù giấc mơ có mang ý nghĩa ẩn giấu hay không, chúng vẫn là một trong những phần hấp dẫn nhất của việc làm người."}], "dialogue": [{"who": "Ben", "g": "m", "en": "I had the strangest dream last night. I was flying over my old school.", "vi": "Tối qua mình mơ một giấc kỳ lạ lắm. Mình đang bay trên nóc trường cũ."}, {"who": "Ava", "g": "f", "en": "That's funny, I rarely remember my dreams at all.", "vi": "Buồn cười thật, mình hiếm khi nhớ được giấc mơ của mình."}, {"who": "Ben", "g": "m", "en": "Do you know why some dreams feel so real?", "vi": "Cậu có biết tại sao một số giấc mơ lại cảm thấy thật đến vậy không?"}, {"who": "Ava", "g": "f", "en": "I read that during REM sleep, the brain is almost as active as when you're awake.", "vi": "Mình đọc được là trong giấc ngủ REM, não gần như hoạt động mạnh như lúc thức."}, {"who": "Ben", "g": "m", "en": "That explains a lot actually. My dream felt incredibly vivid.", "vi": "Vậy thì hợp lý đấy. Giấc mơ của mình cảm thấy sống động kinh khủng."}, {"who": "Ava", "g": "f", "en": "Have you ever had a lucid dream, where you know you're dreaming?", "vi": "Cậu đã từng có giấc mơ sáng suốt, nơi cậu biết mình đang mơ chưa?"}, {"who": "Ben", "g": "m", "en": "Once, actually! I even tried to control what happened next.", "vi": "Có một lần đấy! Mình còn thử kiểm soát điều gì xảy ra tiếp theo nữa."}, {"who": "Ava", "g": "f", "en": "That sounds amazing. I've never experienced that myself.", "vi": "Nghe tuyệt vời đấy. Mình chưa bao giờ trải qua điều đó cả."}, {"who": "Ben", "g": "m", "en": "What about nightmares? Do you get those often?", "vi": "Còn ác mộng thì sao? Cậu có hay gặp không?"}, {"who": "Ava", "g": "f", "en": "More than I'd like, especially during stressful weeks.", "vi": "Nhiều hơn mình muốn, đặc biệt là trong những tuần căng thẳng."}, {"who": "Ben", "g": "m", "en": "I read that stress can definitely increase how often they happen.", "vi": "Mình đọc được là căng thẳng có thể làm tăng tần suất gặp ác mộng đấy."}, {"who": "Ava", "g": "f", "en": "That makes sense. Mine always seem worse during exam season.", "vi": "Nghe có lý. Của mình lúc nào cũng tệ hơn trong mùa thi."}, {"who": "Ben", "g": "m", "en": "Do scientists actually agree on why we dream?", "vi": "Các nhà khoa học có thực sự đồng ý về lý do tại sao chúng ta mơ không?"}, {"who": "Ava", "g": "f", "en": "Not really. There are several theories, but no single clear answer.", "vi": "Không hẳn. Có nhiều giả thuyết, nhưng không có câu trả lời rõ ràng duy nhất."}, {"who": "Ben", "g": "m", "en": "Mysterious, but kind of fascinating when you think about it.", "vi": "Bí ẩn, nhưng khá hấp dẫn khi cậu nghĩ về nó."}, {"who": "Ava", "g": "f", "en": "Agreed. Maybe we'll never fully understand dreams.", "vi": "Đồng ý. Có lẽ chúng ta sẽ không bao giờ hiểu hết về giấc mơ."}], "vocab": [{"w": "dream", "f": ["dream", "dreams", "dreamed", "dreaming"], "pos": "n/v", "ipa": "driːm", "vi": "giấc mơ, mơ", "ex": "She dreamed about her childhood home.", "exVi": "Cô ấy mơ về ngôi nhà thời thơ ấu của mình."}, {"w": "nightmare", "f": ["nightmare", "nightmares"], "pos": "n", "ipa": "ˈnaɪtmer", "vi": "ác mộng", "ex": "He woke up from a terrible nightmare.", "exVi": "Anh ấy tỉnh dậy sau một cơn ác mộng kinh khủng."}, {"w": "lucid", "f": ["lucid"], "pos": "adj", "ipa": "ˈluːsɪd", "vi": "sáng suốt, tỉnh táo (trong giấc mơ)", "ex": "She had her first lucid dream last year.", "exVi": "Cô ấy có giấc mơ sáng suốt đầu tiên vào năm ngoái."}, {"w": "vivid", "f": ["vivid"], "pos": "adj", "ipa": "ˈvɪvɪd", "vi": "sống động, rõ nét", "ex": "His memory of the dream was surprisingly vivid.", "exVi": "Ký ức về giấc mơ của anh ấy sống động đến bất ngờ."}, {"w": "paralyzed", "f": ["paralyzed"], "pos": "adj", "ipa": "ˈpærəlaɪzd", "vi": "bị tê liệt", "ex": "The body stays mostly paralyzed during REM sleep.", "exVi": "Cơ thể gần như bị tê liệt trong giấc ngủ REM."}, {"w": "theory", "f": ["theory", "theories"], "pos": "n", "ipa": "ˈθɪəri", "vi": "giả thuyết, lý thuyết", "ex": "There are many theories about why we dream.", "exVi": "Có nhiều giả thuyết về lý do tại sao chúng ta mơ."}, {"w": "anxiety", "f": ["anxiety"], "pos": "n", "ipa": "æŋˈzaɪəti", "vi": "sự lo lắng", "ex": "Nightmares can cause real anxiety.", "exVi": "Ác mộng có thể gây ra sự lo lắng thực sự."}, {"w": "fascinating", "f": ["fascinating"], "pos": "adj", "ipa": "ˈfæsɪneɪtɪŋ", "vi": "hấp dẫn, thú vị", "ex": "Dreams are a fascinating topic to study.", "exVi": "Giấc mơ là một chủ đề hấp dẫn để nghiên cứu."}, {"w": "mysterious", "f": ["mysterious"], "pos": "adj", "ipa": "mɪˈstɪriəs", "vi": "bí ẩn", "ex": "The reason for dreaming remains mysterious.", "exVi": "Lý do của việc mơ vẫn còn bí ẩn."}, {"w": "occur", "f": ["occur", "occurs", "occurred", "occurring"], "pos": "v", "ipa": "əˈkɜːr", "vi": "xảy ra", "ex": "Nightmares often occur during stressful times.", "exVi": "Ác mộng thường xảy ra trong những lúc căng thẳng."}], "grammar": [{"title": "Whether... or not (dù... hay không)", "formula": "Whether + mệnh đề + or not, mệnh đề chính", "use": "Dùng để nói rằng điều gì đó vẫn đúng bất kể một điều kiện có xảy ra hay không.", "examples": [{"en": "Whether dreams carry meaning or not, they remain fascinating.", "vi": "Dù giấc mơ có mang ý nghĩa hay không, chúng vẫn hấp dẫn."}, {"en": "Whether you agree or not, the plan will continue.", "vi": "Dù bạn có đồng ý hay không, kế hoạch vẫn sẽ tiếp tục."}, {"en": "We'll go, whether it rains or not.", "vi": "Chúng tôi vẫn sẽ đi, dù trời có mưa hay không."}]}, {"title": "Even if (ngay cả khi)", "formula": "Even if + mệnh đề, mệnh đề chính", "use": "Dùng để nói rằng kết quả vẫn không thay đổi ngay cả khi một điều kiện khác xảy ra.", "examples": [{"en": "Almost everyone dreams, even if they don't remember it.", "vi": "Hầu như ai cũng mơ, ngay cả khi họ không nhớ lại."}, {"en": "I'll go for a run, even if it's cold outside.", "vi": "Mình vẫn sẽ chạy bộ, ngay cả khi trời lạnh bên ngoài."}, {"en": "She stayed calm, even if the situation was stressful.", "vi": "Cô ấy vẫn giữ bình tĩnh, ngay cả khi tình huống căng thẳng."}]}], "phrases": [{"p": "in the first place", "vi": "ngay từ đầu", "ex": "Why did he say that in the first place?", "exVi": "Tại sao ngay từ đầu anh ấy lại nói vậy?", "ctx": "Trung tính, dùng khi hỏi về nguyên nhân gốc rễ."}, {"p": "on the other hand", "vi": "mặt khác", "ex": "On the other hand, some people never remember their dreams.", "exVi": "Mặt khác, một số người không bao giờ nhớ giấc mơ của họ.", "ctx": "Trung tính, dùng để đưa ra ý trái ngược."}, {"p": "more than I'd like", "vi": "nhiều hơn mình muốn", "ex": "I get nightmares more than I'd like.", "exVi": "Mình gặp ác mộng nhiều hơn mình muốn.", "ctx": "Thân mật, dùng khi than phiền nhẹ về tần suất điều gì đó."}, {"p": "that explains a lot", "vi": "vậy thì hợp lý đấy, thế thì giải thích được nhiều điều", "ex": "You didn't sleep well? That explains a lot.", "exVi": "Cậu ngủ không ngon à? Vậy thì hợp lý đấy.", "ctx": "Thân mật, dùng khi một thông tin mới giúp hiểu rõ điều gì đó."}, {"p": "not really", "vi": "không hẳn", "ex": "Do scientists agree? Not really.", "exVi": "Các nhà khoa học có đồng ý không? Không hẳn.", "ctx": "Thân mật, dùng để phủ định nhẹ nhàng."}, {"p": "kind of fascinating", "vi": "khá là hấp dẫn", "ex": "This topic is kind of fascinating, actually.", "exVi": "Chủ đề này thật ra khá là hấp dẫn.", "ctx": "Thân mật, dùng khi diễn đạt sự thú vị ở mức vừa phải."}, {"p": "makes sense", "vi": "nghe có lý", "ex": "That makes sense, thanks for explaining.", "exVi": "Nghe có lý đấy, cảm ơn cậu đã giải thích.", "ctx": "Thân mật, dùng khi đồng ý rằng điều gì đó hợp lý."}, {"p": "no single clear answer", "vi": "không có câu trả lời rõ ràng duy nhất", "ex": "There's no single clear answer to that question.", "exVi": "Không có câu trả lời rõ ràng duy nhất cho câu hỏi đó.", "ctx": "Trung tính, dùng khi một vấn đề có nhiều quan điểm khác nhau."}, {"p": "think about it", "vi": "nghĩ về nó, suy ngẫm về nó", "ex": "It's actually quite deep when you think about it.", "exVi": "Nó thực ra khá sâu sắc khi bạn nghĩ về nó.", "ctx": "Thân mật, dùng khi khuyến khích suy ngẫm thêm."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Almost everyone dreams, (1)___ they don't remember it.", "o": ["even if", "even though it", "despite"], "a": 0, "why": "'Even if' nghĩa là ngay cả khi, dùng trước mệnh đề điều kiện."}, {"t": "During REM sleep, the brain becomes almost as (2)___ as when awake.", "o": ["active", "activity", "actively"], "a": 0, "why": "Cấu trúc so sánh bằng 'as + adj + as' cần tính từ: active."}, {"t": "The body stays mostly (3)___ during REM sleep.", "o": ["paralyzed", "paralysis", "paralyzing"], "a": 0, "why": "Cần tính từ/quá khứ phân từ sau 'stays': paralyzed."}, {"t": "Stress can increase how often nightmares (4)___.", "o": ["occur", "occurs", "occurred"], "a": 0, "why": "Mệnh đề danh từ 'how often nightmares occur', động từ giữ nguyên thể vì chủ ngữ số nhiều 'nightmares'."}, {"t": "In a lucid dream, a person can sometimes (5)___ what happens next.", "o": ["control", "controls", "controlled"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: control."}, {"t": "(6)___ dreams carry meaning or not, they remain fascinating.", "o": ["Whether", "If", "Unless"], "a": 0, "why": "'Whether...or not' nghĩa là dù có hay không."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Ava said she rarely (1)___ her dreams.", "o": ["remember", "remembers", "remembered"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: remembered."}, {"t": "Ben explained that the brain (2)___ almost as active as when awake.", "o": ["is", "was", "were"], "a": 1, "why": "Sự thật khoa học trong câu tường thuật thường vẫn giữ nguyên nhưng đáp án đúng ngữ cảnh ở đây là was (lùi thì theo mệnh đề chính)."}, {"t": "Ben said he had once (3)___ a lucid dream.", "o": ["have", "has", "had"], "a": 2, "why": "Thì quá khứ hoàn thành sau 'said': had."}, {"t": "Ava admitted she got nightmares more than she'd (4)___.", "o": ["like", "likes", "liked"], "a": 0, "why": "Cụm cố định 'more than I'd like' giữ nguyên dạng này trong tường thuật."}, {"t": "She said hers always seemed worse during (5)___ season.", "o": ["exam", "exams", "examine"], "a": 0, "why": "Danh từ ghép 'exam season' dùng danh từ số ít làm tính từ."}, {"t": "Ben agreed that it was mysterious but (6)___ fascinating.", "o": ["kind of", "kind", "a kind"], "a": 0, "why": "Cụm cố định 'kind of' nghĩa là khá là, hơi."}]}]}, {"id": "B1-SPORTS-004", "topic": "SPORTS", "n": 4, "level": "B1", "title": "The Mental Side of Sports", "titleVi": "Yếu tố tinh thần trong thể thao", "passage": [{"en": "When people think about becoming a great athlete, they usually focus on physical training.", "vi": "Khi mọi người nghĩ về việc trở thành một vận động viên giỏi, họ thường tập trung vào việc tập luyện thể chất."}, {"en": "However, top athletes and coaches agree that the mental side of sports matters just as much.", "vi": "Tuy nhiên, các vận động viên và huấn luyện viên hàng đầu đều đồng ý rằng yếu tố tinh thần trong thể thao quan trọng không kém."}, {"en": "This mental side is often called sports psychology, and it focuses on the mind, not the body.", "vi": "Yếu tố tinh thần này thường được gọi là tâm lý học thể thao, tập trung vào tâm trí chứ không phải cơ thể."}, {"en": "One key part of sports psychology is handling pressure during important moments.", "vi": "Một phần quan trọng của tâm lý học thể thao là xử lý áp lực trong những khoảnh khắc quan trọng."}, {"en": "Even highly skilled athletes can perform poorly if their mind is full of doubt or fear.", "vi": "Ngay cả những vận động viên có kỹ năng cao cũng có thể thi đấu kém nếu tâm trí họ đầy nghi ngờ hoặc sợ hãi."}, {"en": "This is often called 'choking', when nerves cause someone to underperform at a crucial moment.", "vi": "Điều này thường được gọi là 'choking' (đơ người), khi sự hồi hộp khiến ai đó thi đấu kém hơn khả năng vào thời điểm quan trọng."}, {"en": "To avoid this, many athletes practice visualization, imagining success before it actually happens.", "vi": "Để tránh điều này, nhiều vận động viên luyện tập hình dung, tưởng tượng về sự thành công trước khi nó thực sự xảy ra."}, {"en": "Studies show that visualization can actually activate similar brain patterns to real physical practice.", "vi": "Các nghiên cứu cho thấy việc hình dung thực sự có thể kích hoạt các mẫu hoạt động não tương tự như tập luyện thể chất thật sự."}, {"en": "Another important mental skill is staying focused on the present moment, not the final result.", "vi": "Một kỹ năng tinh thần quan trọng khác là tập trung vào khoảnh khắc hiện tại, không phải kết quả cuối cùng."}, {"en": "Thinking too much about winning or losing can actually hurt performance.", "vi": "Nghĩ quá nhiều về việc thắng hay thua thực ra có thể làm hại đến thành tích."}, {"en": "Instead, athletes are trained to focus on small, controllable actions, like their breathing or technique.", "vi": "Thay vào đó, các vận động viên được huấn luyện để tập trung vào những hành động nhỏ, có thể kiểm soát được, như hơi thở hoặc kỹ thuật."}, {"en": "Building confidence is also essential, and it often comes from consistent preparation.", "vi": "Xây dựng sự tự tin cũng rất cần thiết, và nó thường đến từ sự chuẩn bị đều đặn."}, {"en": "Athletes who trust their training tend to perform better under pressure than those who doubt themselves.", "vi": "Những vận động viên tin tưởng vào quá trình tập luyện của mình thường thi đấu tốt hơn dưới áp lực so với những người nghi ngờ bản thân."}, {"en": "Many professional teams now hire full-time sports psychologists to support their players.", "vi": "Nhiều đội chuyên nghiệp giờ đây thuê các nhà tâm lý học thể thao toàn thời gian để hỗ trợ các cầu thủ của họ."}, {"en": "This shows just how seriously the sports world now takes mental preparation.", "vi": "Điều này cho thấy mức độ nghiêm túc mà giới thể thao hiện nay đang dành cho việc chuẩn bị tinh thần."}, {"en": "In the end, a strong mind can be just as powerful as a strong body.", "vi": "Cuối cùng, một tinh thần vững vàng có thể mạnh mẽ không kém gì một cơ thể khỏe mạnh."}], "dialogue": [{"who": "Noah", "g": "m", "en": "I played terribly in my last match. I just froze under pressure.", "vi": "Mình chơi tệ quá trong trận đấu vừa rồi. Mình cứ đơ người dưới áp lực."}, {"who": "Isla", "g": "f", "en": "That happens to everyone sometimes. Even pros choke under pressure.", "vi": "Chuyện đó thỉnh thoảng xảy ra với mọi người mà. Ngay cả dân chuyên nghiệp cũng đơ dưới áp lực."}, {"who": "Noah", "g": "m", "en": "Is there anything I can actually do about it?", "vi": "Có cách nào mình thực sự có thể làm để cải thiện không?"}, {"who": "Isla", "g": "f", "en": "Try visualization. Imagine yourself succeeding before the match starts.", "vi": "Thử hình dung xem. Tưởng tượng bản thân thành công trước khi trận đấu bắt đầu."}, {"who": "Noah", "g": "m", "en": "Does that actually work, or is it just a mental trick?", "vi": "Cái đó có thực sự hiệu quả không, hay chỉ là một mẹo tâm lý thôi?"}, {"who": "Isla", "g": "f", "en": "It really works. It activates similar brain patterns to real practice.", "vi": "Nó thực sự hiệu quả. Nó kích hoạt các mẫu hoạt động não tương tự như tập luyện thật."}, {"who": "Noah", "g": "m", "en": "Interesting. I always just focus on winning, maybe that's the problem.", "vi": "Thú vị đấy. Mình lúc nào cũng chỉ tập trung vào việc thắng, có lẽ đó là vấn đề."}, {"who": "Isla", "g": "f", "en": "That might be it. Try focusing on small things instead, like your breathing.", "vi": "Có thể đúng đấy. Thử tập trung vào những điều nhỏ hơn, như hơi thở của cậu."}, {"who": "Noah", "g": "m", "en": "That sounds strange, but I'll give it a try.", "vi": "Nghe hơi lạ, nhưng mình sẽ thử xem."}, {"who": "Isla", "g": "f", "en": "Confidence matters too. It comes from consistent preparation.", "vi": "Sự tự tin cũng quan trọng. Nó đến từ sự chuẩn bị đều đặn."}, {"who": "Noah", "g": "m", "en": "I guess I haven't been practicing as consistently as I should.", "vi": "Chắc là mình đã không luyện tập đều đặn như mình nên làm."}, {"who": "Isla", "g": "f", "en": "That could definitely be affecting your confidence on match day.", "vi": "Điều đó chắc chắn có thể đang ảnh hưởng đến sự tự tin của cậu vào ngày thi đấu."}, {"who": "Noah", "g": "m", "en": "Do professional teams really hire psychologists for this?", "vi": "Các đội chuyên nghiệp có thực sự thuê nhà tâm lý học cho việc này không?"}, {"who": "Isla", "g": "f", "en": "Yes, many of them do now. It's taken very seriously.", "vi": "Có, nhiều đội giờ làm vậy đấy. Chuyện đó được xem rất nghiêm túc."}, {"who": "Noah", "g": "m", "en": "Okay, I'm convinced. I'll start training my mind, not just my body.", "vi": "Được rồi, mình bị thuyết phục rồi. Mình sẽ bắt đầu luyện tập tinh thần, không chỉ cơ thể."}, {"who": "Isla", "g": "f", "en": "That's the right mindset. Good luck next time!", "vi": "Đó là tư duy đúng đắn đấy. Chúc may mắn lần sau nhé!"}], "vocab": [{"w": "pressure", "f": ["pressure"], "pos": "n", "ipa": "ˈpreʃər", "vi": "áp lực", "ex": "He performs well under pressure.", "exVi": "Anh ấy thi đấu tốt dưới áp lực."}, {"w": "confidence", "f": ["confidence"], "pos": "n", "ipa": "ˈkɑːnfɪdəns", "vi": "sự tự tin", "ex": "Her confidence grew with each match.", "exVi": "Sự tự tin của cô ấy tăng lên theo từng trận đấu."}, {"w": "focus", "f": ["focus", "focuses", "focused", "focusing"], "pos": "v/n", "ipa": "ˈfoʊkəs", "vi": "tập trung", "ex": "He focused on his breathing before the shot.", "exVi": "Anh ấy tập trung vào hơi thở trước khi thực hiện cú đánh."}, {"w": "visualization", "f": ["visualization"], "pos": "n", "ipa": "ˌvɪʒuəlaɪˈzeɪʃn", "vi": "sự hình dung", "ex": "Visualization helps athletes prepare mentally.", "exVi": "Việc hình dung giúp vận động viên chuẩn bị về mặt tinh thần."}, {"w": "doubt", "f": ["doubt", "doubts"], "pos": "n/v", "ipa": "daʊt", "vi": "sự nghi ngờ, nghi ngờ", "ex": "Self-doubt can hurt performance.", "exVi": "Sự tự nghi ngờ có thể làm hại đến thành tích."}, {"w": "crucial", "f": ["crucial"], "pos": "adj", "ipa": "ˈkruːʃl", "vi": "quan trọng, mang tính quyết định", "ex": "She stayed calm at the crucial moment.", "exVi": "Cô ấy giữ bình tĩnh vào khoảnh khắc quan trọng."}, {"w": "consistent", "f": ["consistent"], "pos": "adj", "ipa": "kənˈsɪstənt", "vi": "đều đặn, nhất quán", "ex": "Consistent practice builds real confidence.", "exVi": "Luyện tập đều đặn xây dựng sự tự tin thực sự."}, {"w": "perform", "f": ["perform", "performs", "performed", "performing"], "pos": "v", "ipa": "pərˈfɔːrm", "vi": "thi đấu, thể hiện", "ex": "She performed well despite the pressure.", "exVi": "Cô ấy thi đấu tốt dù có áp lực."}, {"w": "underperform", "f": ["underperform", "underperforms", "underperformed"], "pos": "v", "ipa": "ˌʌndərpərˈfɔːrm", "vi": "thi đấu kém hơn khả năng", "ex": "He underperformed during the final.", "exVi": "Anh ấy thi đấu kém hơn khả năng trong trận chung kết."}, {"w": "mindset", "f": ["mindset"], "pos": "n", "ipa": "ˈmaɪndset", "vi": "tư duy, lối suy nghĩ", "ex": "A positive mindset can improve performance.", "exVi": "Một tư duy tích cực có thể cải thiện thành tích."}], "grammar": [{"title": "Just as + adj/adv + as (quan trọng/mạnh không kém)", "formula": "S + tobe + just as + adj + as + noun", "use": "Dùng để nhấn mạnh hai điều quan trọng hoặc mạnh mẽ ngang nhau, thường dùng để so sánh yếu tố tinh thần với thể chất trong thể thao.", "examples": [{"en": "A strong mind can be just as powerful as a strong body.", "vi": "Một tinh thần vững vàng có thể mạnh mẽ không kém gì một cơ thể khỏe mạnh."}, {"en": "Practice is just as important as talent.", "vi": "Luyện tập quan trọng không kém gì tài năng."}, {"en": "Rest is just as crucial as training.", "vi": "Nghỉ ngơi quan trọng không kém gì luyện tập."}]}, {"title": "Tend to + V (có xu hướng)", "formula": "S + tend(s) to + V", "use": "Dùng để diễn tả một xu hướng chung, điều thường xảy ra chứ không phải luôn luôn tuyệt đối.", "examples": [{"en": "Athletes who trust their training tend to perform better.", "vi": "Những vận động viên tin tưởng vào luyện tập của mình có xu hướng thi đấu tốt hơn."}, {"en": "People tend to underestimate the mental side of sports.", "vi": "Mọi người có xu hướng đánh giá thấp yếu tố tinh thần trong thể thao."}, {"en": "She tends to stay calm under pressure.", "vi": "Cô ấy có xu hướng giữ bình tĩnh dưới áp lực."}]}], "phrases": [{"p": "freeze under pressure", "vi": "đơ người dưới áp lực", "ex": "He froze under pressure during the final shot.", "exVi": "Anh ấy đơ người dưới áp lực trong cú đánh cuối cùng.", "ctx": "Thân mật, dùng khi ai đó mất bình tĩnh vào thời điểm quan trọng."}, {"p": "give it a try", "vi": "thử xem sao", "ex": "I've never tried visualization, but I'll give it a try.", "exVi": "Mình chưa từng thử hình dung, nhưng mình sẽ thử xem sao.", "ctx": "Thân mật, dùng khi đồng ý thử điều gì đó mới."}, {"p": "that could be it", "vi": "có thể đúng là vậy đấy", "ex": "Not practicing enough? That could be it.", "exVi": "Không luyện tập đủ à? Có thể đúng là vậy đấy.", "ctx": "Thân mật, dùng khi đồng ý với một giả thuyết hợp lý."}, {"p": "taken seriously", "vi": "được xem trọng, được coi trọng", "ex": "Mental training is now taken very seriously.", "exVi": "Luyện tập tinh thần giờ được xem rất trọng.", "ctx": "Trung tính, dùng khi nói điều gì đó được đối xử một cách nghiêm túc."}, {"p": "I'm convinced", "vi": "tôi bị thuyết phục rồi", "ex": "Okay, I'm convinced. Let's try your method.", "exVi": "Được rồi, mình bị thuyết phục rồi. Thử cách của cậu xem.", "ctx": "Thân mật, dùng khi đã bị thuyết phục sau khi nghe lý lẽ."}, {"p": "the right mindset", "vi": "tư duy đúng đắn", "ex": "Having the right mindset is half the battle.", "exVi": "Có tư duy đúng đắn đã là một nửa thành công rồi.", "ctx": "Trung tính, dùng khi khen ngợi cách suy nghĩ tích cực của ai đó."}, {"p": "affect something", "vi": "ảnh hưởng đến điều gì", "ex": "Lack of sleep can affect your performance.", "exVi": "Thiếu ngủ có thể ảnh hưởng đến thành tích của bạn.", "ctx": "Trung tính, dùng khi nói về tác động của một yếu tố."}, {"p": "does that actually work", "vi": "cái đó có thực sự hiệu quả không", "ex": "Does that actually work, or is it just a myth?", "exVi": "Cái đó có thực sự hiệu quả không, hay chỉ là lời đồn?", "ctx": "Thân mật, dùng khi nghi ngờ hiệu quả của một phương pháp."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "A strong mind can be (1)___ as powerful as a strong body.", "o": ["just", "so", "very"], "a": 0, "why": "Cấu trúc 'just as...as' nhấn mạnh sự ngang bằng."}, {"t": "Athletes who trust their training (2)___ to perform better under pressure.", "o": ["tend", "tends", "tending"], "a": 0, "why": "Chủ ngữ số nhiều 'athletes', động từ giữ nguyên thể: tend."}, {"t": "'Choking' is when nerves cause someone to (3)___ at a crucial moment.", "o": ["underperform", "underperformed", "underperforming"], "a": 0, "why": "Sau 'cause someone to' dùng động từ nguyên mẫu: underperform."}, {"t": "Visualization can activate similar brain patterns to real (4)___ practice.", "o": ["physical", "physically", "physic"], "a": 0, "why": "Cần tính từ bổ nghĩa cho danh từ 'practice': physical."}, {"t": "Building confidence often comes from (5)___ preparation.", "o": ["consistent", "consistency", "consistently"], "a": 0, "why": "Cần tính từ bổ nghĩa cho danh từ 'preparation': consistent."}, {"t": "This shows how seriously the sports world (6)___ mental preparation.", "o": ["takes", "take", "took"], "a": 0, "why": "Chủ ngữ số ít 'the sports world', hiện tại đơn thêm s: takes."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Noah said he (1)___ terribly in his last match.", "o": ["play", "played", "had played"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had played."}, {"t": "Isla told him that even pros (2)___ under pressure sometimes.", "o": ["choke", "chokes", "choked"], "a": 0, "why": "Sự thật chung giữ nguyên hiện tại đơn trong câu tường thuật: choke."}, {"t": "She suggested he (3)___ visualization.", "o": ["try", "tries", "tried"], "a": 0, "why": "Sau 'suggested' dùng động từ nguyên mẫu (subjunctive): try."}, {"t": "Noah admitted he hadn't been practicing as (4)___ as he should.", "o": ["consistent", "consistently", "consistency"], "a": 1, "why": "Trạng từ bổ nghĩa cho động từ 'practicing': consistently."}, {"t": "Isla said many professional teams (5)___ psychologists now.", "o": ["hire", "hires", "hired"], "a": 0, "why": "Sự thật chung giữ nguyên hiện tại đơn: hire."}, {"t": "Noah said he was (6)___ and would train his mind too.", "o": ["convince", "convinced", "convincing"], "a": 1, "why": "Tính từ 'convinced' (bị thuyết phục) dùng sau động từ 'to be'."}]}]}, {"id": "B1-SOCIAL-005", "topic": "SOCIAL", "n": 5, "level": "B1", "title": "The Shift Toward a Cashless Society", "titleVi": "Xu hướng tiến tới xã hội không dùng tiền mặt", "passage": [{"en": "Twenty years ago, most people paid for everything with cash.", "vi": "Hai mươi năm trước, hầu hết mọi người trả tiền cho mọi thứ bằng tiền mặt."}, {"en": "Today, many people go days or even weeks without touching a single paper bill.", "vi": "Ngày nay, nhiều người có thể cả ngày hoặc thậm chí cả tuần mà không chạm vào một tờ tiền giấy nào."}, {"en": "This shift is often called the move toward a 'cashless society'.", "vi": "Sự chuyển đổi này thường được gọi là bước tiến tới một 'xã hội không dùng tiền mặt'."}, {"en": "Digital payments, like cards and mobile apps, have made transactions faster and more convenient.", "vi": "Thanh toán kỹ thuật số, như thẻ và ứng dụng di động, đã khiến các giao dịch nhanh hơn và tiện lợi hơn."}, {"en": "In many countries, even small street vendors now accept payments through a simple phone scan.", "vi": "Ở nhiều quốc gia, ngay cả những người bán hàng rong nhỏ cũng chấp nhận thanh toán qua một lần quét điện thoại đơn giản."}, {"en": "Supporters of this shift argue that digital payments are safer than carrying large amounts of cash.", "vi": "Những người ủng hộ sự chuyển đổi này cho rằng thanh toán kỹ thuật số an toàn hơn so với việc mang theo nhiều tiền mặt."}, {"en": "They also point out that digital transactions are easier to track for both businesses and individuals.", "vi": "Họ cũng chỉ ra rằng các giao dịch kỹ thuật số dễ theo dõi hơn đối với cả doanh nghiệp và cá nhân."}, {"en": "However, not everyone welcomes this change with open arms.", "vi": "Tuy nhiên, không phải ai cũng chào đón sự thay đổi này một cách nồng nhiệt."}, {"en": "Critics worry that a fully cashless society could leave certain groups of people behind.", "vi": "Những người phản đối lo ngại rằng một xã hội hoàn toàn không dùng tiền mặt có thể bỏ lại một số nhóm người."}, {"en": "Elderly people, for example, may find it harder to adapt to constantly changing technology.", "vi": "Ví dụ, người lớn tuổi có thể thấy khó thích nghi hơn với công nghệ liên tục thay đổi."}, {"en": "People without access to smartphones or stable internet can also be excluded from the system entirely.", "vi": "Những người không có điều kiện tiếp cận điện thoại thông minh hoặc internet ổn định cũng có thể bị loại hoàn toàn khỏi hệ thống."}, {"en": "There are also concerns about privacy, since every digital transaction leaves a traceable record.", "vi": "Cũng có những lo ngại về quyền riêng tư, vì mỗi giao dịch kỹ thuật số đều để lại một dấu vết có thể truy vết."}, {"en": "Some people simply prefer the independence that comes with holding physical cash.", "vi": "Một số người đơn giản là thích sự độc lập đi kèm với việc giữ tiền mặt vật lý."}, {"en": "Governments and banks are now trying to find a balance between convenience and inclusion.", "vi": "Các chính phủ và ngân hàng hiện đang cố gắng tìm sự cân bằng giữa sự tiện lợi và tính bao trùm."}, {"en": "Many experts believe cash will never disappear completely, even as digital options keep growing.", "vi": "Nhiều chuyên gia tin rằng tiền mặt sẽ không bao giờ biến mất hoàn toàn, ngay cả khi các lựa chọn kỹ thuật số tiếp tục phát triển."}, {"en": "The real challenge is making sure no one gets left behind during this transition.", "vi": "Thách thức thực sự là đảm bảo không ai bị bỏ lại phía sau trong quá trình chuyển đổi này."}], "dialogue": [{"who": "Leo", "g": "m", "en": "I haven't used cash in weeks, honestly. Everything's just on my phone now.", "vi": "Thật lòng thì mình không dùng tiền mặt mấy tuần nay rồi. Giờ mọi thứ chỉ trên điện thoại thôi."}, {"who": "Hana", "g": "f", "en": "Same here. It's so much faster than counting bills.", "vi": "Mình cũng vậy. Nhanh hơn nhiều so với đếm tiền giấy."}, {"who": "Leo", "g": "m", "en": "Although, I do wonder if it's a problem for some people.", "vi": "Mặc dù, mình cũng thắc mắc liệu nó có phải vấn đề với một số người không."}, {"who": "Hana", "g": "f", "en": "What do you mean exactly?", "vi": "Ý cậu là sao vậy?"}, {"who": "Leo", "g": "m", "en": "Like, what about elderly people who aren't used to this technology?", "vi": "Kiểu như, người lớn tuổi không quen với công nghệ này thì sao?"}, {"who": "Hana", "g": "f", "en": "That's a fair concern. My grandmother still struggles with mobile apps.", "vi": "Đó là một lo ngại hợp lý đấy. Bà mình vẫn gặp khó khăn với các ứng dụng di động."}, {"who": "Leo", "g": "m", "en": "Exactly. And some people simply don't have smartphones at all.", "vi": "Chính xác. Và một số người thì đơn giản là không có điện thoại thông minh."}, {"who": "Hana", "g": "f", "en": "True. They could get completely excluded from the system.", "vi": "Đúng vậy. Họ có thể bị loại hoàn toàn khỏi hệ thống."}, {"who": "Leo", "g": "m", "en": "There's also the privacy issue. Every payment leaves a digital record.", "vi": "Còn có vấn đề về quyền riêng tư nữa. Mỗi lần thanh toán đều để lại một dấu vết kỹ thuật số."}, {"who": "Hana", "g": "f", "en": "I hadn't thought about that. That's a bit unsettling, actually.", "vi": "Mình chưa nghĩ tới điều đó. Thật ra nghe hơi đáng lo đấy."}, {"who": "Leo", "g": "m", "en": "Still, I don't think cash will ever fully disappear.", "vi": "Dù vậy, mình không nghĩ tiền mặt sẽ biến mất hoàn toàn đâu."}, {"who": "Hana", "g": "f", "en": "I agree. Some people will always prefer having physical money.", "vi": "Mình đồng ý. Một số người sẽ luôn thích có tiền mặt vật lý."}, {"who": "Leo", "g": "m", "en": "It's a tricky balance between convenience and fairness.", "vi": "Đó là một sự cân bằng khó khăn giữa sự tiện lợi và sự công bằng."}, {"who": "Hana", "g": "f", "en": "Agreed. Hopefully the transition won't leave anyone behind.", "vi": "Đồng ý. Hy vọng quá trình chuyển đổi sẽ không bỏ lại ai cả."}, {"who": "Leo", "g": "m", "en": "That's the real challenge, isn't it?", "vi": "Đó mới là thách thức thực sự, đúng không?"}, {"who": "Hana", "g": "f", "en": "Exactly. Progress is good, but it has to include everyone.", "vi": "Chính xác. Tiến bộ là tốt, nhưng nó phải bao gồm mọi người."}], "vocab": [{"w": "cashless", "f": ["cashless"], "pos": "adj", "ipa": "ˈkæʃləs", "vi": "không dùng tiền mặt", "ex": "Many stores are becoming fully cashless.", "exVi": "Nhiều cửa hàng đang trở nên hoàn toàn không dùng tiền mặt."}, {"w": "transaction", "f": ["transaction", "transactions"], "pos": "n", "ipa": "trænˈzækʃn", "vi": "giao dịch", "ex": "The transaction took only a few seconds.", "exVi": "Giao dịch chỉ mất vài giây."}, {"w": "convenient", "f": ["convenient"], "pos": "adj", "ipa": "kənˈviːniənt", "vi": "tiện lợi", "ex": "Mobile payments are extremely convenient.", "exVi": "Thanh toán di động cực kỳ tiện lợi."}, {"w": "exclude", "f": ["exclude", "excludes", "excluded", "excluding"], "pos": "v", "ipa": "ɪkˈskluːd", "vi": "loại trừ", "ex": "Some people are excluded from digital systems.", "exVi": "Một số người bị loại khỏi các hệ thống kỹ thuật số."}, {"w": "privacy", "f": ["privacy"], "pos": "n", "ipa": "ˈpraɪvəsi", "vi": "quyền riêng tư", "ex": "People are concerned about privacy online.", "exVi": "Mọi người lo ngại về quyền riêng tư trên mạng."}, {"w": "traceable", "f": ["traceable"], "pos": "adj", "ipa": "ˈtreɪsəbl", "vi": "có thể truy vết", "ex": "Digital payments leave a traceable record.", "exVi": "Thanh toán kỹ thuật số để lại một dấu vết có thể truy vết."}, {"w": "independence", "f": ["independence"], "pos": "n", "ipa": "ˌɪndɪˈpendəns", "vi": "sự độc lập", "ex": "Cash gives people a sense of independence.", "exVi": "Tiền mặt mang lại cho mọi người cảm giác độc lập."}, {"w": "inclusion", "f": ["inclusion"], "pos": "n", "ipa": "ɪnˈkluːʒn", "vi": "tính bao trùm, sự hòa nhập", "ex": "Financial inclusion is important for everyone.", "exVi": "Sự bao trùm về tài chính quan trọng với tất cả mọi người."}, {"w": "transition", "f": ["transition", "transitions"], "pos": "n", "ipa": "trænˈzɪʃn", "vi": "quá trình chuyển đổi", "ex": "The transition to digital payments is happening fast.", "exVi": "Quá trình chuyển đổi sang thanh toán kỹ thuật số đang diễn ra nhanh chóng."}, {"w": "vendor", "f": ["vendor", "vendors"], "pos": "n", "ipa": "ˈvendər", "vi": "người bán hàng", "ex": "Even street vendors accept mobile payments now.", "exVi": "Ngay cả người bán hàng rong giờ cũng chấp nhận thanh toán di động."}], "grammar": [{"title": "Not everyone + V (không phải ai cũng)", "formula": "Not everyone + V", "use": "Dùng để nói rằng một điều không đúng với tất cả mọi người, dù có thể đúng với đa số. Phổ biến khi đưa ra quan điểm cân bằng.", "examples": [{"en": "Not everyone welcomes this change with open arms.", "vi": "Không phải ai cũng chào đón sự thay đổi này nồng nhiệt."}, {"en": "Not everyone agrees with the new policy.", "vi": "Không phải ai cũng đồng ý với chính sách mới."}, {"en": "Not everyone has access to the internet.", "vi": "Không phải ai cũng có điều kiện tiếp cận internet."}]}, {"title": "Even as (ngay cả khi, trong khi)", "formula": "Even as + mệnh đề, mệnh đề chính", "use": "Dùng để nói rằng hai điều đang xảy ra cùng lúc, thường tạo sự tương phản nhẹ.", "examples": [{"en": "Cash will never disappear completely, eve
