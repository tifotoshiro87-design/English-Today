ộ phim yêu thích cũ cảm giác ít giống giải trí hơn mà giống một món ăn an ủi tinh thần."}, {"en": "It seems strange at first: why watch something again when there's so much new content out there?", "vi": "Nghe có vẻ lạ lúc đầu: tại sao lại xem lại thứ gì đó khi có quá nhiều nội dung mới ngoài kia?"}, {"en": "Psychologists actually have a pretty simple explanation for this habit.", "vi": "Các nhà tâm lý học thực ra có một lời giải thích khá đơn giản cho thói quen này."}, {"en": "When you already know what happens, your brain doesn't have to work as hard to follow the story.", "vi": "Khi bạn đã biết chuyện gì sẽ xảy ra, não bộ không cần phải hoạt động vất vả để theo dõi cốt truyện."}, {"en": "That frees up mental energy, which makes the experience feel relaxing instead of demanding.", "vi": "Điều đó giải phóng năng lượng tinh thần, khiến trải nghiệm cảm thấy thư giãn thay vì đòi hỏi nhiều nỗ lực."}, {"en": "There's also something comforting about spending time with familiar characters, almost like visiting old friends.", "vi": "Còn có điều gì đó dễ chịu khi dành thời gian với những nhân vật quen thuộc, gần như đang thăm lại những người bạn cũ."}, {"en": "You already know their personalities, their jokes, and how they'll react to different situations.", "vi": "Bạn đã biết tính cách của họ, những câu đùa của họ, và cách họ sẽ phản ứng trong các tình huống khác nhau."}, {"en": "That predictability can feel especially soothing during a stressful week.", "vi": "Sự dễ đoán đó có thể cảm thấy đặc biệt dịu dàng trong một tuần căng thẳng."}, {"en": "New shows, on the other hand, require a bit of emotional risk.", "vi": "Ngược lại, phim mới đòi hỏi một chút mạo hiểm về mặt cảm xúc."}, {"en": "You don't know yet if you'll like the characters, or if the ending will disappoint you.", "vi": "Bạn chưa biết liệu mình có thích các nhân vật hay không, hoặc cái kết có làm bạn thất vọng không."}, {"en": "Sometimes, after a long day, people simply don't have the energy for that kind of uncertainty.", "vi": "Đôi khi, sau một ngày dài, người ta đơn giản là không còn năng lượng cho kiểu bất định đó."}, {"en": "Rewatching also lets viewers notice small details they missed the first time around.", "vi": "Xem lại cũng cho phép người xem để ý những chi tiết nhỏ mà họ đã bỏ lỡ ở lần xem đầu tiên."}, {"en": "A joke that felt random the first time might suddenly make perfect sense on a second watch.", "vi": "Một câu đùa mà lần đầu cảm thấy ngẫu nhiên có thể bỗng nhiên hợp lý hoàn toàn ở lần xem thứ hai."}, {"en": "So rewatching isn't necessarily a sign of laziness or a lack of imagination.", "vi": "Vậy nên việc xem lại không nhất thiết là dấu hiệu của lười biếng hay thiếu trí tưởng tượng."}, {"en": "For many people, it's simply a small, reliable way to feel a little better at the end of a long day.", "vi": "Với nhiều người, đó đơn giản là một cách nhỏ, đáng tin cậy để cảm thấy dễ chịu hơn một chút vào cuối một ngày dài."}], "dialogue": [{"who": "Mia", "g": "f", "en": "I'm rewatching that same show again. This is probably my eighth time.", "vi": "Mình lại đang xem lại đúng bộ phim đó. Chắc là lần thứ tám rồi."}, {"who": "Jack", "g": "m", "en": "Eighth time? Don't you already know exactly what happens?", "vi": "Lần thứ tám? Cậu không phải đã biết chính xác chuyện gì sẽ xảy ra rồi sao?"}, {"who": "Mia", "g": "f", "en": "That's exactly why I like it. It's relaxing, not stressful.", "vi": "Đó chính xác là lý do mình thích nó. Nó thư giãn, không căng thẳng."}, {"who": "Jack", "g": "m", "en": "Huh, I never really thought about it that way.", "vi": "Ồ, mình chưa bao giờ nghĩ theo hướng đó."}, {"who": "Mia", "g": "f", "en": "New shows are great, but they take more energy, you know?", "vi": "Phim mới thì hay, nhưng nó tốn nhiều năng lượng hơn, cậu biết đấy?"}, {"who": "Jack", "g": "m", "en": "I guess that makes sense. New shows can be disappointing too.", "vi": "Chắc cũng có lý đấy. Phim mới cũng có thể gây thất vọng nữa."}, {"who": "Mia", "g": "f", "en": "Right. With this show, I know I'll enjoy it every single time.", "vi": "Đúng vậy. Với bộ phim này, mình biết mình sẽ thích nó mỗi lần xem."}, {"who": "Jack", "g": "m", "en": "Do you notice new things even after watching it so many times?", "vi": "Cậu có nhận ra điều gì mới dù đã xem nó nhiều lần như vậy không?"}, {"who": "Mia", "g": "f", "en": "Actually, yes! I caught a joke last week I never understood before.", "vi": "Thật ra là có! Tuần trước mình bắt được một câu đùa mà trước đây mình chưa bao giờ hiểu."}, {"who": "Jack", "g": "m", "en": "That's kind of cool, honestly.", "vi": "Nghe cũng khá hay đấy, thật lòng."}, {"who": "Mia", "g": "f", "en": "It's like visiting old friends. The characters feel familiar.", "vi": "Nó giống như thăm lại những người bạn cũ. Các nhân vật cảm thấy quen thuộc."}, {"who": "Jack", "g": "m", "en": "Maybe I should try rewatching something instead of always starting new shows.", "vi": "Chắc mình cũng nên thử xem lại thứ gì đó thay vì lúc nào cũng bắt đầu phim mới."}, {"who": "Mia", "g": "f", "en": "You should. It's honestly one of my favorite ways to relax.", "vi": "Cậu nên thử. Đó thật sự là một trong những cách mình thích nhất để thư giãn."}, {"who": "Jack", "g": "m", "en": "What show should I start with?", "vi": "Mình nên bắt đầu với bộ phim nào?"}, {"who": "Mia", "g": "f", "en": "Pick something you already loved once. Trust me, it hits differently the second time.", "vi": "Chọn thứ gì đó cậu từng thích trước đây. Tin mình đi, xem lần hai sẽ có cảm giác khác hẳn."}], "vocab": [{"w": "comfort", "f": ["comfort"], "pos": "n", "ipa": "ˈkʌmfərt", "vi": "sự an ủi, dễ chịu", "ex": "Rewatching an old show can bring a lot of comfort.", "exVi": "Xem lại một bộ phim cũ có thể mang lại rất nhiều sự an ủi."}, {"w": "predictability", "f": ["predictability"], "pos": "n", "ipa": "prɪˌdɪktəˈbɪləti", "vi": "tính dễ đoán", "ex": "The predictability of the story feels soothing.", "exVi": "Tính dễ đoán của câu chuyện cảm thấy dịu dàng."}, {"w": "uncertainty", "f": ["uncertainty"], "pos": "n", "ipa": "ʌnˈsɜːrtnti", "vi": "sự bất định, không chắc chắn", "ex": "Some people don't have energy for that uncertainty.", "exVi": "Một số người không còn năng lượng cho sự bất định đó."}, {"w": "familiar", "f": ["familiar"], "pos": "adj", "ipa": "fəˈmɪliər", "vi": "quen thuộc", "ex": "The characters feel familiar after so many rewatches.", "exVi": "Các nhân vật cảm thấy quen thuộc sau nhiều lần xem lại."}, {"w": "soothing", "f": ["soothing"], "pos": "adj", "ipa": "ˈsuːðɪŋ", "vi": "dịu dàng, làm dịu", "ex": "There's something soothing about a familiar story.", "exVi": "Có điều gì đó dịu dàng về một câu chuyện quen thuộc."}, {"w": "disappoint", "f": ["disappoint", "disappoints", "disappointed", "disappointing"], "pos": "v", "ipa": "ˌdɪsəˈpɔɪnt", "vi": "làm thất vọng", "ex": "A new show's ending might disappoint you.", "exVi": "Cái kết của một bộ phim mới có thể khiến bạn thất vọng."}, {"w": "laziness", "f": ["laziness"], "pos": "n", "ipa": "ˈleɪzinəs", "vi": "sự lười biếng", "ex": "Rewatching isn't a sign of laziness.", "exVi": "Xem lại không phải là dấu hiệu của sự lười biếng."}, {"w": "reliable", "f": ["reliable"], "pos": "adj", "ipa": "rɪˈlaɪəbl", "vi": "đáng tin cậy", "ex": "It's a reliable way to relax after a long day.", "exVi": "Đó là một cách đáng tin cậy để thư giãn sau một ngày dài."}, {"w": "catch (a joke)", "f": ["catch", "catches", "caught"], "pos": "v", "ipa": "kætʃ", "vi": "bắt được, nhận ra (ý nghĩa)", "ex": "I caught a joke I never understood before.", "exVi": "Mình bắt được một câu đùa mà trước đây chưa bao giờ hiểu."}, {"w": "hit differently", "f": ["hit differently"], "pos": "phrase", "ipa": "hɪt ˈdɪfrəntli", "vi": "mang lại cảm giác khác hẳn", "ex": "Watching it a second time hits differently.", "exVi": "Xem lần hai mang lại cảm giác khác hẳn."}], "grammar": [{"title": "Free up (giải phóng, tạo ra khoảng trống)", "formula": "S + free(s) up + danh từ", "use": "Dùng để nói việc gì đó tạo thêm không gian/thời gian/năng lượng cho thứ khác. Rất phổ biến trong văn nói tự nhiên.", "examples": [{"en": "Knowing the story frees up mental energy.", "vi": "Việc biết trước câu chuyện giải phóng năng lượng tinh thần."}, {"en": "Working from home frees up an hour every morning.", "vi": "Làm việc tại nhà giải phóng thêm một tiếng mỗi sáng."}, {"en": "This app frees up space on your phone.", "vi": "Ứng dụng này giải phóng dung lượng trên điện thoại của bạn."}]}, {"title": "Instead of + V-ing (ôn lại, mở rộng)", "formula": "instead of + V-ing", "use": "Nhắc lại cấu trúc 'thay vì làm gì' — luôn theo sau bởi V-ing hoặc danh từ, không dùng động từ nguyên mẫu.", "examples": [{"en": "I should try rewatching something instead of always starting new shows.", "vi": "Mình nên thử xem lại thứ gì đó thay vì lúc nào cũng bắt đầu phim mới."}, {"en": "She read a book instead of watching TV.", "vi": "Cô ấy đọc sách thay vì xem TV."}, {"en": "We walked instead of taking the bus.", "vi": "Chúng tôi đi bộ thay vì đi xe buýt."}]}], "phrases": [{"p": "comfort show/food", "vi": "bộ phim/món ăn 'an ủi' tinh thần", "ex": "This is my comfort show whenever I'm stressed.", "exVi": "Đây là bộ phim 'an ủi' của mình mỗi khi căng thẳng.", "ctx": "Thân mật, dùng để nói về thứ mang lại cảm giác dễ chịu quen thuộc."}, {"p": "visiting old friends", "vi": "như thăm lại bạn cũ (nghĩa bóng)", "ex": "Rewatching this show feels like visiting old friends.", "exVi": "Xem lại bộ phim này cảm giác như thăm lại những người bạn cũ.", "ctx": "Thân mật, dùng theo nghĩa bóng cho nhân vật quen thuộc."}, {"p": "that's exactly why", "vi": "đó chính xác là lý do", "ex": "That's exactly why I like watching it again.", "exVi": "Đó chính xác là lý do mình thích xem lại nó.", "ctx": "Thân mật, dùng khi xác nhận lý do rõ ràng."}, {"p": "you know?", "vi": "cậu biết đấy? (dùng cuối câu)", "ex": "New shows take more energy, you know?", "exVi": "Phim mới tốn nhiều năng lượng hơn, cậu biết đấy?", "ctx": "Rất thân mật, dùng cuối câu để tìm sự đồng cảm."}, {"p": "kind of cool", "vi": "cũng khá hay đấy", "ex": "Noticing new details is kind of cool.", "exVi": "Nhận ra chi tiết mới cũng khá hay đấy.", "ctx": "Thân mật, dùng để khen nhẹ nhàng."}, {"p": "trust me", "vi": "tin mình đi", "ex": "Trust me, it hits differently the second time.", "exVi": "Tin mình đi, xem lần hai sẽ khác hẳn.", "ctx": "Thân mật, dùng khi thuyết phục ai đó tin lời mình."}, {"p": "at first", "vi": "lúc đầu", "ex": "It seemed strange at first, but now I get it.", "exVi": "Lúc đầu nghe có vẻ lạ, nhưng giờ mình hiểu rồi.", "ctx": "Trung tính, dùng khi mô tả cảm giác ban đầu."}, {"p": "on the other hand", "vi": "mặt khác", "ex": "New shows, on the other hand, feel riskier.", "exVi": "Mặt khác, phim mới lại cảm thấy rủi ro hơn.", "ctx": "Trung tính, dùng khi đưa ra ý đối lập."}, {"p": "a sign of", "vi": "một dấu hiệu của", "ex": "It's not a sign of laziness.", "exVi": "Đó không phải là một dấu hiệu của sự lười biếng.", "ctx": "Trung tính, dùng khi giải thích ý nghĩa của một hành động."}, {"p": "feel a little better", "vi": "cảm thấy dễ chịu hơn một chút", "ex": "Watching my comfort show helps me feel a little better.", "exVi": "Xem bộ phim 'an ủi' của mình giúp mình cảm thấy dễ chịu hơn một chút.", "ctx": "Thân mật, dùng khi nói về việc cải thiện tâm trạng nhẹ nhàng."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Knowing the story (1)___ up mental energy.", "o": ["free", "frees", "freed"], "a": 1, "why": "Chủ ngữ số ít 'knowing the story', hiện tại đơn thêm 's': frees."}, {"t": "I should try rewatching something (2)___ always starting new shows.", "o": ["instead of", "instead", "rather"], "a": 0, "why": "Cấu trúc 'instead of + V-ing'."}, {"t": "New shows require a bit of emotional (3)___.", "o": ["risk", "risky", "risking"], "a": 0, "why": "Sau 'a bit of' dùng danh từ: risk."}, {"t": "Rewatching isn't necessarily a sign (4)___ laziness.", "o": ["of", "for", "in"], "a": 0, "why": "Cụm cố định 'a sign of'."}, {"t": "A joke that felt random might suddenly (5)___ perfect sense.", "o": ["make", "makes", "made"], "a": 0, "why": "Sau 'might' dùng động từ nguyên mẫu: make."}, {"t": "That predictability can (6)___ especially soothing.", "o": ["feel", "feels", "felt"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: feel."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Jack asked if she (1)___ what happens in the show.", "o": ["know", "knows", "already knew"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: already knew."}, {"t": "Mia said new shows (2)___ more energy.", "o": ["take", "takes", "took"], "a": 0, "why": "Sự thật chung vẫn đúng, giữ nguyên hiện tại đơn: take."}, {"t": "She told him it (3)___ like visiting old friends.", "o": ["feel", "feels", "felt"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: felt."}, {"t": "He admitted he never really (4)___ about it that way.", "o": ["think", "thinks", "thought"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: thought."}, {"t": "She told him to pick something he (5)___ loved once.", "o": ["already", "always", "ever"], "a": 0, "why": "'Already' phù hợp nghĩa 'đã từng' trong ngữ cảnh này."}, {"t": "She said it (6)___ differently the second time.", "o": ["hit", "hits", "would hit"], "a": 2, "why": "Câu tường thuật, 'will' lùi thành 'would': would hit."}]}]}, {"id": "B1-HEALTH-003", "topic": "HEALTH", "n": 3, "level": "B1", "title": "Do You Really Need Vitamins?", "titleVi": "Bạn có thực sự cần vitamin không?", "passage": [{"en": "Walk into any pharmacy and you'll see entire shelves full of colorful vitamin bottles.", "vi": "Bước vào bất kỳ hiệu thuốc nào, bạn sẽ thấy cả kệ đầy những lọ vitamin đầy màu sắc."}, {"en": "It can feel like everyone around you is taking some kind of supplement.", "vi": "Cảm giác như mọi người xung quanh bạn đều đang uống một loại thực phẩm chức năng nào đó."}, {"en": "But do most healthy people actually need to take vitamins every day?", "vi": "Nhưng liệu hầu hết người khỏe mạnh có thực sự cần uống vitamin mỗi ngày không?"}, {"en": "According to many doctors, the honest answer is usually no.", "vi": "Theo nhiều bác sĩ, câu trả lời thật lòng thường là không."}, {"en": "If you eat a fairly balanced diet, your body likely gets most of what it needs from food alone.", "vi": "Nếu bạn ăn một chế độ ăn khá cân bằng, cơ thể bạn có khả năng đã nhận được hầu hết những gì nó cần chỉ từ thức ăn."}, {"en": "Fruits, vegetables, grains, and protein already contain a wide range of vitamins and minerals.", "vi": "Trái cây, rau củ, ngũ cốc và chất đạm đã chứa sẵn một loạt vitamin và khoáng chất."}, {"en": "That said, there are situations where a supplement genuinely makes sense.", "vi": "Tuy vậy, có những trường hợp mà việc bổ sung thực sự hợp lý."}, {"en": "People who eat a very limited diet, for example, may be missing certain nutrients.", "vi": "Ví dụ, những người ăn theo chế độ rất hạn chế có thể đang thiếu một số dưỡng chất nhất định."}, {"en": "Pregnant women are often advised to take specific vitamins that support a baby's development.", "vi": "Phụ nữ mang thai thường được khuyên uống những loại vitamin cụ thể hỗ trợ sự phát triển của thai nhi."}, {"en": "People who rarely go outside may also lack vitamin D, since sunlight helps the body produce it.", "vi": "Những người hiếm khi ra ngoài cũng có thể thiếu vitamin D, vì ánh nắng mặt trời giúp cơ thể sản sinh ra nó."}, {"en": "In these cases, a doctor can run a simple blood test to check for an actual deficiency.", "vi": "Trong những trường hợp này, bác sĩ có thể làm một xét nghiệm máu đơn giản để kiểm tra sự thiếu hụt thực sự."}, {"en": "That's a much smarter approach than simply guessing and buying random bottles at the store.", "vi": "Đó là một cách tiếp cận khôn ngoan hơn nhiều so với việc đoán mò và mua đại các lọ thuốc ở cửa hàng."}, {"en": "Taking more vitamins than your body needs doesn't necessarily make you healthier, either.", "vi": "Uống nhiều vitamin hơn mức cơ thể cần cũng không nhất thiết khiến bạn khỏe mạnh hơn."}, {"en": "For some vitamins, too much can actually cause problems rather than solve them.", "vi": "Với một số loại vitamin, uống quá nhiều thực ra có thể gây ra vấn đề thay vì giải quyết chúng."}, {"en": "So instead of following trends, it's usually better to ask a real question: what does my body actually need?", "vi": "Vậy nên thay vì chạy theo trào lưu, thường tốt hơn là đặt một câu hỏi thật sự: cơ thể mình thực sự cần gì?"}, {"en": "A quick conversation with a doctor can often answer that far better than any advertisement can.", "vi": "Một cuộc trò chuyện ngắn với bác sĩ thường có thể trả lời điều đó tốt hơn nhiều so với bất kỳ quảng cáo nào."}], "dialogue": [{"who": "Ethan", "g": "m", "en": "My coworker takes like ten different vitamins every morning.", "vi": "Đồng nghiệp mình mỗi sáng uống đến mười loại vitamin khác nhau."}, {"who": "Priya", "g": "f", "en": "Ten? That seems like a lot. Does she actually need all of them?", "vi": "Mười loại? Nghe nhiều quá. Cô ấy có thực sự cần hết chỗ đó không?"}, {"who": "Ethan", "g": "m", "en": "I have no idea, honestly. She just says it's good for her.", "vi": "Thật lòng thì mình không biết. Cô ấy chỉ nói là tốt cho cô ấy thôi."}, {"who": "Priya", "g": "f", "en": "I read that most healthy people don't actually need supplements.", "vi": "Mình đọc được là hầu hết người khỏe mạnh không thực sự cần thực phẩm chức năng."}, {"who": "Ethan", "g": "m", "en": "Really? I always thought more vitamins meant better health.", "vi": "Thật hả? Mình luôn nghĩ nhiều vitamin hơn nghĩa là sức khỏe tốt hơn."}, {"who": "Priya", "g": "f", "en": "Apparently not. If your diet is balanced, food already covers most of it.", "vi": "Có vẻ không phải vậy. Nếu chế độ ăn của bạn cân bằng, thức ăn đã bao phủ hầu hết rồi."}, {"who": "Ethan", "g": "m", "en": "That's surprising. So when would someone actually need them?", "vi": "Nghe bất ngờ đấy. Vậy khi nào ai đó thực sự cần chúng?"}, {"who": "Priya", "g": "f", "en": "Like if you have a very limited diet, or you rarely go outside for sunlight.", "vi": "Kiểu như nếu bạn ăn theo chế độ rất hạn chế, hoặc hiếm khi ra ngoài để đón nắng."}, {"who": "Ethan", "g": "m", "en": "I barely go outside these days, actually.", "vi": "Thật ra dạo này mình hiếm khi ra ngoài lắm."}, {"who": "Priya", "g": "f", "en": "Then maybe get a blood test instead of just guessing.", "vi": "Vậy thì có khi nên đi xét nghiệm máu thay vì chỉ đoán mò."}, {"who": "Ethan", "g": "m", "en": "That actually makes more sense than buying random bottles.", "vi": "Nghe hợp lý hơn nhiều so với việc mua đại các lọ thuốc."}, {"who": "Priya", "g": "f", "en": "Exactly. Plus, taking too much of some vitamins can actually cause problems.", "vi": "Chính xác. Với lại, uống quá nhiều một số vitamin thực ra có thể gây ra vấn đề."}, {"who": "Ethan", "g": "m", "en": "I never knew that. I thought more was always better.", "vi": "Mình chưa bao giờ biết điều đó. Mình cứ nghĩ càng nhiều càng tốt."}, {"who": "Priya", "g": "f", "en": "Nope, not always. I'll book a doctor's appointment this week, actually.", "vi": "Không, không phải lúc nào cũng vậy. Thật ra tuần này mình sẽ đặt lịch hẹn bác sĩ."}, {"who": "Ethan", "g": "m", "en": "Good idea. I might do the same instead of guessing too.", "vi": "Ý hay đấy. Chắc mình cũng sẽ làm vậy thay vì đoán mò."}], "vocab": [{"w": "supplement", "f": ["supplement", "supplements"], "pos": "n", "ipa": "ˈsʌplɪmənt", "vi": "thực phẩm chức năng, chất bổ sung", "ex": "She takes a vitamin D supplement every morning.", "exVi": "Cô ấy uống thực phẩm chức năng vitamin D mỗi sáng."}, {"w": "balanced diet", "f": ["balanced diet"], "pos": "n", "ipa": "ˈbælənst ˈdaɪət", "vi": "chế độ ăn cân bằng", "ex": "A balanced diet gives you most of the vitamins you need.", "exVi": "Một chế độ ăn cân bằng cung cấp cho bạn hầu hết các vitamin cần thiết."}, {"w": "nutrient", "f": ["nutrient", "nutrients"], "pos": "n", "ipa": "ˈnuːtriənt", "vi": "dưỡng chất", "ex": "A limited diet might be missing certain nutrients.", "exVi": "Một chế độ ăn hạn chế có thể đang thiếu một số dưỡng chất nhất định."}, {"w": "deficiency", "f": ["deficiency", "deficiencies"], "pos": "n", "ipa": "dɪˈfɪʃənsi", "vi": "sự thiếu hụt", "ex": "A blood test can check for a vitamin deficiency.", "exVi": "Xét nghiệm máu có thể kiểm tra sự thiếu hụt vitamin."}, {"w": "pregnant", "f": ["pregnant"], "pos": "adj", "ipa": "ˈpreɡnənt", "vi": "mang thai", "ex": "Pregnant women often need specific vitamins.", "exVi": "Phụ nữ mang thai thường cần những loại vitamin cụ thể."}, {"w": "advise", "f": ["advise", "advises", "advised", "advising"], "pos": "v", "ipa": "ədˈvaɪz", "vi": "khuyên, tư vấn", "ex": "Doctors advise a balanced diet over random supplements.", "exVi": "Bác sĩ khuyên nên có chế độ ăn cân bằng hơn là uống thực phẩm chức năng bừa bãi."}, {"w": "guess", "f": ["guess", "guesses", "guessed", "guessing"], "pos": "v", "ipa": "ɡes", "vi": "đoán, đoán mò", "ex": "It's better to test than to guess.", "exVi": "Xét nghiệm thì tốt hơn là đoán mò."}, {"w": "appointment", "f": ["appointment", "appointments"], "pos": "n", "ipa": "əˈpɔɪntmənt", "vi": "lịch hẹn", "ex": "I booked a doctor's appointment for next week.", "exVi": "Mình đã đặt lịch hẹn bác sĩ cho tuần sau."}, {"w": "trend", "f": ["trend", "trends"], "pos": "n", "ipa": "trend", "vi": "trào lưu, xu hướng", "ex": "It's easy to follow health trends without checking the facts.", "exVi": "Rất dễ để chạy theo trào lưu sức khỏe mà không kiểm chứng sự thật."}, {"w": "advertisement", "f": ["advertisement", "advertisements"], "pos": "n", "ipa": "ˌædvərˈtaɪzmənt", "vi": "quảng cáo", "ex": "Don't trust every health advertisement you see.", "exVi": "Đừng tin mọi quảng cáo về sức khỏe mà bạn thấy."}], "grammar": [{"title": "That said (tuy vậy, dù vậy)", "formula": "That said, + mệnh đề", "use": "Dùng để chuyển sang một ý hơi tương phản với điều vừa nói, thường đứng đầu câu, rất phổ biến trong văn nói lẫn văn viết trang trọng nhẹ.", "examples": [{"en": "That said, there are situations where a supplement makes sense.", "vi": "Tuy vậy, có những trường hợp mà việc bổ sung là hợp lý."}, {"en": "The trip was expensive. That said, it was worth it.", "vi": "Chuyến đi khá đắt đỏ. Tuy vậy, nó xứng đáng."}, {"en": "I'm busy today. That said, I can help tomorrow.", "vi": "Hôm nay mình bận. Tuy vậy, mai mình có thể giúp."}]}, {"title": "Rather than + V-ing/danh từ", "formula": "S + V + rather than + V-ing/noun", "use": "Dùng để so sánh, nói 'thay vì' theo cách trang trọng hơn 'instead of' một chút, thường dùng để nhấn mạnh lựa chọn tốt hơn.", "examples": [{"en": "Too much of a vitamin can cause problems rather than solve them.", "vi": "Quá nhiều một loại vitamin có thể gây ra vấn đề thay vì giải quyết chúng."}, {"en": "She chose to walk rather than drive.", "vi": "Cô ấy chọn đi bộ thay vì lái xe."}, {"en": "We should test rather than guess.", "vi": "Chúng ta nên xét nghiệm thay vì đoán mò."}]}], "phrases": [{"p": "I have no idea", "vi": "mình chẳng biết gì cả", "ex": "I have no idea why she takes so many vitamins.", "exVi": "Mình chẳng biết vì sao cô ấy uống nhiều vitamin vậy.", "ctx": "Thân mật, dùng khi thật sự không biết điều gì đó."}, {"p": "makes more sense", "vi": "nghe hợp lý hơn", "ex": "Getting a blood test makes more sense than guessing.", "exVi": "Đi xét nghiệm máu nghe hợp lý hơn là đoán mò.", "ctx": "Thân mật, dùng khi so sánh hai lựa chọn."}, {"p": "more is always better", "vi": "càng nhiều càng tốt (thường dùng để phản bác)", "ex": "I used to think more vitamins was always better.", "exVi": "Mình từng nghĩ uống nhiều vitamin hơn lúc nào cũng tốt hơn.", "ctx": "Trung tính, thường dùng để nói về một quan niệm sai lầm phổ biến."}, {"p": "apparently not", "vi": "có vẻ không phải vậy", "ex": "Does more sleep always help? Apparently not.", "exVi": "Ngủ nhiều hơn lúc nào cũng tốt à? Có vẻ không phải vậy.", "ctx": "Thân mật, dùng khi phủ nhận một giả định phổ biến."}, {"p": "I never knew that", "vi": "mình chưa bao giờ biết điều đó", "ex": "I never knew too much vitamin C could cause problems.", "exVi": "Mình chưa bao giờ biết là quá nhiều vitamin C có thể gây vấn đề.", "ctx": "Thân mật, dùng khi ngạc nhiên về thông tin mới."}, {"p": "book an appointment", "vi": "đặt lịch hẹn", "ex": "I'm going to book an appointment with my doctor.", "exVi": "Mình sẽ đặt lịch hẹn với bác sĩ.", "ctx": "Trung tính, dùng khi sắp xếp gặp bác sĩ hoặc chuyên gia."}, {"p": "instead of guessing", "vi": "thay vì đoán mò", "ex": "Get a test done instead of guessing.", "exVi": "Hãy đi xét nghiệm thay vì đoán mò.", "ctx": "Trung tính, dùng khi khuyên nên kiểm chứng thay vì phỏng đoán."}, {"p": "good idea", "vi": "ý hay đấy", "ex": "Booking a doctor's appointment is a good idea.", "exVi": "Đặt lịch hẹn bác sĩ là một ý hay đấy.", "ctx": "Thân mật, dùng khi đồng ý với một đề xuất."}, {"p": "plus", "vi": "với lại, thêm nữa", "ex": "Plus, too much of some vitamins can cause problems.", "exVi": "Với lại, uống quá nhiều một số vitamin có thể gây ra vấn đề.", "ctx": "Thân mật, dùng để thêm một lý do vào câu trước."}, {"p": "not always", "vi": "không phải lúc nào cũng vậy", "ex": "More vitamins isn't always better.", "exVi": "Uống nhiều vitamin hơn không phải lúc nào cũng tốt hơn.", "ctx": "Trung tính, dùng để phủ nhận một giả định tuyệt đối."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "That said, there (1)___ situations where a supplement makes sense.", "o": ["is", "are", "be"], "a": 1, "why": "Chủ ngữ số nhiều 'situations', hiện tại đơn: are."}, {"t": "Too much of a vitamin can cause problems (2)___ solve them.", "o": ["rather than", "instead", "than"], "a": 0, "why": "Cấu trúc 'rather than' dùng để so sánh, đứng trước V-ing hoặc động từ nguyên mẫu song song."}, {"t": "A doctor can (3)___ a simple blood test.", "o": ["run", "runs", "ran"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: run."}, {"t": "People who rarely go outside may (4)___ vitamin D.", "o": ["lack", "lacks", "lacked"], "a": 0, "why": "Sau 'may' dùng động từ nguyên mẫu: lack."}, {"t": "That's a much smarter approach (5)___ guessing.", "o": ["than", "that", "then"], "a": 0, "why": "So sánh hơn dùng 'than': smarter approach than guessing."}, {"t": "It's usually better to ask what my body actually (6)___.", "o": ["need", "needs", "needed"], "a": 1, "why": "Chủ ngữ số ít 'my body', hiện tại đơn thêm 's': needs."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Priya said most healthy people (1)___ need supplements.", "o": ["don't", "doesn't", "didn't"], "a": 0, "why": "Sự thật chung vẫn đúng, giữ nguyên hiện tại đơn: don't."}, {"t": "Ethan admitted he (2)___ more vitamins meant better health.", "o": ["think", "thinks", "had always thought"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had always thought."}, {"t": "She suggested he (3)___ a blood test instead of guessing.", "o": ["get", "gets", "got"], "a": 0, "why": "Sau 'suggest' + tân ngữ dùng động từ nguyên mẫu trong văn nói thân mật: get."}, {"t": "He said that actually made more (4)___ than buying random bottles.", "o": ["sense", "senses", "sensing"], "a": 0, "why": "Cụm cố định 'make more sense' dùng danh từ không đếm được 'sense'."}, {"t": "She said she would book an (5)___ that week.", "o": ["appoint", "appointment", "appointing"], "a": 1, "why": "Danh từ 'appointment' sau mạo từ 'an'."}, {"t": "He said he might do the (6)___ instead of guessing too.", "o": ["same", "similar", "alike"], "a": 0, "why": "Cụm cố định 'do the same'."}]}]}, {"id": "B1-SCIENCE-003", "topic": "SCIENCE", "n": 3, "level": "B1", "title": "How Do Vaccines Work?", "titleVi": "Vắc-xin hoạt động như thế nào?", "passage": [{"en": "Every year, doctors give millions of vaccines to protect people from dangerous diseases.", "vi": "Mỗi năm, các bác sĩ tiêm hàng triệu liều vắc-xin để bảo vệ con người khỏi các căn bệnh nguy hiểm."}, {"en": "But how does a small injection actually protect the whole body?", "vi": "Nhưng làm sao một mũi tiêm nhỏ lại có thể bảo vệ cả cơ thể?"}, {"en": "The answer lies in something called the immune system.", "vi": "Câu trả lời nằm ở thứ gọi là hệ miễn dịch."}, {"en": "Your immune system is like an army that fights off germs such as viruses and bacteria.", "vi": "Hệ miễn dịch của bạn giống như một đội quân chiến đấu chống lại vi trùng như vi-rút và vi khuẩn."}, {"en": "When a germ enters your body for the first time, your immune system usually needs time to learn how to fight it.", "vi": "Khi một loại vi trùng lần đầu xâm nhập cơ thể, hệ miễn dịch thường cần thời gian để học cách chống lại nó."}, {"en": "That delay can sometimes let a disease make you very sick before your body catches up.", "vi": "Sự chậm trễ đó đôi khi có thể khiến bệnh làm bạn ốm nặng trước khi cơ thể kịp phản ứng."}, {"en": "A vaccine solves this problem by teaching your immune system in advance, without making you sick.", "vi": "Vắc-xin giải quyết vấn đề này bằng cách dạy hệ miễn dịch từ trước, mà không khiến bạn bị bệnh."}, {"en": "It usually contains a weakened or small piece of the germ, just enough for your body to recognize it.", "vi": "Nó thường chứa một phần vi trùng đã bị làm yếu hoặc một mảnh nhỏ, chỉ vừa đủ để cơ thể nhận diện."}, {"en": "Your immune system then builds special defenders called antibodies to fight that specific germ.", "vi": "Sau đó hệ miễn dịch xây dựng những 'người bảo vệ' đặc biệt gọi là kháng thể để chống lại loại vi trùng đó."}, {"en": "These antibodies stay in your body, ready to act quickly if the real germ ever shows up.", "vi": "Những kháng thể này ở lại trong cơ thể, sẵn sàng hành động nhanh chóng nếu vi trùng thật sự xuất hiện."}, {"en": "That's why a vaccinated person can often avoid getting seriously ill, even after being exposed.", "vi": "Đó là lý do một người đã tiêm vắc-xin thường có thể tránh bị bệnh nặng, ngay cả sau khi tiếp xúc với mầm bệnh."}, {"en": "Some vaccines also help protect people around you, not just yourself.", "vi": "Một số vắc-xin còn giúp bảo vệ những người xung quanh bạn, không chỉ riêng bản thân bạn."}, {"en": "When enough people in a community are protected, a disease has a much harder time spreading.", "vi": "Khi đủ nhiều người trong một cộng đồng được bảo vệ, một căn bệnh sẽ khó lây lan hơn nhiều."}, {"en": "This effect protects even people who can't get vaccinated, such as newborn babies.", "vi": "Hiệu ứng này bảo vệ cả những người không thể tiêm vắc-xin, chẳng hạn như trẻ sơ sinh."}, {"en": "Of course, no vaccine works perfectly for everyone, and mild side effects are sometimes possible.", "vi": "Tất nhiên, không có vắc-xin nào hiệu quả tuyệt đối với mọi người, và đôi khi có thể xảy ra tác dụng phụ nhẹ."}, {"en": "Still, scientists agree that vaccines remain one of the most effective tools medicine has ever created.", "vi": "Dù vậy, các nhà khoa học đồng ý rằng vắc-xin vẫn là một trong những công cụ hiệu quả nhất mà y học từng tạo ra."}], "dialogue": [{"who": "Lucas", "g": "m", "en": "I have to get a flu shot tomorrow. I always forget how vaccines actually work.", "vi": "Mai mình phải đi chích ngừa cúm. Mình lúc nào cũng quên vắc-xin thực sự hoạt động ra sao."}, {"who": "Nora", "g": "f", "en": "Basically, it teaches your immune system to recognize a germ before you actually catch it.", "vi": "Về cơ bản, nó dạy hệ miễn dịch nhận diện một loại vi trùng trước khi bạn thật sự nhiễm nó."}, {"who": "Lucas", "g": "m", "en": "So it's like practicing for a test before the real one?", "vi": "Vậy giống như luyện tập trước một kỳ thi trước khi thi thật à?"}, {"who": "Nora", "g": "f", "en": "Exactly! Your body builds antibodies so it's ready if the real germ shows up.", "vi": "Chính xác! Cơ thể bạn xây dựng kháng thể để sẵn sàng nếu vi trùng thật xuất hiện."}, {"who": "Priya", "g": "f", "en": "That's why people who are vaccinated usually get less sick, right?", "vi": "Đó là lý do người đã tiêm vắc-xin thường ít bị bệnh nặng hơn, đúng không?"}, {"who": "Nora", "g": "f", "en": "Right. Their body already knows how to fight it quickly.", "vi": "Đúng vậy. Cơ thể họ đã biết cách chống lại nó nhanh chóng."}, {"who": "Lucas", "g": "m", "en": "I heard vaccines also protect other people somehow. How does that work?", "vi": "Mình nghe nói vắc-xin còn bảo vệ cả người khác bằng cách nào đó. Cái đó hoạt động thế nào?"}, {"who": "Priya", "g": "f", "en": "If enough people are protected, the disease can't spread easily through the community.", "vi": "Nếu đủ nhiều người được bảo vệ, bệnh sẽ khó lây lan trong cộng đồng."}, {"who": "Nora", "g": "f", "en": "That protects babies and other people who can't get vaccinated yet.", "vi": "Điều đó bảo vệ trẻ sơ sinh và những người chưa thể tiêm vắc-xin."}, {"who": "Lucas", "g": "m", "en": "That's actually really clever. I never thought about it that way.", "vi": "Nghe khá hay đấy. Mình chưa bao giờ nghĩ theo hướng đó."}, {"who": "Priya", "g": "f", "en": "Are you worried about side effects at all?", "vi": "Cậu có lo lắng về tác dụng phụ chút nào không?"}, {"who": "Lucas", "g": "m", "en": "A little, but I know most side effects are mild, like a sore arm.", "vi": "Hơi hơi, nhưng mình biết hầu hết tác dụng phụ đều nhẹ, như đau tay thôi."}, {"who": "Nora", "g": "f", "en": "Exactly. It's usually a small price for a lot of protection.", "vi": "Chính xác. Đó thường chỉ là một cái giá nhỏ đổi lại rất nhiều sự bảo vệ."}, {"who": "Priya", "g": "f", "en": "I'm getting mine next week too. We should compare notes afterward.", "vi": "Tuần sau mình cũng đi chích. Chúng ta nên chia sẻ cảm nhận sau đó."}, {"who": "Lucas", "g": "m", "en": "Deal. At least now I understand what's actually happening in my arm.", "vi": "Đồng ý. Ít nhất giờ mình hiểu chuyện gì đang thật sự xảy ra trong cánh tay mình."}, {"who": "Nora", "g": "f", "en": "See? Science is a lot less scary once you understand it.", "vi": "Thấy chưa? Khoa học sẽ bớt đáng sợ hơn nhiều một khi bạn hiểu nó."}], "vocab": [{"w": "vaccine", "f": ["vaccine", "vaccines"], "pos": "n", "ipa": "vækˈsiːn", "vi": "vắc-xin", "ex": "She got a vaccine before traveling abroad.", "exVi": "Cô ấy đã tiêm vắc-xin trước khi đi nước ngoài."}, {"w": "immune system", "f": ["immune system"], "pos": "n", "ipa": "ɪˈmjuːn ˈsɪstəm", "vi": "hệ miễn dịch", "ex": "A healthy diet supports your immune system.", "exVi": "Chế độ ăn lành mạnh hỗ trợ hệ miễn dịch của bạn."}, {"w": "antibody", "f": ["antibody", "antibodies"], "pos": "n", "ipa": "ˈæntibɑːdi", "vi": "kháng thể", "ex": "The body produces antibodies to fight infection.", "exVi": "Cơ thể sản sinh kháng thể để chống lại nhiễm trùng."}, {"w": "disease", "f": ["disease", "diseases"], "pos": "n", "ipa": "dɪˈziːz", "vi": "căn bệnh", "ex": "Vaccines protect people from many diseases.", "exVi": "Vắc-xin bảo vệ con người khỏi nhiều căn bệnh."}, {"w": "infect", "f": ["infect", "infects", "infected", "infecting"], "pos": "v", "ipa": "ɪnˈfekt", "vi": "lây nhiễm", "ex": "A virus can infect thousands of people quickly.", "exVi": "Một loại vi-rút có thể lây nhiễm cho hàng ngàn người rất nhanh."}, {"w": "expose", "f": ["expose", "exposes", "exposed", "exposing"], "pos": "v", "ipa": "ɪkˈspoʊz", "vi": "tiếp xúc (với mầm bệnh)", "ex": "He was exposed to the virus at work.", "exVi": "Anh ấy đã tiếp xúc với vi-rút ở nơi làm việc."}, {"w": "protect", "f": ["protect", "protects", "protected", "protecting"], "pos": "v", "ipa": "prəˈtekt", "vi": "bảo vệ", "ex": "This vaccine protects against measles.", "exVi": "Vắc-xin này bảo vệ khỏi bệnh sởi."}, {"w": "side effect", "f": ["side effect", "side effects"], "pos": "n", "ipa": "saɪd ɪˈfekt", "vi": "tác dụng phụ", "ex": "A sore arm is a common side effect.", "exVi": "Đau tay là một tác dụng phụ phổ biến."}, {"w": "community", "f": ["community", "communities"], "pos": "n", "ipa": "kəˈmjuːnəti", "vi": "cộng đồng", "ex": "Vaccines help protect the whole community.", "exVi": "Vắc-xin giúp bảo vệ cả cộng đồng."}, {"w": "effective", "f": ["effective"], "pos": "adj", "ipa": "ɪˈfektɪv", "vi": "hiệu quả", "ex": "This vaccine is very effective against the disease.", "exVi": "Vắc-xin này rất hiệu quả trong việc chống lại căn bệnh."}], "grammar": [{"title": "So that + mục đích", "formula": "S + V + so that + mệnh đề", "use": "Dùng để diễn tả mục đích của một hành động, giải thích 'để làm gì'. Rất phổ biến khi giải thích lý do khoa học hoặc hướng dẫn.", "examples": [{"en": "The vaccine teaches your body so that it can fight the real germ later.", "vi": "Vắc-xin dạy cơ thể bạn để nó có thể chống lại vi trùng thật sau này."}, {"en": "She wrote everything down so that she wouldn't forget.", "vi": "Cô ấy viết mọi thứ ra để không quên."}, {"en": "We left early so that we could avoid the traffic.", "vi": "Chúng tôi rời đi sớm để tránh kẹt xe."}]}, {"title": "Even after + V-ing", "formula": "even after + V-ing, mệnh đề chính", "use": "Dùng để nhấn mạnh rằng điều gì đó vẫn đúng dù đã trải qua một hành động khác. Rất tự nhiên trong văn nói khi nhấn mạnh kết quả bất ngờ.", "examples": [{"en": "A vaccinated person can avoid getting sick even after being exposed.", "vi": "Một người đã tiêm vắc-xin có thể tránh bị bệnh ngay cả sau khi đã tiếp xúc với mầm bệnh."}, {"en": "He still felt tired even after sleeping ten hours.", "vi": "Anh ấy vẫn thấy mệt ngay cả sau khi đã ngủ mười tiếng."}, {"en": "She kept practicing even after making mistakes.", "vi": "Cô ấy vẫn tiếp tục luyện tập ngay cả sau khi mắc lỗi."}]}], "phrases": [{"p": "catch up", "vi": "bắt kịp, đuổi kịp", "ex": "Your body needs time to catch up with a new germ.", "exVi": "Cơ thể bạn cần thời gian để bắt kịp một loại vi trùng mới.", "ctx": "Trung tính, dùng khi nói về việc theo kịp điều gì đó."}, {"p": "a small price to pay", "vi": "một cái giá nhỏ phải trả (đổi lại lợi ích lớn)", "ex": "A sore arm is a small price to pay for protection.", "exVi": "Đau tay là một cái giá nhỏ phải trả để đổi lấy sự bảo vệ.", "ctx": "Trung tính, dùng khi chấp nhận một bất tiện nhỏ vì lợi ích lớn."}, {"p": "show up", "vi": "xuất hiện", "ex": "The antibodies are ready if the real germ shows up.", "exVi": "Kháng thể đã sẵn sàng nếu vi trùng thật xuất hiện.", "ctx": "Thân mật, dùng khi nói về việc gì đó bất ngờ xuất hiện."}, {"p": "compare notes", "vi": "chia sẻ, so sánh trải nghiệm với nhau", "ex": "Let's compare notes after we both get the shot.", "exVi": "Chúng ta hãy chia sẻ cảm nhận sau khi cả hai đều đã chích ngừa.", "ctx": "Thân mật, dùng khi hai người muốn trao đổi kinh nghiệm."}, {"p": "think about it that way", "vi": "nghĩ theo hướng đó", "ex": "I never thought about it that way before.", "exVi": "Trước đây mình chưa bao giờ nghĩ theo hướng đó.", "ctx": "Thân mật, dùng khi có góc nhìn mới về một vấn đề."}, {"p": "less scary", "vi": "đỡ đáng sợ hơn", "ex": "Science feels less scary once you understand it.", "exVi": "Khoa học sẽ bớt đáng sợ hơn một khi bạn hiểu nó.", "ctx": "Thân mật, dùng khi nỗi sợ giảm đi nhờ hiểu biết."}, {"p": "a lot less", "vi": "ít hơn nhiều", "ex": "Vaccinated people usually get a lot less sick.", "exVi": "Người đã tiêm vắc-xin thường ít bị bệnh nặng hơn nhiều.", "ctx": "Trung tính, dùng để nhấn mạnh mức độ giảm."}, {"p": "in advance", "vi": "trước, từ trước", "ex": "The vaccine teaches your body in advance.", "exVi": "Vắc-xin dạy cơ thể bạn từ trước.", "ctx": "Trung tính, dùng khi nói về việc chuẩn bị trước."}, {"p": "basically", "vi": "về cơ bản", "ex": "Basically, it trains your immune system.", "exVi": "Về cơ bản, nó huấn luyện hệ miễn dịch của bạn.", "ctx": "Thân mật, dùng khi tóm tắt một ý phức tạp thành đơn giản."}, {"p": "worried about", "vi": "lo lắng về", "ex": "Are you worried about side effects?", "exVi": "Cậu có lo lắng về tác dụng phụ không?", "ctx": "Trung tính, dùng khi hỏi hoặc bày tỏ sự lo lắng."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "A vaccine teaches your immune system (1)___ it can fight the real germ later.", "o": ["so that", "because", "although"], "a": 0, "why": "'So that' diễn tả mục đích: để làm gì."}, {"t": "A vaccinated person can avoid getting sick (2)___ being exposed.", "o": ["even after", "even though", "despite of"], "a": 0, "why": "'Even after + V-ing' nhấn mạnh điều vẫn đúng sau một hành động."}, {"t": "Your body needs time to (3)___ with a new germ.", "o": ["catch up", "show up", "give up"], "a": 0, "why": "'Catch up with' nghĩa là bắt kịp, đuổi kịp."}, {"t": "These antibodies stay ready in case the real germ (4)___.", "o": ["show up", "shows up", "showed up"], "a": 1, "why": "Chủ ngữ số ít 'the real germ', hiện tại đơn thêm 's': shows up."}, {"t": "Some vaccines help (5)___ people around you too.", "o": ["protect", "protects", "protected"], "a": 0, "why": "Sau 'help' dùng động từ nguyên mẫu: protect."}, {"t": "Scientists agree that vaccines remain one of the most (6)___ tools in medicine.", "o": ["effective", "effect", "effectively"], "a": 0, "why": "Cần tính từ bổ nghĩa cho danh từ 'tools': effective."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Nora said the vaccine (1)___ your immune system to recognize a germ.", "o": ["teach", "teaches", "was teaching"], "a": 1, "why": "Sự thật khoa học vẫn đúng, giữ nguyên hiện tại đơn: teaches."}, {"t": "Lucas said he never (2)___ about it that way before.", "o": ["think", "thought", "had thought"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had thought."}, {"t": "Priya asked if he was worried (3)___ side effects.", "o": ["about", "of", "for"], "a": 0, "why": "Cụm cố định 'worried about'."}, {"t": "He said most side effects were (4)___, like a sore arm.", "o": ["mild", "milder", "mildest"], "a": 0, "why": "Tính từ mô tả mức độ nhẹ: mild."}, {"t": "Nora said a sore arm was a small price (5)___ pay.", "o": ["for", "to", "of"], "a": 1, "why": "Cụm cố định 'a small price to pay'."}, {"t": "They agreed to (6)___ notes after getting their shots.", "o": ["compare", "compares", "compared"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: compare."}]}]}, {"id": "B1-SPORTS-003", "topic": "SPORTS", "n": 3, "level": "B1", "title": "Preparing for a First Marathon", "titleVi": "Chuẩn bị cho lần chạy marathon đầu tiên", "passage": [{"en": "Every year, thousands of ordinary people decide to run their first marathon.", "vi": "Mỗi năm, hàng ngàn người bình thường quyết định chạy marathon lần đầu tiên."}, {"en": "For many of them, running more than a few kilometers once felt completely impossible.", "vi": "Với nhiều người trong số họ, chạy hơn vài cây số từng có vẻ hoàn toàn không thể."}, {"en": "A marathon is a race of about forty-two kilometers, which sounds intimidating to almost everyone at first.", "vi": "Marathon là một cuộc đua khoảng bốn mươi hai cây số, nghe có vẻ đáng sợ với hầu như tất cả mọi người lúc đầu."}, {"en": "The good news is that no one runs a marathon on their first day of training.", "vi": "Tin tốt là không ai chạy marathon ngay ngày đầu tiên luyện tập cả."}, {"en": "Most training plans last between three and six months, building distance slowly week by week.", "vi": "Hầu hết các kế hoạch luyện tập kéo dài từ ba đến sáu tháng, tăng dần quãng đường mỗi tuần."}, {"en": "A beginner might start by running just a few kilometers, three times a week.", "vi": "Người mới bắt đầu có thể chỉ chạy vài cây số, ba lần một tuần."}, {"en": "Over time, the body adapts, and those same kilometers start to feel much easier.", "vi": "Theo thời gian, cơ thể thích nghi, và đúng những cây số đó bắt đầu cảm thấy dễ dàng hơn nhiều."}, {"en": "One common mistake beginners make is increasing their distance too quickly.", "vi": "Một lỗi phổ biến người mới thường mắc là tăng quãng đường quá nhanh."}, {"en": "This can lead to injuries that force runners to stop training altogether.", "vi": "Điều này có thể dẫn đến chấn thương khiến người chạy phải ngừng luyện tập hoàn toàn."}, {"en": "Experienced runners usually recommend increasing weekly distance by no more than ten percent.", "vi": "Những người chạy có kinh nghiệm thường khuyên tăng quãng đường hằng tuần không quá mười phần trăm."}, {"en": "Rest days are just as important as training days, even though they can feel unproductive.", "vi": "Những ngày nghỉ quan trọng không kém gì những ngày luyện tập, dù chúng có thể cảm thấy như không làm được gì."}, {"en": "During rest, the muscles actually repair themselves and become stronger.", "vi": "Trong lúc nghỉ, cơ bắp thực sự tự phục hồi và trở nên khỏe hơn."}, {"en": "Nutrition also plays a bigger role than most beginners expect.", "vi": "Dinh dưỡng cũng đóng vai trò lớn hơn nhiều người mới nghĩ."}, {"en": "Eating enough carbohydrates gives the body the energy it needs for long runs.", "vi": "Ăn đủ tinh bột cung cấp cho cơ thể năng lượng cần thiết cho những buổi chạy dài."}, {"en": "On race day itself, many runners say the biggest challenge is actually mental, not physical.", "vi": "Vào chính ngày đua, nhiều người chạy nói rằng thử thách lớn nhất thực ra là tinh thần, không phải thể chất."}, {"en": "Crossing the finish line after months of preparation often becomes one of the proudest moments of a runner's life.", "vi": "Vượt qua vạch đích sau nhiều tháng chuẩn bị thường trở thành một trong những khoảnh khắc tự hào nhất trong đời một người chạy."}], "dialogue": [{"who": "Chris", "g": "m", "en": "I finally signed up for a marathon. I'm honestly a little terrified.", "vi": "Cuối cùng mình đã đăng ký chạy marathon. Thật lòng thì mình hơi sợ."}, {"who": "Rachel", "g": "f", "en": "That's exciting! Have you run long distances before?", "vi": "Thú vị đấy! Cậu đã từng chạy quãng đường dài chưa?"}, {"who": "Chris", "g": "m", "en": "Not really. My longest run ever was maybe five kilometers.", "vi": "Cũng không hẳn. Lần chạy dài nhất của mình có lẽ là năm cây số."}, {"who": "Rachel", "g": "f", "en": "That's a great starting point, actually. You have plenty of time to build up.", "vi": "Đó thực ra là một khởi đầu tốt đấy. Cậu có nhiều thời gian để tăng dần."}, {"who": "Chris", "g": "m", "en": "How much should I increase my distance each week?", "vi": "Mình nên tăng quãng đường mỗi tuần bao nhiêu vậy?"}, {"who": "Rachel", "g": "f", "en": "A common rule is no more than ten percent a week. Going too fast causes injuries.", "vi": "Một quy tắc phổ biến là không quá mười phần trăm mỗi tuần. Tăng quá nhanh sẽ gây chấn thương."}, {"who": "Chris", "g": "m", "en": "Good to know. I was planning to just run every single day.", "vi": "May mà biết trước. Mình định chạy mỗi ngày luôn đấy."}, {"who": "Rachel", "g": "f", "en": "Don't! Rest days matter just as much as training days.", "vi": "Đừng làm vậy! Những ngày nghỉ quan trọng không kém gì những ngày luyện tập đâu."}, {"who": "Chris", "g": "m", "en": "Really? I always thought resting was basically wasting time.", "vi": "Thật hả? Mình cứ nghĩ nghỉ ngơi cơ bản là lãng phí thời gian."}, {"who": "Rachel", "g": "f", "en": "Not at all. Your muscles actually repair and get stronger while you rest.", "vi": "Không hề. Cơ bắp thật sự phục hồi và khỏe hơn trong lúc bạn nghỉ."}, {"who": "Chris", "g": "m", "en": "That's surprising. What about food? Does that matter a lot too?", "vi": "Nghe bất ngờ đấy. Còn ăn uống thì sao? Cái đó có quan trọng nhiều không?"}, {"who": "Rachel", "g": "f", "en": "Definitely. You'll need plenty of carbs for energy on long runs.", "vi": "Chắc chắn rồi. Cậu sẽ cần nhiều tinh bột để có năng lượng cho những buổi chạy dài."}, {"who": "Chris", "g": "m", "en": "Okay, I have a lot to learn. Any tips for race day itself?", "vi": "Được rồi, mình còn phải học nhiều thứ. Có mẹo nào cho chính ngày đua không?"}, {"who": "Rachel", "g": "f", "en": "Honestly, the hardest part is usually mental, not physical.", "vi": "Thật lòng thì phần khó nhất thường là tinh thần, không phải thể chất."}, {"who": "Chris", "g": "m", "en": "That makes me feel a little better, actually.", "vi": "Nghe vậy thật sự khiến mình thấy đỡ hơn một chút."}, {"who": "Rachel", "g": "f", "en": "You've got this. Crossing that finish line will feel amazing.", "vi": "Cậu làm được mà. Vượt qua vạch đích sẽ cảm thấy tuyệt vời lắm đấy."}], "vocab": [{"w": "marathon", "f": ["marathon", "marathons"], "pos": "n", "ipa": "ˈmærəθɑːn", "vi": "cuộc đua marathon", "ex": "She trained for six months before her first marathon.", "exVi": "Cô ấy đã luyện tập sáu tháng trước lần chạy marathon đầu tiên."}, {"w": "distance", "f": ["distance", "distances"], "pos": "n", "ipa": "ˈdɪstəns", "vi": "quãng đường", "ex": "He increased his running distance slowly.", "exVi": "Anh ấy tăng quãng đường chạy của mình một cách từ từ."}, {"w": "injury", "f": ["injury", "injuries"], "pos": "n", "ipa": "ˈɪndʒəri", "vi": "chấn thương", "ex": "Running too much too fast can cause an injury.", "exVi": "Chạy quá nhiều quá nhanh có thể gây chấn thương."}, {"w": "beginner", "f": ["beginner", "beginners"], "pos": "n", "ipa": "bɪˈɡɪnər", "vi": "người mới bắt đầu", "ex": "This training plan is designed for beginners.", "exVi": "Kế hoạch luyện tập này được thiết kế cho người mới bắt đầu."}, {"w": "adapt", "f": ["adapt", "adapts", "adapted", "adapting"], "pos": "v", "ipa": "əˈdæpt", "vi": "thích nghi", "ex": "The body adapts to regular exercise over time.", "exVi": "Cơ thể thích nghi với việc tập luyện đều đặn theo thời gian."}, {"w": "muscle", "f": ["muscle", "muscles"], "pos": "n", "ipa": "ˈmʌsl", "vi": "cơ bắp", "ex": "Muscles need rest to become stronger.", "exVi": "Cơ bắp cần nghỉ ngơi để trở nên khỏe hơn."}, {"w": "nutrition", "f": ["nutrition"], "pos": "n", "ipa": "nuːˈtrɪʃən", "vi": "dinh dưỡng", "ex": "Good nutrition supports your training.", "exVi": "Dinh dưỡng tốt hỗ trợ việc luyện tập của bạn."}, {"w": "carbohydrate", "f": ["carbohydrate", "carbohydrates"], "pos": "n", "ipa": "ˌkɑːrboʊˈhaɪdreɪt", "vi": "tinh bột, carbohydrate", "ex": "Runners eat extra carbohydrates before a race.", "exVi": "Người chạy ăn thêm tinh bột trước một cuộc đua."}, {"w": "finish line", "f": ["finish line"], "pos": "n", "ipa": "ˈfɪnɪʃ laɪn", "vi": "vạch đích", "ex": "Crossing the finish line felt incredible.", "exVi": "Vượt qua vạch đích cảm thấy thật tuyệt vời."}, {"w": "mental", "f": ["mental"], "pos": "adj", "ipa": "ˈmentl", "vi": "thuộc về tinh thần", "ex": "The biggest challenge was mental, not physical.", "exVi": "Thử thách lớn nhất là về tinh thần, không phải thể chất."}], "grammar": [{"title": "No more than (không quá)", "formula": "no more than + số lượng", "use": "Dùng để đặt giới hạn tối đa cho một số lượng. Rất phổ biến khi đưa ra hướng dẫn hoặc lời khuyên có con số cụ thể.", "examples": [{"en": "Increase your distance by no more than ten percent a week.", "vi": "Tăng quãng đường của bạn không quá mười phần trăm mỗi tuần."}, {"en": "You should eat no more than two cups of coffee a day.", "vi": "Bạn không nên uống quá hai ly cà phê một ngày."}, {"en": "The trip should take no more than three hours.", "vi": "Chuyến đi không nên mất quá ba tiếng."}]}, {"title": "Just as + tính từ + as (so sánh ngang bằng, nhấn mạnh)", "formula": "S + tobe + just as + adj + as + noun", "use": "Dùng để nhấn mạnh rằng hai điều quan trọng/tốt ngang nhau, mạnh hơn cách nói 'as...as' thông thường.", "examples": [{"en": "Rest days are just as important as training days.", "vi": "Những ngày nghỉ quan trọng không kém gì những ngày luyện tập."}, {"en": "This restaurant is just as good as the one downtown.", "vi": "Nhà hàng này ngon không kém gì cái ở trung tâm."}, {"en": "Sleep is just as important as diet for your health.", "vi": "Giấc ngủ quan trọng không kém chế độ ăn đối với sức khỏe của bạn."}]}], "phrases": [{"p": "sign up for", "vi": "đăng ký tham gia", "ex": "I signed up for my first marathon last week.", "exVi": "Tuần trước mình đã đăng ký chạy marathon đầu tiên.", "ctx": "Trung tính, dùng khi đăng ký một hoạt động hoặc sự kiện."}, {"p": "build up", "vi": "tăng dần, xây dựng dần", "ex": "You need time to build up your distance.", "exVi": "Bạn cần thời gian để tăng dần quãng đường của mình.", "ctx": "Trung tính, dùng khi nói về việc phát triển từ từ."}, {"p": "good to know", "vi": "may mà biết trước, tốt là biết được điều đó", "ex": "Good to know, I almost trained wrong.", "exVi": "May mà biết trước, mình suýt luyện tập sai cách rồi.", "ctx": "Thân mật, dùng khi vừa học được thông tin hữu ích."}, {"p": "not at all", "vi": "hoàn toàn không", "ex": "Is resting a waste of time? Not at all.", "exVi": "Nghỉ ngơi có lãng phí thời gian không? Hoàn toàn không.", "ctx": "Trung tính, dùng để phủ định mạnh mẽ."}, {"p": "a starting point", "vi": "một điểm khởi đầu", "ex": "Five kilometers is a great starting point.", "exVi": "Năm cây số là một điểm khởi đầu tuyệt vời.", "ctx": "Trung tính, dùng khi đánh giá một khởi đầu."}, {"p": "you've got this", "vi": "cậu làm được mà", "ex": "Don't worry about race day, you've got this.", "exVi": "Đừng lo về ngày đua, cậu làm được mà.", "ctx": "Thân mật, dùng để động viên ai đó."}, {"p": "a waste of time", "vi": "lãng phí thời gian", "ex": "I used to think stretching was a waste of time.", "exVi": "Mình từng nghĩ giãn cơ là lãng phí thời gian.", "ctx": "Thân mật, dùng khi nói về việc gì đó tưởng chừng vô ích."}, {"p": "plenty of", "vi": "nhiều, dư dả", "ex": "You'll need plenty of carbs before a long run.", "exVi": "Bạn sẽ cần nhiều tinh bột trước một buổi chạy dài.", "ctx": "Trung tính, dùng để nhấn mạnh số lượng dồi dào."}, {"p": "feel a little better", "vi": "cảm thấy đỡ hơn một chút", "ex": "Knowing that makes me feel a little better.", "exVi": "Biết được điều đó khiến mình thấy đỡ hơn một chút.", "ctx": "Thân mật, dùng khi tâm trạng cải thiện nhẹ."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "You should increase your distance by (1)___ than ten percent a week.", "o": ["no more", "not more", "no most"], "a": 0, "why": "Cụm cố định 'no more than' nghĩa là không quá."}, {"t": "Rest days are (2)___ as important as training days.", "o": ["just", "so", "very"], "a": 0, "why": "Cấu trúc 'just as...as' nhấn mạnh sự ngang bằng."}, {"t": "Muscles need rest to (3)___ stronger.", "o": ["become", "becomes", "became"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: become."}, {"t": "Eating enough carbs (4)___ your body energy for long runs.", "o": ["give", "gives", "gave"], "a": 1, "why": "Chủ ngữ số ít (danh động từ), hiện tại đơn thêm 's': gives."}, {"t": "Many runners say the biggest challenge is (5)___, not physical.", "o": ["mental", "mind", "mentally"], "a": 0, "why": "Tính từ 'mental' bổ nghĩa song song với 'physical'."}, {"t": "Crossing the finish line becomes one of the (6)___ moments of a runner's life.", "o": ["proud", "prouder", "proudest"], "a": 2, "why": "So sánh nhất: proudest (một trong những khoảnh khắc tự hào nhất)."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Rachel said Chris (1)___ a great starting point.", "o": ["have", "has", "had"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: had."}, {"t": "She warned that going too fast (2)___ injuries.", "o": ["cause", "causes", "would cause"], "a": 1, "why": "Sự thật chung vẫn đúng, giữ nguyên hiện tại đơn: causes."}, {"t": "Chris admitted he (3)___ resting was a waste of time.", "o": ["think", "thinks", "had thought"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had thought."}, {"t": "Rachel told him muscles repair themselves while he (4)___.", "o": ["rest", "rests", "rested"], "a": 1, "why": "Sự thật khoa học vẫn giữ hiện tại đơn với chủ ngữ số ít 'he': rests."}, {"t": "She said the hardest part was usually (5)___, not physical.", "o": ["mental", "mentally", "mind"], "a": 0, "why": "Tính từ 'mental' được dùng để mô tả loại thử thách."}, {"t": "Chris said that made him feel a little (6)___.", "o": ["good", "well", "better"], "a": 2, "why": "So sánh hơn 'better' vì đang so sánh với trạng thái lo lắng trước đó."}]}]}, {"id": "B1-PHRASES-003", "topic": "PHRASES", "n": 3, "level": "B1", "title": "Phrases for Giving Opinions", "titleVi": "Cụm từ để nêu ý kiến", "passage": [{"en": "Sharing your opinion clearly is one of the most useful skills in everyday English.", "vi": "Nêu ý kiến một cách rõ ràng là một trong những kỹ năng hữu ích nhất trong tiếng Anh hằng ngày."}, {"en": "Native speakers rarely just say 'I think' over and over; they use many different phrases to sound natural.", "vi": "Người bản xứ hiếm khi chỉ nói 'I think' lặp đi lặp lại; họ dùng nhiều cụm từ khác nhau để nghe tự nhiên hơn."}, {"en": "Some phrases are strong and direct, while others are soft and polite.", "vi": "Một số cụm từ mạnh mẽ và trực tiếp, trong khi những cụm khác lại nhẹ nhàng và lịch sự."}, {"en": "Choosing the right one depends on the situation and who you're talking to.", "vi": "Chọn đúng cụm từ nào phụ thuộc vào tình huống và bạn đang nói chuyện với ai."}, {"en": "For example, 'In my opinion' is common, clear, and works in almost any conversation.", "vi": "Ví dụ, 'In my opinion' rất phổ biến, rõ ràng, và dùng được trong hầu hết mọi cuộc trò chuyện."}, {"en": "If you want to sound more confident, you might say 'I'm convinced that' or 'I strongly believe'.", "vi": "Nếu muốn nghe tự tin hơn, bạn có thể nói 'I'm convinced that' hoặc 'I strongly believe'."}, {"en": "But if you're not completely sure, softer phrases like 'I'd say' or 'It seems to me' work better.", "vi": "Nhưng nếu bạn không hoàn toàn chắc chắn, những cụm nhẹ nhàng hơn như 'I'd say' hoặc 'It seems to me' sẽ phù hợp hơn."}, {"en": "These softer phrases leave room for other people to disagree without feeling attacked.", "vi": "Những cụm từ nhẹ nhàng này để lại khoảng trống cho người khác không đồng ý mà không cảm thấy bị công kích."}, {"en": "When you want to agree with someone, you can say 'I couldn't agree more' for strong agreement.", "vi": "Khi bạn muốn đồng ý với ai đó, bạn có thể nói 'I couldn't agree more' để thể hiện sự đồng tình mạnh mẽ."}, {"en": "For partial agreement, try 'I see your point, but' before adding your own idea.", "vi": "Để đồng ý một phần, hãy thử nói 'I see your point, but' trước khi thêm ý kiến của riêng bạn."}, {"en": "Disagreeing politely is a skill too; simply saying 'you're wrong' can sound rude in English.", "vi": "Không đồng ý một cách lịch sự cũng là một kỹ năng; chỉ nói 'you're wrong' có thể nghe thô lỗ trong tiếng Anh."}, {"en": "Instead, native speakers often say 'I see it a bit differently' or 'I'm not so sure about that'.", "vi": "Thay vào đó, người bản xứ thường nói 'I see it a bit differently' hoặc 'I'm not so sure about that'."}, {"en": "These phrases disagree without closing the conversation.", "vi": "Những cụm từ này không đồng ý mà không khép lại cuộc trò chuyện."}, {"en": "Practicing these phrases in real conversations, even simple ones, helps them become automatic.", "vi": "Luyện tập những cụm từ này trong các cuộc trò chuyện thực tế, dù đơn giản, giúp chúng trở nên tự động."}, {"en": "Over time, switching between them naturally becomes a habit rather than something you have to think about.", "vi": "Theo thời gian, việc chuyển đổi giữa chúng một cách tự nhiên trở thành thói quen thay vì điều bạn phải suy nghĩ."}, {"en": "That's exactly what makes a conversation feel smooth instead of robotic.", "vi": "Đó chính xác là điều khiến một cuộc trò chuyện trở nên trôi chảy thay vì cứng nhắc."}], "dialogue": [{"who": "Mia", "g": "f", "en": "What do you think about working from home full-time?", "vi": "Cậu nghĩ sao về việc làm việc tại nhà toàn thời gian?"}, {"who": "Daniel", "g": "m", "en": "In my opinion, it depends a lot on the person's personality.", "vi": "Theo ý mình, nó phụ thuộc rất nhiều vào tính cách của mỗi người."}, {"who": "Mia", "g": "f", "en": "I'd say I'm not so sure about that. I think most people struggle with it.", "vi": "Mình thì mình không chắc lắm về điều đó. Mình nghĩ hầu hết mọi người gặp khó khăn với nó."}, {"who": "Daniel", "g": "m", "en": "I see your point, but some people are actually more productive at home.", "vi": "Mình hiểu ý cậu, nhưng thật ra một số người làm việc hiệu quả hơn khi ở nhà."}, {"who": "Priya", "g": "f", "en": "I couldn't agree more with Daniel. I get so much more done without office noise.", "vi": "Mình hoàn toàn đồng ý với Daniel. Mình làm được nhiều việc hơn hẳn khi không có tiếng ồn văn phòng."}, {"who": "Mia", "g": "f", "en": "That's fair. I guess it really is different for everyone.", "vi": "Công bằng mà nói thì đúng vậy. Mình nghĩ đúng là mỗi người mỗi khác."}, {"who": "Daniel", "g": "m", "en": "Exactly. I'm convinced that flexibility matters more than location.", "vi": "Chính xác. Mình tin chắc rằng sự linh hoạt quan trọng hơn địa điểm."}, {"who": "Priya", "g": "f", "en": "It seems to me that companies are slowly realizing that too.", "vi": "Mình thấy có vẻ các công ty cũng đang dần nhận ra điều đó."}, {"who": "Mia", "g": "f", "en": "I see it a bit differently, honestly. I think many still prefer the office.", "vi": "Thật lòng thì mình thấy hơi khác một chút. Mình nghĩ nhiều người vẫn thích ở văn phòng hơn."}, {"who": "Daniel", "g": "m", "en": "That's a fair point too. There's no single right answer here.", "vi": "Đó cũng là một điểm hợp lý. Ở đây không có câu trả lời đúng duy nhất."}, {"who": "Priya", "g": "f", "en": "I strongly believe it'll keep changing as technology improves.", "vi": "Mình tin chắc rằng nó sẽ tiếp tục thay đổi khi công nghệ phát triển hơn."}, {"who": "Mia", "g": "f", "en": "Probably true. We'll just have to see how it goes.", "vi": "Có lẽ đúng vậy. Chúng ta sẽ phải chờ xem mọi thứ diễn ra thế nào thôi."}, {"who": "Daniel", "g": "m", "en": "Anyway, I like how we all had different opinions here.", "vi": "Dù sao thì mình thích cách tất cả chúng ta có những ý kiến khác nhau ở đây."}, {"who": "Priya", "g": "f", "en": "Me too. It's more interesting than everyone just agreeing.", "vi": "Mình cũng vậy. Nó thú vị hơn nhiều so với việc ai cũng đồng ý hết."}, {"who": "Mia", "g": "f", "en": "True. Good conversations need a bit of disagreement sometimes.", "vi": "Đúng vậy. Những cuộc trò chuyện hay đôi khi cần một chút bất đồng."}, {"who": "Daniel", "g": "m", "en": "Couldn't agree more on that one.", "vi": "Về điểm đó thì mình hoàn toàn đồng ý."}], "vocab": [{"w": "opinion", "f": ["opinion", "opinions"], "pos": "n", "ipa": "əˈpɪnjən", "vi": "ý kiến, quan điểm", "ex": "Everyone has a different opinion on this topic.", "exVi": "Mọi người đều có ý kiến khác nhau về chủ đề này."}, {"w": "convinced", "f": ["convinced"], "pos": "adj", "ipa": "kənˈvɪnst", "vi": "tin chắc, bị thuyết phục", "ex": "I'm convinced that this plan will work.", "exVi": "Mình tin chắc rằng kế hoạch này sẽ hiệu quả."}, {"w": "agree", "f": ["agree", "agrees", "agreed", "agreeing"], "pos": "v", "ipa": "əˈɡriː", "vi": "đồng ý", "ex": "I agree with most of what you said.", "exVi": "Mình đồng ý với hầu hết những gì cậu nói."}, {"w": "disagree", "f": ["disagree", "disagrees", "disagreed", "disagreeing"], "pos": "v", "ipa": "ˌdɪsəˈɡriː", "vi": "không đồng ý", "ex": "She politely disagreed with his plan.", "exVi": "Cô ấy lịch sự không đồng ý với kế hoạch của anh ấy."}, {"w": "point", "f": ["point", "points"], "pos": "n", "ipa": "pɔɪnt", "vi": "luận điểm, ý kiến", "ex": "That's a really good point.", "exVi": "Đó thực sự là một luận điểm rất hay."}, {"w": "rude", "f": ["rude"], "pos": "adj", "ipa": "ruːd", "vi": "thô lỗ", "ex": "Interrupting someone can seem rude.", "exVi": "Ngắt lời ai đó có thể trông thô lỗ."}, {"w": "polite", "f": ["polite"], "pos": "adj", "ipa": "pəˈlaɪt", "vi": "lịch sự", "ex": "She gave a polite but firm answer.", "exVi": "Cô ấy đưa ra câu trả lời lịch sự nhưng kiên quyết."}, {"w": "productive", "f": ["productive"], "pos": "adj", "ipa": "prəˈdʌktɪv", "vi": "hiệu quả, năng suất", "ex": "He's more productive in the morning.", "exVi": "Anh ấy làm việc hiệu quả hơn vào buổi sáng."}, {"w": "flexibility", "f": ["flexibility"], "pos": "n", "ipa": "ˌfleksəˈbɪləti", "vi": "sự linh hoạt", "ex": "Flexibility is important in a remote job.", "exVi": "Sự linh hoạt rất quan trọng trong công việc từ xa."}, {"w": "honestly", "f": ["honestly"], "pos": "adv", "ipa": "ˈɑːnɪstli", "vi": "thành thật mà nói", "ex": "Honestly, I'm not sure what to choose.", "exVi": "Thành thật mà nói, mình không chắc nên chọn gì."}], "grammar": [{"title": "I'd say... (cách nói giảm nhẹ ý kiến)", "formula": "I'd say + mệnh đề", "use": "Viết tắt của 'I would say', dùng để đưa ra ý kiến một cách nhẹ nhàng, ít chắc chắn hơn 'I think'. Rất phổ biến trong văn nói tự nhiên.", "examples": [{"en": "I'd say it's one of the best restaurants in town.", "vi": "Mình thì nghĩ đó là một trong những nhà hàng ngon nhất thành phố."}, {"en": "I'd say we should wait a little longer.", "vi": "Mình thì nghĩ chúng ta nên chờ thêm một chút."}, {"en": "I'd say he's right about this one.", "vi": "Mình thì nghĩ anh ấy đúng về việc này."}]}, {"title": "But + ý kiến đối lập (phản đối nhẹ nhàng)", "formula": "I see your point, but + mệnh đề", "use": "Dùng để thừa nhận ý kiến người khác trước khi đưa ra ý kiến khác, giúp cuộc trò chuyện lịch sự và không gây căng thẳng.", "examples": [{"en": "I see your point, but I still prefer the office.", "vi": "Mình hiểu ý cậu, nhưng mình vẫn thích văn phòng hơn."}, {"en": "That's true, but there are other factors too.", "vi": "Đúng vậy, nhưng còn những yếu tố khác nữa."}, {"en": "I understand, but I think we need more time.", "vi": "Mình hiểu, nhưng mình nghĩ chúng ta cần thêm thời gian."}]}], "phrases": [{"p": "in my opinion", "vi": "theo ý kiến của tôi", "ex": "In my opinion, this is the best option.", "exVi": "Theo ý kiến của mình, đây là lựa chọn tốt nhất.", "ctx": "Trung tính, dùng để mở đầu khi nêu ý kiến trong mọi tình huống."}, {"p": "I couldn't agree more", "vi": "tôi hoàn toàn đồng ý", "ex": "I couldn't agree more with your decision.", "exVi": "Mình hoàn toàn đồng ý với quyết định của cậu.", "ctx": "Thân mật, dùng để thể hiện sự đồng tình mạnh mẽ."}, {"p": "I see your point", "vi": "tôi hiểu ý bạn", "ex": "I see your point, but I disagree a little.", "exVi": "Mình hiểu ý cậu, nhưng mình hơi không đồng ý.", "ctx": "Trung tính, dùng trước khi đưa ra ý kiến trái chiều một cách lịch sự."}, {"p": "it seems to me", "vi": "tôi thấy có vẻ như", "ex": "It seems to me that things are improving.", "exVi": "Mình thấy có vẻ như mọi thứ đang cải thiện.", "ctx": "Trung tính, dùng khi đưa ra nhận định không hoàn toàn chắc chắn."}, {"p": "I'm not so sure about that", "vi": "tôi không chắc lắm về điều đó", "ex": "I'm not so sure about that plan.", "exVi": "Mình không chắc lắm về kế hoạch đó.", "ctx": "Thân mật, dùng khi nghi ngờ nhẹ nhàng mà không phủ nhận hoàn toàn."}, {"p": "that's a fair point", "vi": "đó là một điểm hợp lý", "ex": "That's a fair point, I hadn't thought of that.", "exVi": "Đó là một điểm hợp lý, mình chưa nghĩ tới điều đó.", "ctx": "Thân mật, dùng để công nhận ý kiến người khác dù mình không hoàn toàn đồng ý."}, {"p": "I see it a bit differently", "vi": "tôi thấy hơi khác một chút", "ex": "I see it a bit differently than you do.", "exVi": "Mình thấy hơi khác một chút so với cậu.", "ctx": "Trung tính, cách phản đối nhẹ nhàng, lịch sự."}, {"p": "there's no single right answer", "vi": "không có câu trả lời đúng duy nhất", "ex": "There's no single right answer to this question.", "exVi": "Không có câu trả lời đúng duy nhất cho câu hỏi này.", "ctx": "Trung tính, dùng khi kết thúc một cuộc tranh luận ôn hòa."}, {"p": "we'll have to see", "vi": "chúng ta sẽ phải chờ xem", "ex": "We'll have to see how things turn out.", "exVi": "Chúng ta sẽ phải chờ xem mọi việc diễn ra thế nào.", "ctx": "Thân mật, dùng khi chưa chắc chắn về kết quả tương lai."}, {"p": "probably true", "vi": "có lẽ đúng vậy", "ex": "Probably true, but I'd still check it myself.", "exVi": "Có lẽ đúng vậy, nhưng mình vẫn sẽ tự kiểm tra lại.", "ctx": "Thân mật, dùng khi đồng ý một phần mà không khẳng định chắc chắn."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "'In my (1)___' is common and works in almost any conversation.", "o": ["opinion", "point", "agree"], "a": 0, "why": "Cụm cố định 'in my opinion' nghĩa là theo ý kiến của tôi."}, {"t": "If you're not completely sure, softer phrases like 'I'd say' work (2)___.", "o": ["better", "best", "good"], "a": 0, "why": "So sánh hơn 'better' phù hợp khi so sánh với cách nói mạnh hơn."}, {"t": "'I couldn't agree (3)___' shows strong agreement.", "o": ["more", "most", "much"], "a": 0, "why": "Cụm cố định 'couldn't agree more' nghĩa là hoàn toàn đồng ý."}, {"t": "Simply saying 'you're wrong' can (4)___ rude in English.", "o": ["sound", "sounds", "sounded"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: sound."}, {"t": "These phrases disagree (5)___ closing the conversation.", "o": ["without", "with", "for"], "a": 0, "why": "'Without + V-ing' nghĩa là mà không làm gì."}, {"t": "Practicing these phrases helps them become (6)___.", "o": ["automatic", "automatically", "automation"], "a": 0, "why": "Cần tính từ bổ nghĩa cho 'become': automatic."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Mia asked Daniel what he (1)___ about working from home.", "o": ["think", "thought", "thinks"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: thought."}, {"t": "Daniel said it (2)___ a lot on personality.", "o": ["depend", "depends", "depended"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn: depends."}, {"t": "Priya said she (3)___ agree more with Daniel.", "o": ["couldn't", "can't", "didn't"], "a": 0, "why": "Giữ nguyên 'couldn't' trong câu tường thuật vì đây là cụm cố định diễn tả mức độ."}, {"t": "Mia admitted she saw it a bit (4)___.", "o": ["different", "differently", "difference"], "a": 1, "why": "Trạng từ bổ nghĩa cho động từ 'see': differently."}, {"t": "Daniel said that was a fair (5)___ too.", "o": ["point", "points", "pointed"], "a": 0, "why": "Danh từ số ít 'point' sau mạo từ 'a fair'."}, {"t": "Priya said she strongly (6)___ it would keep changing.", "o": ["believe", "believes", "believed"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: believed."}]}]}, {"id": "B1-DAILY-004", "topic": "DAILY", "n": 4, "level": "B1", "title": "Packing for a Trip the Smart Way", "titleVi": "Xếp đồ đi du lịch một cách thông minh", "passage": [{"en": "Packing for a trip sounds simple, but many people end up stressed the night before leaving.", "vi": "Xếp đồ đi du lịch nghe có vẻ đơn giản, nhưng nhiều người lại căng thẳng vào đêm trước khi đi."}, {"en": "The biggest mistake is starting too late, usually just hours before the flight or bus.", "vi": "Lỗi lớn nhất là bắt đầu quá trễ, thường chỉ vài tiếng trước chuyến bay hoặc xe buýt."}, {"en": "Experienced travelers usually start packing at least one or two days in advance.", "vi": "Những người đi du lịch có kinh nghiệm thường bắt đầu xếp đồ ít nhất một hoặc hai ngày trước."}, {"en": "This gives them time to realize what's missing without rushing to the store at midnight.", "vi": "Điều này cho họ thời gian nhận ra thứ gì còn thiếu mà không phải vội vàng chạy ra cửa hàng lúc nửa đêm."}, {"en": "A simple packing list makes the whole process much easier and less stressful.", "vi": "Một danh sách đồ cần mang đơn giản khiến cả quá trình dễ dàng và bớt căng thẳng hơn nhiều."}, {"en": "Many travelers divide their list into categories, such as clothes, documents, and electronics.", "vi": "Nhiều người đi du lịch chia danh sách thành các nhóm, như quần áo, giấy tờ, và thiết bị điện tử."}, {"en": "Rolling clothes instead of folding them is a popular trick that saves a lot of space.", "vi": "Cuộn quần áo thay vì gấp chúng là một mẹo phổ biến giúp tiết kiệm rất nhiều chỗ trống."}, {"en": "It's also smart to wear your bulkiest item, like a jacket, instead of packing it.", "vi": "Việc mặc món đồ cồng kềnh nhất, như áo khoác, thay vì xếp nó vào vali cũng là một cách thông minh."}, {"en": "Important documents, such as passports and tickets, should always go in your carry-on bag.", "vi": "Các giấy tờ quan trọng, như hộ chiếu và vé, nên luôn để trong túi xách tay."}, {"en": "Losing these in checked luggage can turn a simple trip into a real nightmare.", "vi": "Việc làm mất chúng trong hành lý ký gửi có thể biến một chuyến đi đơn giản thành cơn ác mộng thực sự."}, {"en": "Another common tip is to pack a small first-aid kit with basic medicine.", "vi": "Một mẹo phổ biến khác là mang theo một túi sơ cứu nhỏ với thuốc cơ bản."}, {"en": "You never know when a headache or small injury might ruin an otherwise perfect day.", "vi": "Bạn không bao giờ biết khi nào một cơn đau đầu hay chấn thương nhỏ có thể làm hỏng một ngày vốn hoàn hảo."}, {"en": "Leaving some empty space in your suitcase is also a good habit, especially for souvenirs.", "vi": "Chừa lại một chút không gian trống trong vali cũng là thói quen tốt, đặc biệt là để mua đồ lưu niệm."}, {"en": "Many travelers forget this and end up struggling to zip their bag on the way home.", "vi": "Nhiều người đi du lịch quên điều này và cuối cùng phải vật lộn để kéo khóa vali trên đường về."}, {"en": "In the end, good packing isn't about bringing everything you own.", "vi": "Cuối cùng, xếp đồ tốt không phải là mang theo mọi thứ bạn sở hữu."}, {"en": "It's about bringing exactly what you need, with just enough room to breathe.", "vi": "Đó là việc mang theo chính xác những gì bạn cần, với vừa đủ khoảng trống để thoải mái."}], "dialogue": [{"who": "Ethan", "g": "m", "en": "My flight is tomorrow morning and I haven't packed anything yet.", "vi": "Chuyến bay của mình là sáng mai mà mình vẫn chưa xếp gì cả."}, {"who": "Sofia", "g": "f", "en": "Seriously? You should have started at least a day ago.", "vi": "Thật hả? Cậu nên bắt đầu từ ít nhất một ngày trước rồi."}, {"who": "Ethan", "g": "m", "en": "I know, I know. Any quick tips to make this faster?", "vi": "Mình biết, mình biết. Có mẹo nào nhanh giúp mình xong việc này không?"}, {"who": "Sofia", "g": "f", "en": "Make a simple list first. Clothes, documents, electronics, done.", "vi": "Lập một danh sách đơn giản trước đã. Quần áo, giấy tờ, thiết bị điện tử, xong."}, {"who": "Ethan", "g": "m", "en": "Good idea. Should I fold or roll my clothes?", "vi": "Ý hay đấy. Mình nên gấp hay cuộn quần áo vậy?"}, {"who": "Sofia", "g": "f", "en": "Definitely roll them. It saves so much space in your suitcase.", "vi": "Chắc chắn là cuộn. Nó tiết kiệm được rất nhiều chỗ trong vali."}, {"who": "Ethan", "g": "m", "en": "Got it. What about my passport and ticket?", "vi": "Được rồi. Còn hộ chiếu và vé thì sao?"}, {"who": "Sofia", "g": "f", "en": "Those always go in your carry-on, never in checked luggage.", "vi": "Những thứ đó luôn để trong túi xách tay, không bao giờ cho vào hành lý ký gửi."}, {"who": "Ethan", "g": "m", "en": "Right, I almost forgot that last time and panicked at the airport.", "vi": "Đúng rồi, lần trước mình suýt quên và hoảng loạn ở sân bay."}, {"who": "Sofia", "g": "f", "en": "Exactly why you plan ahead this time. Did you pack a first-aid kit?", "vi": "Chính vì vậy nên lần này cậu hãy lên kế hoạch trước. Cậu có mang túi sơ cứu không?"}, {"who": "Ethan", "g": "m", "en": "No, honestly I didn't even think about that.", "vi": "Không, thật lòng mình còn chưa nghĩ tới cái đó."}, {"who": "Sofia", "g": "f", "en": "Add some basic medicine, just in case something happens.", "vi": "Thêm vài loại thuốc cơ bản vào, phòng khi có chuyện gì xảy ra."}, {"who": "Ethan", "g": "m", "en": "Will do. Last question, should I pack my suitcase completely full?", "vi": "Mình sẽ làm vậy. Câu hỏi cuối, mình có nên xếp vali đầy kín không?"}, {"who": "Sofia", "g": "f", "en": "No, leave some space for souvenirs. Trust me on this one.", "vi": "Không, chừa lại một chút chỗ để mua đồ lưu niệm. Tin mình đi."}, {"who": "Ethan", "g": "m", "en": "Thanks, Sofia. I think I can actually finish this tonight now.", "vi": "Cảm ơn Sofia. Giờ mình nghĩ mình thực sự có thể xong việc này tối nay."}, {"who": "Sofia", "g": "f", "en": "See? It's not so bad once you have a plan.", "vi": "Thấy chưa? Không tệ lắm khi cậu có một kế hoạch."}], "vocab": [{"w": "pack", "f": ["pack", "packs", "packed", "packing"], "pos": "v", "ipa": "pæk", "vi": "xếp đồ, đóng gói", "ex": "She packed her suitcase the night before.", "exVi": "Cô ấy xếp vali vào đêm hôm trước."}, {"w": "suitcase", "f": ["suitcase", "suitcases"], "pos": "n", "ipa": "ˈsuːtkeɪs", "vi": "vali", "ex": "His suitcase was too heavy to lift.", "exVi": "Vali của anh ấy nặng quá không nhấc nổi."}, {"w": "carry-on", "f": ["carry-on"], "pos": "n", "ipa": "ˈkæri ɑːn", "vi": "túi xách tay (mang lên máy bay)", "ex": "Keep your passport in your carry-on.", "exVi": "Giữ hộ chiếu của bạn trong túi xách tay."}, {"w": "luggage", "f": ["luggage"], "pos": "n", "ipa": "ˈlʌɡɪdʒ", "vi": "hành lý", "ex": "Our luggage arrived late at the airport.", "exVi": "Hành lý của chúng tôi đến sân bay muộn."}, {"w": "document", "f": ["document", "documents"], "pos": "n", "ipa": "ˈdɑːkjəmənt", "vi": "giấy tờ, tài liệu", "ex": "Keep your travel documents in one folder.", "exVi": "Giữ giấy tờ du lịch của bạn trong một tập hồ sơ."}, {"w": "souvenir", "f": ["souvenir", "souvenirs"], "pos": "n", "ipa": "ˌsuːvəˈnɪr", "vi": "đồ lưu niệm", "ex": "I bought a small souvenir for my sister.", "exVi": "Mình đã mua một món đồ lưu niệm nhỏ cho chị gái."}, {"w": "bulky", "f": ["bulky"], "pos": "adj", "ipa": "ˈbʌlki", "vi": "cồng kềnh", "ex": "A winter coat is quite bulky to pack.", "exVi": "Áo khoác mùa đông khá cồng kềnh khi xếp vào vali."}, {"w": "panic", "f": ["panic", "panics", "panicked", "panicking"], "pos": "v", "ipa": "ˈpænɪk", "vi": "hoảng loạn", "ex": "Don't panic, we still have plenty of time.", "exVi": "Đừng hoảng loạn, chúng ta vẫn còn nhiều thời gian."}, {"w": "first-aid kit", "f": ["first-aid kit"], "pos": "n", "ipa": "fɜːrst eɪd kɪt", "vi": "túi sơ cứu", "ex": "Always travel with a small first-aid kit.", "exVi": "Luôn mang theo một túi sơ cứu nhỏ khi đi du lịch."}, {"w": "in advance", "f": ["in advance"], "pos": "adv", "ipa": "ɪn ədˈvæns", "vi": "trước, từ trước", "ex": "Book your hotel in advance to save money.", "exVi": "Đặt khách sạn trước để tiết kiệm tiền."}], "grammar": [{"title": "Should have + V3 (đáng lẽ nên làm gì)", "formula": "S + should have + V3/ed", "use": "Dùng để diễn tả một việc đáng lẽ nên làm trong quá khứ nhưng đã không làm, thường kèm theo sự hối tiếc hoặc lời trách nhẹ.", "examples": [{"en": "You should have started packing a day ago.", "vi": "Đáng lẽ cậu nên bắt đầu xếp đồ từ một ngày trước."}, {"en": "I should have brought a jacket, it's freezing here.", "vi": "Đáng lẽ mình nên mang áo khoác theo, ở đây lạnh quá."}, {"en": "We should have booked tickets earlier.", "vi": "Đáng lẽ chúng ta nên đặt vé sớm hơn."}]}, {"title": "Just in case (phòng khi, đề phòng)", "formula": "mệnh đề, just in case + mệnh đề", "use": "Dùng để nói về một hành động được thực hiện để đề phòng một tình huống có thể xảy ra, không chắc chắn nhưng vẫn chuẩn bị trước.", "examples": [{"en": "Bring some medicine, just in case you get a headache.", "vi": "Mang theo vài viên thuốc, phòng khi bạn bị đau đầu."}, {"en": "I packed an umbrella just in case it rains.", "vi": "Mình đã mang theo dù, phòng khi trời mưa."}, {"en": "Save the document twice, just in case one file gets lost.", "vi": "Lưu tài liệu hai lần, phòng khi một tệp bị mất."}]}], "phrases": [{"p": "end up + V-ing", "vi": "cuối cùng lại, rốt cuộc lại", "ex": "They end up stressed the night before leaving.", "exVi": "Họ cuối cùng lại căng thẳng vào đêm trước khi đi.", "ctx": "Trung tính, dùng khi nói về kết quả không mong muốn."}, {"p": "just in case", "vi": "phòng khi, để đề phòng", "ex": "Pack an extra shirt, just in case.", "exVi": "Mang thêm một chiếc áo, để đề phòng.", "ctx": "Thân mật, dùng khi chuẩn bị cho tình huống bất ngờ."}, {"p": "trust me on this one", "vi": "tin tôi về điều này đi", "ex": "Leave some space in your bag, trust me on this one.", "exVi": "Chừa chút chỗ trong túi đi, tin mình về điều này đi.", "ctx": "Thân mật, dùng khi khuyên ai đó dựa trên kinh nghiệm."}, {"p": "got it", "vi": "hiểu rồi, được rồi", "ex": "Got it, I'll pack my passport in my carry-on.", "exVi": "Hiểu rồi, mình sẽ để hộ chiếu trong túi xách tay.", "ctx": "Thân mật, dùng để xác nhận đã hiểu."}, {"p": "any quick tips", "vi": "có mẹo nhanh nào không", "ex": "Any quick tips before I leave for the airport?", "exVi": "Có mẹo nhanh nào trước khi mình ra sân bay không?", "ctx": "Thân mật, dùng khi hỏi xin lời khu
