n as digital options keep growing.", "vi": "Tiền mặt sẽ không bao giờ biến mất hoàn toàn, ngay cả khi các lựa chọn kỹ thuật số tiếp tục phát triển."}, {"en": "She stayed calm, even as the situation got worse.", "vi": "Cô ấy vẫn giữ bình tĩnh, ngay cả khi tình huống trở nên tồi tệ hơn."}, {"en": "Prices kept rising, even as demand slowed down.", "vi": "Giá cả tiếp tục tăng, ngay cả khi nhu cầu chậm lại."}]}], "phrases": [{"p": "with open arms", "vi": "nồng nhiệt, với vòng tay rộng mở", "ex": "The new technology wasn't welcomed with open arms by everyone.", "exVi": "Công nghệ mới không được mọi người chào đón nồng nhiệt.", "ctx": "Trung tính, dùng khi nói về sự đón nhận tích cực (hoặc thiếu nó)."}, {"p": "leave someone behind", "vi": "bỏ lại ai đó phía sau", "ex": "The transition shouldn't leave anyone behind.", "exVi": "Quá trình chuyển đổi không nên bỏ lại ai phía sau.", "ctx": "Trung tính, dùng khi nói về sự công bằng trong thay đổi xã hội."}, {"p": "a fair concern", "vi": "một mối lo ngại hợp lý", "ex": "That's a fair concern, we should think about it.", "exVi": "Đó là một mối lo ngại hợp lý, chúng ta nên suy nghĩ về nó.", "ctx": "Trung tính, dùng khi công nhận lo ngại của ai đó là chính đáng."}, {"p": "a bit unsettling", "vi": "hơi đáng lo một chút", "ex": "The idea of being tracked is a bit unsettling.", "exVi": "Ý tưởng bị theo dõi nghe hơi đáng lo một chút.", "ctx": "Thân mật, dùng khi diễn đạt sự khó chịu nhẹ."}, {"p": "hadn't thought about that", "vi": "chưa nghĩ tới điều đó", "ex": "Honestly, I hadn't thought about that before.", "exVi": "Thành thật thì mình chưa nghĩ tới điều đó trước đây.", "ctx": "Thân mật, dùng khi nhận ra một góc nhìn mới."}, {"p": "a tricky balance", "vi": "một sự cân bằng khó khăn", "ex": "It's a tricky balance between speed and accuracy.", "exVi": "Đó là một sự cân bằng khó khăn giữa tốc độ và độ chính xác.", "ctx": "Trung tính, dùng khi nói về việc cân nhắc giữa hai yếu tố."}, {"p": "the real challenge", "vi": "thách thức thực sự", "ex": "The real challenge is making sure everyone benefits.", "exVi": "Thách thức thực sự là đảm bảo mọi người đều được hưởng lợi.", "ctx": "Trung tính, dùng khi xác định vấn đề cốt lõi."}, {"p": "isn't it", "vi": "đúng không (câu hỏi đuôi)", "ex": "That's the real challenge, isn't it?", "exVi": "Đó mới là thách thức thực sự, đúng không?", "ctx": "Thân mật, câu hỏi đuôi dùng để xác nhận ý kiến."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "(1)___ everyone welcomes this change with open arms.", "o": ["Not", "No", "None"], "a": 0, "why": "Cụm 'Not everyone' nghĩa là không phải ai cũng, đứng đầu câu."}, {"t": "Critics worry that a cashless society could leave some people (2)___.", "o": ["behind", "back", "out"], "a": 0, "why": "Cụm cố định 'leave someone behind' nghĩa là bỏ lại ai đó phía sau."}, {"t": "Every digital transaction leaves a (3)___ record.", "o": ["traceable", "trace", "tracing"], "a": 0, "why": "Cần tính từ bổ nghĩa cho danh từ 'record': traceable."}, {"t": "Cash will never disappear completely, (4)___ digital options keep growing.", "o": ["even as", "even though it", "despite"], "a": 0, "why": "'Even as' nghĩa là ngay cả khi, dùng để nối hai mệnh đề đồng thời."}, {"t": "The real challenge is making sure no one gets left (5)___.", "o": ["behind", "back", "out"], "a": 0, "why": "Cụm cố định 'get left behind' nghĩa là bị bỏ lại phía sau."}, {"t": "Governments are trying to find a (6)___ between convenience and inclusion.", "o": ["balance", "balanced", "balancing"], "a": 0, "why": "Cần danh từ sau mạo từ 'a': balance."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Leo said he (1)___ used cash in weeks.", "o": ["hasn't", "hadn't", "didn't"], "a": 1, "why": "Câu tường thuật lùi về quá khứ hoàn thành: hadn't."}, {"t": "Hana admitted her grandmother still (2)___ with mobile apps.", "o": ["struggle", "struggles", "struggled"], "a": 1, "why": "Sự thật vẫn đang đúng ở hiện tại, giữ nguyên hiện tại đơn: struggles."}, {"t": "Leo pointed out that every payment (3)___ a digital record.", "o": ["leave", "leaves", "left"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn, chủ ngữ số ít 'every payment': leaves."}, {"t": "Hana said that idea was a bit (4)___.", "o": ["unsettling", "unsettled", "unsettle"], "a": 0, "why": "Tính từ 'unsettling' mô tả cảm giác gây ra bởi điều gì đó."}, {"t": "Leo said he didn't think cash would ever (5)___ disappear.", "o": ["fully", "full", "fullness"], "a": 0, "why": "Trạng từ 'fully' bổ nghĩa cho động từ 'disappear'."}, {"t": "Hana agreed that progress had to (6)___ everyone.", "o": ["include", "includes", "included"], "a": 0, "why": "Sau 'had to' dùng động từ nguyên mẫu: include."}]}]}, {"id": "B1-SCIENCE-005", "topic": "SCIENCE", "n": 5, "level": "B1", "title": "The Strange Physics of Black Holes", "titleVi": "Vật lý kỳ lạ của hố đen", "passage": [{"en": "Few things in the universe capture people's imagination like black holes.", "vi": "Rất ít thứ trong vũ trụ lại thu hút trí tưởng tượng của con người như hố đen."}, {"en": "A black hole forms when a massive star runs out of fuel and collapses under its own gravity.", "vi": "Một hố đen hình thành khi một ngôi sao khổng lồ cạn kiệt nhiên liệu và sụp đổ dưới chính lực hấp dẫn của nó."}, {"en": "The result is an object so dense that nothing, not even light, can escape its pull.", "vi": "Kết quả là một vật thể đặc đến mức không gì, kể cả ánh sáng, có thể thoát khỏi lực hút của nó."}, {"en": "This is exactly why black holes appear completely black; no light ever reflects back to our eyes.", "vi": "Đây chính xác là lý do tại sao hố đen trông hoàn toàn đen; không ánh sáng nào phản chiếu lại mắt chúng ta."}, {"en": "The boundary around a black hole is called the event horizon.", "vi": "Ranh giới xung quanh một hố đen được gọi là chân trời sự kiện."}, {"en": "Once anything crosses the event horizon, there is no way back, not even for light itself.", "vi": "Một khi bất cứ thứ gì vượt qua chân trời sự kiện, sẽ không có đường quay lại, kể cả với chính ánh sáng."}, {"en": "For a long time, black holes were only a theory, predicted by Einstein's equations.", "vi": "Trong một thời gian dài, hố đen chỉ là một giả thuyết, được dự đoán bởi các phương trình của Einstein."}, {"en": "It wasn't until 2019 that scientists captured the first actual image of a black hole.", "vi": "Phải đến năm 2019 các nhà khoa học mới chụp được hình ảnh thực sự đầu tiên của một hố đen."}, {"en": "That historic photo showed a glowing ring of gas surrounding a dark, empty center.", "vi": "Bức ảnh lịch sử đó cho thấy một vòng khí phát sáng bao quanh một tâm tối, trống rỗng."}, {"en": "Black holes also dramatically affect the flow of time around them.", "vi": "Hố đen cũng ảnh hưởng mạnh mẽ đến dòng chảy thời gian xung quanh chúng."}, {"en": "The closer an object gets to a black hole, the slower time passes for it, compared to someone far away.", "vi": "Vật thể càng đến gần hố đen, thời gian trôi qua càng chậm đối với nó, so với người ở xa."}, {"en": "This strange effect has been confirmed by real experiments, not just imagined in science fiction.", "vi": "Hiệu ứng kỳ lạ này đã được xác nhận bởi các thí nghiệm thực tế, không chỉ là tưởng tượng trong khoa học viễn tưởng."}, {"en": "Despite their terrifying reputation, black holes aren't actually cosmic vacuum cleaners.", "vi": "Dù có tiếng xấu đáng sợ, hố đen thực ra không phải là những chiếc máy hút bụi vũ trụ."}, {"en": "They only pull in objects that get extremely close, similar to how any massive object has gravity.", "vi": "Chúng chỉ hút những vật thể đến rất gần, tương tự như cách bất kỳ vật thể khổng lồ nào cũng có lực hấp dẫn."}, {"en": "Scientists even believe a supermassive black hole sits quietly at the center of our own galaxy.", "vi": "Các nhà khoa học thậm chí tin rằng một hố đen siêu khổng lồ đang nằm yên lặng ở trung tâm của chính thiên hà chúng ta."}, {"en": "Studying these mysterious objects continues to reshape our understanding of space, time, and gravity itself.", "vi": "Việc nghiên cứu những vật thể bí ẩn này tiếp tục định hình lại hiểu biết của chúng ta về không gian, thời gian, và chính lực hấp dẫn."}], "dialogue": [{"who": "Theo", "g": "m", "en": "I watched a documentary about black holes last night. It blew my mind.", "vi": "Tối qua mình xem một phim tài liệu về hố đen. Nó làm mình choáng váng luôn."}, {"who": "Nina", "g": "f", "en": "Same, they're honestly terrifying when you really think about them.", "vi": "Mình cũng vậy, thật lòng chúng khá đáng sợ khi bạn thực sự nghĩ về chúng."}, {"who": "Theo", "g": "m", "en": "Did you know not even light can escape one?", "vi": "Cậu có biết không, kể cả ánh sáng cũng không thể thoát khỏi một cái không?"}, {"who": "Nina", "g": "f", "en": "Yeah, that's why they appear completely black. Makes sense actually.", "vi": "Có, đó là lý do chúng trông hoàn toàn đen. Nghe có lý thật."}, {"who": "Theo", "g": "m", "en": "They also mentioned time moves slower near a black hole. That part confused me.", "vi": "Họ cũng nói thời gian chậm lại gần một hố đen. Phần đó làm mình rối trí."}, {"who": "Nina", "g": "f", "en": "It's wild, but it's actually been proven with real experiments.", "vi": "Nghe điên rồ thật, nhưng thực ra nó đã được chứng minh bằng các thí nghiệm thực tế."}, {"who": "Theo", "g": "m", "en": "Wait, so it's not just something from science fiction movies?", "vi": "Khoan, vậy nó không chỉ là thứ trong phim khoa học viễn tưởng à?"}, {"who": "Nina", "g": "f", "en": "Nope, it's actual physics. Einstein predicted it a long time ago.", "vi": "Không hề, đó là vật lý thực sự. Einstein đã dự đoán điều đó từ rất lâu rồi."}, {"who": "Theo", "g": "m", "en": "Did they ever actually take a picture of one?", "vi": "Vậy có bao giờ họ thực sự chụp được ảnh một cái chưa?"}, {"who": "Nina", "g": "f", "en": "Yes, in 2019. It showed a glowing ring around a dark center.", "vi": "Có, vào năm 2019. Nó cho thấy một vòng phát sáng quanh một tâm tối."}, {"who": "Theo", "g": "m", "en": "That's incredible. I always imagined them like giant vacuum cleaners in space.", "vi": "Thật tuyệt vời. Mình luôn tưởng tượng chúng như những chiếc máy hút bụi khổng lồ trong không gian."}, {"who": "Nina", "g": "f", "en": "Actually, they only pull in things that get really close.", "vi": "Thực ra, chúng chỉ hút những thứ đến thật gần thôi."}, {"who": "Theo", "g": "m", "en": "Oh really? I thought they sucked in everything around them.", "vi": "Ồ thật hả? Mình cứ tưởng chúng hút hết mọi thứ xung quanh."}, {"who": "Nina", "g": "f", "en": "Nope, it's just like regular gravity, just extremely strong.", "vi": "Không hề, nó giống trọng lực bình thường thôi, chỉ là cực kỳ mạnh."}, {"who": "Theo", "g": "m", "en": "There's apparently even one at the center of our galaxy.", "vi": "Hình như còn có một cái ở trung tâm thiên hà của chúng ta nữa."}, {"who": "Nina", "g": "f", "en": "Yep, a supermassive one. Space is honestly so strange.", "vi": "Đúng vậy, một cái siêu khổng lồ. Vũ trụ thật lòng kỳ lạ quá đi."}], "vocab": [{"w": "gravity", "f": ["gravity"], "pos": "n", "ipa": "ˈɡrævəti", "vi": "lực hấp dẫn, trọng lực", "ex": "Gravity pulls objects toward the Earth.", "exVi": "Lực hấp dẫn kéo các vật thể về phía Trái Đất."}, {"w": "collapse", "f": ["collapse", "collapses", "collapsed", "collapsing"], "pos": "v", "ipa": "kəˈlæps", "vi": "sụp đổ, suy sụp", "ex": "The star collapsed under its own weight.", "exVi": "Ngôi sao sụp đổ dưới chính trọng lượng của nó."}, {"w": "dense", "f": ["dense"], "pos": "adj", "ipa": "dens", "vi": "đặc, dày đặc", "ex": "The object was extremely dense and heavy.", "exVi": "Vật thể đó cực kỳ đặc và nặng."}, {"w": "escape", "f": ["escape", "escapes", "escaped", "escaping"], "pos": "v", "ipa": "ɪˈskeɪp", "vi": "thoát khỏi", "ex": "Nothing can escape a black hole's pull.", "exVi": "Không gì có thể thoát khỏi lực hút của hố đen."}, {"w": "boundary", "f": ["boundary", "boundaries"], "pos": "n", "ipa": "ˈbaʊndri", "vi": "ranh giới", "ex": "The event horizon is the boundary of a black hole.", "exVi": "Chân trời sự kiện là ranh giới của một hố đen."}, {"w": "predict", "f": ["predict", "predicts", "predicted", "predicting"], "pos": "v", "ipa": "prɪˈdɪkt", "vi": "dự đoán", "ex": "Scientists predicted black holes decades before seeing one.", "exVi": "Các nhà khoa học đã dự đoán hố đen hàng chục năm trước khi nhìn thấy một cái."}, {"w": "galaxy", "f": ["galaxy", "galaxies"], "pos": "n", "ipa": "ˈɡæləksi", "vi": "thiên hà", "ex": "Our galaxy contains billions of stars.", "exVi": "Thiên hà của chúng ta chứa hàng tỷ ngôi sao."}, {"w": "massive", "f": ["massive"], "pos": "adj", "ipa": "ˈmæsɪv", "vi": "khổng lồ, đồ sộ", "ex": "A massive star eventually becomes a black hole.", "exVi": "Một ngôi sao khổng lồ cuối cùng trở thành một hố đen."}, {"w": "terrifying", "f": ["terrifying"], "pos": "adj", "ipa": "ˈterɪfaɪɪŋ", "vi": "đáng sợ, kinh hoàng", "ex": "The idea of falling into a black hole is terrifying.", "exVi": "Ý tưởng rơi vào một hố đen thật đáng sợ."}, {"w": "reshape", "f": ["reshape", "reshapes", "reshaped", "reshaping"], "pos": "v", "ipa": "riːˈʃeɪp", "vi": "định hình lại", "ex": "This discovery reshaped our understanding of physics.", "exVi": "Khám phá này định hình lại hiểu biết của chúng ta về vật lý."}], "grammar": [{"title": "The + so sánh hơn..., the + so sánh hơn (đi cùng nhau)", "formula": "The + comparative + S + V, the + comparative + S + V", "use": "Dùng để nói hai sự việc thay đổi tỉ lệ thuận với nhau: một thứ tăng/giảm thì thứ kia cũng tăng/giảm theo.", "examples": [{"en": "The closer an object gets to a black hole, the slower time passes.", "vi": "Vật thể càng đến gần hố đen, thời gian càng trôi chậm hơn."}, {"en": "The bigger the star, the stronger its gravity.", "vi": "Ngôi sao càng lớn, lực hấp dẫn của nó càng mạnh."}, {"en": "The more we study space, the more questions we find.", "vi": "Chúng ta càng nghiên cứu không gian nhiều, chúng ta càng tìm thấy nhiều câu hỏi hơn."}]}, {"title": "It wasn't until... that (mãi đến khi... mới)", "formula": "It wasn't until + thời gian/mốc + that + mệnh đề", "use": "Dùng để nhấn mạnh rằng một việc chỉ xảy ra sau một thời điểm nhất định, không sớm hơn.", "examples": [{"en": "It wasn't until 2019 that scientists captured the first image.", "vi": "Mãi đến năm 2019 các nhà khoa học mới chụp được bức ảnh đầu tiên."}, {"en": "It wasn't until last year that she learned to swim.", "vi": "Mãi đến năm ngoái cô ấy mới học bơi."}, {"en": "It wasn't until he apologized that she forgave him.", "vi": "Mãi đến khi anh ấy xin lỗi cô ấy mới tha thứ cho anh."}]}], "phrases": [{"p": "blew my mind", "vi": "làm tôi choáng váng, mở mang đầu óc", "ex": "That documentary about space blew my mind.", "exVi": "Bộ phim tài liệu về không gian đó làm mình choáng váng.", "ctx": "Thân mật, dùng khi điều gì đó cực kỳ ấn tượng hoặc bất ngờ."}, {"p": "makes sense", "vi": "nghe có lý", "ex": "That explanation actually makes sense.", "exVi": "Lời giải thích đó thực sự nghe có lý.", "ctx": "Thân mật, dùng khi hiểu và đồng ý với điều gì đó."}, {"p": "it's wild", "vi": "nghe điên rồ thật, khó tin thật", "ex": "It's wild how big the universe actually is.", "exVi": "Thật khó tin vũ trụ thực sự lớn đến thế nào.", "ctx": "Thân mật, dùng để diễn tả sự kinh ngạc."}, {"p": "a long time ago", "vi": "từ rất lâu rồi", "ex": "Einstein predicted this a long time ago.", "exVi": "Einstein đã dự đoán điều này từ rất lâu rồi.", "ctx": "Trung tính, dùng khi nói về quá khứ xa."}, {"p": "oh really", "vi": "ồ thật hả", "ex": "Oh really? I had no idea.", "exVi": "Ồ thật hả? Mình không hề biết đấy.", "ctx": "Thân mật, dùng để thể hiện sự ngạc nhiên nhẹ."}, {"p": "I thought", "vi": "tôi cứ tưởng (nhưng thực ra không phải)", "ex": "I thought black holes pulled in everything nearby.", "exVi": "Mình cứ tưởng hố đen hút hết mọi thứ gần đó.", "ctx": "Thân mật, dùng khi sửa lại một hiểu lầm trước đó."}, {"p": "just like", "vi": "giống như, y như", "ex": "It's just like regular gravity, just stronger.", "exVi": "Nó giống như trọng lực bình thường, chỉ là mạnh hơn.", "ctx": "Trung tính, dùng khi so sánh điều gì đó với thứ quen thuộc."}, {"p": "apparently", "vi": "nghe nói là, hình như", "ex": "Apparently, there's a black hole at the center of our galaxy.", "exVi": "Hình như có một hố đen ở trung tâm thiên hà của chúng ta.", "ctx": "Trung tính, dùng khi chia sẻ thông tin chưa hoàn toàn chắc chắn."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "A black hole forms when a massive star (1)___ under its own gravity.", "o": ["collapses", "collapse", "collapsing"], "a": 0, "why": "Chủ ngữ số ít 'a massive star', hiện tại đơn thêm s: collapses."}, {"t": "Nothing, not even light, can (2)___ a black hole's pull.", "o": ["escape", "escapes", "escaped"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: escape."}, {"t": "The closer an object gets, the (3)___ time passes for it.", "o": ["slower", "slow", "slowly"], "a": 0, "why": "Cấu trúc 'the + so sánh hơn' cần tính từ so sánh: slower."}, {"t": "It wasn't (4)___ 2019 that scientists captured the first image.", "o": ["until", "since", "by"], "a": 0, "why": "Cụm cố định 'it wasn't until...that' nghĩa là mãi đến khi."}, {"t": "Black holes aren't actually cosmic vacuum (5)___.", "o": ["cleaners", "cleaner", "cleaning"], "a": 0, "why": "Danh từ số nhiều 'cleaners' sau tính từ 'vacuum'."}, {"t": "Studying these objects continues to (6)___ our understanding.", "o": ["reshape", "reshapes", "reshaped"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: reshape."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Theo said the documentary (1)___ his mind.", "o": ["blow", "blew", "had blown"], "a": 1, "why": "Câu tường thuật lùi về quá khứ đơn: blew (cụm cố định giữ nguyên dạng quá khứ)."}, {"t": "Nina explained that time (2)___ slower near a black hole.", "o": ["move", "moves", "moved"], "a": 1, "why": "Sự thật khoa học giữ nguyên hiện tại đơn: moves."}, {"t": "Theo asked if it (3)___ just something from movies.", "o": ["was", "is", "were"], "a": 0, "why": "Câu tường thuật lùi về quá khứ: was."}, {"t": "Nina said Einstein had predicted it a long time (4)___.", "o": ["ago", "before", "past"], "a": 0, "why": "Cụm cố định 'a long time ago' nghĩa là từ rất lâu rồi."}, {"t": "Theo admitted he (5)___ they sucked in everything nearby.", "o": ["think", "thought", "had thought"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had thought."}, {"t": "Nina said space was honestly so (6)___.", "o": ["strange", "strangely", "strangeness"], "a": 0, "why": "Cần tính từ sau 'so': strange."}]}]}, {"id": "B1-HEALTH-005", "topic": "HEALTH", "n": 5, "level": "B1", "title": "The Truth About Drinking Enough Water", "titleVi": "Sự thật về việc uống đủ nước", "passage": [{"en": "Almost everyone has heard the advice to drink eight glasses of water a day.", "vi": "Hầu như ai cũng từng nghe lời khuyên uống tám ly nước mỗi ngày."}, {"en": "But where did this specific number actually come from?", "vi": "Nhưng con số cụ thể này thực sự đến từ đâu?"}, {"en": "Surprisingly, researchers have never found strong scientific evidence supporting this exact rule.", "vi": "Đáng ngạc nhiên, các nhà nghiên cứu chưa bao giờ tìm thấy bằng chứng khoa học mạnh mẽ ủng hộ quy tắc chính xác này."}, {"en": "It likely started as a simplified guideline, not a precise medical requirement.", "vi": "Nó có khả năng bắt đầu như một hướng dẫn đơn giản hóa, không phải một yêu cầu y tế chính xác."}, {"en": "In reality, how much water a person needs depends on many different factors.", "vi": "Trong thực tế, một người cần bao nhiêu nước phụ thuộc vào nhiều yếu tố khác nhau."}, {"en": "Body size, activity level, climate, and even diet all play a role.", "vi": "Kích thước cơ thể, mức độ hoạt động, khí hậu, và thậm chí chế độ ăn đều đóng vai trò."}, {"en": "Someone exercising intensely in a hot climate needs far more water than someone sitting indoors all day.", "vi": "Người tập luyện cường độ cao trong khí hậu nóng cần nhiều nước hơn hẳn người ngồi trong nhà cả ngày."}, {"en": "It's also important to remember that water doesn't only come from drinking liquids.", "vi": "Cũng quan trọng để nhớ rằng nước không chỉ đến từ việc uống chất lỏng."}, {"en": "Many fruits and vegetables, like watermelon and cucumbers, contain a surprisingly high amount of water.", "vi": "Nhiều loại trái cây và rau củ, như dưa hấu và dưa leo, chứa một lượng nước cao đến bất ngờ."}, {"en": "So counting only glasses of water can actually underestimate someone's total hydration.", "vi": "Vì vậy chỉ đếm số ly nước có thể thực sự đánh giá thấp mức độ hydrat hóa tổng thể của một người."}, {"en": "One simple and reliable way to check hydration is by looking at urine color.", "vi": "Một cách đơn giản và đáng tin cậy để kiểm tra hydrat hóa là nhìn vào màu nước tiểu."}, {"en": "Pale yellow usually indicates good hydration, while dark yellow often suggests drinking more is needed.", "vi": "Màu vàng nhạt thường cho thấy hydrat hóa tốt, trong khi vàng đậm thường gợi ý cần uống thêm."}, {"en": "Thirst itself is also a fairly reliable signal, despite what some people believe.", "vi": "Bản thân cơn khát cũng là một tín hiệu khá đáng tin cậy, bất kể một số người tin điều gì."}, {"en": "The idea that 'by the time you're thirsty, you're already dehydrated' is somewhat exaggerated.", "vi": "Ý tưởng rằng 'đến khi bạn khát, bạn đã bị mất nước rồi' phần nào bị phóng đại."}, {"en": "Drinking too much water too quickly can even be dangerous in extremely rare cases.", "vi": "Uống quá nhiều nước quá nhanh thậm chí có thể nguy hiểm trong những trường hợp cực kỳ hiếm."}, {"en": "In the end, listening to your body is often more useful than following one fixed number.", "vi": "Cuối cùng, lắng nghe cơ thể của bạn thường hữu ích hơn việc tuân theo một con số cố định."}], "dialogue": [{"who": "Sam", "g": "m", "en": "I've been forcing myself to drink eight glasses of water every day.", "vi": "Dạo này mình ép bản thân uống tám ly nước mỗi ngày."}, {"who": "Lily", "g": "f", "en": "Did you know that number doesn't actually have strong scientific backing?", "vi": "Cậu có biết con số đó thực ra không có cơ sở khoa học mạnh mẽ không?"}, {"who": "Sam", "g": "m", "en": "Wait, really? I thought it was like a medical fact.", "vi": "Khoan, thật hả? Mình cứ tưởng nó như một sự thật y khoa."}, {"who": "Lily", "g": "f", "en": "Nope, it depends a lot on your body, activity level, and climate.", "vi": "Không hề, nó phụ thuộc nhiều vào cơ thể, mức độ hoạt động, và khí hậu của cậu."}, {"who": "Sam", "g": "m", "en": "So someone who exercises a lot needs more than someone who sits all day?", "vi": "Vậy người tập luyện nhiều cần nhiều nước hơn người ngồi cả ngày à?"}, {"who": "Lily", "g": "f", "en": "Exactly. Plus, food counts too, not just drinks.", "vi": "Chính xác. Thêm nữa, thức ăn cũng được tính, không chỉ đồ uống thôi đâu."}, {"who": "Sam", "g": "m", "en": "Oh right, watermelon is basically mostly water, isn't it?", "vi": "À đúng rồi, dưa hấu cơ bản là chủ yếu toàn nước mà, đúng không?"}, {"who": "Lily", "g": "f", "en": "Exactly! So you're probably getting more water than you think.", "vi": "Chính xác! Nên có lẽ cậu đang nạp nhiều nước hơn cậu nghĩ đấy."}, {"who": "Sam", "g": "m", "en": "So how do I actually know if I'm drinking enough?", "vi": "Vậy làm sao mình thực sự biết mình đang uống đủ không?"}, {"who": "Lily", "g": "f", "en": "Check your urine color. Pale yellow usually means you're fine.", "vi": "Xem màu nước tiểu của cậu. Vàng nhạt thường nghĩa là ổn đấy."}, {"who": "Sam", "g": "m", "en": "That's a surprisingly simple method, honestly.", "vi": "Đó là một phương pháp đơn giản đến bất ngờ, thật lòng đấy."}, {"who": "Lily", "g": "f", "en": "Also, thirst itself is pretty reliable. You don't have to overthink it.", "vi": "Ngoài ra, bản thân cơn khát cũng khá đáng tin cậy. Cậu không cần nghĩ quá nhiều về nó đâu."}, {"who": "Sam", "g": "m", "en": "I always heard that being thirsty means you're already dehydrated.", "vi": "Mình luôn nghe nói khát nghĩa là đã bị mất nước rồi."}, {"who": "Lily", "g": "f", "en": "That's actually a bit exaggerated. It's not that extreme.", "vi": "Cái đó thực ra hơi bị phóng đại đấy. Không nghiêm trọng đến mức đó đâu."}, {"who": "Sam", "g": "m", "en": "Good to know. I've been stressing over this for no reason.", "vi": "May mà biết trước. Mình đã căng thẳng vì chuyện này mà chẳng có lý do gì cả."}, {"who": "Lily", "g": "f", "en": "Just listen to your body, it's usually smarter than any fixed number.", "vi": "Cứ lắng nghe cơ thể cậu thôi, nó thường thông minh hơn bất kỳ con số cố định nào."}], "vocab": [{"w": "hydration", "f": ["hydration"], "pos": "n", "ipa": "haɪˈdreɪʃn", "vi": "sự cấp nước, hydrat hóa", "ex": "Good hydration keeps your body functioning well.", "exVi": "Hydrat hóa tốt giúp cơ thể bạn hoạt động tốt."}, {"w": "dehydrated", "f": ["dehydrated"], "pos": "adj", "ipa": "diːˈhaɪdreɪtɪd", "vi": "bị mất nước", "ex": "He felt dizzy because he was dehydrated.", "exVi": "Anh ấy cảm thấy chóng mặt vì bị mất nước."}, {"w": "evidence", "f": ["evidence"], "pos": "n", "ipa": "ˈevɪdəns", "vi": "bằng chứng", "ex": "There's no strong evidence for that claim.", "exVi": "Không có bằng chứng mạnh mẽ nào cho tuyên bố đó."}, {"w": "underestimate", "f": ["underestimate", "underestimates", "underestimated"], "pos": "v", "ipa": "ˌʌndərˈestɪmeɪt", "vi": "đánh giá thấp", "ex": "People often underestimate how much water food contains.", "exVi": "Mọi người thường đánh giá thấp lượng nước trong thức ăn."}, {"w": "reliable", "f": ["reliable"], "pos": "adj", "ipa": "rɪˈlaɪəbl", "vi": "đáng tin cậy", "ex": "Thirst is a fairly reliable signal from your body.", "exVi": "Cơn khát là một tín hiệu khá đáng tin cậy từ cơ thể bạn."}, {"w": "exaggerated", "f": ["exaggerated"], "pos": "adj", "ipa": "ɪɡˈzædʒəreɪtɪd", "vi": "bị phóng đại", "ex": "That claim sounds a bit exaggerated to me.", "exVi": "Tuyên bố đó nghe hơi bị phóng đại với mình."}, {"w": "factor", "f": ["factor", "factors"], "pos": "n", "ipa": "ˈfæktər", "vi": "yếu tố", "ex": " "evident", "evidently"], "a": 0, "why": "Cần danh từ sau tính từ 'strong scientific': evidence."}, {"t": "How much water a person needs (2)___ on many factors.", "o": ["depends", "depend", "depending"], "a": 0, "why": "Chủ ngữ số ít 'how much water...needs', hiện tại đơn thêm s: depends."}, {"t": "Counting only glasses can (3)___ someone's total hydration.", "o": ["underestimate", "underestimates", "underestimated"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: underestimate."}, {"t": "Pale yellow urine usually (4)___ good hydration.", "o": ["indicates", "indicate", "indicating"], "a": 0, "why": "Chủ ngữ số ít 'pale yellow urine', hiện tại đơn thêm s: indicates."}, {"t": "The idea that thirst means dehydration is somewhat (5)___.", "o": ["exaggerated", "exaggerate", "exaggeration"], "a": 0, "why": "Cần tính từ sau 'is': exaggerated."}, {"t": "Listening to your body is often more useful than following one fixed (6)___.", "o": ["number", "numbers", "numbered"], "a": 0, "why": "Danh từ số ít 'number' sau mạo từ 'one'."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Sam said he (1)___ it was a medical fact.", "o": ["think", "thought", "had thought"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: thought."}, {"t": "Lily explained that it (2)___ on body, activity, and climate.", "o": ["depend", "depends", "depended"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn: depends."}, {"t": "Sam realized watermelon was (3)___ mostly water.", "o": ["basic", "basically", "basics"], "a": 1, "why": "Trạng từ 'basically' bổ nghĩa cho cụm từ sau nó."}, {"t": "Lily told him to check his urine (4)___.", "o": ["color", "colors", "colored"], "a": 0, "why": "Danh từ không đếm được 'color' giữ số ít."}, {"t": "Sam admitted he had been stressing (5)___ no reason.", "o": ["for", "with", "of"], "a": 0, "why": "Cụm cố định 'for no reason' nghĩa là mà không có lý do."}, {"t": "Lily said the body was usually smarter than any fixed (6)___.", "o": ["number", "numbers", "numbering"], "a": 0, "why": "Danh từ số ít 'number' sau 'any fixed'."}]}]}, {"id": "B1-DAILY-005", "topic": "DAILY", "n": 5, "level": "B1", "title": "Learning to Cook for Yourself", "titleVi": "Học nấu ăn cho chính mình", "passage": [{"en": "Moving out for the first time often means learning to cook, usually the hard way.", "vi": "Lần đầu dọn ra sống riêng thường đồng nghĩa với việc phải học nấu ăn, thường là theo cách khó khăn."}, {"en": "Many young adults survive their first few months on takeout food and instant noodles.", "vi": "Nhiều người trẻ sống qua vài tháng đầu bằng đồ ăn mang về và mì ăn liền."}, {"en": "Eventually, though, the cost and the lack of nutrition catch up with almost everyone.", "vi": "Tuy nhiên, cuối cùng chi phí và sự thiếu dinh dưỡng cũng bắt kịp hầu như mọi người."}, {"en": "Learning to cook doesn't have to start with complicated recipes or fancy equipment.", "vi": "Học nấu ăn không nhất thiết phải bắt đầu bằng những công thức phức tạp hay thiết bị cầu kỳ."}, {"en": "In fact, most beginner cooks benefit more from mastering a handful of simple dishes first.", "vi": "Thực tế, hầu hết người mới nấu ăn sẽ có lợi hơn khi thành thạo một vài món đơn giản trước."}, {"en": "Eggs are often recommended as a great starting point because they're cheap and versatile.", "vi": "Trứng thường được khuyên dùng làm điểm khởi đầu tuyệt vời vì rẻ và đa dụng."}, {"en": "You can scramble them, fry them, or turn them into a simple omelet within minutes.", "vi": "Bạn có thể đánh trứng, chiên, hoặc biến chúng thành một món trứng ốp la đơn giản chỉ trong vài phút."}, {"en": "Rice is another forgiving ingredient that almost never goes completely wrong.", "vi": "Cơm là một nguyên liệu dễ tính khác mà gần như không bao giờ hỏng hoàn toàn."}, {"en": "Once someone masters rice, countless simple meals suddenly become possible.", "vi": "Một khi ai đó thành thạo nấu cơm, vô số bữa ăn đơn giản bỗng trở nên khả thi."}, {"en": "Learning a few basic knife skills also makes cooking faster and much safer.", "vi": "Học một vài kỹ năng cắt dao cơ bản cũng giúp nấu ăn nhanh hơn và an toàn hơn nhiều."}, {"en": "Many people are surprised by how much time proper chopping technique actually saves.", "vi": "Nhiều người ngạc nhiên về việc kỹ thuật thái đúng cách thực sự tiết kiệm được bao nhiêu thời gian."}, {"en": "Meal prepping, cooking several meals in advance, is another trick that busy people rely on.", "vi": "Chuẩn bị bữa ăn trước, nấu nhiều bữa trước thời hạn, là một mẹo khác mà người bận rộn hay dựa vào."}, {"en": "Spending just a few hours on Sunday can provide ready-made meals for the entire week.", "vi": "Chỉ dành vài tiếng vào Chủ Nhật có thể cung cấp bữa ăn sẵn sàng cho cả tuần."}, {"en": "Of course, mistakes are completely normal, even expected, when first starting out.", "vi": "Tất nhiên, sai sót là hoàn toàn bình thường, thậm chí được dự đoán trước, khi mới bắt đầu."}, {"en": "Burnt rice and overly salty soup are basically rites of passage for new cooks.", "vi": "Cơm cháy và canh quá mặn cơ bản là những 'thủ tục' mà người mới nấu ăn nào cũng phải trải qua."}, {"en": "With enough practice, though, cooking eventually shifts from a chore into something genuinely enjoyable.", "vi": "Tuy nhiên, với đủ luyện tập, nấu ăn cuối cùng sẽ chuyển từ một việc vặt thành điều thực sự thú vị."}], "dialogue": [{"who": "Ryan", "g": "m", "en": "I just moved into my own place. I have no idea how to cook anything.", "vi": "Mình vừa dọn ra ở riêng. Mình chẳng biết nấu món gì cả."}, {"who": "Amy", "g": "f", "en": "Don't worry, everyone starts somewhere. What do you usually eat now?", "vi": "Đừng lo, ai cũng bắt đầu từ đâu đó mà. Giờ cậu thường ăn gì vậy?"}, {"who": "Ryan", "g": "m", "en": "Mostly takeout, honestly. It's getting expensive though.", "vi": "Chủ yếu là đồ ăn mang về, thật lòng mà nói. Nhưng nó đang trở nên đắt đỏ."}, {"who": "Amy", "g": "f", "en": "Start with eggs. They're cheap, quick, and hard to mess up.", "vi": "Bắt đầu với trứng đi. Nó rẻ, nhanh, và khó làm hỏng."}, {"who": "Ryan", "g": "m", "en": "I can barely fry an egg without breaking the yolk.", "vi": "Mình còn chưa chiên nổi một quả trứng mà không làm vỡ lòng đỏ."}, {"who": "Amy", "g": "f", "en": "That's fine, scrambled eggs are even easier. Just mix and cook.", "vi": "Không sao đâu, trứng đánh còn dễ hơn. Chỉ cần khuấy và nấu thôi."}, {"who": "Ryan", "g": "m", "en": "What about rice? I always burn it somehow.", "vi": "Còn cơm thì sao? Mình lúc nào cũng làm cháy nó bằng cách nào đó."}, {"who": "Amy", "g": "f", "en": "A rice cooker fixes that problem completely, honestly.", "vi": "Một nồi cơm điện giải quyết hoàn toàn vấn đề đó, thật đấy."}, {"who": "Ryan", "g": "m", "en": "I don't have one yet, but maybe I should get one.", "vi": "Mình chưa có cái nào, nhưng có lẽ mình nên mua một cái."}, {"who": "Amy", "g": "f", "en": "Definitely. It'll save you from a lot of burnt rice disasters.", "vi": "Chắc chắn rồi. Nó sẽ cứu cậu khỏi rất nhiều thảm họa cơm cháy."}, {"who": "Ryan", "g": "m", "en": "Any other tips for someone completely new to this?", "vi": "Có mẹo nào khác cho người hoàn toàn mới với việc này không?"}, {"who": "Amy", "g": "f", "en": "Try meal prepping on Sundays. It saves so much time during the week.", "vi": "Thử chuẩn bị bữa ăn trước vào Chủ Nhật xem. Nó tiết kiệm rất nhiều thời gian trong tuần."}, {"who": "Ryan", "g": "m", "en": "That actually sounds really practical for my busy schedule.", "vi": "Nghe thực sự thực tế với lịch bận rộn của mình đấy."}, {"who": "Amy", "g": "f", "en": "Just expect some mistakes along the way, that's totally normal.", "vi": "Cứ chuẩn bị tinh thần sẽ có vài sai sót trên đường đi, cái đó hoàn toàn bình thường."}, {"who": "Ryan", "g": "m", "en": "Good, because I'm pretty sure I'll mess something up soon.", "vi": "Tốt, vì mình khá chắc mình sẽ làm hỏng gì đó sớm thôi."}, {"who": "Amy", "g": "f", "en": "That's basically a rite of passage. You'll get better fast.", "vi": "Đó cơ bản là một 'thủ tục' mà ai cũng trải qua. Cậu sẽ tiến bộ nhanh thôi."}], "vocab": [{"w": "recipe", "f": ["recipe", "recipes"], "pos": "n", "ipa": "ˈresəpi", "vi": "công thức nấu ăn", "ex": "She tried a new recipe for dinner.", "exVi": "Cô ấy thử một công thức mới cho bữa tối."}, {"w": "versatile", "f": ["versatile"], "pos": "adj", "ipa": "ˈvɜːrsətl", "vi": "đa dụng, linh hoạt", "ex": "Eggs are a cheap and versatile ingredient.", "exVi": "Trứng là một nguyên liệu rẻ và đa dụng."}, {"w": "ingredient", "f": ["ingredient", "ingredients"], "pos": "n", "ipa": "ɪnˈɡriːdiənt", "vi": "nguyên liệu", "ex": "Rice is a forgiving ingredient for beginners.", "exVi": "Cơm là một nguyên liệu dễ tính cho người mới bắt đầu."}, {"w": "chop", "f": ["chop", "chops", "chopped", "chopping"], "pos": "v", "ipa": "tʃɑːp", "vi": "thái, chặt", "ex": "He chopped the vegetables quickly.", "exVi": "Anh ấy thái rau rất nhanh."}, {"w": "meal prep", "f": ["meal prep", "meal prepping"], "pos": "n", "ipa": "miːl prep", "vi": "chuẩn bị bữa ăn trước", "ex": "Meal prep saves time during busy weeks.", "exVi": "Chuẩn bị bữa ăn trước giúp tiết kiệm thời gian trong những tuần bận rộn."}, {"w": "chore", "f": ["chore", "chores"], "pos": "n", "ipa": "tʃɔːr", "vi": "việc vặt, việc nhà", "ex": "Cooking used to feel like a chore to him.", "exVi": "Nấu ăn từng cảm thấy giống một việc vặt với anh ấy."}, {"w": "mess up", "f": ["mess up", "messes up", "messed up"], "pos": "v", "ipa": "mes ʌp", "vi": "làm hỏng", "ex": "I always mess up when frying eggs.", "exVi": "Mình lúc nào cũng làm hỏng khi chiên trứng."}, {"w": "scramble", "f": ["scramble", "scrambles", "scrambled", "scrambling"], "pos": "v", "ipa": "ˈskræmbl", "vi": "đánh (trứng), khuấy đều", "ex": "She scrambled two eggs for breakfast.", "exVi": "Cô ấy đánh hai quả trứng cho bữa sáng."}, {"w": "rite of passage", "f": ["rite of passage"], "pos": "n", "ipa": "raɪt əv ˈpæsɪdʒ", "vi": "nghi thức/trải nghiệm mà ai cũng phải qua", "ex": "Burning rice is a rite of passage for new cooks.", "exVi": "Làm cháy cơm là một 'thủ tục' mà người mới nấu ăn nào cũng trải qua."}, {"w": "nutrition", "f": ["nutrition"], "pos": "n", "ipa": "nuːˈtrɪʃn", "vi": "dinh dưỡng", "ex": "Takeout food often lacks proper nutrition.", "exVi": "Đồ ăn mang về thường thiếu dinh dưỡng phù hợp."}], "grammar": [{"title": "Doesn't have to + V (không nhất thiết phải)", "formula": "S + doesn't/don't have to + V", "use": "Dùng để nói rằng điều gì đó không bắt buộc, có thể làm hoặc không làm đều được.", "examples": [{"en": "Learning to cook doesn't have to start with complicated recipes.", "vi": "Học nấu ăn không nhất thiết phải bắt đầu bằng công thức phức tạp."}, {"en": "You don't have to use expensive ingredients.", "vi": "Bạn không nhất thiết phải dùng nguyên liệu đắt tiền."}, {"en": "She doesn't have to finish it today.", "vi": "Cô ấy không nhất thiết phải hoàn thành nó hôm nay."}]}, {"title": "Shift from... into... (chuyển từ... thành...)", "formula": "S + shift(s) from + noun + into + noun", "use": "Dùng để diễn tả một quá trình thay đổi dần dần từ trạng thái này sang trạng thái khác.", "examples": [{"en": "Cooking eventually shifts from a chore into something enjoyable.", "vi": "Nấu ăn cuối cùng chuyển từ một việc vặt thành điều thú vị."}, {"en": "His attitude shifted from doubt into confidence.", "vi": "Thái độ của anh ấy chuyển từ nghi ngờ thành tự tin."}, {"en": "The city shifted from quiet into chaos during the festival.", "vi": "Thành phố chuyển từ yên tĩnh thành hỗn loạn trong lễ hội."}]}], "phrases": [{"p": "the hard way", "vi": "theo cách khó khăn (qua sai lầm)", "ex": "He learned to cook the hard way, through many mistakes.", "exVi": "Anh ấy học nấu ăn theo cách khó khăn, qua nhiều lần sai sót.", "ctx": "Trung tính, dùng khi học điều gì đó qua trải nghiệm khó khăn."}, {"p": "catch up with someone", "vi": "bắt kịp ai đó (hậu quả xảy đến)", "ex": "Bad eating habits eventually catch up with you.", "exVi": "Thói quen ăn uống xấu cuối cùng cũng bắt kịp bạn.", "ctx": "Trung tính, dùng khi hậu quả của việc gì đó cuối cùng cũng xuất hiện."}, {"p": "a great starting point", "vi": "một điểm khởi đầu tuyệt vời", "ex": "Eggs are a great starting point for new cooks.", "exVi": "Trứng là một điểm khởi đầu tuyệt vời cho người mới nấu ăn.", "ctx": "Trung tính, dùng khi gợi ý nơi bắt đầu tốt."}, {"p": "hard to mess up", "vi": "khó làm hỏng", "ex": "This recipe is simple and hard to mess up.", "exVi": "Công thức này đơn giản và khó làm hỏng.", "ctx": "Thân mật, dùng khi một việc khó sai sót."}, {"p": "fixes that problem", "vi": "giải quyết vấn đề đó", "ex": "A timer fixes that problem completely.", "exVi": "Một chiếc hẹn giờ giải quyết hoàn toàn vấn đề đó.", "ctx": "Trung tính, dùng khi một giải pháp đơn giản khắc phục vấn đề."}, {"p": "sounds really practical", "vi": "nghe thực sự thực tế", "ex": "That idea sounds really practical for my schedule.", "exVi": "Ý tưởng đó nghe thực sự thực tế với lịch trình của mình.", "ctx": "Thân mật, dùng khi một gợi ý rất khả thi."}, {"p": "along the way", "vi": "trên đường đi, trong quá trình", "ex": "You'll learn a lot along the way.", "exVi": "Cậu sẽ học được nhiều thứ trên đường đi.", "ctx": "Trung tính, dùng khi nói về quá trình học hỏi hoặc trải nghiệm."}, {"p": "get better fast", "vi": "tiến bộ nhanh", "ex": "Don't worry, you'll get better fast with practice.", "exVi": "Đừng lo, cậu sẽ tiến bộ nhanh khi luyện tập.", "ctx": "Thân mật, dùng để động viên ai đó mới bắt đầu."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Learning to cook doesn't (1)___ to start with complicated recipes.", "o": ["have", "has", "had"], "a": 0, "why": "Chủ ngữ danh động từ coi như số ít nhưng cụm cố định giữ nguyên 'doesn't have to'."}, {"t": "Eggs are recommended because they're cheap and (2)___.", "o": ["versatile", "versatility", "versatilely"], "a": 0, "why": "Cần tính từ sau 'and': versatile."}, {"t": "Rice is a forgiving ingredient that almost never (3)___ wrong.", "o": ["goes", "go", "went"], "a": 0, "why": "Chủ ngữ số ít 'rice', hiện tại đơn thêm s: goes."}, {"t": "Meal prepping can provide ready-made meals (4)___ the entire week.", "o": ["for", "during", "at"], "a": 0, "why": "Giới từ 'for' dùng để chỉ khoảng thời gian áp dụng."}, {"t": "Mistakes are completely normal, even (5)___, when starting out.", "o": ["expected", "expect", "expecting"], "a": 0, "why": "Tính từ/quá khứ phân từ 'expected' song song với 'normal'."}, {"t": "Cooking eventually shifts from a chore (6)___ something enjoyable.", "o": ["into", "to", "for"], "a": 0, "why": "Cụm cố định 'shift from...into...' nghĩa là chuyển từ...thành..."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Ryan said he had no idea how to (1)___ anything.", "o": ["cook", "cooks", "cooked"], "a": 0, "why": "Sau 'how to' dùng động từ nguyên mẫu: cook."}, {"t": "Amy suggested that he (2)___ with eggs.", "o": ["start", "starts", "started"], "a": 0, "why": "Sau 'suggested that' dùng động từ nguyên thể (subjunctive): start."}, {"t": "Ryan admitted he (3)___ burn rice somehow.", "o": ["always", "was always", "had always"], "a": 0, "why": "Trạng từ 'always' đứng trước động từ thường để diễn tả thói quen."}, {"t": "Amy told him a rice cooker (4)___ that problem completely.", "o": ["fix", "fixes", "fixed"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn: fixes."}, {"t": "Ryan said meal prepping sounded (5)___ practical for him.", "o": ["real", "really", "reality"], "a": 1, "why": "Trạng từ 'really' bổ nghĩa cho tính từ 'practical'."}, {"t": "Amy said he would get better (6)___ with practice.", "o": ["fast", "faster", "fastest"], "a": 0, "why": "Trạng từ 'fast' bổ nghĩa cho động từ 'get better'."}]}]}, {"id": "B1-SPORTS-005", "topic": "SPORTS", "n": 5, "level": "B1", "title": "The Science of Warming Up", "titleVi": "Khoa học của việc khởi động", "passage": [{"en": "Many beginners skip warming up, thinking it's just a waste of valuable time.", "vi": "Nhiều người mới bắt đầu bỏ qua việc khởi động, nghĩ rằng đó chỉ là lãng phí thời gian quý báu."}, {"en": "In reality, warming up properly can make a huge difference in both performance and safety.", "vi": "Trong thực tế, khởi động đúng cách có thể tạo ra sự khác biệt lớn cả về thành tích lẫn an toàn."}, {"en": "A good warm-up gradually raises your heart rate and increases blood flow to your muscles.", "vi": "Một bài khởi động tốt dần dần tăng nhịp tim và tăng lưu lượng máu đến cơ bắp của bạn."}, {"en": "This process makes muscles more flexible and significantly less likely to get injured.", "vi": "Quá trình này khiến cơ bắp linh hoạt hơn và ít có khả năng bị chấn thương hơn đáng kể."}, {"en": "Cold muscles are stiffer and simply can't perform at their full potential.", "vi": "Cơ bắp lạnh cứng hơn và đơn giản là không thể hoạt động hết tiềm năng."}, {"en": "Think of a rubber band left in the freezer; it snaps far more easily than a warm one.", "vi": "Hãy nghĩ về một sợi dây thun để trong tủ đông; nó đứt dễ hơn nhiều so với một sợi ấm."}, {"en": "A proper warm-up usually includes two main parts: general movement and sport-specific drills.", "vi": "Một bài khởi động đúng cách thường gồm hai phần chính: vận động chung và các bài tập chuyên biệt theo môn thể thao."}, {"en": "General movement, like light jogging, raises the body's overall temperature first.", "vi": "Vận động chung, như chạy bộ nhẹ, trước tiên làm tăng nhiệt độ tổng thể của cơ thể."}, {"en": "Sport-specific drills then prepare the exact muscles that will be used most during the activity.", "vi": "Các bài tập chuyên biệt sau đó chuẩn bị chính xác những cơ bắp sẽ được sử dụng nhiều nhất trong hoạt động."}, {"en": "For example, a runner might do high knees, while a swimmer might do arm circles.", "vi": "Ví dụ, một người chạy bộ có thể tập nâng cao đầu gối, trong khi người bơi có thể xoay tay."}, {"en": "Static stretching, holding a stretch without movement, used to be the standard before exercise.", "vi": "Giãn cơ tĩnh, giữ một tư thế giãn mà không di chuyển, từng là tiêu chuẩn trước khi tập thể dục."}, {"en": "However, recent research suggests this type of stretching can actually reduce strength temporarily.", "vi": "Tuy nhiên, nghiên cứu gần đây cho thấy loại giãn cơ này thực ra có thể làm giảm sức mạnh tạm thời."}, {"en": "Many coaches now recommend dynamic stretching instead, which involves continuous movement.", "vi": "Nhiều huấn luyện viên giờ khuyên dùng giãn cơ động thay vào đó, bao gồm vận động liên tục."}, {"en": "Examples of dynamic stretching include leg swings, lunges, and arm rotations.", "vi": "Ví dụ về giãn cơ động bao gồm đá chân, chùng chân, và xoay cánh tay."}, {"en": "A full warm-up typically takes between ten and fifteen minutes to complete properly.", "vi": "Một bài khởi động đầy đủ thường mất từ mười đến mười lăm phút để hoàn thành đúng cách."}, {"en": "Though it may feel like wasted time at first, it ultimately leads to safer, stronger performance.", "vi": "Dù ban đầu có thể cảm thấy như lãng phí thời gian, nó cuối cùng dẫn đến thành tích an toàn hơn, mạnh mẽ hơn."}], "dialogue": [{"who": "Max", "g": "m", "en": "I usually skip warming up. It feels like a waste of time before a workout.", "vi": "Mình thường bỏ qua khởi động. Nó cảm thấy như lãng phí thời gian trước khi tập."}, {"who": "Ruby", "g": "f", "en": "That's actually risky. Warming up really reduces your chance of injury.", "vi": "Cái đó thực ra khá rủi ro đấy. Khởi động thực sự giảm nguy cơ chấn thương của cậu."}, {"who": "Max", "g": "m", "en": "Really? I always assumed it was just for professional athletes.", "vi": "Thật hả? Mình luôn nghĩ nó chỉ dành cho vận động viên chuyên nghiệp thôi."}, {"who": "Ruby", "g": "f", "en": "Not at all. Cold muscles are just stiffer and more likely to get hurt.", "vi": "Hoàn toàn không. Cơ bắp lạnh chỉ đơn giản là cứng hơn và dễ bị thương hơn."}, {"who": "Max", "g": "m", "en": "What should a good warm-up actually include?", "vi": "Một bài khởi động tốt thực sự nên bao gồm những gì vậy?"}, {"who": "Ruby", "g": "f", "en": "Start with light jogging, then do movements specific to your sport.", "vi": "Bắt đầu bằng chạy bộ nhẹ, sau đó làm những động tác chuyên biệt theo môn thể thao của cậu."}, {"who": "Max", "g": "m", "en": "I used to do static stretching before everything. Isn't that enough?", "vi": "Mình từng làm giãn cơ tĩnh trước mọi thứ. Vậy không đủ à?"}, {"who": "Ruby", "g": "f", "en": "Actually, that can reduce your strength temporarily. Try dynamic stretching instead.", "vi": "Thực ra, cái đó có thể làm giảm sức mạnh của cậu tạm thời. Thử giãn cơ động thay vào đó đi."}, {"who": "Max", "g": "m", "en": "What's the difference between those two exactly?", "vi": "Sự khác biệt giữa hai loại đó chính xác là gì vậy?"}, {"who": "Ruby", "g": "f", "en": "Dynamic stretching keeps you moving, like leg swings or lunges.", "vi": "Giãn cơ động giúp cậu tiếp tục di chuyển, như đá chân hoặc chùng chân."}, {"who": "Max", "g": "m", "en": "That actually sounds way more useful than just standing there stretching.", "vi": "Nghe thực sự hữu ích hơn nhiều so với chỉ đứng yên giãn cơ."}, {"who": "Ruby", "g": "f", "en": "Exactly. How long do you usually spend warming up now?", "vi": "Chính xác. Giờ cậu thường dành bao lâu để khởi động vậy?"}, {"who": "Max", "g": "m", "en": "Honestly, maybe two minutes if I even bother at all.", "vi": "Thật lòng thì, có lẽ hai phút nếu mình thậm chí còn chịu làm."}, {"who": "Ruby", "g": "f", "en": "Try for ten to fifteen minutes. It really makes a noticeable difference.", "vi": "Thử dành mười đến mười lăm phút xem. Nó thực sự tạo ra khác biệt rõ rệt đấy."}, {"who": "Max", "g": "m", "en": "Okay, I'll actually try it properly starting tomorrow.", "vi": "Được rồi, mình sẽ thực sự thử làm đúng cách từ ngày mai."}, {"who": "Ruby", "g": "f", "en": "Your future self will definitely thank you for it.", "vi": "Bản thân cậu trong tương lai chắc chắn sẽ cảm ơn cậu vì điều đó."}], "vocab": [{"w": "warm-up", "f": ["warm-up", "warm-ups"], "pos": "n", "ipa": "wɔːrm ʌp", "vi": "khởi động", "ex": "A good warm-up prevents many injuries.", "exVi": , "instead of", "rather"], "a": 0, "why": "'Instead' đứng cuối câu, không cần giới từ theo sau."}, {"t": "A full warm-up typically takes (6)___ ten and fifteen minutes.", "o": ["between", "from", "among"], "a": 0, "why": "Cụm cố định 'between...and...' dùng để chỉ khoảng."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Max admitted he usually (1)___ warming up.", "o": ["skip", "skips", "skipped"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: skipped."}, {"t": "Ruby told him that cold muscles (2)___ stiffer.", "o": ["is", "are", "were"], "a": 1, "why": "Sự thật chung giữ nguyên hiện tại đơn: are."}, {"t": "Max said he (3)___ it was just for professionals.", "o": ["assume", "assumes", "had assumed"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had assumed."}, {"t": "Ruby suggested that he (4)___ dynamic stretching instead.", "o": ["try", "tries", "tried"], "a": 0, "why": "Sau 'suggested that' dùng động từ nguyên thể (subjunctive): try."}, {"t": "Max said it sounded (5)___ more useful than static stretching.", "o": ["way", "very", "so"], "a": 0, "why": "Cụm 'way more' nghĩa là nhiều hơn hẳn, phổ biến trong văn nói."}, {"t": "Ruby said his future self would (6)___ him for it.", "o": ["thank", "thanks", "thanked"], "a": 0, "why": "Sau 'would' dùng động từ nguyên mẫu: thank."}]}]}]}</script>

var FEM = 'samantha karen moira tessa fiona victoria allison ava susan zira hazel aria jenny michelle libby sonia natasha clara emily olivia kate serena joanna salli kimberly ivy amy emma nicole catherine heather linda zoe veena holly mia maisie shelley sandy flo female nancy jane ashley sara elizabeth evelyn mary denise ayanna leah lucy eva ellen lily megan ruth stephanie claire jessica joan joanne matilda molly rachel sophia grandma karen'.split(' ');
var MAL = 'daniel alex fred tom aaron arthur gordon rishi oliver nathan evan david mark george richard james guy ryan davis brian christopher eric roger steffan andrew ethan jason matthew joey justin kevin russell reed rocko male neil liam thomas jacob ronald sean tony william henry jack john paul jim lewis luke alfie connor harry mitchell noah ronan eddy grandpa'.split(' ');
var NOVELTY = /(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|junior|kathy|bruce|vicki|agnes|princess)/i;
/* Giọng họ Eloquence của Apple (Eddy, Flo, Reed, Rocko, Sandy, Shelley, Grandma, Grandpa) đọc to cả mã điều khiển trên iPhone khi đổi tốc độ, nên loại bỏ hoàn toàn */
var ELOQ = /(eloquence|(^|[^a-z])(eddy|flo|reed|rocko|sandy|shelley|grandma|grandpa)([^a-z]|$))/i;
var GOOD = 'samantha ava allison susan nicky evan nathan daniel karen moira tessa serena oliver zoe aria jenny guy'.split(' ');
var groups = {f:[],m:[],u:[]}, byName = {}, voicesTotal = 0, enTotal = 0;
function hasTTS(){ return ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance!=='undefined'; }
function classify(v){
  var nm=(v.name||'').toLowerCase(), toks=nm.split(/[^a-z]+/), g='u', i;
  if(toks.indexOf('female')>-1) g='f'; else if(toks.indexOf('male')>-1) g='m';
  else{ for(i=0;i<toks.length;i++){ if(FEM.indexOf(toks[i])>-1){g='f';break;} } if(g==='u'){ for(i=0;i<toks.length;i++){ if(MAL.indexOf(toks[i])>-1){g='m';break;} } } }
  var q=0;
  /* Giọng Siri (iPhone) là chuẩn tham chiếu người dùng chọn, nên luôn xếp lên đầu danh sách trên iPhone */
  if(/siri/i.test(v.name)) q+=10;
  if(/premium/i.test(v.name)) q+=3;
  if(/enhanced/i.test(v.name)) q+=2;
  if(/neural|natural|online/i.test(v.name)) q+=2;
  if(v.localService===false) q+=1;
  if(/google/i.test(v.name)) q+=1;
  if(toks.some(function(t){ return GOOD.indexOf(t)>-1; })) q+=.6;
  if(/^en[-_]US$/i.test(v.lang)) q+=.5; else if(/^en[-_]GB$/i.test(v.lang)) q+=.4;
  return {v:v,g:g,q:q,name:v.name,lang:v.lang};
}
function refreshVoices(){
  if(!hasTTS()) return;
  var all=[]; try{ all=window.speechSynthesis.getVoices()||[]; }catch(e){}
  voicesTotal=all.length;
  var seen={}, g={f:[],m:[],u:[]}, n=0; byName={};
  all.forEach(function(v){
    if(!/^en([-_]|$)/i.test(v.lang||'')) return;
    if(NOVELTY.test(v.name||'')) return;
    if(ELOQ.test((v.name||'')+' '+(v.voiceURI||''))) return;
    var k=v.name+'|'+v.lang; if(seen[k]) return; seen[k]=1;
    var c=classify(v); g[c.g].push(c); byName[v.name]=v; n++;
  });
  ['f','m','u'].forEach(function(k){ g[k].sort(function(a,b){ return (b.q-a.q) || a.name.localeCompare(b.name); }); });
  groups=g; enTotal=n;
}
function voiceFor(g){
  var want = g==='m' ? settings.voiceM : settings.voiceF;
  if(want && byName[want]) return byName[want];
  var list = g==='m' ? groups.m : groups.f;
  if(list.length) return list[0].v;
  var any = groups.f[0]||groups.m[0]||groups.u[0];
  return any ? any.v : null;
}
if(hasTTS()){
  refreshVoices();
  try{ window.speechSynthesis.onvoiceschanged=function(){ refreshVoices(); if(S && S.view==='settings') render(); }; }catch(e){}

}

/* ---------- speech (English only) ---------- */
var token=0, UTT=[], wd=null, unlocked=false;
var NUM1=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var NUM10=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function say3(n){
  var s='';
  if(n>=100){ s+=NUM1[Math.floor(n/100)]+' hundred'; n%=100; if(n) s+=' '; }
  if(n>=20){ s+=NUM10[Math.floor(n/10)]; if(n%10) s+='-'+NUM1[n%10]; }
  else if(n>0) s+=NUM1[n];
  return s;
}
/* đổi số thành chữ để trình đọc không đọc rời từng chữ số, tránh đọc sai/lẫn trong câu */
function numToWords(n){
  n=Math.round(n);
  if(n===0) return 'zero';
  if(n<0) return 'minus '+numToWords(-n);
  if(n>=1000000000) return 'a very large number';
  var parts=[];
  if(n>=1000000){ parts.push(say3(Math.floor(n/1000000))+' million'); n%=1000000; }
  if(n>=1000){ parts.push(say3(Math.floor(n/1000))+' thousand'); n%=1000; }
  if(n>0) parts.push(say3(n));
  return parts.join(' ');
}
function clean(t){
  var s=String(t==null?'':t);
  s=s.replace(/<[^>]*>/g,' ');
  s=s.replace(/\(\s*\d+\s*\)\s*_+/g,' blank ').replace(/_{2,}/g,' blank ');
  try{ s=s.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2B00-\u2BFF\u2190-\u21FF\u2705\u274C]/gu,' '); }catch(e){}
  s=s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,', ');
  s=s.replace(/&/g,' and ');
  /* $12.50 -> "12 dollars and 50 cents"; $12 -> "12 dollars" */
  s=s.replace(/\$\s*(\d[\d,]*)(?:\.(\d{1,2}))?/g,function(m,a,b){
    var d=parseInt(a.replace(/,/g,''),10); var out=numToWords(d)+' dollar'+(d===1?'':'s');
    if(b){ var c=parseInt(b.length===1?b+'0':b,10); if(c>0) out+=' and '+numToWords(c)+' cent'+(c===1?'':'s'); }
    return out;
  });
  /* 25% -> "25 percent" */
  s=s.replace(/(\d[\d,]*)\s*%/g,function(m,a){ return numToWords(parseInt(a.replace(/,/g,''),10))+' percent'; });
  /* các số nguyên độc lập còn lại (ví dụ trong câu trắc nghiệm) đổi sang chữ để đọc trơn tru */
  s=s.replace(/\b\d{1,9}\b/g,function(m){ return numToWords(parseInt(m,10)); });
  s=s.replace(/[\u0250-\u02FF\u0300-\u036F]/g,'').replace(/[\/\[\]{}<>|*#~^=+\\]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function clearPlaying(){
  qsa('.spk.playing,.btn-all.playing').forEach(function(el){ el.classList.remove('playing'); });
  qsa('.now').forEach(function(el){ el.classList.remove('now'); });
}
/* trả về true nếu lúc gọi đang có tiếng đọc dở */
function stopSpeak(){
  token++; clearInterval(wd); UTT=[];
  var busy=false;
  try{ if(hasTTS()){ var sy=window.speechSynthesis; busy=!!(sy.speaking||sy.pending); sy.cancel(); } }catch(e){}
  clearPlaying();
  return busy;
}
/* Mở khóa âm thanh của iPhone bằng một câu im lặng trong lần chạm đầu tiên */
function unlockTTS(){
  if(unlocked||!hasTTS()) return; unlocked=true;
  try{ var u=new window.SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }catch(e){}
}
function markNow(id){
  qsa('.now').forEach(function(el){ el.classList.remove('now'); });
  if(!id) return; var r=document.getElementById(id);
  if(r){ r.classList.add('now'); try{ var bb=r.getBoundingClientRect(); if(bb.top<110||bb.bottom>window.innerHeight-20) r.scrollIntoView({block:'center'}); }catch(e){} }
}
function speakItems(items, opts){
  opts=opts||{};
  if(!hasTTS()){ notice(MSG.noTTS); return; }
  var wasOn = opts.btn && opts.btn.classList.contains('playing');
  var busy=stopSpeak();
  if(wasOn) return;                       // bấm lần nữa = dừng
  unlocked=true;
  var tok=token;
  refreshVoices();
  if(voicesTotal>0 && enTotal===0){ notice(MSG.noVoice,9000); return; }
  if(opts.btn) opts.btn.classList.add('playing');
  var syn=window.speechSynthesis;
  function run(){
    if(tok!==token) return;
    try{ if(syn.paused) syn.resume(); }catch(e){}
    var list=[]; UTT=list;
    items.forEach(function(it,i){
      var text=clean(it.text); if(!text) return;
      var u=new window.SpeechSynthesisUtterance(text);
      var v = it.voice || voiceFor(it.g||settings.reader);
      if(v){ u.voice=v; u.lang=v.lang; } else { u.lang='en-US'; }
      u.rate=settings.rate;
      u.onstart=function(){ if(tok===token) markNow(opts.rows&&opts.rows[i]); };
      u.onend=function(){ if(tok===token && u===list[list.length-1]) clearPlaying(); };
      u.onerror=function(e){
        if(tok!==token) return; var er=e&&e.error;
        if(er==='not-allowed'){ stopSpeak(); notice(MSG.tapAgain); }
      };
      list.push(u);
    });
    list.forEach(function(u){ try{ syn.speak(u); }catch(err){ stopSpeak(); notice(MSG.noTTS); } });
    /* phòng khi iPhone không báo "đã đọc xong": tự trả nút về trạng thái nghỉ */
    var idle=0, t0=Date.now(); clearInterval(wd);
    wd=setInterval(function(){
      if(tok!==token){ clearInterval(wd); return; }
      if(Date.now()-t0<1500) return;
      if(!syn.speaking && !syn.pending){ idle++; if(idle>=2){ clearInterval(wd); clearPlaying(); } } else idle=0;
    },600);
  }
  /* iPhone hay bỏ qua câu mới nếu vừa hủy câu cũ ngay lập tức, nên chờ một nhịp ngắn */
  if(busy) setTimeout(run,140); else run();
}

function wrapWords(text,L){
  if(!L._re){
    var map={}; L.vocab.forEach(function(v,i){ (v.f||[v.w]).forEach(function(f){ map[f.toLowerCase()]=i; }); });
    var keys=Object.keys(map).sort(function(a,b){ return b.length-a.length; }).map(escRe);
    L._map=map; L._re=new RegExp('\\b('+keys.join('|')+')\\b','gi');
  }
  var re=L._re, out='', last=0, m; re.lastIndex=0;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    out+='<span class="w" role="button" tabindex="0" data-act="word" data-i="'+L._map[m[0].toLowerCase()]+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

function copyText(txt){
  var done=function(){ notice('Đã sao chép. Mở Claude và dán vào ô chat để bắt đầu luyện nói.'); };
  var fallback=function(){
    var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ notice('Chưa sao chép được. Bạn hãy nhấn giữ và sao chép thủ công nhé.'); }
    document.body.removeChild(ta);
  };
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,fallback); } else fallback(); }catch(e){ fallback(); }
}

function tabQuiz(L){
  if(!QS||QS.id!==L.id) QS={id:L.id,p:0,ans:{},done:false,finished:false,cd:0};
  var st=QS, h='<div class="h2" style="margin-top:.4rem">Trắc nghiệm</div>';
  if(st.finished){
    return h+'<div class="card result"><div class="big">Hoàn thành!</div><p>Bạn đã làm hết 3 đoạn của bài này. Bài kế tiếp cùng chủ đề sẽ có khi Claude cập nhật bài học.</p><button type="button" class="btn pri block" data-act="qagain">Làm lại 3 đoạn</button><div style="height:.5rem"></div><button type="button" class="btn block" data-act="topic" data-key="'+esc(L.topic)+'">Về danh sách bài</button></div>';
  }
  var P=L.quiz[st.p], ss=P.sentences;
  var para=ss.map(function(q,i){
    var t=esc(q.t);
    return t.replace(/\((\d+)\)_+/g,function(m,n){
      var a=st.ans[n-1], qq=ss[n-1];
      if(a===undefined) return '<span class="blank">('+n+')___</span>';
      return '<span class="filled '+(a===qq.a?'ok':'bad')+'">('+n+') '+esc(qq.o[a])+'</span>';
    });
  }).join(' ');
  h+='<div class="muted small">Đoạn '+(st.p+1)+'/3 · '+esc(P.title)+'</div>';
  h+='<div class="card"><div style="margin-bottom:.4rem">'+spk(ss.map(function(q){ return q.t; }).join(' '),settings.reader)+'</div><div class="qtext">'+para+'</div></div>';
  var L3=['a','b','c'], answered=0, correct=0;
  ss.forEach(function(q,i){
    var a=st.ans[i]; if(a!==undefined){ answered++; if(a===q.a) correct++; }
    h+='<div class="qb"><div class="qn">'+(i+1)+'/</div><div class="opts">';
    q.o.forEach(function(o,j){
      var cls='opt'; if(a!==undefined){ if(j===q.a) cls+=' ok'; else if(j===a) cls+=' bad'; }
      h+='<button type="button" class="'+cls+'" data-act="pick" data-n="'+i+'" data-o="'+j+'"'+(a!==undefined?' disabled':'')+'><b>'+L3[j]+'</b>-'+esc(o)+'</button>';
    });
    h+='</div>';
    if(a!==undefined) h+='<div class="why '+(a===q.a?'okc':'badc')+'">'+(a===q.a?'✅ Đúng! ':'❌ Chưa đúng. Đáp án: '+L3[q.a]+'-'+esc(q.o[q.a])+'. ')+esc(q.why)+'</div>';
    h+='</div>';
  });
  if(answered===ss.length){
    st.done=true;
    h+='<div class="card result" id="qres"><div class="big">'+correct+'/'+ss.length+'</div><p>Bạn làm đúng '+correct+' trên '+ss.length+' câu.</p>'+
       '<p class="muted" id="qcd">'+(st.p<2?'Tự chuyển sang đoạn tiếp theo sau '+st.cd+' giây':'Tự chuyển sang bài kế tiếp sau '+st.cd+' giây')+'</p>'+
       '<button type="button" class="btn pri block" data-act="qnext">'+(st.p<2?'Sang đoạn tiếp theo':'Sang bài kế tiếp')+'</button><div style="height:.5rem"></div><button type="button" class="btn block" data-act="qstay">Ở lại xem lại</button></div>';
  }
  return h;
}
function quizPick(n,o){
  var L=lessonById(S.lesson), st=QS; if(!st||st.done||st.ans[n]!==undefined) return;
  st.ans[n]=o; var P=L.quiz[st.p], ss=P.sentences;

  if(all){
    var c=0; ss.forEach(function(q,i){ if(st.ans[i]===q.a) c++; });
    scores[L.id+':'+st.p]={c:c,t:ss.length,ts:Date.now()}; store.set('scores',scores);
    st.cd=10;
  }
  var y=window.pageYOffset; renderTab(); try{ window.scrollTo(0,y); }catch(e){}

    },1000);
  }
}

    case 'tab': stopSpeak(); clearQT(); closeSheet(); S.tab=+el.getAttribute('data-n'); renderTab(); try{ window.scrollTo(0,0); }catch(err){} break;
    case 'trans': S.trans=!S.trans; stopSpeak(); renderTab(); break;
    case 'learn': var L=lessonById(S.lesson); if(L){ if(learned[L.id]) delete learned[L.id]; else learned[L.id]=true; store.set('learned',learned); render(); } break;
    case 'say': var it=SAY[+el.getAttribute('data-i')]; if(it) speakItems([{text:it.text,g:it.g}],{btn:el}); break;
    case 'sayall': var g=SAYALL[+el.getAttribute('data-i')]; if(g) speakItems(g.items,{btn:el,rows:g.rows}); break;
    case 'word': openWord(+el.getAttribute('data-i')); break;
    case 'closesheet': closeSheet(); break;
    case 'theme': settings.theme=el.getAttribute('data-v'); saveSettings(); applySettings(); render(); break;
    case 'font': settings.font=+el.getAttribute('data-v'); saveSettings(); applySettings(); render(); break;
    case 'rate': settings.rate=+el.getAttribute('data-v'); saveSettings(); render(); break;
    case 'reader': settings.reader=el.getAttribute('data-v'); saveSettings(); render(); break;
    case 'revoice': refreshVoices(); render(); break;
    case 'vtry': var c=VREG[+el.getAttribute('data-i')]; if(c) speakItems([{text:'Hello! Nice to meet you. Let\u2019s practice English together.',voice:c.v}],{btn:el}); break;
    case 'vpick': var c2=VREG[+el.getAttribute('data-i')], gg=el.getAttribute('data-g'); if(c2){ if(gg==='m') settings.voiceM=c2.name; else settings.voiceF=c2.name; saveSettings(); var y=window.pageYOffset; render(); try{ window.scrollTo(0,y); }catch(err){} } break;
    case 'stopsp': if(SP.ctl){ try{ SP.ctl.abort(); }catch(err){} } break;
    case 'pick': quizPick(+el.getAttribute('data-n'), +el.getAttribute('data-o')); break;
    case 'qnext': quizAdvance(); break;
    case 'qstay': clearQT(); var cd=document.getElementById('qcd'); if(cd) cd.textContent='Bạn cứ xem lại thoải mái nhé.'; break;
    case 'qagain': QS={id:S.lesson,p:0,ans:{},done:false,finished:false,cd:0}; renderTab(); try{ window.scrollTo(0,0); }catch(err){} break;
  }
});
document.addEventListener('input',function(e){ if(e.target&&e.target.id==='draft') SP.draft=e.target.value; if(e.target&&e.target.id==='fcdraft') FC.draft=e.target.value; });
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('w')){ e.preventDefault(); e.target.click(); } });

render();
window.__app={S:S};
})();
</script>
