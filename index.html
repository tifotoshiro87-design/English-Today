tes, and I still saved money.", "vi": "Thật sự đúng vậy. Mười lăm phút thôi, mà mình vẫn tiết kiệm được tiền."}, {"who": "Daniel", "g": "m", "en": "I never plan my meals, so I always end up staring at an empty fridge.", "vi": "Mình chẳng bao giờ lên kế hoạch bữa ăn, nên lúc nào cũng đứng nhìn tủ lạnh trống trơn."}, {"who": "Olivia", "g": "f", "en": "You should try planning just a few dinners for the week.", "vi": "Cậu nên thử lên kế hoạch chỉ vài bữa tối trong tuần thôi."}, {"who": "Daniel", "g": "m", "en": "Maybe I will. Cooking feels less stressful when I know what to make.", "vi": "Chắc mình sẽ thử. Nấu ăn cảm thấy đỡ căng thẳng hơn khi mình biết mình sẽ làm gì."}, {"who": "Olivia", "g": "f", "en": "Exactly. I also put on a podcast while I cook, it makes it more fun.", "vi": "Chính xác đấy. Mình cũng bật podcast khi nấu, nó khiến việc nấu ăn thú vị hơn."}, {"who": "Daniel", "g": "m", "en": "I might try that too, instead of just staring at the pan.", "vi": "Chắc mình cũng sẽ thử cách đó, thay vì cứ nhìn chằm chằm vào cái chảo."}, {"who": "Olivia", "g": "f", "en": "Want to cook together sometime? It's more fun with two people.", "vi": "Cậu có muốn nấu ăn cùng nhau lúc nào đó không? Có hai người vui hơn nhiều."}, {"who": "Daniel", "g": "m", "en": "I'd like that. Maybe this weekend?", "vi": "Mình thích ý đó đấy. Cuối tuần này được không?"}, {"who": "Olivia", "g": "f", "en": "Perfect, let's cook something simple together.", "vi": "Tuyệt, cùng nấu món gì đó đơn giản nhé."}], "vocab": [{"w": "chore", "f": ["chore", "chores"], "pos": "n", "ipa": "tʃɔːr", "vi": "việc vặt trong nhà", "ex": "Cooking every night can feel like a chore.", "exVi": "Nấu ăn mỗi tối có thể cảm thấy như một việc vặt nặng nề."}, {"w": "leftover", "f": ["leftover", "leftovers"], "pos": "n/adj", "ipa": "ˈleftoʊvər", "vi": "đồ ăn thừa", "ex": "I used the leftover rice to make fried rice.", "exVi": "Mình dùng cơm thừa để làm cơm chiên."}, {"w": "ingredient", "f": ["ingredient", "ingredients"], "pos": "n", "ipa": "ɪnˈɡriːdiənt", "vi": "nguyên liệu", "ex": "Keep a few simple ingredients at home.", "exVi": "Giữ sẵn vài nguyên liệu đơn giản trong nhà."}, {"w": "batch", "f": ["batch", "batches"], "pos": "n", "ipa": "bætʃ", "vi": "một mẻ, một lô", "ex": "I cooked a big batch of soup for the whole week.", "exVi": "Mình nấu một nồi súp lớn cho cả tuần."}, {"w": "decent", "f": ["decent"], "pos": "adj", "ipa": "ˈdiːsənt", "vi": "tạm ổn, khá được", "ex": "Eggs and rice can make a decent meal.", "exVi": "Trứng và cơm có thể làm nên một bữa ăn tạm ổn."}, {"w": "stressful", "f": ["stressful"], "pos": "adj", "ipa": "ˈstresfəl", "vi": "căng thẳng", "ex": "Cooking doesn't have to be stressful.", "exVi": "Nấu ăn không nhất thiết phải căng thẳng."}, {"w": "switch off", "f": ["switch off", "switches off"], "pos": "phrase", "ipa": "swɪtʃ ɒf", "vi": "ngừng nghĩ về, thư giãn đầu óc", "ex": "Cooking helps me switch off from work.", "exVi": "Nấu ăn giúp mình ngừng nghĩ về công việc."}, {"w": "quality time", "f": ["quality time"], "pos": "n", "ipa": "ˈkwɒləti taɪm", "vi": "thời gian chất lượng bên nhau", "ex": "We spent quality time cooking together.", "exVi": "Chúng tôi đã có thời gian chất lượng bên nhau khi cùng nấu ăn."}, {"w": "in advance", "f": ["in advance"], "pos": "phrase", "ipa": "ɪn ədˈvæns", "vi": "trước, từ trước", "ex": "I plan my meals in advance every Sunday.", "exVi": "Mình lên kế hoạch bữa ăn từ trước vào mỗi Chủ nhật."}, {"w": "fridge", "f": ["fridge", "fridges"], "pos": "n", "ipa": "frɪdʒ", "vi": "tủ lạnh", "ex": "I stood in front of the fridge, not sure what to cook.", "exVi": "Mình đứng trước tủ lạnh, không chắc nên nấu gì."}], "grammar": [{"title": "That way / this way để nói về kết quả", "formula": "That way/This way + mệnh đề kết quả", "use": "Dùng để giải thích lợi ích hoặc kết quả của một hành động vừa được nhắc tới. Rất tự nhiên trong văn nói.", "examples": [{"en": "Plan your meals in advance. That way, you won't waste time deciding.", "vi": "Lên kế hoạch bữa ăn từ trước. Như vậy, bạn sẽ không mất thời gian phân vân."}, {"en": "Cook a bigger batch. This way, you'll have leftovers for tomorrow.", "vi": "Nấu một mẻ lớn hơn. Như vậy, bạn sẽ có đồ ăn thừa cho ngày mai."}, {"en": "Write it down. That way, you won't forget.", "vi": "Viết nó ra. Như vậy, bạn sẽ không quên."}]}, {"title": "Instead of + V-ing", "formula": "instead of + V-ing", "use": "Dùng để nói 'thay vì làm gì đó'. Sau 'instead of' luôn dùng động từ dạng V-ing hoặc danh từ, không dùng động từ nguyên mẫu.", "examples": [{"en": "I put on a podcast instead of staring at the pan.", "vi": "Mình bật podcast lên thay vì cứ nhìn chằm chằm vào cái chảo."}, {"en": "We cooked at home instead of ordering food.", "vi": "Chúng tôi nấu ăn ở nhà thay vì gọi đồ ăn."}, {"en": "She read a book instead of watching TV.", "vi": "Cô ấy đọc sách thay vì xem TV."}]}], "phrases": [{"p": "I get it", "vi": "mình hiểu mà", "ex": "I get it, cooking after work is tough.", "exVi": "Mình hiểu mà, nấu ăn sau giờ làm rất mệt.", "ctx": "Thân mật, dùng khi đồng cảm với ai đó."}, {"p": "end up doing something", "vi": "cuối cùng lại làm gì đó (ngoài dự tính)", "ex": "I always end up ordering food when I'm tired.", "exVi": "Mình lúc nào cũng cuối cùng lại đặt đồ ăn khi mệt.", "ctx": "Thân mật, dùng khi kết quả không như dự định ban đầu."}, {"p": "sounds easy enough", "vi": "nghe cũng dễ đấy chứ", "ex": "That recipe sounds easy enough to try.", "exVi": "Công thức đó nghe cũng dễ để thử đấy.", "ctx": "Thân mật, dùng khi thấy việc gì đó không quá khó."}, {"p": "stare at", "vi": "nhìn chằm chằm vào", "ex": "I just stood there staring at the fridge.", "exVi": "Mình chỉ đứng đó nhìn chằm chằm vào tủ lạnh.", "ctx": "Trung tính, mô tả hành động nhìn lâu, không rời mắt."}, {"p": "put on (music/a podcast)", "vi": "bật lên (nhạc/podcast)", "ex": "I always put on some music while cooking.", "exVi": "Mình lúc nào cũng bật nhạc lên khi nấu ăn.", "ctx": "Thân mật, dùng khi bật thiết bị phát nhạc/âm thanh."}, {"p": "I'd like that", "vi": "mình thích ý đó đấy", "ex": "Want to cook together? — I'd like that.", "exVi": "Muốn nấu ăn cùng nhau không? — Mình thích ý đó đấy.", "ctx": "Thân mật, dùng khi vui vẻ đồng ý một lời mời."}, {"p": "make a big difference", "vi": "tạo ra khác biệt lớn", "ex": "Keeping simple ingredients at home makes a big difference.", "exVi": "Giữ sẵn nguyên liệu đơn giản trong nhà tạo ra khác biệt lớn.", "ctx": "Trung tính, dùng khi một thay đổi nhỏ mang lại hiệu quả lớn."}, {"p": "the last thing I want to do", "vi": "điều cuối cùng tôi muốn làm", "ex": "Cooking is the last thing I want to do after work.", "exVi": "Nấu ăn là điều cuối cùng mình muốn làm sau giờ làm việc.", "ctx": "Thân mật, dùng khi rất không muốn làm việc gì đó."}, {"p": "it still counts", "vi": "vẫn được tính, vẫn có giá trị", "ex": "Even a simple sandwich still counts as a home-cooked meal.", "exVi": "Kể cả một chiếc sandwich đơn giản cũng vẫn tính là bữa ăn tự nấu.", "ctx": "Thân mật, dùng để trấn an rằng nỗ lực nhỏ vẫn có giá trị."}, {"p": "more fun with two people", "vi": "vui hơn khi có hai người", "ex": "Cooking is more fun with two people.", "exVi": "Nấu ăn vui hơn khi có hai người cùng làm.", "ctx": "Thân mật, dùng khi rủ ai đó cùng làm việc gì đó."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Plan your meals in advance. That (1)___, you won't waste time.", "o": ["way", "time", "thing"], "a": 0, "why": "Cụm cố định 'that way' dùng để nói về kết quả."}, {"t": "I put on a podcast (2)___ staring at the pan.", "o": ["instead", "instead of", "rather"], "a": 1, "why": "Cấu trúc 'instead of + V-ing'."}, {"t": "Eggs and rice can (3)___ into a decent meal.", "o": ["turn", "turns", "turning"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: turn."}, {"t": "Cooking with a roommate turns a chore into quality (4)___.", "o": ["time", "times", "timing"], "a": 0, "why": "Danh từ không đếm được 'time' giữ nguyên số ít."}, {"t": "The goal isn't to cook every night; it's just to make cooking (5)___.", "o": ["easy", "easier", "easiest"], "a": 1, "why": "So sánh hơn 'easier' vì đang so sánh với trạng thái trước đó."}, {"t": "Many people say cooking helps them (6)___ off from work.", "o": ["switch", "switches", "switched"], "a": 0, "why": "Sau 'helps them' dùng động từ nguyên mẫu: switch."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Daniel said he was too tired (1)___ cook.", "o": ["to", "for", "of"], "a": 0, "why": "Cấu trúc 'too...to V' diễn tả 'quá... để...'."}, {"t": "Olivia said she (2)___ leftover rice at home.", "o": ["have", "has", "had"], "a": 2, "why": "Câu tường thuật lùi về quá khứ: had."}, {"t": "He never plans his meals, so he always ends (3)___ staring at an empty fridge.", "o": ["up", "on", "in"], "a": 0, "why": "Cụm động từ cố định 'end up'."}, {"t": "She suggested (4)___ together sometime.", "o": ["cook", "to cook", "cooking"], "a": 2, "why": "Sau 'suggest' dùng V-ing: cooking."}, {"t": "He said he (5)___ try putting on music while cooking.", "o": ["might", "must", "shall"], "a": 0, "why": "'Might' diễn tả dự định chưa chắc chắn."}, {"t": "They agreed to cook something simple (6)___.", "o": ["together", "each other", "with"], "a": 0, "why": "'Together' dùng để nói 'cùng nhau', đứng cuối câu."}]}]}, {"id": "B1-HEALTH-002", "topic": "HEALTH", "n": 2, "level": "B1", "title": "Why Drinking Water Matters", "titleVi": "Vì sao uống nước lại quan trọng", "passage": [{"en": "Water makes up more than half of the human body, yet many people still don't drink enough of it.", "vi": "Nước chiếm hơn một nửa cơ thể con người, vậy mà nhiều người vẫn không uống đủ."}, {"en": "You lose water all day long, through sweat, breathing, and simply going to the bathroom.", "vi": "Bạn mất nước cả ngày, qua mồ hôi, hơi thở, và đơn giản là đi vệ sinh."}, {"en": "If you don't replace that water, your body starts to feel the effects fairly quickly.", "vi": "Nếu bạn không bù lại lượng nước đó, cơ thể sẽ bắt đầu cảm nhận hậu quả khá nhanh."}, {"en": "Even mild dehydration can make you feel tired, dizzy, or unable to concentrate.", "vi": "Kể cả mất nước nhẹ cũng có thể khiến bạn cảm thấy mệt, chóng mặt, hoặc không thể tập trung."}, {"en": "A common myth is that thirst is the first sign your body needs water.", "vi": "Một hiểu lầm phổ biến là cơn khát là dấu hiệu đầu tiên cho thấy cơ thể cần nước."}, {"en": "Actually, by the time you feel thirsty, you are often already a little dehydrated.", "vi": "Thực ra, đến khi bạn cảm thấy khát, cơ thể thường đã hơi thiếu nước rồi."}, {"en": "That's why many doctors suggest drinking water regularly throughout the day, not just when you're thirsty.", "vi": "Đó là lý do nhiều bác sĩ khuyên nên uống nước đều đặn suốt cả ngày, không chỉ khi thấy khát."}, {"en": "A simple way to check is to look at the color of your urine; pale yellow usually means you're doing fine.", "vi": "Một cách đơn giản để kiểm tra là nhìn màu nước tiểu; màu vàng nhạt thường có nghĩa là bạn đang ổn."}, {"en": "The exact amount of water each person needs can depend on their size, activity level, and the weather.", "vi": "Lượng nước chính xác mỗi người cần có thể tùy vào kích thước cơ thể, mức vận động và thời tiết."}, {"en": "A common guideline is about eight glasses a day, though it's more of a general rule than a strict law.", "vi": "Một hướng dẫn phổ biến là khoảng tám ly một ngày, dù đó chỉ là quy tắc chung hơn là luật cứng nhắc."}, {"en": "Food also provides some water, especially fruits and vegetables like watermelon and cucumber.", "vi": "Thức ăn cũng cung cấp một phần nước, đặc biệt là trái cây và rau như dưa hấu và dưa leo."}, {"en": "For people who find plain water boring, adding lemon or mint can make it more enjoyable to drink.", "vi": "Với những người thấy nước lọc nhạt nhẽo, thêm chanh hoặc bạc hà có thể khiến nước dễ uống hơn."}, {"en": "Carrying a reusable water bottle is one of the easiest ways to remember to drink more.", "vi": "Mang theo một chai nước có thể tái sử dụng là một trong những cách dễ nhất để nhớ uống nhiều nước hơn."}, {"en": "Some people even set reminders on their phone to take a few sips every hour.", "vi": "Một số người thậm chí đặt lời nhắc trên điện thoại để nhấp vài ngụm nước mỗi giờ."}, {"en": "Staying properly hydrated can improve your energy, your skin, and even your mood.", "vi": "Giữ đủ nước có thể cải thiện năng lượng, làn da, và cả tâm trạng của bạn."}, {"en": "It's a small habit, but over time, it can make a real difference in how you feel every day.", "vi": "Đó là một thói quen nhỏ, nhưng theo thời gian, nó có thể tạo ra khác biệt thật sự trong cảm giác của bạn mỗi ngày."}], "dialogue": [{"who": "Noah", "g": "m", "en": "Ugh, I have a headache again. This is the third time this week.", "vi": "Ugh, mình lại đau đầu nữa rồi. Đây là lần thứ ba trong tuần này."}, {"who": "Ella", "g": "f", "en": "How much water have you had today?", "vi": "Hôm nay cậu uống bao nhiêu nước rồi?"}, {"who": "Noah", "g": "m", "en": "Honestly? Just one cup of coffee this morning.", "vi": "Thật lòng thì mới có một ly cà phê sáng nay thôi."}, {"who": "Ella", "g": "f", "en": "That might be your problem right there.", "vi": "Có khi đó chính là vấn đề của cậu đấy."}, {"who": "Noah", "g": "m", "en": "You think a headache is just from not drinking water?", "vi": "Cậu nghĩ đau đầu chỉ là do không uống nước hả?"}, {"who": "Ella", "g": "f", "en": "It happens to me all the time. Try drinking a big glass now.", "vi": "Chuyện đó xảy ra với mình suốt. Thử uống một ly lớn ngay bây giờ đi."}, {"who": "Noah", "g": "m", "en": "Fine, I'll try it. I honestly forget to drink water most days.", "vi": "Được, mình sẽ thử. Thật lòng thì hầu như ngày nào mình cũng quên uống nước."}, {"who": "Ella", "g": "f", "en": "I used to be the same way until I started carrying a bottle everywhere.", "vi": "Mình cũng từng vậy cho đến khi bắt đầu mang theo chai nước khắp nơi."}, {"who": "Noah", "g": "m", "en": "Does that actually help?", "vi": "Cách đó có thật sự hiệu quả không?"}, {"who": "Ella", "g": "f", "en": "A lot, actually. If it's right in front of me, I drink it without thinking.", "vi": "Hiệu quả lắm đấy. Nếu nó ngay trước mặt, mình uống mà không cần nghĩ."}, {"who": "Noah", "g": "m", "en": "Maybe I should get a bottle too. What about flavor, though? Plain water is so boring.", "vi": "Chắc mình cũng nên mua một chai. Nhưng còn hương vị thì sao? Nước lọc nhạt quá."}, {"who": "Ella", "g": "f", "en": "Try adding a slice of lemon. It makes a big difference.", "vi": "Thử thêm một lát chanh xem. Nó tạo khác biệt lớn lắm."}, {"who": "Noah", "g": "m", "en": "Okay, I'll give it a shot. Twenty minutes later.", "vi": "Được, mình sẽ thử xem. Hai mươi phút sau."}, {"who": "Noah", "g": "m", "en": "Actually, my headache is already a little better.", "vi": "Thật ra, đầu mình đã đỡ đau hơn một chút rồi."}, {"who": "Ella", "g": "f", "en": "See? Water fixes more problems than people think.", "vi": "Thấy chưa? Nước giải quyết được nhiều vấn đề hơn người ta nghĩ đấy."}], "vocab": [{"w": "dehydrated", "f": ["dehydrated"], "pos": "adj", "ipa": "diːˈhaɪdreɪtɪd", "vi": "mất nước, thiếu nước", "ex": "You can feel dizzy when you're dehydrated.", "exVi": "Bạn có thể thấy chóng mặt khi cơ thể mất nước."}, {"w": "thirsty", "f": ["thirsty"], "pos": "adj", "ipa": "ˈθɜːrsti", "vi": "khát nước", "ex": "I always feel thirsty after exercising.", "exVi": "Tôi luôn thấy khát sau khi tập thể dục."}, {"w": "sweat", "f": ["sweat", "sweats", "sweating"], "pos": "n/v", "ipa": "swet", "vi": "mồ hôi; đổ mồ hôi", "ex": "You lose water through sweat when it's hot.", "exVi": "Bạn mất nước qua mồ hôi khi trời nóng."}, {"w": "concentrate", "f": ["concentrate", "concentrates", "concentrated", "concentrating"], "pos": "v", "ipa": "ˈkɑːnsəntreɪt", "vi": "tập trung", "ex": "It's hard to concentrate when you're dehydrated.", "exVi": "Rất khó để tập trung khi cơ thể bạn mất nước."}, {"w": "guideline", "f": ["guideline", "guidelines"], "pos": "n", "ipa": "ˈɡaɪdlaɪn", "vi": "hướng dẫn, chỉ dẫn", "ex": "Eight glasses a day is a common guideline.", "exVi": "Tám ly một ngày là một hướng dẫn phổ biến."}, {"w": "hydrated", "f": ["hydrated"], "pos": "adj", "ipa": "ˈhaɪdreɪtɪd", "vi": "đủ nước, được cấp nước", "ex": "Staying hydrated helps you feel more energetic.", "exVi": "Giữ đủ nước giúp bạn cảm thấy tràn đầy năng lượng hơn."}, {"w": "reusable", "f": ["reusable"], "pos": "adj", "ipa": "riːˈjuːzəbl", "vi": "có thể tái sử dụng", "ex": "I carry a reusable water bottle every day.", "exVi": "Tôi mang theo một chai nước có thể tái sử dụng mỗi ngày."}, {"w": "reminder", "f": ["reminder", "reminders"], "pos": "n", "ipa": "rɪˈmaɪndər", "vi": "lời nhắc", "ex": "I set a reminder to drink water every hour.", "exVi": "Tôi đặt lời nhắc để uống nước mỗi giờ."}, {"w": "mild", "f": ["mild"], "pos": "adj", "ipa": "maɪld", "vi": "nhẹ, không nghiêm trọng", "ex": "Even mild dehydration can cause a headache.", "exVi": "Kể cả mất nước nhẹ cũng có thể gây đau đầu."}, {"w": "myth", "f": ["myth", "myths"], "pos": "n", "ipa": "mɪθ", "vi": "quan niệm sai lầm, huyền thoại", "ex": "It's a myth that thirst is the first sign of dehydration.", "exVi": "Việc coi khát là dấu hiệu đầu tiên của mất nước là một quan niệm sai lầm."}], "grammar": [{"title": "By the time + mệnh đề (thì hoàn thành)", "formula": "By the time + S + V (hiện tại đơn), S + have/has + V3", "use": "Dùng để nói một việc đã hoàn thành trước một mốc thời gian hoặc sự kiện khác. Rất tự nhiên khi giải thích chuỗi sự việc.", "examples": [{"en": "By the time you feel thirsty, you are often already dehydrated.", "vi": "Đến khi bạn cảm thấy khát, cơ thể thường đã thiếu nước rồi."}, {"en": "By the time we arrived, the meeting had already started.", "vi": "Đến khi chúng tôi đến, cuộc họp đã bắt đầu rồi."}, {"en": "By the time she finishes work, it will be dark outside.", "vi": "Đến khi cô ấy làm xong việc, trời sẽ tối rồi."}]}, {"title": "Used to + V (thói quen trong quá khứ)", "formula": "S + used to + động từ nguyên mẫu", "use": "Dùng để nói về một thói quen hoặc trạng thái trong quá khứ, không còn đúng ở hiện tại.", "examples": [{"en": "I used to be the same way until I started carrying a bottle.", "vi": "Mình cũng từng vậy cho đến khi bắt đầu mang theo chai nước."}, {"en": "She used to drink five cups of coffee a day.", "vi": "Cô ấy từng uống năm ly cà phê mỗi ngày."}, {"en": "We used to live in a small apartment downtown.", "vi": "Chúng tôi từng sống trong một căn hộ nhỏ ở trung tâm."}]}], "phrases": [{"p": "right there", "vi": "chính là đó, ngay chỗ đó", "ex": "That might be your problem right there.", "exVi": "Có khi đó chính là vấn đề của cậu đấy.", "ctx": "Thân mật, dùng để nhấn mạnh điều vừa chỉ ra."}, {"p": "give it a shot", "vi": "thử xem sao", "ex": "I've never liked plain water, but I'll give it a shot.", "exVi": "Mình chưa bao giờ thích nước lọc, nhưng mình sẽ thử xem sao.", "ctx": "Thân mật, dùng khi định thử điều gì mới."}, {"p": "make a big difference", "vi": "tạo ra khác biệt lớn", "ex": "Adding lemon makes a big difference.", "exVi": "Thêm chanh vào tạo ra khác biệt lớn.", "ctx": "Trung tính, dùng khi một thay đổi nhỏ mang lại hiệu quả rõ rệt."}, {"p": "without thinking", "vi": "mà không cần nghĩ, theo phản xạ", "ex": "If the bottle is in front of me, I drink without thinking.", "exVi": "Nếu chai nước ngay trước mặt, mình uống mà không cần nghĩ.", "ctx": "Trung tính, dùng khi mô tả một hành động tự động, theo thói quen."}, {"p": "all the time", "vi": "suốt, thường xuyên", "ex": "That happens to me all the time.", "exVi": "Chuyện đó xảy ra với mình suốt.", "ctx": "Thân mật, dùng để nhấn mạnh tần suất cao."}, {"p": "twenty minutes later", "vi": "hai mươi phút sau", "ex": "Twenty minutes later, his headache was gone.", "exVi": "Hai mươi phút sau, cơn đau đầu của anh ấy đã hết.", "ctx": "Trung tính, dùng khi kể chuyện theo trình tự thời gian."}, {"p": "a little better", "vi": "đỡ hơn một chút", "ex": "After some water, I felt a little better.", "exVi": "Sau khi uống nước, mình thấy đỡ hơn một chút.", "ctx": "Thân mật, dùng khi tình trạng cải thiện nhẹ."}, {"p": "see?", "vi": "thấy chưa?", "ex": "See? Water fixes more than you think.", "exVi": "Thấy chưa? Nước giải quyết được nhiều hơn cậu nghĩ.", "ctx": "Rất thân mật, dùng khi chứng minh mình đúng một cách nhẹ nhàng."}, {"p": "more than people think", "vi": "nhiều hơn người ta nghĩ", "ex": "Sleep affects your mood more than people think.", "exVi": "Giấc ngủ ảnh hưởng đến tâm trạng nhiều hơn người ta nghĩ.", "ctx": "Trung tính, dùng khi nhấn mạnh một sự thật ít người để ý."}, {"p": "fix a problem", "vi": "giải quyết một vấn đề", "ex": "Sometimes water can fix a problem you didn't expect.", "exVi": "Đôi khi nước có thể giải quyết một vấn đề bạn không ngờ tới.", "ctx": "Trung tính, dùng khi nói về việc khắc phục sự cố."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "By the time you feel thirsty, you (1)___ already a little dehydrated.", "o": ["are", "were", "will"], "a": 0, "why": "'By the time' + hiện tại đơn, mệnh đề chính dùng hiện tại: are."}, {"t": "Even mild dehydration can (2)___ you feel tired.", "o": ["make", "makes", "made"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: make."}, {"t": "I (3)___ to forget to drink water every day.", "o": ["use", "used", "using"], "a": 1, "why": "'Used to + V' diễn tả thói quen trong quá khứ: used to."}, {"t": "A reusable bottle (4)___ you remember to drink more.", "o": ["help", "helps", "helping"], "a": 1, "why": "Chủ ngữ số ít 'a reusable bottle', hiện tại đơn thêm 's': helps."}, {"t": "Food also (5)___ some water, especially fruit.", "o": ["provide", "provides", "provided"], "a": 1, "why": "Chủ ngữ số ít 'food', hiện tại đơn thêm 's': provides."}, {"t": "Staying hydrated can (6)___ your energy and mood.", "o": ["improve", "improves", "improved"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: improve."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Ella asked Noah how much water he (1)___ that day.", "o": ["has had", "had had", "have"], "a": 1, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had had."}, {"t": "Noah said he (2)___ to drink water most days.", "o": ["forget", "forgets", "forgot"], "a": 2, "why": "Câu tường thuật lùi về quá khứ đơn: forgot."}, {"t": "Ella used to (3)___ the same way.", "o": ["be", "being", "been"], "a": 0, "why": "Sau 'used to' dùng động từ nguyên mẫu: be."}, {"t": "If it's right in front of her, she drinks it (4)___ thinking.", "o": ["without", "with", "by"], "a": 0, "why": "Cụm cố định 'without thinking'."}, {"t": "Noah decided to (5)___ it a shot.", "o": ["give", "gives", "gave"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: give."}, {"t": "Twenty minutes later, his headache was (6)___ better.", "o": ["a little", "a lot of", "many"], "a": 0, "why": "'A little better' nghĩa là đỡ hơn một chút."}]}]}, {"id": "B1-ENTERTAINMENT-002", "topic": "ENTERTAINMENT", "n": 2, "level": "B1", "title": "The Rise of Podcasts", "titleVi": "Sự trỗi dậy của podcast", "passage": [{"en": "Ten years ago, most people had never even heard the word 'podcast'.", "vi": "Mười năm trước, hầu hết mọi người thậm chí chưa từng nghe từ 'podcast'."}, {"en": "Today, millions of people listen to them every single day, often without leaving their couch.", "vi": "Ngày nay, hàng triệu người nghe podcast mỗi ngày, thường ngay tại nhà không cần đi đâu."}, {"en": "A podcast is basically a series of audio episodes that you can listen to whenever you want.", "vi": "Podcast về cơ bản là một chuỗi các tập âm thanh mà bạn có thể nghe bất cứ khi nào mình muốn."}, {"en": "Unlike traditional radio, there's no fixed schedule; you simply press play.", "vi": "Không như đài phát thanh truyền thống, podcast không có lịch cố định; bạn chỉ cần bấm play."}, {"en": "Topics range from true crime and comedy to history, science and personal stories.", "vi": "Chủ đề trải dài từ tội phạm có thật, hài kịch cho đến lịch sử, khoa học và những câu chuyện cá nhân."}, {"en": "One reason podcasts became so popular is that they fit perfectly into busy modern life.", "vi": "Một lý do khiến podcast trở nên phổ biến là chúng phù hợp hoàn hảo với cuộc sống hiện đại bận rộn."}, {"en": "People listen while commuting, cooking, cleaning, or exercising, turning boring tasks into something enjoyable.", "vi": "Người ta nghe khi đi làm, nấu ăn, dọn dẹp hay tập thể dục, biến những việc nhàm chán thành điều thú vị."}, {"en": "Unlike a video, a podcast doesn't need your eyes, so your hands and body stay free.", "vi": "Không như video, podcast không cần đến mắt bạn, nên tay và cơ thể vẫn được tự do."}, {"en": "Another reason for their popularity is how personal they feel.", "vi": "Một lý do khác khiến chúng được yêu thích là cảm giác gần gũi, cá nhân mà chúng mang lại."}, {"en": "Listening to two hosts chat feels almost like sitting in the room with old friends.", "vi": "Nghe hai người dẫn chương trình trò chuyện cảm giác gần như đang ngồi trong phòng với những người bạn cũ."}, {"en": "Because starting a podcast is cheap, almost anyone with a microphone and an idea can make one.", "vi": "Vì việc bắt đầu làm podcast rất rẻ, hầu như ai có micro và một ý tưởng cũng có thể làm được."}, {"en": "This has created an enormous variety, so there's usually something for every kind of listener.", "vi": "Điều này tạo ra một sự đa dạng khổng lồ, nên thường có điều gì đó cho mọi kiểu người nghe."}, {"en": "Of course, with so many podcasts out there, finding a good one can feel a little overwhelming.", "vi": "Tất nhiên, với quá nhiều podcast ngoài kia, tìm được một chương trình hay đôi khi có thể khiến choáng ngợp."}, {"en": "Many people rely on recommendations from friends rather than searching randomly.", "vi": "Nhiều người dựa vào lời giới thiệu từ bạn bè thay vì tự tìm kiếm ngẫu nhiên."}, {"en": "For language learners, podcasts can also be a surprisingly powerful tool.", "vi": "Với người học ngoại ngữ, podcast cũng có thể là một công cụ mạnh mẽ đến bất ngờ."}, {"en": "Hearing natural conversation, again and again, slowly trains the ear in a way textbooks simply can't.", "vi": "Nghe hội thoại tự nhiên lặp đi lặp lại dần dần rèn luyện đôi tai theo cách mà sách giáo khoa đơn giản là không làm được."}], "dialogue": [{"who": "Zoe", "g": "f", "en": "What are you listening to? You've had those headphones on all morning.", "vi": "Cậu đang nghe gì vậy? Cậu đeo tai nghe suốt cả sáng nay rồi."}, {"who": "Marcus", "g": "m", "en": "A true crime podcast. It's honestly kind of addictive.", "vi": "Một podcast tội phạm có thật. Thật sự khá gây nghiện đấy."}, {"who": "Zoe", "g": "f", "en": "I've never really gotten into podcasts. Where do you even start?", "vi": "Mình chưa bao giờ thật sự mê podcast. Bắt đầu từ đâu vậy?"}, {"who": "Marcus", "g": "m", "en": "Honestly, just pick a topic you already like. That's the easiest way in.", "vi": "Thật lòng thì cứ chọn một chủ đề cậu đã thích sẵn. Đó là cách dễ nhất để bắt đầu."}, {"who": "Zoe", "g": "f", "en": "I guess I like comedy and history.", "vi": "Chắc mình thích hài kịch và lịch sử."}, {"who": "Marcus", "g": "m", "en": "Perfect, there are tons of great ones for both. I'll send you a few links.", "vi": "Tuyệt, có vô số podcast hay cho cả hai chủ đề đó. Mình sẽ gửi cậu vài link."}, {"who": "Zoe", "g": "f", "en": "Thanks. When do you even find time to listen?", "vi": "Cảm ơn cậu. Mà cậu tìm thời gian nghe khi nào vậy?"}, {"who": "Marcus", "g": "m", "en": "Mostly while I'm cooking or on my commute. It doesn't take extra time at all.", "vi": "Chủ yếu là khi mình nấu ăn hoặc trên đường đi làm. Không tốn thêm thời gian gì cả."}, {"who": "Zoe", "g": "f", "en": "That's smart. I always thought I'd need to sit down and focus on it.", "vi": "Khôn đấy. Mình cứ nghĩ là phải ngồi xuống và tập trung nghe nó."}, {"who": "Marcus", "g": "m", "en": "Not at all. It's more like background company than something you have to focus on hard.", "vi": "Không đâu. Nó giống như một người bạn đồng hành hơn là thứ cậu phải tập trung căng thẳng."}, {"who": "Zoe", "g": "f", "en": "I might actually try one while I clean my apartment this weekend.", "vi": "Chắc mình sẽ thử nghe một cái khi dọn nhà cuối tuần này."}, {"who": "Marcus", "g": "m", "en": "Do it. Just start with one episode, you don't have to commit to the whole show.", "vi": "Thử đi. Chỉ cần bắt đầu với một tập, cậu không cần cam kết nghe hết cả chương trình."}, {"who": "Zoe", "g": "f", "en": "Good point. I always feel like I have to finish everything I start.", "vi": "Có lý đấy. Mình lúc nào cũng cảm thấy phải hoàn thành mọi thứ mình bắt đầu."}, {"who": "Marcus", "g": "m", "en": "With podcasts, it's totally fine to skip around and find what you actually like.", "vi": "Với podcast, hoàn toàn ổn nếu cậu nhảy cóc để tìm ra cái mình thật sự thích."}, {"who": "Zoe", "g": "f", "en": "Okay, you've convinced me. Send me those links.", "vi": "Được rồi, cậu thuyết phục mình rồi đấy. Gửi mình những link đó đi."}], "vocab": [{"w": "episode", "f": ["episode", "episodes"], "pos": "n", "ipa": "ˈepɪsoʊd", "vi": "tập (phim, podcast)", "ex": "I listened to a new episode on my way to work.", "exVi": "Tôi đã nghe một tập mới trên đường đi làm."}, {"w": "host", "f": ["host", "hosts"], "pos": "n", "ipa": "hoʊst", "vi": "người dẫn chương trình", "ex": "The podcast has two hosts who are also good friends.", "exVi": "Podcast đó có hai người dẫn chương trình cũng là bạn thân của nhau."}, {"w": "commute", "f": ["commute", "commutes", "commuting"], "pos": "n/v", "ipa": "kəˈmjuːt", "vi": "đi làm/đi học (di chuyển hằng ngày)", "ex": "I listen to podcasts during my commute.", "exVi": "Tôi nghe podcast trong lúc đi làm."}, {"w": "overwhelming", "f": ["overwhelming"], "pos": "adj", "ipa": "ˌoʊvərˈwelmɪŋ", "vi": "choáng ngợp, quá tải", "ex": "The number of podcasts out there can feel overwhelming.", "exVi": "Số lượng podcast ngoài kia có thể khiến người ta choáng ngợp."}, {"w": "recommendation", "f": ["recommendation", "recommendations"], "pos": "n", "ipa": "ˌrekəmenˈdeɪʃən", "vi": "lời giới thiệu, đề xuất", "ex": "I found this podcast through a friend's recommendation.", "exVi": "Tôi biết đến podcast này qua lời giới thiệu của một người bạn."}, {"w": "addictive", "f": ["addictive"], "pos": "adj", "ipa": "əˈdɪktɪv", "vi": "gây nghiện", "ex": "This show is so addictive, I finished it in two days.", "exVi": "Chương trình này gây nghiện đến mức tôi xem hết trong hai ngày."}, {"w": "variety", "f": ["variety"], "pos": "n", "ipa": "vəˈraɪəti", "vi": "sự đa dạng", "ex": "There's a huge variety of podcasts to choose from.", "exVi": "Có vô số loại podcast đa dạng để lựa chọn."}, {"w": "commit", "f": ["commit", "commits", "committed", "committing"], "pos": "v", "ipa": "kəˈmɪt", "vi": "cam kết, gắn bó lâu dài", "ex": "You don't have to commit to the whole series.", "exVi": "Bạn không cần cam kết nghe hết cả loạt chương trình."}, {"w": "microphone", "f": ["microphone", "microphones"], "pos": "n", "ipa": "ˈmaɪkrəfoʊn", "vi": "micro", "ex": "All you need is a microphone and an idea.", "exVi": "Tất cả những gì bạn cần chỉ là một micro và một ý tưởng."}, {"w": "background", "f": ["background"], "pos": "n/adj", "ipa": "ˈbækɡraʊnd", "vi": "nền, phía sau (nghĩa bóng: đi kèm)", "ex": "I put podcasts on as background noise while I clean.", "exVi": "Tôi bật podcast làm âm thanh nền khi dọn dẹp."}], "grammar": [{"title": "Unlike + danh từ/cụm danh từ", "formula": "Unlike + noun/noun phrase, mệnh đề", "use": "Dùng để so sánh sự khác biệt giữa hai điều, đứng đầu câu để nhấn mạnh sự tương phản.", "examples": [{"en": "Unlike traditional radio, podcasts have no fixed schedule.", "vi": "Không như đài phát thanh truyền thống, podcast không có lịch cố định."}, {"en": "Unlike her sister, she loves spicy food.", "vi": "Không như chị gái mình, cô ấy thích đồ ăn cay."}, {"en": "Unlike last year, we have more time to plan this trip.", "vi": "Không như năm ngoái, năm nay chúng tôi có nhiều thời gian hơn để lên kế hoạch chuyến đi."}]}, {"title": "Don't have to (không cần thiết)", "formula": "S + don't/doesn't have to + động từ nguyên mẫu", "use": "Dùng để nói điều gì đó không bắt buộc, khác với 'mustn't' là bị cấm. Rất hay dùng khi trấn an ai đó.", "examples": [{"en": "You don't have to commit to the whole show.", "vi": "Cậu không cần cam kết nghe hết cả chương trình."}, {"en": "You don't have to finish the book if you don't like it.", "vi": "Bạn không cần đọc hết cuốn sách nếu không thích nó."}, {"en": "We don't have to leave right now.", "vi": "Chúng ta không cần phải đi ngay bây giờ."}]}], "phrases": [{"p": "get into (something)", "vi": "bắt đầu thích, dấn thân vào (một sở thích)", "ex": "I never really got into podcasts until this year.", "exVi": "Mình chưa bao giờ thật sự mê podcast cho đến năm nay.", "ctx": "Thân mật, dùng khi bắt đầu thích một sở thích mới."}, {"p": "the easiest way in", "vi": "cách dễ nhất để bắt đầu", "ex": "Picking a familiar topic is the easiest way in.", "exVi": "Chọn một chủ đề quen thuộc là cách dễ nhất để bắt đầu.", "ctx": "Thân mật, dùng khi khuyên cách tiếp cận điều gì mới."}, {"p": "tons of", "vi": "rất nhiều, vô số", "ex": "There are tons of great podcasts about history.", "exVi": "Có vô số podcast hay về lịch sử.", "ctx": "Thân mật, dùng để nhấn mạnh số lượng lớn."}, {"p": "not at all", "vi": "không hề, hoàn toàn không", "ex": "Do I need to focus hard? Not at all.", "exVi": "Mình có cần tập trung căng thẳng không? Hoàn toàn không.", "ctx": "Trung tính, dùng để phủ định mạnh mẽ."}, {"p": "background company", "vi": "thứ đồng hành phía sau, không cần chú ý hoàn toàn", "ex": "I use podcasts as background company while cooking.", "exVi": "Mình dùng podcast làm bạn đồng hành khi nấu ăn.", "ctx": "Thân mật, dùng khi mô tả thứ gì đó đi kèm nhẹ nhàng."}, {"p": "good point", "vi": "có lý đấy, nói đúng đấy", "ex": "Good point, I never thought of it that way.", "exVi": "Có lý đấy, mình chưa bao giờ nghĩ theo hướng đó.", "ctx": "Thân mật, dùng khi đồng ý với một ý kiến hay."}, {"p": "skip around", "vi": "nhảy cóc, xem/nghe không theo thứ tự", "ex": "It's fine to skip around and find episodes you like.", "exVi": "Nhảy cóc để tìm tập mình thích cũng hoàn toàn ổn.", "ctx": "Thân mật, dùng khi nói về việc không theo trình tự."}, {"p": "you've convinced me", "vi": "cậu thuyết phục mình rồi đấy", "ex": "Okay, you've convinced me, I'll give it a try.", "exVi": "Được rồi, cậu thuyết phục mình rồi, mình sẽ thử.", "ctx": "Thân mật, dùng khi đồng ý sau khi bị thuyết phục."}, {"p": "turn (something) into", "vi": "biến (cái gì đó) thành", "ex": "Podcasts turn boring chores into something enjoyable.", "exVi": "Podcast biến những việc vặt nhàm chán thành điều thú vị.", "ctx": "Trung tính, dùng khi nói về sự thay đổi tích cực."}, {"p": "rely on", "vi": "dựa vào, tin cậy vào", "ex": "Many people rely on recommendations from friends.", "exVi": "Nhiều người dựa vào lời giới thiệu từ bạn bè.", "ctx": "Trung tính, dùng trong cả văn nói và văn viết."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "(1)___ traditional radio, podcasts have no fixed schedule.", "o": ["Unlike", "Like", "As"], "a": 0, "why": "'Unlike' dùng để nhấn mạnh sự khác biệt, đứng đầu câu."}, {"t": "You (2)___ have to commit to the whole show.", "o": ["don't", "doesn't", "not"], "a": 0, "why": "Chủ ngữ 'you', phủ định hiện tại đơn: don't have to."}, {"t": "Almost anyone with a microphone can (3)___ a podcast.", "o": ["make", "makes", "made"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu."}, {"t": "Many people (4)___ on recommendations from friends.", "o": ["rely", "relies", "relied"], "a": 0, "why": "Chủ ngữ số nhiều 'many people', hiện tại đơn: rely."}, {"t": "Hearing natural conversation (5)___ the ear over time.", "o": ["train", "trains", "training"], "a": 1, "why": "Chủ ngữ số ít (cụm danh động từ), hiện tại đơn thêm 's': trains."}, {"t": "Podcasts turn boring chores (6)___ something enjoyable.", "o": ["into", "to", "for"], "a": 0, "why": "Cụm cố định 'turn something into something'."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Marcus said the podcast (1)___ kind of addictive.", "o": ["is", "was", "were"], "a": 0, "why": "Sự thật vẫn đúng ở hiện tại nên giữ nguyên thì: is."}, {"t": "Zoe said she had never really (2)___ into podcasts.", "o": ["get", "gets", "gotten"], "a": 2, "why": "Hiện tại hoàn thành trong câu tường thuật lùi về quá khứ hoàn thành: gotten."}, {"t": "He told her that was the easiest way (3)___.", "o": ["in", "on", "at"], "a": 0, "why": "Cụm cố định 'the easiest way in'."}, {"t": "She thought she would need to sit down and (4)___ on it.", "o": ["focus", "focuses", "focused"], "a": 0, "why": "Sau 'to' (trong 'need to') và 'and' nối động từ nguyên mẫu: focus."}, {"t": "He said it was fine to (5)___ around and find what she liked.", "o": ["skip", "skips", "skipped"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: skip."}, {"t": "She finally said he (6)___ convinced her.", "o": ["has", "have", "had"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had convinced."}]}]}, {"id": "B1-SPORTS-002", "topic": "SPORTS", "n": 2, "level": "B1", "title": "Should Kids Play Competitive Sports?", "titleVi": "Có nên cho trẻ em chơi thể thao thi đấu không?", "passage": [{"en": "Every weekend, parks and gyms fill up with kids playing everything from soccer to swimming.", "vi": "Mỗi cuối tuần, các công viên và phòng tập đầy ắp trẻ em chơi đủ mọi môn từ bóng đá đến bơi lội."}, {"en": "For many parents, signing kids up for a sports team feels like an easy, healthy choice.", "vi": "Với nhiều phụ huynh, cho con đăng ký vào một đội thể thao có vẻ là một lựa chọn dễ dàng, lành mạnh."}, {"en": "After all, sports can teach teamwork, discipline, and how to handle both winning and losing.", "vi": "Suy cho cùng, thể thao có thể dạy tinh thần đồng đội, kỷ luật, và cách đối mặt với cả thắng lẫn thua."}, {"en": "However, some experts worry that youth sports have become too competitive, too early.", "vi": "Tuy nhiên, một số chuyên gia lo ngại rằng thể thao trẻ em đã trở nên quá mang tính thi đấu, quá sớm."}, {"en": "Some children play the same sport all year round, with barely any break between seasons.", "vi": "Một số trẻ chơi cùng một môn thể thao quanh năm, gần như không có kỳ nghỉ giữa các mùa giải."}, {"en": "This can lead to injuries that used to be rare in children but are becoming more common.", "vi": "Điều này có thể dẫn đến những chấn thương từng hiếm gặp ở trẻ em nhưng đang trở nên phổ biến hơn."}, {"en": "There's also a mental side to consider, not just a physical one.", "vi": "Còn có khía cạnh tâm lý cần cân nhắc, không chỉ mặt thể chất."}, {"en": "When winning becomes the main focus, some kids start to feel anxious before every game.", "vi": "Khi chiến thắng trở thành mục tiêu chính, một số trẻ bắt đầu cảm thấy lo lắng trước mỗi trận đấu."}, {"en": "A few even lose interest in a sport they once genuinely loved.", "vi": "Một vài em thậm chí mất hứng thú với một môn thể thao mà trước đây các em thật sự yêu thích."}, {"en": "On the other hand, many kids truly thrive under a bit of healthy competition.", "vi": "Mặt khác, nhiều trẻ thực sự phát triển tốt dưới một chút tính cạnh tranh lành mạnh."}, {"en": "It can push them to practice harder and feel proud of their own improvement.", "vi": "Nó có thể thúc đẩy các em luyện tập chăm chỉ hơn và tự hào về sự tiến bộ của chính mình."}, {"en": "So the real question might not be whether competition is good or bad, but how much is too much.", "vi": "Vậy nên câu hỏi thật sự có lẽ không phải là cạnh tranh tốt hay xấu, mà là bao nhiêu là quá nhiều."}, {"en": "Many coaches now recommend that young children try several different sports instead of just one.", "vi": "Nhiều huấn luyện viên hiện nay khuyên trẻ nhỏ nên thử vài môn thể thao khác nhau thay vì chỉ một môn."}, {"en": "This can prevent burnout and help kids discover what they actually enjoy the most.", "vi": "Điều này có thể ngăn tình trạng kiệt sức và giúp trẻ khám phá ra điều các em thật sự thích nhất."}, {"en": "In the end, most experts agree that the goal at a young age should be enjoyment first, skill second.", "vi": "Cuối cùng, hầu hết chuyên gia đồng ý rằng mục tiêu ở độ tuổi nhỏ nên là niềm vui trước, kỹ năng sau."}, {"en": "If a child still wants to compete seriously later on, that choice can come naturally, without being forced.", "vi": "Nếu sau này trẻ vẫn muốn thi đấu nghiêm túc, lựa chọn đó có thể đến một cách tự nhiên, không cần ép buộc."}], "dialogue": [{"who": "Grace", "g": "f", "en": "My son's coach wants him to practice five days a week now. It feels like a lot.", "vi": "Huấn luyện viên của con trai mình muốn nó tập luyện năm ngày một tuần. Nghe có vẻ nhiều quá."}, {"who": "Tom", "g": "m", "en": "Five days? He's only nine, right?", "vi": "Năm ngày? Nó mới chín tuổi thôi mà đúng không?"}, {"who": "Grace", "g": "f", "en": "Exactly. I'm worried it's too much for his age.", "vi": "Đúng vậy. Mình lo là nhiều quá so với tuổi của nó."}, {"who": "Tom", "g": "m", "en": "My daughter used to play soccer year-round, and she actually burned out.", "vi": "Con gái mình từng chơi bóng đá quanh năm, và nó thật sự bị kiệt sức."}, {"who": "Grace", "g": "f", "en": "Really? What happened?", "vi": "Thật hả? Chuyện gì đã xảy ra vậy?"}, {"who": "Tom", "g": "m", "en": "She just stopped enjoying it. One day she told me she didn't want to play anymore.", "vi": "Nó chỉ đơn giản là hết thấy vui nữa. Một ngày nó bảo mình là nó không muốn chơi nữa."}, {"who": "Grace", "g": "f", "en": "That's exactly what I'm afraid of with my son.", "vi": "Đó chính xác là điều mình sợ sẽ xảy ra với con trai mình."}, {"who": "Tom", "g": "m", "en": "Now we let her try different sports each season. She seems much happier.", "vi": "Giờ bọn mình để nó thử các môn khác nhau mỗi mùa. Nó có vẻ vui hơn nhiều."}, {"who": "Grace", "g": "f", "en": "That sounds like a good approach. Maybe I should talk to the coach.", "vi": "Nghe có vẻ là một cách tiếp cận tốt đấy. Chắc mình nên nói chuyện với huấn luyện viên."}, {"who": "Tom", "g": "m", "en": "I think that's a good idea. A little competition is fine, but enjoyment should come first.", "vi": "Mình nghĩ đó là ý hay. Một chút cạnh tranh thì ổn, nhưng niềm vui nên đến trước."}, {"who": "Grace", "g": "f", "en": "I just don't want him to feel anxious before every single game.", "vi": "Mình chỉ không muốn nó cảm thấy lo lắng trước mỗi trận đấu."}, {"who": "Tom", "g": "m", "en": "Have you asked him how he actually feels about it?", "vi": "Cậu đã hỏi nó thật sự cảm thấy thế nào về chuyện đó chưa?"}, {"who": "Grace", "g": "f", "en": "Not directly, actually. I probably should.", "vi": "Thật ra là chưa hỏi trực tiếp. Chắc mình nên hỏi."}, {"who": "Tom", "g": "m", "en": "Kids usually tell you a lot if you just ask the right question.", "vi": "Trẻ con thường sẽ nói cho cậu biết nhiều điều nếu cậu hỏi đúng câu hỏi."}, {"who": "Grace", "g": "f", "en": "You're right. I'll talk to him tonight.", "vi": "Cậu nói đúng đấy. Tối nay mình sẽ nói chuyện với nó."}], "vocab": [{"w": "competitive", "f": ["competitive"], "pos": "adj", "ipa": "kəmˈpetətɪv", "vi": "mang tính cạnh tranh", "ex": "Youth sports have become very competitive these days.", "exVi": "Thể thao trẻ em ngày nay đã trở nên rất mang tính cạnh tranh."}, {"w": "discipline", "f": ["discipline"], "pos": "n", "ipa": "ˈdɪsəplɪn", "vi": "kỷ luật", "ex": "Sports can teach children discipline.", "exVi": "Thể thao có thể dạy trẻ em tính kỷ luật."}, {"w": "injury", "f": ["injury", "injuries"], "pos": "n", "ipa": "ˈɪndʒəri", "vi": "chấn thương", "ex": "Playing one sport all year can lead to injuries.", "exVi": "Chơi một môn thể thao quanh năm có thể dẫn đến chấn thương."}, {"w": "anxious", "f": ["anxious"], "pos": "adj", "ipa": "ˈæŋkʃəs", "vi": "lo lắng", "ex": "He feels anxious before every game.", "exVi": "Cậu bé cảm thấy lo lắng trước mỗi trận đấu."}, {"w": "burnout", "f": ["burnout"], "pos": "n", "ipa": "ˈbɜːrnaʊt", "vi": "sự kiệt sức, mất hứng thú", "ex": "Playing too much of one sport can cause burnout.", "exVi": "Chơi quá nhiều một môn thể thao có thể gây ra kiệt sức."}, {"w": "thrive", "f": ["thrive", "thrives", "thrived", "thriving"], "pos": "v", "ipa": "θraɪv", "vi": "phát triển tốt, phát đạt", "ex": "Some kids thrive under a bit of healthy competition.", "exVi": "Một số trẻ phát triển tốt dưới một chút cạnh tranh lành mạnh."}, {"w": "improvement", "f": ["improvement", "improvements"], "pos": "n", "ipa": "ɪmˈpruːvmənt", "vi": "sự tiến bộ", "ex": "She felt proud of her own improvement.", "exVi": "Cô bé cảm thấy tự hào về sự tiến bộ của chính mình."}, {"w": "coach", "f": ["coach", "coaches"], "pos": "n", "ipa": "koʊtʃ", "vi": "huấn luyện viên", "ex": "The coach wants him to practice five days a week.", "exVi": "Huấn luyện viên muốn cậu bé tập luyện năm ngày một tuần."}, {"w": "forced", "f": ["forced"], "pos": "adj", "ipa": "fɔːrst", "vi": "bị ép buộc", "ex": "That choice shouldn't feel forced.", "exVi": "Lựa chọn đó không nên cảm thấy bị ép buộc."}, {"w": "approach", "f": ["approach", "approaches"], "pos": "n", "ipa": "əˈproʊtʃ", "vi": "cách tiếp cận", "ex": "That sounds like a good approach.", "exVi": "Nghe có vẻ là một cách tiếp cận tốt đấy."}], "grammar": [{"title": "Used to (đã từng, nay không còn) so với be used to", "formula": "S + used to + V (nguyên mẫu)", "use": "Diễn tả một thói quen/trạng thái trong quá khứ mà nay không còn đúng nữa. Khác với 'be used to + V-ing' (đã quen với việc gì).", "examples": [{"en": "My daughter used to play soccer year-round.", "vi": "Con gái mình từng chơi bóng đá quanh năm."}, {"en": "Injuries like this used to be rare in children.", "vi": "Những chấn thương như thế này từng rất hiếm gặp ở trẻ em."}, {"en": "He used to love this sport.", "vi": "Cậu bé từng rất yêu thích môn thể thao này."}]}, {"title": "Should + V (lời khuyên chung, mang tính khuyến nghị)", "formula": "S + should + động từ nguyên mẫu", "use": "Dùng để đưa ra khuyến nghị, thường dùng khi các chuyên gia hoặc số đông đồng ý về điều gì đó nên làm.", "examples": [{"en": "The goal should be enjoyment first, skill second.", "vi": "Mục tiêu nên là niềm vui trước, kỹ năng sau."}, {"en": "Young children should try several different sports.", "vi": "Trẻ nhỏ nên thử vài môn thể thao khác nhau."}, {"en": "That choice should come naturally.", "vi": "Lựa chọn đó nên đến một cách tự nhiên."}]}], "phrases": [{"p": "sign up for", "vi": "đăng ký tham gia", "ex": "We signed our son up for a soccer team.", "exVi": "Chúng tôi đã đăng ký cho con trai mình vào một đội bóng đá.", "ctx": "Trung tính, dùng khi đăng ký tham gia một hoạt động."}, {"p": "after all", "vi": "suy cho cùng, xét cho cùng", "ex": "After all, sports teach kids teamwork.", "exVi": "Suy cho cùng, thể thao dạy trẻ tinh thần đồng đội.", "ctx": "Trung tính, dùng khi đưa ra lý lẽ biện minh."}, {"p": "on the other hand", "vi": "mặt khác", "ex": "On the other hand, some kids thrive on competition.", "exVi": "Mặt khác, một số trẻ phát triển tốt nhờ tính cạnh tranh.", "ctx": "Trung tính, dùng khi đưa ra quan điểm đối lập."}, {"p": "how much is too much", "vi": "bao nhiêu là quá nhiều", "ex": "The real question is how much practice is too much.", "exVi": "Câu hỏi thật sự là bao nhiêu buổi tập là quá nhiều.", "ctx": "Trung tính, dùng khi bàn về giới hạn hợp lý."}, {"p": "lose interest in", "vi": "mất hứng thú với", "ex": "He started to lose interest in the sport.", "exVi": "Cậu bé bắt đầu mất hứng thú với môn thể thao đó.", "ctx": "Trung tính, dùng khi nói về việc không còn thích điều gì."}, {"p": "come naturally", "vi": "đến một cách tự nhiên", "ex": "That decision should come naturally, not be forced.", "exVi": "Quyết định đó nên đến một cách tự nhiên, không bị ép buộc.", "ctx": "Trung tính, dùng khi nói điều gì không nên gượng ép."}, {"p": "burn out", "vi": "kiệt sức, mất động lực", "ex": "She burned out after playing every season.", "exVi": "Cô bé kiệt sức sau khi chơi mọi mùa giải.", "ctx": "Thân mật, dùng khi ai đó quá tải vì làm liên tục."}, {"p": "that's exactly what I'm afraid of", "vi": "đó chính xác là điều mình sợ", "ex": "That's exactly what I'm afraid of with my son.", "exVi": "Đó chính xác là điều mình sợ sẽ xảy ra với con trai mình.", "ctx": "Thân mật, dùng khi đồng cảm với nỗi lo của ai đó."}, {"p": "a lot", "vi": "nhiều, rất nhiều", "ex": "Kids tell you a lot if you ask the right question.", "exVi": "Trẻ con sẽ nói cho bạn biết nhiều điều nếu bạn hỏi đúng câu hỏi.", "ctx": "Trung tính, dùng để nhấn mạnh số lượng/mức độ."}, {"p": "you're right", "vi": "cậu nói đúng đấy", "ex": "You're right, I should ask him directly.", "exVi": "Cậu nói đúng đấy, mình nên hỏi nó trực tiếp.", "ctx": "Thân mật, dùng khi đồng ý với ý kiến của ai đó."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "My daughter (1)___ to play soccer year-round.", "o": ["use", "used", "using"], "a": 1, "why": "'Used to + V' diễn tả thói quen trong quá khứ nay không còn: used to."}, {"t": "The goal (2)___ be enjoyment first, skill second.", "o": ["should", "would", "must to"], "a": 0, "why": "'Should' dùng để đưa ra khuyến nghị chung."}, {"t": "Playing one sport all year can (3)___ to injuries.", "o": ["lead", "leads", "led"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: lead."}, {"t": "Some kids truly (4)___ under healthy competition.", "o": ["thrive", "thrives", "thrived"], "a": 0, "why": "Chủ ngữ số nhiều 'some kids', hiện tại đơn: thrive."}, {"t": "That choice should come naturally, without being (5)___.", "o": ["force", "forces", "forced"], "a": 2, "why": "Tính từ đuôi -ed mô tả trạng thái bị tác động: forced."}, {"t": "Coaches recommend that kids (6)___ several sports.", "o": ["try", "tries", "tried"], "a": 0, "why": "Sau 'recommend that' dùng động từ nguyên mẫu (subjunctive)."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Tom said his daughter (1)___ soccer year-round before.", "o": ["play", "plays", "had played"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had played."}, {"t": "She told him she (2)___ want to play anymore.", "o": ["don't", "didn't", "doesn't"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: didn't."}, {"t": "Grace said that's exactly what she (3)___ afraid of.", "o": ["is", "was", "were"], "a": 1, "why": "Câu tường thuật lùi về quá khứ đơn: was."}, {"t": "Tom asked if she (4)___ how her son actually felt.", "o": ["ask", "asks", "had asked"], "a": 2, "why": "Câu hỏi Yes/No trong tường thuật, lùi về quá khứ hoàn thành: had asked."}, {"t": "Grace admitted she probably (5)___ ask him directly.", "o": ["should", "shall", "will"], "a": 0, "why": "'Should' vẫn giữ nguyên trong câu tường thuật khi diễn tả lời khuyên."}, {"t": "Tom said kids usually tell you a lot if you ask the (6)___ question.", "o": ["right", "correct", "true"], "a": 0, "why": "Cụm cố định 'the right question'."}]}]}, {"id": "B1-PHRASES-002", "topic": "PHRASES", "n": 2, "level": "B1", "type": "phrases", "title": "Common Phrases 2", "titleVi": "Cụm từ bản xứ hay dùng 2", "items": [{"en": "Long time no see!", "vi": "Lâu quá không gặp!", "ctx": "Nói khi gặp lại ai đó sau một thời gian dài không gặp."}, {"en": "My bad.", "vi": "Lỗi của tôi, xin lỗi nhé.", "ctx": "Cách nói xin lỗi rất thân mật, thường dùng cho lỗi nhỏ."}, {"en": "I'm all ears.", "vi": "Tôi đang lắng nghe đây, kể đi.", "ctx": "Dùng khi sẵn sàng nghe ai đó kể chuyện, rất chú ý."}, {"en": "Don't sweat it.", "vi": "Đừng lo lắng về chuyện đó.", "ctx": "Trấn an ai đó rằng chuyện không quan trọng, không cần lo."}, {"en": "That rings a bell.", "vi": "Nghe quen quen đấy.", "ctx": "Dùng khi nghe điều gì đó gợi nhớ lại một ký ức mơ hồ."}, {"en": "Let's call it a day.", "vi": "Thôi dừng ở đây thôi (cho hôm nay).", "ctx": "Đề nghị kết thúc công việc/hoạt động đang làm."}, {"en": "Speak of the devil!", "vi": "Vừa nhắc Tào Tháo, Tào Tháo tới!", "ctx": "Nói khi người vừa được nhắc đến bất ngờ xuất hiện."}, {"en": "It's not rocket science.", "vi": "Chuyện đó không khó đến vậy đâu.", "ctx": "Nói khi một việc thực ra không phức tạp như người ta nghĩ."}]}, {"id": "B1-SOCIAL-004", "topic": "SOCIAL", "n": 4, "level": "B1", "title": "Why Prices Go Up: A Simple Look at Inflation", "titleVi": "Vì sao giá cả tăng lên: nhìn đơn giản về lạm phát", "passage": [{"en": "Have you noticed that the same bag of groceries costs more than it did a few years ago?", "vi": "Bạn có để ý là cùng một túi đồ tạp hóa bây giờ tốn nhiều tiền hơn vài năm trước không?"}, {"en": "That general rise in prices over time is called inflation.", "vi": "Sự tăng giá chung theo thời gian đó được gọi là lạm phát."}, {"en": "It doesn't mean one product suddenly became expensive; it means money itself buys a little less.", "vi": "Nó không có nghĩa là một sản phẩm nào đó bỗng nhiên đắt lên; nó có nghĩa là chính đồng tiền mua được ít hơn."}, {"en": "A small amount of inflation each year is actually considered normal and even healthy for an economy.", "vi": "Một mức lạm phát nhỏ mỗi năm thực ra được coi là bình thường và thậm chí tốt cho nền kinh tế."}, {"en": "Problems start when inflation rises too quickly, and people's paychecks can't keep up.", "vi": "Vấn đề bắt đầu khi lạm phát tăng quá nhanh, và tiền lương của người dân không theo kịp."}, {"en": "So what actually causes prices to rise?", "vi": "Vậy điều gì thực sự khiến giá cả tăng lên?"}, {"en": "One common cause is simply too much demand chasing too few goods.", "vi": "Một nguyên nhân phổ biến đơn giản là quá nhiều nhu cầu đuổi theo quá ít hàng hóa."}, {"en": "If everyone suddenly wants to buy the same product, sellers can raise the price because people will still pay.", "vi": "Nếu mọi người đột nhiên đều muốn mua cùng một sản phẩm, người bán có thể tăng giá vì người mua vẫn sẽ trả."}, {"en": "Another cause is rising costs for businesses, like higher prices for fuel or raw materials.", "vi": "Một nguyên nhân khác là chi phí tăng đối với doanh nghiệp, như giá nhiên liệu hoặc nguyên liệu thô tăng cao."}, {"en": "When it costs more to make something, companies usually pass that cost on to customers.", "vi": "Khi việc sản xuất ra thứ gì đó tốn kém hơn, các công ty thường chuyển chi phí đó sang cho khách hàng."}, {"en": "Governments and central banks try to keep inflation under control using several tools.", "vi": "Chính phủ và ngân hàng trung ương cố gắng kiểm soát lạm phát bằng vài công cụ."}, {"en": "One of the main tools is adjusting interest rates, which affects how much it costs to borrow money.", "vi": "Một trong những công cụ chính là điều chỉnh lãi suất, thứ ảnh hưởng đến việc vay tiền tốn kém đến mức nào."}, {"en": "When interest rates go up, borrowing becomes more expensive, so people tend to spend less.", "vi": "Khi lãi suất tăng, việc vay tiền trở nên đắt đỏ hơn, nên người dân có xu hướng chi tiêu ít hơn."}, {"en": "Less spending can slow down rising prices, though it can also slow down the whole economy.", "vi": "Chi tiêu ít hơn có thể làm chậm việc giá cả tăng, dù nó cũng có thể làm chậm cả nền kinh tế."}, {"en": "This is why economic decisions are rarely simple; fixing one problem can create another.", "vi": "Đây là lý do các quyết định kinh tế hiếm khi đơn giản; giải quyết một vấn đề có thể tạo ra một vấn đề khác."}, {"en": "Understanding the basics of inflation can help you make sense of the news and your own budget.", "vi": "Hiểu những điều cơ bản về lạm phát có thể giúp bạn hiểu rõ hơn tin tức và ngân sách của chính mình."}], "dialogue": [{"who": "Hannah", "g": "f", "en": "I swear my grocery bill has gone up so much this year.", "vi": "Mình thề là hóa đơn tạp hóa của mình đã tăng nhiều lắm trong năm nay."}, {"who": "David", "g": "m", "en": "Yeah, that's inflation. Prices have gone up almost everywhere.", "vi": "Ừ, đó là lạm phát đấy. Giá cả đã tăng gần như ở khắp mọi nơi."}, {"who": "Hannah", "g": "f", "en": "But why does that even happen? It feels so random.", "vi": "Nhưng tại sao chuyện đó lại xảy ra vậy? Cảm giác như ngẫu nhiên vậy."}, {"who": "David", "g": "m", "en": "It's not really random. Sometimes it's because everyone wants to buy the same stuff.", "vi": "Không hẳn là ngẫu nhiên đâu. Đôi khi là vì ai cũng muốn mua cùng một thứ."}, {"who": "Hannah", "g": "f", "en": "So more people buying something makes it more expensive?", "vi": "Vậy nhiều người mua một thứ gì đó khiến nó đắt hơn à?"}, {"who": "David", "g": "m", "en": "Exactly. Sellers know people will still pay, so they raise the price.", "vi": "Chính xác. Người bán biết là người mua vẫn sẽ trả, nên họ tăng giá."}, {"who": "Hannah", "g": "f", "en": "What about when businesses just say their costs went up?", "vi": "Vậy còn khi doanh nghiệp nói là chi phí của họ tăng lên thì sao?"}, {"who": "David", "g": "m", "en": "That happens too. If fuel gets expensive, shipping costs more, and prices follow.", "vi": "Chuyện đó cũng xảy ra. Nếu nhiên liệu đắt lên, chi phí vận chuyển tăng, và giá cả theo đó tăng theo."}, {"who": "Hannah", "g": "f", "en": "Can't the government just stop it?", "vi": "Chính phủ không thể chặn chuyện đó lại được à?"}, {"who": "David", "g": "m", "en": "They try, mostly by changing interest rates.", "vi": "Họ có cố, chủ yếu bằng cách thay đổi lãi suất."}, {"who": "Hannah", "g": "f", "en": "How does that even help?", "vi": "Cách đó giúp được gì vậy?"}, {"who": "David", "g": "m", "en": "Higher interest rates make borrowing expensive, so people spend less overall.", "vi": "Lãi suất cao hơn khiến việc vay tiền đắt đỏ, nên người dân nhìn chung chi tiêu ít hơn."}, {"who": "Hannah", "g": "f", "en": "That sounds like it could slow down the economy too, though.", "vi": "Nhưng nghe có vẻ như nó cũng có thể làm chậm cả nền kinh tế nữa."}, {"who": "David", "g": "m", "en": "Exactly, that's the tricky part. There's no perfect fix.", "vi": "Chính xác, đó là phần khó đấy. Không có cách giải quyết hoàn hảo nào cả."}, {"who": "Hannah", "g": "f", "en": "Okay, that actually makes a lot more sense now. Thanks for explaining.", "vi": "Được rồi, giờ nghe hợp lý hơn nhiều rồi. Cảm ơn cậu đã giải thích."}], "vocab": [{"w": "inflation", "f": ["inflation"], "pos": "n", "ipa": "ɪnˈfleɪʃən", "vi": "lạm phát", "ex": "Inflation means prices rise over time.", "exVi": "Lạm phát nghĩa là giá cả tăng lên theo thời gian."}, {"w": "economy", "f": ["economy", "economies"], "pos": "n", "ipa": "ɪˈkɑːnəmi", "vi": "nền kinh tế", "ex": "A small amount of inflation is normal for the economy.", "exVi": "Một mức lạm phát nhỏ là bình thường đối với nền kinh tế."}, {"w": "demand", "f": ["demand", "demands"], "pos": "n", "ipa": "dɪˈmænd", "vi": "nhu cầu", "ex": "High demand can push prices up.", "exVi": "Nhu cầu cao có thể đẩy giá lên."}, {"w": "interest rate", "f": ["interest rate", "interest rates"], "pos": "n", "ipa": "ˈɪntrəst reɪt", "vi": "lãi suất", "ex": "The bank raised interest rates this year.", "exVi": "Ngân hàng đã tăng lãi suất trong năm nay."}, {"w": "borrow", "f": ["borrow", "borrows", "borrowed", "borrowing"], "pos": "v", "ipa": "ˈbɑːroʊ", "vi": "vay (tiền)", "ex": "It's more expensive to borrow money now.", "exVi": "Bây giờ vay tiền tốn kém hơn."}, {"w": "budget", "f": ["budget", "budgets"], "pos": "n", "ipa": "ˈbʌdʒɪt", "vi": "ngân sách", "ex": "Rising prices affect our monthly budget.", "exVi": "Giá cả tăng ảnh hưởng đến ngân sách hằng tháng của chúng ta."}, {"w": "raw material", "f": ["raw material", "raw materials"], "pos": "n", "ipa": "rɔː məˈtɪəriəl", "vi": "nguyên liệu thô", "ex": "The cost of raw materials went up this year.", "exVi": "Chi phí nguyên liệu thô đã tăng trong năm nay."}, {"w": "pass on", "f": ["pass on", "passes on", "passed on"], "pos": "phrase", "ipa": "pæs ɒn", "vi": "chuyển (chi phí) sang cho ai đó", "ex": "Companies often pass higher costs on to customers.", "exVi": "Các công ty thường chuyển chi phí cao hơn sang cho khách hàng."}, {"w": "spending", "f": ["spending"], "pos": "n", "ipa": "ˈspendɪŋ", "vi": "chi tiêu", "ex": "Higher rates usually lead to less spending.", "exVi": "Lãi suất cao hơn thường dẫn đến chi tiêu ít hơn."}, {"w": "central bank", "f": ["central bank", "central banks"], "pos": "n", "ipa": "ˈsentrəl bæŋk", "vi": "ngân hàng trung ương", "ex": "The central bank controls interest rates.", "exVi": "Ngân hàng trung ương kiểm soát lãi suất."}], "grammar": [{"title": "Tend to + V (xu hướng chung)", "formula": "S + tend to + động từ nguyên mẫu", "use": "Dùng để nói về một xu hướng chung, thường xảy ra nhưng không phải luôn luôn. Rất tự nhiên khi giải thích quy luật hoặc thói quen chung.", "examples": [{"en": "People tend to spend less when rates go up.", "vi": "Người dân có xu hướng chi tiêu ít hơn khi lãi suất tăng."}, {"en": "Prices tend to rise a little every year.", "vi": "Giá cả có xu hướng tăng nhẹ mỗi năm."}, {"en": "Businesses tend to raise prices when costs go up.", "vi": "Doanh nghiệp có xu hướng tăng giá khi chi phí tăng."}]}, {"title": "Though/although ở cuối câu (nhấn mạnh tương phản)", "formula": "Mệnh đề chính, + though (đặt cuối câu, văn nói)", "use": "Trong văn nói, 'though' có thể đặt ở cuối câu để nhấn mạnh sự tương phản với điều vừa nói, thay vì đặt ở đầu câu như 'although'.", "examples": [{"en": "That could slow down the economy too, though.", "vi": "Nhưng nó cũng có thể làm chậm cả nền kinh tế nữa."}, {"en": "It's expensive. It's really good quality, though.", "vi": "Nó đắt đấy. Nhưng chất lượng thật sự tốt."}, {"en": "I don't like coffee. I'll try it, though.", "vi": "Mình không thích cà phê. Nhưng mình sẽ thử."}]}], "phrases": [{"p": "I swear", "vi": "mình thề đấy, thật sự luôn", "ex": "I swear prices have doubled this year.", "exVi": "Mình thề là giá đã tăng gấp đôi trong năm nay.", "ctx": "Thân mật, dùng để nhấn mạnh điều mình nói là thật."}, {"p": "makes a lot more sense", "vi": "nghe hợp lý hơn nhiều", "ex": "That makes a lot more sense now that you explain it.", "exVi": "Giờ nghe hợp lý hơn nhiều khi cậu giải thích.", "ctx": "Thân mật, dùng khi hiểu ra điều gì đó sau khi được giải thích."}, {"p": "the tricky part", "vi": "phần khó, điểm rắc rối", "ex": "The tricky part is there's no perfect fix.", "exVi": "Phần khó là không có cách giải quyết hoàn hảo nào cả.", "ctx": "Trung tính, dùng khi chỉ ra khó khăn cốt lõi của vấn đề."}, {"p": "keep up with", "vi": "theo kịp", "ex": "Paychecks can't always keep up with inflation.", "exVi": "Tiền lương không phải lúc nào cũng theo kịp lạm phát.", "ctx": "Trung tính, dùng khi nói về việc theo kịp tốc độ thay đổi."}, {"p": "make sense of", "vi": "hiểu rõ, lý giải được", "ex": "This helped me make sense of the news.", "exVi": "Điều này giúp mình hiểu rõ hơn về tin tức.", "ctx": "Trung tính, dùng khi nói về việc hiểu một điều phức tạp."}, {"p": "overall", "vi": "nhìn chung", "ex": "People spend less overall when rates rise.", "exVi": "Nhìn chung người dân chi tiêu ít hơn khi lãi suất tăng.", "ctx": "Trung tính, dùng khi tổng kết một xu hướng chung."}, {"p": "almost everywhere", "vi": "gần như khắp mọi nơi", "ex": "Prices have gone up almost everywhere this year.", "exVi": "Giá cả đã tăng gần như khắp mọi nơi trong năm nay.", "ctx": "Trung tính, dùng để nhấn mạnh phạm vi rộng."}, {"p": "thanks for explaining", "vi": "cảm ơn vì đã giải thích", "ex": "Thanks for explaining, it makes sense now.", "exVi": "Cảm ơn cậu đã giải thích, giờ mình hiểu rồi.", "ctx": "Thân mật, dùng khi cảm ơn ai đó đã làm rõ một vấn đề."}, {"p": "no perfect fix", "vi": "không có giải pháp hoàn hảo", "ex": "With economics, there's often no perfect fix.", "exVi": "Với kinh tế, thường không có giải pháp hoàn hảo nào cả.", "ctx": "Trung tính, dùng khi thừa nhận một vấn đề khó giải quyết trọn vẹn."}, {"p": "feels so random", "vi": "cảm giác như ngẫu nhiên vậy", "ex": "Prices changing so fast feels so random sometimes.", "exVi": "Giá cả thay đổi nhanh vậy đôi khi cảm giác như ngẫu nhiên.", "ctx": "Thân mật, dùng khi một điều gì đó có vẻ khó đoán, vô lý."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "People (1)___ to spend less when interest rates go up.", "o": ["tend", "tends", "tended"], "a": 0, "why": "Chủ ngữ số nhiều 'people', hiện tại đơn: tend."}, {"t": "Companies often pass higher costs (2)___ to customers.", "o": ["on", "in", "at"], "a": 0, "why": "Cụm động từ cố định 'pass something on to someone'."}, {"t": "That could slow down the economy too, (3)___.", "o": ["though", "despite", "however"], "a": 0, "why": "'Though' có thể đặt cuối câu trong văn nói để nhấn mạnh tương phản."}, {"t": "If fuel gets expensive, shipping (4)___ more.", "o": ["cost", "costs", "costed"], "a": 1, "why": "Chủ ngữ số ít 'shipping', hiện tại đơn thêm 's': costs."}, {"t": "Paychecks can't always keep (5)___ with inflation.", "o": ["up", "on", "at"], "a": 0, "why": "Cụm động từ cố định 'keep up with'."}, {"t": "A small amount of inflation is (6)___ normal.", "o": ["consider", "considered", "considering"], "a": 1, "why": "Bị động: is/are + considered."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Hannah said her grocery bill (1)___ up a lot that year.", "o": ["go", "goes", "had gone"], "a": 2, "why": "Câu tường thuật lùi về quá khứ hoàn thành: had gone."}, {"t": "David explained that sellers knew people (2)___ still pay.", "o": ["will", "would", "did"], "a": 1, "why": "Câu tường thuật, 'will' lùi thành 'would'."}, {"t": "She asked if the government (3)___ just stop it.", "o": ["can", "could", "will"], "a": 1, "why": "Câu tường thuật, 'can' lùi thành 'could'."}, {"t": "He said higher rates (4)___ borrowing more expensive.", "o": ["make", "makes", "made"], "a": 2, "why": "Câu tường thuật lùi về quá khứ đơn: made."}, {"t": "She admitted it (5)___ a lot more sense now.", "o": ["make", "makes", "made"], "a": 1, "why": "Ý vẫn đúng ở hiện tại nên giữ nguyên thì hiện tại: makes."}, {"t": "He agreed that was (6)___ tricky part.", "o": ["a", "the", "an"], "a": 1, "why": "Cụm cố định 'the tricky part' dùng mạo từ xác định."}]}]}, {"id": "B1-DAILY-003", "topic": "DAILY", "n": 3, "level": "B1", "title": "Making Small Talk with Neighbors", "titleVi": "Trò chuyện xã giao với hàng xóm", "passage": [{"en": "For a lot of people, running into a neighbor in the hallway feels strangely awkward.", "vi": "Với nhiều người, tình cờ gặp hàng xóm ở hành lang lại cảm thấy khó xử một cách kỳ lạ."}, {"en": "You both know you should say something, but your mind suddenly goes blank.", "vi": "Cả hai đều biết là nên nói gì đó, nhưng đầu óc bỗng nhiên trống rỗng."}, {"en": "The good news is that small talk doesn't have to be clever or deep.", "vi": "Tin tốt là chuyện phiếm không cần phải thông minh hay sâu sắc."}, {"en": "Its real purpose is simply to show the other person you're friendly and approachable.", "vi": "Mục đích thật sự của nó đơn giản là cho người kia thấy bạn thân thiện và dễ gần."}, {"en": "The weather is a classic starting point for a reason: it's safe and everyone has an opinion about it.", "vi": "Thời tiết là một chủ đề mở đầu kinh điển vì một lý do: nó an toàn và ai cũng có ý kiến về nó."}, {"en": "Something as simple as 'Can you believe how hot it's been?' can open the door to a short chat.", "vi": "Một câu đơn giản như 'Bạn có tin nổi trời nóng thế này không?' cũng có thể mở ra một cuộc trò chuyện ngắn."}, {"en": "Commenting on something specific, like a neighbor's dog or their new plants, also works well.", "vi": "Nhận xét về điều gì đó cụ thể, như con chó của hàng xóm hay chậu cây mới của họ, cũng rất hiệu quả."}, {"en": "It shows you actually noticed them, which people usually appreciate.", "vi": "Nó cho thấy bạn thật sự để ý đến họ, điều mà mọi người thường trân trọng."}, {"en": "Asking a simple question is another easy trick, since people generally enjoy talking about themselves.", "vi": "Hỏi một câu đơn giản cũng là một mẹo dễ dàng khác, vì con người nói chung thích nói về bản thân."}, {"en": "Something like 'Have you lived here long?' can turn a quick hello into a real conversation.", "vi": "Một câu như 'Bạn sống ở đây lâu chưa?' có thể biến một lời chào nhanh thành một cuộc trò chuyện thật sự."}, {"en": "You don't need to become best friends with every neighbor you have.", "vi": "Bạn không cần phải trở thành bạn thân với mọi hàng xóm mình có."}, {"en": "Even a friendly nod and a smile is far better than awkwardly staring at your phone.", "vi": "Ngay cả một cái gật đầu thân thiện và một nụ cười cũng tốt hơn nhiều so với việc lúng túng nhìn chằm chằm vào điện thoại."}, {"en": "Over time, these small moments actually build something valuable: a sense of community.", "vi": "Theo thời gian, những khoảnh khắc nhỏ này thực sự xây dựng nên một điều quý giá: cảm giác cộng đồng."}, {"en": "Neighbors who know each other, even a little, tend to look out for one another.", "vi": "Những hàng xóm quen biết nhau, dù chỉ một chút, thường có xu hướng để mắt đến nhau."}, {"en": "That might mean picking up a package, watering plants, or simply noticing if something seems off.", "vi": "Điều đó có thể là nhận hộ một gói hàng, tưới cây, hay đơn giản là nhận ra nếu có điều gì đó bất thường."}, {"en": "So the next time you pass someone in the hallway, a simple 'hey, how's it going?' might go a long way.", "vi": "Vậy nên lần tới khi bạn đi ngang qua ai đó trong hành lang, một câu đơn giản 'chào, dạo này thế nào?' có thể mang lại nhiều điều tốt đẹp."}], "dialogue": [{"who": "Ava", "g": "f", "en": "I keep running into my new neighbor and I never know what to say.", "vi": "Mình cứ chạm mặt hàng xóm mới suốt mà chẳng bao giờ biết nói gì."}, {"who": "Liam", "g": "m", "en": "Same here. It's always so awkward in the hallway.", "vi": "Mình cũng vậy. Lúc nào cũng thấy khó xử trong hành lang."}, {"who": "Ava", "g": "f", "en": "Do you just talk about the weather or something?", "vi": "Cậu chỉ nói về thời tiết hay gì đó thôi à?"}, {"who": "Liam", "g": "m", "en": "Honestly, yeah. It sounds boring, but it actually works.", "vi": "Thành thật thì đúng vậy. Nghe có vẻ nhàm chán, nhưng nó thật sự hiệu quả."}, {"who": "Ava", "g": "f", "en": "I guess it's low pressure, at least.", "vi": "Chắc là ít áp lực thật."}, {"who": "Liam", "g": "m", "en": "Exactly. Or I just ask if they've lived there long.", "vi": "Đúng vậy. Hoặc mình chỉ hỏi họ đã sống ở đó lâu chưa."}, {"who": "Ava", "g": "f", "en": "That's a good one. People love talking about themselves.", "vi": "Câu đó hay đấy. Người ta thích nói về bản thân mình lắm."}, {"who": "Liam", "g": "m", "en": "Right? One question and suddenly it's a full conversation.", "vi": "Đúng không? Chỉ một câu hỏi mà bỗng nhiên thành cả một cuộc trò chuyện."}, {"who": "Ava", "g": "f", "en": "My neighbor has this really cute dog. Maybe I'll just ask about that.", "vi": "Hàng xóm mình có con chó dễ thương lắm. Chắc mình sẽ hỏi về nó."}, {"who": "Liam", "g": "m", "en": "Perfect. Commenting on their dog is basically a guaranteed win.", "vi": "Tuyệt. Nhận xét về con chó của họ gần như là chắc thắng luôn."}, {"who": "Ava", "g": "f", "en": "I always feel weird just nodding and walking away, though.", "vi": "Nhưng mình luôn cảm thấy kỳ kỳ khi chỉ gật đầu rồi bước đi."}, {"who": "Liam", "g": "m", "en": "Honestly, a nod and a smile is still way better than staring at your phone.", "vi": "Thật lòng thì một cái gật đầu và nụ cười vẫn tốt hơn nhiều so với việc nhìn chằm chằm vào điện thoại."}, {"who": "Ava", "g": "f", "en": "That's true. Maybe I'm overthinking this whole thing.", "vi": "Đúng thật. Chắc mình đang nghĩ quá nhiều về chuyện này."}, {"who": "Liam", "g": "m", "en": "You kind of are. Just say hi next time, that's really all it takes.", "vi": "Hơi hơi vậy đấy. Lần tới cứ chào thôi, chỉ cần vậy là đủ rồi."}, {"who": "Ava", "g": "f", "en": "Okay, I'll try that tomorrow morning.", "vi": "Được rồi, sáng mai mình sẽ thử."}], "vocab": [{"w": "awkward", "f": ["awkward"], "pos": "adj", "ipa": "ˈɔːkwərd", "vi": "khó xử, lúng túng", "ex": "It felt awkward running into her in the hallway.", "exVi": "Cảm thấy khó xử khi tình cờ gặp cô ấy ở hành lang."}, {"w": "approachable", "f": ["approachable"], "pos": "adj", "ipa": "əˈproʊtʃəbl", "vi": "dễ gần", "ex": "A smile makes you seem more approachable.", "exVi": "Một nụ cười khiến bạn có vẻ dễ gần hơn."}, {"w": "comment on", "f": ["comment on", "comments on", "commented on"], "pos": "phrase", "ipa": "ˈkɑːment ɒn", "vi": "nhận xét về", "ex": "I commented on her new plants.", "exVi": "Mình đã nhận xét về những chậu cây mới của cô ấy."}, {"w": "appreciate", "f": ["appreciate", "appreciates", "appreciated", "appreciating"], "pos": "v", "ipa": "əˈpriːʃieɪt", "vi": "trân trọng, đánh giá cao", "ex": "People usually appreciate it when you notice them.", "exVi": "Người ta thường trân trọng khi bạn để ý đến họ."}, {"w": "nod", "f": ["nod", "nods", "nodded", "nodding"], "pos": "n/v", "ipa": "nɑːd", "vi": "gật đầu", "ex": "He gave a friendly nod as he walked past.", "exVi": "Anh ấy gật đầu thân thiện khi đi ngang qua."}, {"w": "community", "f": ["community", "communities"], "pos": "n", "ipa": "kəˈmjuːnəti", "vi": "cộng đồng", "ex": "Small chats can build a real sense of community.", "exVi": "Những cuộc trò chuyện nhỏ có thể xây dựng cảm giác cộng đồng thật sự."}, {"w": "look out for", "f": ["look out for", "looks out for"], "pos": "phrase", "ipa": "lʊk aʊt fɔːr", "vi": "để mắt đến, quan tâm chăm sóc", "ex": "Neighbors who know each other look out for one another.", "exVi": "Những hàng xóm quen biết nhau để mắt đến nhau."}, {"w": "package", "f": ["package", "packages"], "pos": "n", "ipa": "ˈpækɪdʒ", "vi": "gói hàng, bưu kiện", "ex": "She picked up my package while I was away.", "exVi": "Cô ấy đã nhận hộ gói hàng của mình trong lúc mình đi vắng."}, {"w": "purpose", "f": ["purpose", "purposes"], "pos": "n", "ipa": "ˈpɜːrpəs", "vi": "mục đích", "ex": "The purpose of small talk is to seem friendly.", "exVi": "Mục đích của chuyện phiếm là để có vẻ thân thiện."}, {"w": "overthink", "f": ["overthink", "overthinks", "overthought", "overthinking"], "pos": "v", "ipa": "ˌoʊvərˈθɪŋk", "vi": "suy nghĩ quá nhiều", "ex": "I think I'm overthinking this whole thing.", "exVi": "Mình nghĩ mình đang suy nghĩ quá nhiều về chuyện này."}], "grammar": [{"title": "Doesn't have to be (không cần thiết phải là)", "formula": "S + doesn't/don't have to be + tính từ/danh từ", "use": "Dùng để nói một điều gì đó không bắt buộc phải mang tính chất nào đó, thường dùng để trấn an, hạ thấp kỳ vọng.", "examples": [{"en": "Small talk doesn't have to be clever or deep.", "vi": "Chuyện phiếm không cần phải thông minh hay sâu sắc."}, {"en": "Your answer doesn't have to be perfect.", "vi": "Câu trả lời của bạn không cần phải hoàn hảo."}, {"en": "The gift doesn't have to be expensive.", "vi": "Món quà không cần phải đắt tiền."}]}, {"title": "Even + danh từ/cụm từ (nhấn mạnh mức tối thiểu)", "formula": "Even + noun/noun phrase + is/are + ...", "use": "Dùng để nhấn mạnh rằng ngay cả một điều nhỏ nhặt cũng có giá trị, thường dùng để so sánh với một lựa chọn tệ hơn.", "examples": [{"en": "Even a friendly nod is better than staring at your phone.", "vi": "Ngay cả một cái gật đầu thân thiện cũng tốt hơn việc nhìn chằm chằm vào điện thoại."}, {"en": "Even a short walk can improve your mood.", "vi": "Ngay cả một cuốc đi bộ ngắn cũng có thể cải thiện tâm trạng bạn."}, {"en": "Even one question can start a real conversation.", "vi": "Ngay cả một câu hỏi cũng có thể bắt đầu một cuộc trò chuyện thật sự."}]}], "phrases": [{"p": "go blank", "vi": "đầu óc trống rỗng, không nghĩ ra gì", "ex": "My mind went blank when I saw my neighbor.", "exVi": "Đầu óc mình trống rỗng khi thấy hàng xóm.", "ctx": "Thân mật, dùng khi đột nhiên không nghĩ ra điều gì để nói."}, {"p": "open the door to", "vi": "mở ra cơ hội cho", "ex": "A simple comment can open the door to a real chat.", "exVi": "Một nhận xét đơn giản có thể mở ra cơ hội cho một cuộc trò chuyện thật sự.", "ctx": "Trung tính, dùng theo nghĩa bóng để nói về cơ hội mới."}, {"p": "go a long way", "vi": "mang lại hiệu quả lớn, có ích nhiều", "ex": "A simple smile can go a long way.", "exVi": "Một nụ cười đơn giản có thể mang lại hiệu quả lớn.", "ctx": "Trung tính, dùng khi một hành động nhỏ có tác động lớn."}, {"p": "low pressure", "vi": "ít áp lực", "ex": "Talking about the weather is low pressure.", "exVi": "Nói về thời tiết thì ít áp lực.", "ctx": "Thân mật, dùng khi một tình huống không căng thẳng."}, {"p": "a guaranteed win", "vi": "chắc thắng, chắc chắn hiệu quả", "ex": "Complimenting someone's dog is basically a guaranteed win.", "exVi": "Khen con chó của ai đó gần như là chắc thắng luôn.", "ctx": "Thân mật, dùng khi một cách làm gần như luôn hiệu quả."}, {"p": "that's really all it takes", "vi": "chỉ cần vậy là đủ rồi", "ex": "Just say hi, that's really all it takes.", "exVi": "Cứ chào thôi, chỉ cần vậy là đủ rồi.", "ctx": "Thân mật, dùng để trấn an rằng việc gì đó rất đơn giản."}, {"p": "run into (someone)", "vi": "tình cờ gặp ai đó", "ex": "I keep running into my neighbor at the elevator.", "exVi": "Mình cứ tình cờ gặp hàng xóm ở thang máy.", "ctx": "Thân mật, dùng khi gặp ai đó ngẫu nhiên."}, {"p": "same here", "vi": "mình cũng vậy", "ex": "It's always awkward for me too — same here.", "exVi": "Với mình lúc nào cũng khó xử — mình cũng vậy.", "ctx": "Thân mật, dùng khi đồng cảm với điều ai đó vừa nói."}, {"p": "kind of", "vi": "kiểu như, hơi hơi", "ex": "You're kind of overthinking this.", "exVi": "Cậu đang hơi suy nghĩ quá nhiều về chuyện này đấy.", "ctx": "Rất thân mật, dùng để làm nhẹ một nhận định."}, {"p": "how's it going?", "vi": "dạo này thế nào?", "ex": "Hey, how's it going?", "exVi": "Này, dạo này thế nào?", "ctx": "Rất thân mật, lời chào hỏi thông thường."}], "quiz": [{"title": "Đoạn 1", "sentences": [{"t": "Small talk (1)___ have to be clever or deep.", "o": ["doesn't", "don't", "isn't"], "a": 0, "why": "Chủ ngữ số ít 'small talk', phủ định hiện tại đơn: doesn't have to."}, {"t": "Even a friendly nod (2)___ better than staring at your phone.", "o": ["is", "are", "be"], "a": 0, "why": "Chủ ngữ số ít 'a friendly nod', hiện tại đơn: is."}, {"t": "Asking a question can (3)___ a quick hello into a real conversation.", "o": ["turn", "turns", "turned"], "a": 0, "why": "Sau 'can' dùng động từ nguyên mẫu: turn."}, {"t": "Neighbors who know each other tend to look (4)___ for one another.", "o": ["out", "after", "for"], "a": 0, "why": "Cụm động từ cố định 'look out for'."}, {"t": "A simple comment can open the door (5)___ a real chat.", "o": ["to", "for", "of"], "a": 0, "why": "Cụm cố định 'open the door to'."}, {"t": "That might (6)___ picking up a package or watering plants.", "o": ["mean", "means", "meant"], "a": 0, "why": "Sau 'might' dùng động từ nguyên mẫu: mean."}]}, {"title": "Đoạn 2", "sentences": [{"t": "Liam said talking about the weather (1)___ boring but worked.", "o": ["sound", "sounds", "sounded"], "a": 1, "why": "Ý kiến vẫn đúng ở hiện tại nên giữ nguyên thì: sounds."}, {"t": "Ava said people (2)___ talking about themselves.", "o": ["love", "loves", "loved"], "a": 0, "why": "Sự thật chung vẫn đúng, giữ nguyên hiện tại đơn: love."}, {"t": "He told her commenting on the dog was basically a guaranteed (3)___.", "o": ["win", "wins", "winning"], "a": 0, "why": "Danh từ 'a guaranteed win' dùng số ít."}, {"t": "She admitted she was probably (4)___ the whole thing.", "o": ["overthink", "overthinking", "overthought"], "a": 1, "why": "Sau 'was' dùng V-ing để diễn tả hành động đang diễn ra: overthinking."}, {"t": "He said a nod and a smile (5)___ still better than staring at a phone.", "o": ["is", "was", "were"], "a": 1, "why": "Câu tường thuật lùi về quá khứ: was."}, {"t": "She agreed to (6)___ that the next morning.", "o": ["try", "tries", "tried"], "a": 0, "why": "Sau 'to' dùng động từ nguyên mẫu: try."}]}]}, {"id": "B1-ENTERTAINMENT-003", "topic": "ENTERTAINMENT", "n": 3, "level": "B1", "title": "Why We Rewatch the Same Shows", "titleVi": "Vì sao chúng ta xem đi xem lại cùng một bộ phim", "passage": [{"en": "Ask a few friends about their comfort show, and you'll probably hear about something they've seen ten times.", "vi": "Hỏi vài người bạn về bộ phim 'an ủi' của họ, có lẽ bạn sẽ nghe về thứ gì đó họ đã xem đến mười lần."}, {"en": "For a lot of people, rewatching an old favorite feels less like entertainment and more like comfort food.", "vi": "Với nhiều người, xem lại một b
