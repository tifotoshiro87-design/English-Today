<!DOCTYPE html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nói tiếng Anh">
<meta name="theme-color" content="#0B7A85">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B7A85'/%3E%3Ctext x='50' y='64' font-size='52' font-family='Arial,sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B7A85'/%3E%3Ctext x='50' y='64' font-size='52' font-family='Arial,sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EEN%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22N%C3%B3i%20ti%E1%BA%BFng%20Anh%20nh%C6%B0%20ng%C6%B0%E1%BB%9Di%20b%E1%BA%A3n%20x%E1%BB%A9%22%2C%22short_name%22%3A%22N%C3%B3i%20ti%E1%BA%BFng%20Anh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F2F6F7%22%2C%22theme_color%22%3A%22%230B7A85%22%7D">
<title>Nói tiếng Anh như người bản xứ – 3 cấp độ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --ink:#16303A; --muted:#566E7A; --line:#D3DFE4;
  --brand:#0B7A85; --brand-ink:#FFFFFF; --brand-soft:#DDF1F3;
  --hi:#FFE7A0; --ok:#1B8558; --ok-soft:#DCF3E7; --bad:#C23B3B; --bad-soft:#FBE2E2; --warn-soft:#FFF1CF;
  --s0:#DDF1F3; --s1:#FFF0CC; --s2:#EADFF7; --s3:#E1F2D9;
  --shadow:0 1px 2px rgba(22,48,58,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-size:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F181C; --surface:#172329; --ink:#E6EFF2; --muted:#98AEB8; --line:#2B3C44;
    --brand:#4CC4CE; --brand-ink:#08262A; --brand-soft:#173A40;
    --hi:#5B4B14; --ok:#4CC58F; --ok-soft:#153427; --bad:#F08585; --bad-soft:#3B1C1C; --warn-soft:#3A3212;
    --s0:#173A40; --s1:#3A3212; --s2:#2E2545; --s3:#22381A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F181C; --surface:#172329; --ink:#E6EFF2; --muted:#98AEB8; --line:#2B3C44;
  --brand:#4CC4CE; --brand-ink:#08262A; --brand-soft:#173A40;
  --hi:#5B4B14; --ok:#4CC58F; --ok-soft:#153427; --bad:#F08585; --bad-soft:#3B1C1C; --warn-soft:#3A3212;
  --s0:#173A40; --s1:#3A3212; --s2:#2E2545; --s3:#22381A; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;overflow-wrap:break-word;word-break:break-word;min-width:0}
img,svg,video,canvas{max-width:100%}
.opts,.tabs,.lvsw,.nav{min-width:0}
.opt,.tabs button,.lvsw button,.nav button{min-width:0;overflow-wrap:break-word;word-break:break-word;white-space:normal}
.bub,.bub .ln,.bub .ln>*,.turn{min-width:0;max-width:100%}
.vw,.vw>*{min-width:0}
.wd{overflow-wrap:break-word;word-break:break-word}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;font-size:1rem;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,.w:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
p{margin:.3rem 0}
h1,h2,h3{margin:0;line-height:1.25}
.wrap{max-width:720px;margin:0 auto;padding:0 .9rem 5rem}
.composer-fixed{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:.6rem .9rem calc(.6rem + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.composer-in{max-width:720px;margin:0 auto}
body.has-composer .wrap{padding-bottom:11rem}

/* top bar */
.top-in{max-width:720px;margin:0 auto;padding:.6rem .9rem .3rem}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.navbar-in{max-width:720px;margin:0 auto;padding:.4rem .9rem}
.brand{display:flex;align-items:center;gap:.6rem}
.lv{background:var(--brand);color:var(--brand-ink);font-weight:800;border-radius:.6rem;padding:.15rem .55rem;font-size:.95rem}
.ttl{font-weight:800;font-size:1.05rem;line-height:1.2}
.sub{color:var(--muted);font-size:.8rem}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.nav button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:.7rem;font-weight:600;font-size:.82rem;padding:.3rem .2rem}
.nav button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.lvsw{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin:.4rem 0 .1rem}
.lvsw button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:.7rem;font-weight:700;font-size:.85rem;padding:.2rem}
.lvsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvsw button .soon{display:block;font-weight:500;font-size:.72rem;opacity:.7}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.9rem;margin:.8rem 0;box-shadow:var(--shadow);overflow-wrap:break-word;word-break:break-word;max-width:100%}
.h2{font-size:1.25rem;font-weight:800;margin:1.1rem 0 .4rem}
.h3{font-size:1.05rem;font-weight:800;margin:.2rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border-radius:.8rem;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.block{display:flex;width:100%}
.btn.on{background:var(--brand-soft);border-color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.4rem;margin:.4rem 0}
.bar{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.back{background:none;border:0;color:var(--brand);font-weight:700;min-height:44px;padding:0 .2rem}

/* lists */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.7rem .9rem;margin:.5rem 0;min-height:64px}
.item .num{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center}
.item .t{font-weight:700;line-height:1.3}
.item .d{font-size:.85rem;color:var(--muted)}
.item .go{margin-left:auto;color:var(--muted);font-size:1.3rem}
.item.done .num{background:var(--ok);color:#fff}
.item.soon{opacity:.6}

/* speaker button */
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk svg{width:22px;height:22px;fill:currentColor}
.spk .ic-stop,.btn-all .ic-stop{display:none}
.spk.playing{background:var(--brand);color:var(--brand-ink)}
.spk.playing .ic-play,.btn-all.playing .ic-play{display:none}
.spk.playing .ic-stop,.btn-all.playing .ic-stop{display:block}
.btn-all.playing{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin:.6rem 0}
.tabs button{grid-column:span 2;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:.8rem;font-weight:600;font-size:.88rem;line-height:1.2;padding:.3rem .3rem}
.tabs button:nth-child(-n+2){grid-column:span 3}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* passage */
.row{display:flex;gap:.55rem;align-items:flex-start;padding:.55rem .4rem;border-bottom:1px solid var(--line);border-radius:.6rem}
.row:last-child{border-bottom:0}
.row.now{background:var(--hi)}
.row .tx{flex:1;min-width:0}
.en{font-size:1.02rem}
.vi{color:var(--muted);font-size:.92rem}
.w{border-bottom:2px dotted var(--brand);cursor:pointer;touch-action:manipulation}
.para{font-size:1.08rem;line-height:1.9;margin-top:.5rem;overflow-wrap:break-word;word-break:break-word}
.para.vi{color:var(--muted);font-size:.98rem;line-height:1.75;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.8rem;overflow-wrap:break-word;word-break:break-word}
.sen{border-radius:.35rem;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sen.now{background:var(--hi)}

/* dialogue */
.turn{display:flex;flex-direction:column;margin:.7rem 0;width:94%}
.turn.r{margin-left:auto;align-items:flex-end}.turn.r .bub{align-self:stretch}.turn:not(.r) .bub{align-self:stretch}
.turn .who{font-weight:800;font-size:.85rem;margin:0 .5rem .15rem}
.bub{border-radius:1.1rem;padding:.55rem .75rem;border:1px solid var(--line)}
.turn.k0 .bub{background:var(--s0)} .turn.k1 .bub{background:var(--s1)} .turn.k2 .bub{background:var(--s2)} .turn.k3 .bub{background:var(--s3)}
.turn.now .bub{outline:3px solid var(--hi)}
.bub .ln{display:flex;gap:.5rem;align-items:flex-start}
.bub .vi{margin-top:.25rem}

/* vocab */
.vw{display:flex;gap:.6rem;align-items:center}
.vw .wd{font-weight:800;font-size:1.15rem}
.pos{background:var(--brand-soft);color:var(--brand);border-radius:.5rem;padding:0 .4rem;font-size:.8rem;font-weight:700;margin-left:.3rem}
.ipa{color:var(--muted);font-size:.95rem}
.exr{display:flex;gap:.5rem;align-items:flex-start;margin-top:.35rem}
.exr>div{min-width:0;flex:1 1 auto;overflow-wrap:break-word;word-break:break-word}
.formula{background:var(--warn-soft);border-radius:.7rem;padding:.5rem .7rem;font-weight:700;margin:.4rem 0}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:.6rem;padding:.05rem .5rem;font-size:.82rem;font-weight:600}

/* speaking */
.emma{display:flex;gap:.7rem;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem}
.msg{border-radius:1rem;padding:.6rem .8rem;margin:.6rem 0;border:1px solid var(--line);background:var(--surface);overflow-wrap:break-word;word-break:break-word;max-width:100%}
.msg.me{background:var(--brand-soft);margin-left:12%}
.msg.girl{margin-right:6%}
.fb-sec{border-radius:.8rem;padding:.5rem .7rem;margin:.4rem 0;background:var(--bg);overflow-wrap:break-word;word-break:break-word}
.fb-sec.okc{background:var(--ok-soft)} .fb-sec.badc{background:var(--bad-soft)}
.fb-sec ul{margin:.2rem 0 0;padding-left:1.2rem}
textarea{width:100%;min-height:90px;font:inherit;font-size:1.05rem;padding:.7rem;border-radius:.8rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.mic{width:100%;min-height:76px;border-radius:1.2rem;border:0;background:var(--brand);color:var(--brand-ink);font-size:1.2rem;font-weight:800}
.mic.live{background:var(--bad);color:#fff}
.info{background:var(--warn-soft);border-radius:.8rem;padding:.6rem .8rem;margin:.6rem 0}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* quiz */
.qtext{line-height:1.9;font-size:1.05rem}
.blank{background:var(--warn-soft);border-radius:.4rem;padding:0 .3rem;font-weight:700}
.filled{border-radius:.4rem;padding:0 .3rem;font-weight:700}
.filled.ok{background:var(--ok-soft);color:var(--ok)}
.filled.bad{background:var(--bad-soft);color:var(--bad)}
.qb{border-top:1px solid var(--line);padding:.6rem 0}
.qn{font-weight:800;margin-bottom:.3rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.opt{min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:.8rem;font-weight:600;padding:.2rem .3rem;line-height:1.2;word-break:break-word}
.opt b{color:var(--brand)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:.4rem;font-size:.92rem}
.why.okc{color:var(--ok)} .why.badc{color:var(--bad)}
.result{text-align:center}
.result .big{font-size:2rem;font-weight:800}

/* settings */
.vrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.vrow .nm{flex:1 1 12rem;min-width:0;font-weight:600;font-size:.95rem;word-break:break-word}
.vrow .btn{min-height:44px;padding:.3rem .7rem;font-size:.9rem}
.badge{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:.5rem;padding:0 .4rem;font-size:.75rem;font-weight:700;margin-left:.3rem}

/* overlays */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:.6rem .8rem calc(.8rem + env(safe-area-inset-bottom,0px));display:none}
#sheet.on{display:block}
#sheet .in{max-width:720px;margin:0 auto;background:var(--surface);border:2px solid var(--brand);border-radius:1.1rem;padding:.8rem .9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#notice{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + .5rem);z-index:50;display:none;padding:0 .8rem}
#notice.on{display:block}
#notice .in{max-width:720px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:.9rem;padding:.7rem .9rem;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" role="dialog" aria-live="polite"></div>
<div id="notice" role="alert"><div class="in" id="noticeTx"></div></div>
<script type="application/json" id="lesson-data">{"goal": 500, "levels": [{"key": "B1", "badge": "B1", "name": "Trung bình"}, {"key": "B2", "badge": "B2", "name": "Khó"}, {"key": "C1", "badge": "C1", "name": "Nâng cao"}], "topics": [{"n": 1, "key": "SOCIAL", "name": "Social (Kinh tế – Chính trị – Xã hội)"}, {"n": 2, "key": "SCIENCE", "name": "Science (Khoa học – Vũ trụ – Thiên nhiên – Toán học)"}, {"n": 3, "key": "ENTERTAINMENT", "name": "Entertainment (Văn học – Phim ảnh – Âm nhạc)"}, {"n": 4, "key": "HEALTH", "name": "Healthcare (Y tế)"}, {"n": 5, "key": "DAILY", "name": "Daily Life (Du lịch – Giáo dục – Đời sống)"}, {"n": 6, "key": "SPORTS", "name": "Sports (Thể thao)"}, {"n": 7, "key": "PHRASES", "name": "Common Phrases (Cụm từ người bản xứ hay dùng)"}], "lessons": [{"id": "B1-SOCIAL-001", "topic": "SOCIAL", "n": 1, "title": "Living on a Budget", "titleVi": "Sống theo ngân sách", "passage": [{"en": "Managing money is not easy, especially when prices keep going up.", "vi": "Quản lý tiền bạc không dễ, nhất là khi giá cả cứ tăng mãi."}, {"en": "A lot of people spend their whole salary before the end of the month and don't know where it went.", "vi": "Nhiều người tiêu hết cả tháng lương trước khi hết tháng mà không biết tiền đã đi đâu."}, {"en": "That's why many experts say you should make a budget.", "vi": "Vì vậy nhiều chuyên gia khuyên bạn nên lập ngân sách."}, {"en": "A budget is simply a plan for your money: how much comes in and how much goes out.", "vi": "Ngân sách đơn giản là một kế hoạch cho đồng tiền của bạn: bao nhiêu tiền vào và bao nhiêu tiền ra."}, {"en": "First, write down your monthly income, which is the money you earn from your job.", "vi": "Trước tiên, hãy ghi ra thu nhập hằng tháng, tức là số tiền bạn kiếm được từ công việc."}, {"en": "Then list your fixed costs, such as rent, electricity, water and the internet bill.", "vi": "Sau đó liệt kê các chi phí cố định như tiền thuê nhà, tiền điện, tiền nước và tiền internet."}, {"en": "These bills stay almost the same every month, so they are easy to plan for.", "vi": "Những khoản này gần như không đổi mỗi tháng nên rất dễ lên kế hoạch."}, {"en": "Next, think about the things that change, like food, transport and entertainment.", "vi": "Tiếp theo, hãy nghĩ đến những khoản hay thay đổi như ăn uống, đi lại và giải trí."}, {"en": "This is where most people can save a little money without feeling unhappy.", "vi": "Đây là chỗ mà hầu hết mọi người có thể tiết kiệm được một ít mà không thấy khó chịu."}, {"en": "For example, cooking at home is much cheaper than eating out every day.", "vi": "Ví dụ, nấu ăn ở nhà rẻ hơn nhiều so với ngày nào cũng ăn ngoài."}, {"en": "Buying things on sale is another smart habit, but only if you really need them.", "vi": "Mua đồ đang giảm giá là một thói quen khôn ngoan khác, nhưng chỉ khi bạn thật sự cần chúng."}, {"en": "A cheap jacket is not a good deal if you never wear it.", "vi": "Một chiếc áo khoác rẻ không phải là món hời nếu bạn chẳng bao giờ mặc nó."}, {"en": "Some people feel they can't afford to save anything, but even ten dollars a month is a start.", "vi": "Có người cảm thấy mình không đủ khả năng để dành ra đồng nào, nhưng mỗi tháng dành ra mười đô cũng đã là một khởi đầu."}, {"en": "If you save a little every month, you will have a safety net when something unexpected happens.", "vi": "Nếu bạn để dành một ít mỗi tháng, bạn sẽ có một khoản dự phòng khi có chuyện bất ngờ xảy ra."}, {"en": "Of course, some months are harder than others, and that's completely normal.", "vi": "Tất nhiên, có những tháng khó khăn hơn những tháng khác, và điều đó hoàn toàn bình thường."}, {"en": "The most important thing is to keep trying and to check your budget regularly.", "vi": "Điều quan trọng nhất là cứ tiếp tục cố gắng và thường xuyên kiểm tra ngân sách của mình."}, {"en": "After a few months, you will probably feel much more relaxed about money.", "vi": "Sau vài tháng, có lẽ bạn sẽ thấy thoải mái hơn nhiều về chuyện tiền bạc."}], "dialogue": [{"who": "Tom", "g": "m", "en": "Guys, I checked my banking app this morning, and I've only got twenty dollars left. It's only the twentieth!", "vi": "Mọi người ơi, sáng nay mình vừa xem app ngân hàng và chỉ còn đúng hai mươi đô. Mới ngày hai mươi thôi mà!"}, {"who": "Lily", "g": "f", "en": "Same here, honestly. I have no idea where my money goes.", "vi": "Mình cũng vậy, thật lòng luôn. Mình chẳng biết tiền của mình đi đâu hết."}, {"who": "Sara", "g": "f", "en": "I know where mine goes. Coffee and delivery food, almost every day.", "vi": "Còn mình thì biết tiền mình đi đâu. Cà phê với đồ ăn giao tận nơi, gần như ngày nào cũng vậy."}, {"who": "Tom", "g": "m", "en": "Okay, that's a lot of coffee. Maybe we need a house budget, like my mom does.", "vi": "Ừ, vậy là nhiều cà phê thật đó. Có khi nhà mình cần một bản ngân sách chung, giống như mẹ mình hay làm."}, {"who": "Lily", "g": "f", "en": "A budget? That sounds boring, but you're probably right. How do we start?", "vi": "Ngân sách á? Nghe chán ghê, nhưng chắc cậu nói đúng. Mình bắt đầu thế nào đây?"}, {"who": "Sara", "g": "f", "en": "Let's write down what comes in first. My income is about nine hundred a month after tax. What about you two?", "vi": "Trước hết mình ghi ra khoản tiền vào đã. Thu nhập của mình khoảng chín trăm đô một tháng sau thuế. Hai cậu thì sao?"}, {"who": "Lily", "g": "f", "en": "Mine's a bit lower, around eight hundred, because I only work part-time.", "vi": "Của mình thấp hơn một chút, khoảng tám trăm, vì mình chỉ làm bán thời gian."}, {"who": "Tom", "g": "m", "en": "I get about a thousand. So together we have roughly twenty-seven hundred.", "vi": "Mình được khoảng một nghìn. Vậy cộng lại tụi mình có khoảng hai nghìn bảy trăm."}, {"who": "Sara", "g": "f", "en": "Great. Now the bills. Rent is twelve hundred for the apartment, and the internet and electricity are about two hundred together.", "vi": "Tốt. Giờ tới các khoản hóa đơn. Tiền thuê căn hộ là một nghìn hai, còn internet với điện tổng cộng khoảng hai trăm."}, {"who": "Lily", "g": "f", "en": "So that leaves us about thirteen hundred for everything else. It doesn't sound like much when you say it out loud.", "vi": "Vậy là còn khoảng một nghìn ba cho mọi thứ khác. Nói to lên nghe chẳng nhiều nhặn gì."}, {"who": "Tom", "g": "m", "en": "We definitely can't afford to eat out three times a week. Cooking together would be way cheaper than that.", "vi": "Chắc chắn tụi mình không đủ khả năng ăn ngoài ba lần một tuần rồi. Nấu ăn chung sẽ rẻ hơn thế nhiều."}, {"who": "Sara", "g": "f", "en": "If we cook a big meal on Sundays, we'll have lunch for the whole week.", "vi": "Nếu tụi mình nấu một bữa thật lớn vào Chủ nhật, thì sẽ có cơm trưa cho cả tuần."}, {"who": "Lily", "g": "f", "en": "I like that. And the supermarket near the station has a sale on rice and vegetables today. Should we go now?", "vi": "Mình thích ý đó. Với lại siêu thị gần ga hôm nay đang giảm giá gạo và rau. Mình đi luôn nhé?"}, {"who": "Tom", "g": "m", "en": "Sure, but let's make a list first. Last time I went in for milk and came out with a pizza and three chocolate bars.", "vi": "Được, nhưng viết danh sách trước đã. Lần trước mình vào mua sữa mà ra với một cái pizza và ba thanh sô-cô-la."}, {"who": "Sara", "g": "f", "en": "Ha! That's exactly what we need to stop. Let's set a limit of ten dollars each for snacks.", "vi": "Ha! Đúng là thứ mà mình phải bỏ đó. Mình đặt hạn mức mười đô mỗi người cho đồ ăn vặt nhé."}, {"who": "Lily", "g": "f", "en": "Deal. And let's check the budget together every Friday, just for ten minutes.", "vi": "Chốt. Và mỗi thứ Sáu mình cùng xem lại ngân sách, chỉ mười phút thôi."}, {"who": "Tom", "g": "m", "en": "Okay, okay. Maybe I'll actually enjoy having some money left at the end of the month for once.", "vi": "Rồi rồi. Biết đâu mình lại thấy vui khi còn dư chút tiền vào cuối tháng, một lần cho biết."}], "vocab": [{"w": "budget", "f": ["budget", "budgets"], "pos": "n", "ipa": "ˈbʌdʒɪt", "vi": "ngân sách", "ex": "We set a budget of two thousand dollars for our wedding.", "exVi": "Chúng tôi đặt ngân sách hai nghìn đô la cho đám cưới."}, {"w": "income", "f": ["income"], "pos": "n", "ipa": "ˈɪnkʌm", "vi": "thu nhập", "ex": "Her main source of income is teaching English online.", "exVi": "Nguồn thu nhập chính của cô ấy là dạy tiếng Anh trực tuyến."}, {"w": "rent", "f": ["rent"], "pos": "n", "ipa": "rent", "vi": "tiền thuê nhà", "ex": "How much rent do you pay for your apartment?", "exVi": "Bạn trả bao nhiêu tiền thuê cho căn hộ của mình?"}, {"w": "bill", "f": ["bill", "bills"], "pos": "n", "ipa": "bɪl", "vi": "hóa đơn; tiền điện, nước…", "ex": "I forgot to pay the water bill this month.", "exVi": "Tháng này tôi quên đóng tiền nước."}, {"w": "afford", "f": ["afford"], "pos": "v", "ipa": "əˈfɔːrd", "vi": "đủ khả năng (chi trả)", "ex": "We'd love to buy a house, but we can't afford one yet.", "exVi": "Chúng tôi rất muốn mua nhà, nhưng hiện chưa đủ tiền."}, {"w": "save", "f": ["save", "saves", "saving"], "pos": "v", "ipa": "seɪv", "vi": "tiết kiệm; để dành", "ex": "He saves ten percent of his salary every month.", "exVi": "Anh ấy để dành mười phần trăm tiền lương mỗi tháng."}, {"w": "spend", "f": ["spend", "spent"], "pos": "v", "ipa": "spend", "vi": "tiêu (tiền); dành (thời gian)", "ex": "Try not to spend too much money on clothes.", "exVi": "Cố đừng tiêu quá nhiều tiền vào quần áo nhé."}, {"w": "cheap", "f": ["cheap", "cheaper"], "pos": "adj", "ipa": "tʃiːp", "vi": "rẻ", "ex": "This hotel is cheap, but it's clean and comfortable.", "exVi": "Khách sạn này rẻ nhưng sạch sẽ và thoải mái."}, {"w": "sale", "f": ["sale"], "pos": "n", "ipa": "seɪl", "vi": "đợt giảm giá; việc bán hàng", "ex": "All the shoes in this shop are on sale this weekend.", "exVi": "Tất cả giày trong cửa hàng này đang giảm giá cuối tuần này."}, {"w": "habit", "f": ["habit"], "pos": "n", "ipa": "ˈhæbɪt", "vi": "thói quen", "ex": "Drinking a glass of water in the morning is a healthy habit.", "exVi": "Uống một ly nước vào buổi sáng là thói quen tốt cho sức khỏe."}, {"w": "unexpected", "f": ["unexpected"], "pos": "adj", "ipa": "ˌʌnɪkˈspektɪd", "vi": "bất ngờ, không lường trước", "ex": "We had an unexpected visitor last night.", "exVi": "Tối qua nhà tôi có một vị khách bất ngờ."}, {"w": "regularly", "f": ["regularly"], "pos": "adv", "ipa": "ˈreɡjələrli", "vi": "thường xuyên, đều đặn", "ex": "You should exercise regularly to stay healthy.", "exVi": "Bạn nên tập thể dục thường xuyên để giữ sức khỏe."}], "grammar": [{"title": "Câu điều kiện loại 1 (First conditional)", "formula": "If + hiện tại đơn, S + will + động từ nguyên mẫu", "use": "Dùng để nói về một điều có thể xảy ra ở hiện tại hoặc tương lai và kết quả của nó. Mệnh đề If dùng hiện tại đơn (không dùng will). Có thể đảo vị trí hai mệnh đề; khi mệnh đề If đứng sau thì không cần dấu phẩy.", "examples": [{"en": "If it rains tomorrow, we'll stay at home.", "vi": "Nếu ngày mai trời mưa, chúng tôi sẽ ở nhà."}, {"en": "You'll miss the bus if you don't hurry.", "vi": "Bạn sẽ lỡ xe buýt nếu không nhanh lên."}, {"en": "If she calls me, I'll tell her the news.", "vi": "Nếu cô ấy gọi cho tôi, tôi sẽ báo tin cho cô ấy."}]}, {"title": "Can / can’t afford (to)", "formula": "S + can / can’t + afford + danh từ  |  S + can / can’t + afford + to + động từ", "use": "Nói về việc có (hoặc không có) đủ tiền, đủ điều kiện để mua hay làm việc gì. Thường dùng với can/can’t/could; trong câu hỏi dùng “Can you afford…?”.", "examples": [{"en": "We can't afford a new car this year.", "vi": "Năm nay chúng tôi không đủ tiền mua xe mới."}, {"en": "Can you afford to take a week off work?", "vi": "Bạn có thể nghỉ làm một tuần mà không sao về tiền không?"}, {"en": "I can't afford to lose this job.", "vi": "Tôi không thể để mất công việc này."}]}, {"title": "So sánh hơn (Comparatives)", "formula": "S + be + tính từ ngắn-er + than  |  S + be + more + tính từ dài + than", "use": "Dùng để so sánh hai người, vật hay việc. Tính từ ngắn thêm -er (cheap → cheaper); tính từ dài dùng more (expensive → more expensive). Thêm much / a lot / a bit trước dạng so sánh để nhấn mạnh mức độ.", "examples": [{"en": "The bus is slower than the train, but it's cheaper.", "vi": "Xe buýt chậm hơn tàu, nhưng rẻ hơn."}, {"en": "This laptop is more expensive than mine.", "vi": "Chiếc laptop này đắt hơn chiếc của tôi."}, {"en": "Living in the city is much more stressful than living in a small town.", "vi": "Sống ở thành phố căng thẳng hơn nhiều so với sống ở thị trấn nhỏ."}]}], "phrases": [{"p": "make ends meet", "vi": "xoay xở đủ tiền để sống", "ex": "With rent so high, many families struggle to make ends meet.", "exVi": "Tiền thuê nhà cao thế này, nhiều gia đình phải chật vật mới đủ sống.", "ctx": "Trung tính, dùng được khi nói chuyện lẫn khi viết; nói về khó khăn tài chính."}, {"p": "live within your means", "vi": "sống trong khả năng tài chính (chi tiêu vừa với thu nhập)", "ex": "My parents always taught me to live within my means.", "exVi": "Bố mẹ luôn dạy tôi phải chi tiêu vừa với khả năng của mình.", "ctx": "Hơi nghiêm túc; dùng khi khuyên nhủ hoặc nói về lối sống."}, {"p": "save up for", "vi": "để dành tiền cho / để mua…", "ex": "I'm saving up for a new laptop.", "exVi": "Tôi đang để dành tiền mua một chiếc laptop mới.", "ctx": "Thân mật, dùng hằng ngày với bạn bè, đồng nghiệp."}, {"p": "cut back on", "vi": "cắt giảm (chi tiêu, đồ ăn, thói quen…)", "ex": "We need to cut back on eating out.", "exVi": "Chúng ta cần cắt giảm việc ăn ngoài.", "ctx": "Trung tính; dùng được với bạn bè, gia đình và cả ở nơi làm việc."}, {"p": "be short of cash", "vi": "thiếu tiền mặt, hơi hết tiền", "ex": "Can you pay for lunch? I'm a bit short of cash today.", "exVi": "Bạn trả tiền ăn trưa giúp mình được không? Hôm nay mình hơi hết tiền.", "ctx": "Thân mật; nhờ bạn bè hoặc người quen. Thêm “a bit” cho bớt ngại."}, {"p": "on a tight budget", "vi": "với ngân sách eo hẹp", "ex": "We're travelling on a tight budget, so we stay in hostels.", "exVi": "Chúng tôi đi du lịch với ngân sách eo hẹp nên ở nhà nghỉ tập thể.", "ctx": "Trung tính; dùng khi kể về hoàn cảnh của mình hay của người khác."}, {"p": "keep track of your spending", "vi": "theo dõi chi tiêu của mình", "ex": "This app helps me keep track of my spending.", "exVi": "Ứng dụng này giúp tôi theo dõi chi tiêu của mình.", "ctx": "Trung tính; dùng khi nói về quản lý tiền, có thể dùng ở công việc."}, {"p": "put some money aside", "vi": "để riêng ra một ít tiền", "ex": "I try to put some money aside every payday.", "exVi": "Ngày nào nhận lương tôi cũng cố để riêng ra một ít.", "ctx": "Thân mật đến trung tính; nói về thói quen tiết kiệm."}, {"p": "split the bill", "vi": "chia hóa đơn (khi đi ăn chung)", "ex": "Let's split the bill. It's easier.", "exVi": "Mình chia hóa đơn đi, cho đơn giản.", "ctx": "Thân mật đến trung tính; nói với bạn bè hoặc đồng nghiệp ở nhà hàng."}, {"p": "chip in", "vi": "góp tiền (mỗi người góp một ít)", "ex": "Everyone chipped in to buy Mia a birthday present.", "exVi": "Ai cũng góp tiền mua quà sinh nhật cho Mia.", "ctx": "Thân mật; nhóm bạn, đồng nghiệp, gia đình."}, {"p": "It's a bargain.", "vi": "Giá hời quá!", "ex": "Only ten dollars for these boots? It's a bargain!", "exVi": "Chỉ mười đô cho đôi ủng này á? Hời quá!", "ctx": "Thân mật; khi đi mua sắm hoặc kể về món đồ đã mua."}, {"p": "It's a rip-off.", "vi": "Đắt cắt cổ! / Bị chặt chém rồi!", "ex": "Five dollars for a bottle of water? That's a rip-off.", "exVi": "Năm đô một chai nước á? Chặt chém quá.", "ctx": "Rất thân mật, hơi tiêu cực; nói với bạn bè, không nói thẳng với người bán."}, {"p": "It's out of my price range.", "vi": "Cái này vượt quá tầm giá của tôi.", "ex": "The apartment is lovely, but it's out of my price range.", "exVi": "Căn hộ này đẹp thật, nhưng vượt quá tầm giá của tôi.", "ctx": "Lịch sự; dùng được với nhân viên bán hàng hay môi giới."}, {"p": "I'm broke.", "vi": "Mình cháy túi rồi.", "ex": "I can't go out tonight. I'm completely broke.", "exVi": "Tối nay mình không đi chơi được. Mình hết sạch tiền rồi.", "ctx": "Rất thân mật; nói với bạn bè, không dùng ở nơi trang trọng."}], "quiz": [{"title": "Sam đi siêu thị", "sentences": [{"t": "Last Saturday, Sam (1)___ to the supermarket to buy food for the week.", "o": ["go", "went", "going"], "a": 1, "why": "“Last Saturday” chỉ quá khứ nên dùng quá khứ đơn: went."}, {"t": "He didn't have much money, so he (2)___ a shopping list before he left home.", "o": ["write", "wrote", "writes"], "a": 1, "why": "Đang kể chuyện đã xảy ra nên dùng quá khứ đơn: wrote."}, {"t": "The rice was (3)___ than he expected, so he bought two bags.", "o": ["cheap", "cheaper", "cheapest"], "a": 1, "why": "Có “than” nên dùng so sánh hơn: cheaper than."}, {"t": "“If I (4)___ too many snacks, I won't have enough money for dinner,” he thought.", "o": ["buy", "will buy", "bought"], "a": 0, "why": "Câu điều kiện loại 1: mệnh đề If dùng hiện tại đơn (buy), mệnh đề chính dùng will."}, {"t": "He put the chocolate back because he couldn't (5)___ to spend so much.", "o": ["afford", "effort", "offer"], "a": 0, "why": "Cấu trúc can’t afford to + động từ nghĩa là “không đủ tiền để…”."}, {"t": "At the checkout, the cashier told him that the vegetables were (6)___ sale.", "o": ["in", "on", "at"], "a": 1, "why": "“On sale” là cụm cố định, nghĩa là đang giảm giá."}, {"t": "Sam (7)___ only thirty dollars, which was less than he had planned.", "o": ["spend", "spent", "spending"], "a": 1, "why": "Chuyện đã xảy ra ở quá khứ nên dùng spent (quá khứ của spend)."}, {"t": "He felt proud and decided to check his budget (8)___ from now on.", "o": ["regular", "regularly", "regularity"], "a": 1, "why": "Cần trạng từ bổ nghĩa cho động từ check: regularly (thường xuyên)."}]}, {"title": "Hai người bạn cùng phòng", "sentences": [{"t": "Anna and her roommate Kate (1)___ in a small apartment near the city center.", "o": ["live", "lives", "living"], "a": 0, "why": "Chủ ngữ “Anna and her roommate Kate” là số nhiều nên dùng live (không thêm s)."}, {"t": "The (2)___ for the apartment is five hundred dollars a month, and they share it equally.", "o": ["rent", "habit", "sale"], "a": 0, "why": "“Rent” là tiền thuê nhà, hợp với “for the apartment”."}, {"t": "They also pay the electricity and water (3)___ together.", "o": ["bills", "sales", "habits"], "a": 0, "why": "“Bills” là hóa đơn tiền điện, nước."}, {"t": "Kate works part-time, so her monthly (4)___ is lower than Anna's.", "o": ["income", "habit", "sale"], "a": 0, "why": "Làm bán thời gian nên thu nhập (income) thấp hơn."}, {"t": "Because of this, Kate can't (5)___ to buy a new phone this year.", "o": ["afford", "cost", "spend"], "a": 0, "why": "Cấu trúc can’t afford to + động từ: không đủ tiền để làm gì."}, {"t": "Anna (6)___ Kate with the shopping every week.", "o": ["help", "helps", "helping"], "a": 1, "why": "Anna là ngôi thứ ba số ít, hiện tại đơn nên thêm s: helps."}, {"t": "If they cook at home more often, they (7)___ a lot of money.", "o": ["save", "will save", "saved"], "a": 1, "why": "Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính dùng will + động từ."}, {"t": "Ordering food every day is (8)___ expensive than cooking at home.", "o": ["more", "most", "much"], "a": 0, "why": "So sánh hơn với tính từ dài: more + tính từ + than. (Muốn nhấn mạnh thì nói much more.)"}]}, {"title": "Lucas và kế hoạch tiết kiệm", "sentences": [{"t": "Lucas is twenty years old, and he (1)___ a part-time job at a coffee shop.", "o": ["has", "have", "having"], "a": 0, "why": "Chủ ngữ “he” ở hiện tại đơn dùng has."}, {"t": "He earns about six hundred dollars a month, and he tries to (2)___ at least a hundred for emergencies.", "o": ["save", "lose", "forget"], "a": 0, "why": "“Save … for emergencies” là để dành tiền phòng khi khẩn cấp."}, {"t": "He says that a good (3)___ is more important than a high salary.", "o": ["habit", "sale", "bill"], "a": 0, "why": "“A good habit” là một thói quen tốt, hợp với ý của câu."}, {"t": "Last month he wanted a new jacket, but it was out of his price (4)___.", "o": ["range", "rate", "line"], "a": 0, "why": "“Out of my price range” là cụm cố định: vượt quá tầm giá."}, {"t": "So he waited for a (5)___ and bought it for half the price.", "o": ["sale", "rent", "income"], "a": 0, "why": "Đợi đến đợt giảm giá (a sale) thì mua được nửa giá."}, {"t": "Now Lucas is (6)___ to save for a trip to Japan next year.", "o": ["going", "go", "goes"], "a": 0, "why": "Nói về kế hoạch tương lai: be going to + động từ (is going to)."}, {"t": "If he (7)___ a hundred dollars every month, he will have twelve hundred dollars in a year.", "o": ["save", "saves", "will save"], "a": 1, "why": "Mệnh đề If dùng hiện tại đơn, chủ ngữ “he” nên thêm s: saves."}, {"t": "His friends often say he (8)___ too careful, but Lucas doesn't mind.", "o": ["are", "is", "be"], "a": 1, "why": "Chủ ngữ “he” đi với is."}]}], "level": "B1"}, {"id": "B1-SOCIAL-002", "topic": "SOCIAL", "n": 2, "title": "Starting a Small Business", "titleVi": "Bắt đầu một việc kinh doanh nhỏ", "passage": [{"en": "Many young people dream of starting their own business instead of working for a boss.", "vi": "Nhiều bạn trẻ mơ ước tự mở việc kinh doanh riêng thay vì đi làm cho sếp."}, {"en": "It sounds exciting, but it also takes a lot of planning and hard work.", "vi": "Nghe thì thú vị, nhưng nó cũng đòi hỏi rất nhiều kế hoạch và sự chăm chỉ."}, {"en": "Maria is a good example: two years ago, she was a waitress with a small salary and a big idea.", "vi": "Maria là một ví dụ điển hình: hai năm trước, cô ấy là nhân viên phục vụ với đồng lương nhỏ và một ý tưởng lớn."}, {"en": "She loved baking, and her friends always said her cakes were better than the ones in the shops.", "vi": "Cô ấy yêu thích làm bánh, và bạn bè luôn bảo bánh của cô ngon hơn bánh ngoài tiệm."}, {"en": "So she decided to turn her hobby into a real business.", "vi": "Vì vậy cô quyết định biến sở thích của mình thành một việc kinh doanh thực sự."}, {"en": "First, she wrote a simple plan that explained what she wanted to sell and who her customers would be.", "vi": "Trước tiên, cô viết một bản kế hoạch đơn giản nêu rõ cô muốn bán gì và khách hàng của cô là ai."}, {"en": "Then she looked for money, because she didn't have enough savings to buy an oven and equipment.", "vi": "Sau đó cô đi tìm nguồn tiền, vì cô không có đủ tiền tiết kiệm để mua lò nướng và dụng cụ."}, {"en": "A bank gave her a small loan, and she promised to pay it back over three years.", "vi": "Một ngân hàng cho cô vay một khoản nhỏ, và cô hứa sẽ trả lại trong ba năm."}, {"en": "Her first shop was tiny, but the location was perfect, right next to a busy bus stop.", "vi": "Cửa tiệm đầu tiên của cô rất nhỏ, nhưng vị trí thì hoàn hảo, ngay cạnh một trạm xe buýt đông đúc."}, {"en": "In the beginning, she worked from six in the morning until late at night.", "vi": "Thời gian đầu, cô làm việc từ sáu giờ sáng đến tận khuya."}, {"en": "She also advertised her cakes online, which was cheap and brought her many new customers.", "vi": "Cô cũng quảng cáo bánh trên mạng, cách này rẻ và mang đến cho cô nhiều khách mới."}, {"en": "Of course, there were problems: some days nobody came in, and the price of flour went up twice.", "vi": "Tất nhiên cũng có khó khăn: có ngày chẳng ai ghé vào, và giá bột mì tăng lên hai lần."}, {"en": "However, Maria didn't give up because she believed in her product.", "vi": "Tuy vậy, Maria không bỏ cuộc vì cô tin vào sản phẩm của mình."}, {"en": "She has run the shop for two years now, and it's finally making a profit.", "vi": "Cô đã điều hành tiệm được hai năm rồi, và cuối cùng nó cũng bắt đầu có lãi."}, {"en": "She has also hired two employees, so she doesn't have to work every single day any more.", "vi": "Cô cũng đã thuê hai nhân viên nên không còn phải làm việc mỗi ngày nữa."}, {"en": "Running a business is risky, and many new companies close in the first year.", "vi": "Kinh doanh là việc nhiều rủi ro, và nhiều công ty mới đóng cửa ngay trong năm đầu."}, {"en": "But if you prepare carefully and keep learning from your mistakes, you can succeed.", "vi": "Nhưng nếu bạn chuẩn bị kỹ và luôn học hỏi từ sai lầm của mình, bạn có thể thành công."}], "dialogue": [{"who": "Ben", "g": "m", "en": "Maria, can I ask you something? I've been thinking about opening a food truck.", "vi": "Maria ơi, mình hỏi bạn chút được không? Dạo này mình cứ nghĩ đến việc mở một xe bán đồ ăn lưu động."}, {"who": "Maria", "g": "f", "en": "That's great, Ben! Have you made a plan yet?", "vi": "Hay quá Ben! Bạn đã lập kế hoạch chưa?"}, {"who": "Ben", "g": "m", "en": "Not really. I've only told my sister so far. I don't know where to begin.", "vi": "Chưa thật sự. Đến giờ mình mới chỉ nói với chị gái. Mình không biết bắt đầu từ đâu."}, {"who": "Priya", "g": "f", "en": "Start with the numbers. How much will the truck cost, and how many customers do you need every day?", "vi": "Bắt đầu bằng các con số. Chiếc xe tốn bao nhiêu, và mỗi ngày bạn cần bao nhiêu khách?"}, {"who": "Ben", "g": "m", "en": "Well, a second-hand truck costs about fifteen thousand dollars. I'm not sure I have enough money.", "vi": "Ừm, một chiếc xe cũ khoảng mười lăm nghìn đô. Mình không chắc mình đủ tiền."}, {"who": "Maria", "g": "f", "en": "Most people don't. I took out a loan from the bank, and it was stressful, but it worked out.", "vi": "Hầu hết mọi người đều không đủ. Mình vay ngân hàng, và tuy áp lực nhưng cuối cùng mọi chuyện ổn."}, {"who": "Priya", "g": "f", "en": "You could also ask your family to invest a little. Just make sure everything is written down.", "vi": "Bạn cũng có thể nhờ gia đình góp vốn một ít. Nhưng nhớ ghi lại mọi thứ ra giấy."}, {"who": "Ben", "g": "m", "en": "Good idea. What about prices? I don't want to charge too much, but I need to make a profit.", "vi": "Ý hay đấy. Còn giá cả thì sao? Mình không muốn bán quá đắt, nhưng mình cần có lãi."}, {"who": "Maria", "g": "f", "en": "Check what other stalls charge. If your food is better, people will pay a little more.", "vi": "Xem các quầy khác bán giá bao nhiêu. Nếu đồ ăn của bạn ngon hơn, người ta sẽ trả cao hơn một chút."}, {"who": "Priya", "g": "f", "en": "And don't forget to advertise. I follow three food trucks on social media, and I visit them all the time.", "vi": "Và đừng quên quảng cáo nhé. Mình theo dõi ba xe đồ ăn trên mạng xã hội và lúc nào cũng ghé họ."}, {"who": "Ben", "g": "m", "en": "That's smart. Do I need to hire anyone at the beginning?", "vi": "Khôn đấy. Lúc đầu mình có cần thuê ai không?"}, {"who": "Maria", "g": "f", "en": "Not at first. You can do it alone, but you'll be too tired after a few months.", "vi": "Lúc đầu thì không. Bạn có thể tự làm, nhưng sau vài tháng bạn sẽ quá mệt."}, {"who": "Priya", "g": "f", "en": "Right. Then you can hire one employee for the busy hours.", "vi": "Đúng vậy. Khi đó bạn có thể thuê một nhân viên cho giờ cao điểm."}, {"who": "Ben", "g": "m", "en": "Honestly, I'm a bit scared. What if nobody comes?", "vi": "Thật lòng thì mình hơi sợ. Lỡ không ai đến thì sao?"}, {"who": "Maria", "g": "f", "en": "Every business has some risk, Ben. But you've already done the hardest part, which is deciding to try.", "vi": "Kinh doanh nào cũng có rủi ro, Ben ạ. Nhưng bạn đã làm xong phần khó nhất rồi, đó là quyết định thử."}, {"who": "Priya", "g": "f", "en": "Come to my place on Saturday. We'll write your plan together.", "vi": "Thứ Bảy đến nhà mình nhé. Tụi mình sẽ cùng viết kế hoạch cho bạn."}], "vocab": [{"w": "business", "f": ["business"], "pos": "n", "ipa": "ˈbɪznəs", "vi": "việc kinh doanh; doanh nghiệp", "ex": "She runs a small business selling handmade soap.", "exVi": "Cô ấy điều hành một việc kinh doanh nhỏ bán xà phòng thủ công."}, {"w": "customer", "f": ["customer", "customers"], "pos": "n", "ipa": "ˈkʌstəmər", "vi": "khách hàng", "ex": "The customer asked for a refund.", "exVi": "Vị khách đó yêu cầu hoàn tiền."}, {"w": "loan", "f": ["loan"], "pos": "n", "ipa": "loʊn", "vi": "khoản vay", "ex": "He needs a loan to buy a car.", "exVi": "Anh ấy cần một khoản vay để mua xe."}, {"w": "profit", "f": ["profit"], "pos": "n", "ipa": "ˈprɑːfɪt", "vi": "lợi nhuận, tiền lãi", "ex": "The company made a profit of two million dollars.", "exVi": "Công ty đã có lợi nhuận hai triệu đô la."}, {"w": "employee", "f": ["employee", "employees"], "pos": "n", "ipa": "ɪmˈplɔɪiː", "vi": "nhân viên", "ex": "The company has more than fifty employees.", "exVi": "Công ty có hơn năm mươi nhân viên."}, {"w": "advertise", "f": ["advertise", "advertised"], "pos": "v", "ipa": "ˈædvərtaɪz", "vi": "quảng cáo", "ex": "They advertise their products on television.", "exVi": "Họ quảng cáo sản phẩm của mình trên truyền hình."}, {"w": "risk", "f": ["risk"], "pos": "n", "ipa": "rɪsk", "vi": "rủi ro", "ex": "There is always a risk when you invest money.", "exVi": "Luôn có rủi ro khi bạn đầu tư tiền."}, {"w": "savings", "f": ["savings"], "pos": "n", "ipa": "ˈseɪvɪŋz", "vi": "tiền tiết kiệm", "ex": "I used my savings to pay for the course.", "exVi": "Tôi dùng tiền tiết kiệm để trả học phí khóa học."}, {"w": "invest", "f": ["invest"], "pos": "v", "ipa": "ɪnˈvest", "vi": "đầu tư", "ex": "He invested in a small coffee farm.", "exVi": "Anh ấy đầu tư vào một trang trại cà phê nhỏ."}, {"w": "location", "f": ["location"], "pos": "n", "ipa": "loʊˈkeɪʃn", "vi": "vị trí, địa điểm", "ex": "The hotel has a great location near the beach.", "exVi": "Khách sạn có vị trí tuyệt vời gần bãi biển."}, {"w": "product", "f": ["product"], "pos": "n", "ipa": "ˈprɑːdʌkt", "vi": "sản phẩm", "ex": "Their new product is selling very well.", "exVi": "Sản phẩm mới của họ đang bán rất chạy."}, {"w": "hire", "f": ["hire", "hired"], "pos": "v", "ipa": "ˈhaɪər", "vi": "thuê (nhân viên)", "ex": "We need to hire someone with experience.", "exVi": "Chúng tôi cần thuê một người có kinh nghiệm."}], "grammar": [{"title": "Thì hiện tại hoàn thành (Present perfect)", "formula": "S + have / has + quá khứ phân từ (V3)", "use": "Dùng cho việc bắt đầu trong quá khứ và còn liên quan đến hiện tại (đi với for, since), kinh nghiệm sống (ever, never) và việc vừa xảy ra (just, already, yet). Không dùng với mốc thời gian đã qua như “last year”.", "examples": [{"en": "I've lived in this city for five years.", "vi": "Tôi đã sống ở thành phố này được năm năm."}, {"en": "Have you ever tried Vietnamese coffee?", "vi": "Bạn đã bao giờ thử cà phê Việt Nam chưa?"}, {"en": "She hasn't called me since Monday.", "vi": "Cô ấy chưa gọi cho tôi từ hôm thứ Hai."}]}, {"title": "Enough và too", "formula": "adj + enough (+ to V)  |  enough + danh từ  |  too + adj (+ to V)", "use": "“Enough” nghĩa là đủ: đứng sau tính từ, đứng trước danh từ. “Too” nghĩa là quá (mang ý không tốt) và đứng trước tính từ. Không nói “too much good”, mà nói “very good”.", "examples": [{"en": "Is the water hot enough for tea?", "vi": "Nước đã đủ nóng để pha trà chưa?"}, {"en": "We don't have enough chairs for everyone.", "vi": "Chúng ta không có đủ ghế cho mọi người."}, {"en": "It's too cold to swim today.", "vi": "Hôm nay trời quá lạnh để bơi."}]}, {"title": "Have to và don’t have to", "formula": "S + have / has to + V  |  S + don’t / doesn’t have to + V", "use": "“Have to” diễn tả điều bắt buộc do hoàn cảnh hoặc quy định. “Don’t have to” nghĩa là không cần thiết (được phép không làm), khác với “mustn’t” là bị cấm. Câu hỏi dùng do/does.", "examples": [{"en": "I have to get up at six tomorrow.", "vi": "Ngày mai tôi phải dậy lúc sáu giờ."}, {"en": "You don't have to come if you're busy.", "vi": "Bạn không cần đến nếu bận."}, {"en": "Does she have to wear a uniform at work?", "vi": "Cô ấy có phải mặc đồng phục khi đi làm không?"}]}], "phrases": [{"p": "start from scratch", "vi": "bắt đầu lại từ con số không", "ex": "We had to start from scratch after the fire.", "exVi": "Sau vụ cháy, chúng tôi phải làm lại từ đầu.", "ctx": "Trung tính; dùng khi nói về việc làm lại hoặc xây dựng từ đầu."}, {"p": "turn a hobby into a business", "vi": "biến sở thích thành việc kinh doanh", "ex": "He turned his love of photography into a business.", "exVi": "Anh ấy biến niềm đam mê nhiếp ảnh thành một việc kinh doanh.", "ctx": "Trung tính; dùng khi kể chuyện hoặc khen ngợi ai đó."}, {"p": "take out a loan", "vi": "vay tiền (từ ngân hàng)", "ex": "They took out a loan to buy their first house.", "exVi": "Họ vay ngân hàng để mua căn nhà đầu tiên.", "ctx": "Trung tính đến hơi trang trọng; nói về tài chính."}, {"p": "break even", "vi": "hòa vốn (không lời không lỗ)", "ex": "We are not making money yet, but we are breaking even.", "exVi": "Chúng tôi chưa có lãi, nhưng đã hòa vốn.", "ctx": "Dùng trong công việc kinh doanh; nói với đồng nghiệp hoặc đối tác."}, {"p": "make a profit", "vi": "có lãi, kiếm được lợi nhuận", "ex": "The coffee shop made a profit for the first time last month.", "exVi": "Tháng trước, quán cà phê lần đầu tiên có lãi.", "ctx": "Trung tính; dùng cả khi nói chuyện lẫn khi viết."}, {"p": "word of mouth", "vi": "truyền miệng", "ex": "Most of our customers come by word of mouth.", "exVi": "Hầu hết khách của chúng tôi đến nhờ truyền miệng.", "ctx": "Trung tính; nói về cách quảng bá không tốn tiền."}, {"p": "give up", "vi": "bỏ cuộc, từ bỏ", "ex": "Don't give up. You're almost there.", "exVi": "Đừng bỏ cuộc. Bạn sắp tới rồi.", "ctx": "Thân mật; động viên bạn bè, đồng nghiệp."}, {"p": "run a business", "vi": "điều hành một việc kinh doanh", "ex": "My aunt runs a small bookshop near the station.", "exVi": "Dì tôi điều hành một hiệu sách nhỏ gần nhà ga.", "ctx": "Trung tính; dùng với run + business/shop/hotel."}, {"p": "pay back", "vi": "trả lại (tiền đã vay)", "ex": "I'll pay you back on Friday.", "exVi": "Thứ Sáu mình sẽ trả lại tiền cho bạn.", "ctx": "Thân mật; nói với bạn bè, người thân khi mượn tiền."}, {"p": "in the long run", "vi": "về lâu dài", "ex": "Cheap shoes can cost more in the long run.", "exVi": "Giày rẻ về lâu dài có thể tốn kém hơn.", "ctx": "Trung tính; dùng khi so sánh lợi hại giữa các lựa chọn."}, {"p": "be your own boss", "vi": "tự làm chủ (không phải làm thuê)", "ex": "I want to be my own boss one day.", "exVi": "Một ngày nào đó tôi muốn tự làm chủ.", "ctx": "Thân mật; nói về ước mơ nghề nghiệp."}, {"p": "keep an eye on", "vi": "để mắt tới, theo dõi", "ex": "Keep an eye on your spending this month.", "exVi": "Tháng này bạn hãy theo dõi chi tiêu của mình nhé.", "ctx": "Thân mật đến trung tính; dùng nhiều trong đời sống hằng ngày."}, {"p": "It's worth a try.", "vi": "Đáng để thử đấy.", "ex": "I'm not sure it will work, but it's worth a try.", "exVi": "Mình không chắc là sẽ được, nhưng đáng để thử.", "ctx": "Thân mật; dùng khi khuyên hoặc tự động viên mình."}, {"p": "The customer is always right.", "vi": "Khách hàng luôn đúng.", "ex": "In this shop, the customer is always right.", "exVi": "Ở cửa hàng này, khách hàng luôn đúng.", "ctx": "Câu nói quen thuộc trong bán hàng; nói với nhân viên hoặc chủ cửa hàng."}], "quiz": [{"title": "Lan mở tiệm trà sữa", "sentences": [{"t": "Lan (1)___ tea shops since she was a teenager.", "o": ["loves", "has loved", "loved"], "a": 1, "why": "“Since” + mốc thời gian, việc kéo dài đến hiện tại nên dùng hiện tại hoàn thành: has loved."}, {"t": "Last year, she (2)___ her office job and opened her own shop.", "o": ["quit", "has quit", "quits"], "a": 0, "why": "“Last year” là thời điểm quá khứ xác định nên dùng quá khứ đơn: quit."}, {"t": "She didn't have (3)___ money, so she took out a loan.", "o": ["enough", "too", "very"], "a": 0, "why": "“Enough + danh từ” nghĩa là đủ: không có đủ tiền."}, {"t": "The rent was (4)___ high on the first street she visited.", "o": ["too", "enough", "much"], "a": 0, "why": "“Too + tính từ” nghĩa là quá (không tốt): tiền thuê quá cao."}, {"t": "At first, she had to (5)___ every day from eight to ten.", "o": ["work", "works", "working"], "a": 0, "why": "Sau “have to” dùng động từ nguyên mẫu: work."}, {"t": "Now she has two (6)___, so she doesn't have to work on Sundays.", "o": ["employees", "loans", "risks"], "a": 0, "why": "Có nhân viên (employees) giúp việc thì chủ tiệm không cần làm Chủ nhật."}, {"t": "Her shop (7)___ a profit for six months now.", "o": ["makes", "is making", "has made"], "a": 2, "why": "“For six months now” chỉ khoảng thời gian kéo dài đến hiện tại: has made."}, {"t": "Lan says the best way to attract customers is to (8)___ online.", "o": ["advertise", "advertising", "advertises"], "a": 0, "why": "Sau “to” dùng động từ nguyên mẫu: to advertise (quảng cáo)."}]}, {"title": "Quán cà phê của Tom", "sentences": [{"t": "Last spring, Tom (1)___ to open a coffee shop because he wanted to be his own boss.", "o": ["decides", "decided", "deciding"], "a": 1, "why": "“Last spring” là quá khứ nên dùng quá khứ đơn: decided."}, {"t": "He has (2)___ as a barista for three years, so he knows the work well.", "o": ["worked", "work", "works"], "a": 0, "why": "Hiện tại hoàn thành: has + quá khứ phân từ (worked)."}, {"t": "The coffee shop is small, but it is big (3)___ for twenty customers.", "o": ["enough", "too", "very"], "a": 0, "why": "Tính từ + enough: đủ lớn."}, {"t": "The coffee machine was (4)___ expensive to buy new, so he bought a used one.", "o": ["too", "enough", "so"], "a": 0, "why": "“Too + tính từ + to + V” nghĩa là quá … để làm gì."}, {"t": "He doesn't (5)___ to pay for advertising because most people hear about the coffee shop by word of mouth.", "o": ["has", "have", "having"], "a": 1, "why": "“Doesn’t” + have to: sau doesn’t dùng động từ nguyên mẫu (have)."}, {"t": "Last month, the coffee shop made a small (6)___ for the first time.", "o": ["profit", "loan", "risk"], "a": 0, "why": "“Made a profit” là có lãi."}, {"t": "Tom knows that every new business (7)___ some risk.", "o": ["have", "has", "having"], "a": 1, "why": "Chủ ngữ số ít “every new business” đi với has."}, {"t": "He hasn't (8)___ a day off since the coffee shop opened.", "o": ["take", "took", "taken"], "a": 2, "why": "Hiện tại hoàn thành phủ định: hasn’t + quá khứ phân từ (taken)."}]}, {"title": "Cửa hàng online của Hoa", "sentences": [{"t": "Hoa sells handmade bags, and her (1)___ are very popular with young people.", "o": ["products", "profits", "loans"], "a": 0, "why": "“Products” là sản phẩm, hợp với “handmade bags”."}, {"t": "She started the business at home, so she didn't need to pay (2)___ for a shop.", "o": ["rent", "habit", "income"], "a": 0, "why": "Tiền thuê cửa hàng gọi là rent."}, {"t": "She put photos of her bags online to (3)___ her products.", "o": ["advertise", "invest", "hire"], "a": 0, "why": "Đăng ảnh lên mạng để quảng cáo sản phẩm: advertise."}, {"t": "Soon she had more (4)___ visiting her page than she expected.", "o": ["customers", "employees", "risks"], "a": 0, "why": "Người ghé xem trang để mua hàng là khách hàng (customers)."}, {"t": "She decided to (5)___ a friend to help her pack the orders.", "o": ["hire", "save", "spend"], "a": 0, "why": "“Hire” là thuê ai đó làm việc."}, {"t": "She has (6)___ most of her profit in new materials.", "o": ["invest", "invested", "investing"], "a": 1, "why": "Hiện tại hoàn thành: has + quá khứ phân từ (invested)."}, {"t": "Her business isn't big (7)___ to open a real shop yet.", "o": ["enough", "too", "very"], "a": 0, "why": "Tính từ + enough + to V: đủ lớn để…"}, {"t": "Hoa says that in the long (8)___, patience is more important than luck.", "o": ["run", "walk", "jump"], "a": 0, "why": "“In the long run” là cụm cố định: về lâu dài."}]}], "level": "B1"}, {"id": "B1-SOCIAL-003", "topic": "SOCIAL", "n": 3, "title": "How Government Works", "titleVi": "Chính phủ vận hành như thế nào", "passage": [{"en": "Every country has a government, which is the group of people who make decisions for the whole nation.", "vi": "Mỗi quốc gia đều có một chính phủ, tức là nhóm người đưa ra quyết định cho cả đất nước."}, {"en": "In many countries, citizens choose their leaders by voting in an election.", "vi": "Ở nhiều nước, công dân chọn người lãnh đạo bằng cách bỏ phiếu trong một cuộc bầu cử."}, {"en": "Before an election, candidates explain their ideas to the public in a campaign.", "vi": "Trước bầu cử, các ứng viên trình bày ý tưởng của mình với công chúng trong một chiến dịch vận động."}, {"en": "After the votes are counted, the person or party with enough support is given the responsibility to lead.", "vi": "Sau khi phiếu được kiểm, người hoặc đảng có đủ sự ủng hộ sẽ được giao trách nhiệm lãnh đạo."}, {"en": "Most governments have three main parts: one makes the laws, one carries them out, and one checks them in court.", "vi": "Hầu hết các chính phủ có ba bộ phận chính: một bộ phận làm ra luật, một bộ phận thực thi luật, và một bộ phận kiểm tra việc đó tại tòa án."}, {"en": "The part that makes the laws is often called parliament or congress.", "vi": "Bộ phận làm ra luật thường được gọi là quốc hội hoặc nghị viện."}, {"en": "Its members are chosen by voters, and they discuss new laws before they are approved.", "vi": "Các thành viên của nó do cử tri chọn ra, và họ thảo luận các luật mới trước khi được thông qua."}, {"en": "Another part, led by a president or a prime minister, is responsible for running the country every day.", "vi": "Một bộ phận khác, do tổng thống hoặc thủ tướng đứng đầu, chịu trách nhiệm điều hành đất nước mỗi ngày."}, {"en": "Ministers who are in charge of areas such as health, education and transport help with this work.", "vi": "Các bộ trưởng phụ trách những lĩnh vực như y tế, giáo dục và giao thông giúp thực hiện công việc này."}, {"en": "Their decisions are paid for mainly by taxes, which are collected from people and companies.", "vi": "Các quyết định của họ chủ yếu được chi trả bằng thuế, thứ được thu từ người dân và doanh nghiệp."}, {"en": "Judges and courts are the third part; they make sure that laws are applied fairly.", "vi": "Thẩm phán và tòa án là bộ phận thứ ba; họ bảo đảm luật được áp dụng công bằng."}, {"en": "This system is designed so that no single person has too much power.", "vi": "Hệ thống này được thiết kế để không một cá nhân nào có quá nhiều quyền lực."}, {"en": "Laws are usually changed slowly because many people must agree first.", "vi": "Luật thường được thay đổi chậm vì nhiều người phải đồng ý trước."}, {"en": "Some citizens join political groups, while others prefer to follow the news and vote.", "vi": "Một số công dân tham gia các nhóm chính trị, trong khi những người khác thích theo dõi tin tức và đi bầu."}, {"en": "Both ways help a country stay healthy, as long as people respect the rules and each other's opinions.", "vi": "Cả hai cách đều giúp đất nước lành mạnh, miễn là mọi người tôn trọng quy tắc và ý kiến của nhau."}, {"en": "Understanding how the system works is the first step to taking part in it.", "vi": "Hiểu hệ thống vận hành ra sao là bước đầu để tham gia vào nó."}], "dialogue": [{"who": "Ms. Hart", "g": "f", "en": "Okay, everyone, today we're going to talk about how decisions are made in our country. Who can tell me what a citizen is?", "vi": "Nào các em, hôm nay chúng ta sẽ nói về cách các quyết định được đưa ra ở đất nước mình. Ai cho cô biết công dân là gì nào?"}, {"who": "Danny", "g": "m", "en": "Is it just someone who lives in the country?", "vi": "Có phải chỉ là người sống trong nước không ạ?"}, {"who": "Ms. Hart", "g": "f", "en": "Almost. A citizen is a person who legally belongs to a country, and citizens usually have both rights and responsibilities.", "vi": "Gần đúng. Công dân là người thuộc về một quốc gia theo pháp luật, và công dân thường có cả quyền lẫn trách nhiệm."}, {"who": "Yuki", "g": "f", "en": "Like voting?", "vi": "Ví dụ như đi bầu cử ạ?"}, {"who": "Ms. Hart", "g": "f", "en": "Exactly. Voting is one of the most important rights, and in some countries it's also a duty.", "vi": "Chính xác. Bỏ phiếu là một trong những quyền quan trọng nhất, và ở một số nước nó còn là nghĩa vụ."}, {"who": "Danny", "g": "m", "en": "But how do we know who to vote for? I don't understand the difference between all the candidates.", "vi": "Nhưng làm sao biết nên bầu cho ai? Em không hiểu sự khác nhau giữa các ứng viên."}, {"who": "Ms. Hart", "g": "f", "en": "Good question. You can read about their plans, watch their debates, and compare what they promise.", "vi": "Câu hỏi hay. Các em có thể đọc kế hoạch của họ, xem các buổi tranh luận và so sánh những điều họ hứa."}, {"who": "Yuki", "g": "f", "en": "My mom always says we should check the facts before we believe a speech.", "vi": "Mẹ em lúc nào cũng nói phải kiểm tra sự thật trước khi tin một bài phát biểu."}, {"who": "Ms. Hart", "g": "f", "en": "She's right. Now, who pays for schools and hospitals? Anyone?", "vi": "Mẹ em nói đúng. Giờ thì, ai trả tiền cho trường học và bệnh viện? Có ai biết không?"}, {"who": "Danny", "g": "m", "en": "Taxes, right? My dad complains about them every month.", "vi": "Thuế đúng không ạ? Tháng nào bố em cũng than phiền về chuyện đó."}, {"who": "Ms. Hart", "g": "f", "en": "Ha, many people do. But taxes pay for roads, teachers and many other public services.", "vi": "Ha, nhiều người cũng vậy. Nhưng thuế trả cho đường sá, giáo viên và nhiều dịch vụ công khác."}, {"who": "Yuki", "g": "f", "en": "Who decides how the money is used?", "vi": "Vậy ai quyết định tiền được dùng như thế nào ạ?"}, {"who": "Ms. Hart", "g": "f", "en": "Usually the government proposes a budget, and then the parliament discusses it and votes on it.", "vi": "Thường thì chính phủ đề xuất một ngân sách, rồi quốc hội thảo luận và bỏ phiếu về nó."}, {"who": "Danny", "g": "m", "en": "So a lot of people are involved before anything changes.", "vi": "Vậy là có rất nhiều người tham gia trước khi có gì đó thay đổi."}, {"who": "Ms. Hart", "g": "f", "en": "Yes, and that's on purpose. It gives everyone time to think, and it protects us from sudden, careless decisions.", "vi": "Đúng vậy, và đó là có chủ đích. Nó cho mọi người thời gian suy nghĩ và bảo vệ chúng ta khỏi những quyết định vội vàng, thiếu cẩn trọng."}, {"who": "Yuki", "g": "f", "en": "That makes sense. Can we watch a real parliament meeting next week?", "vi": "Nghe hợp lý ạ. Tuần sau mình xem một buổi họp quốc hội thật được không ạ?"}, {"who": "Ms. Hart", "g": "f", "en": "Great idea. I'll find a video, and you'll have to write three questions about it.", "vi": "Ý hay đấy. Cô sẽ tìm một đoạn video, và các em sẽ phải viết ba câu hỏi về nó."}], "vocab": [{"w": "government", "f": ["government"], "pos": "n", "ipa": "ˈɡʌvərnmənt", "vi": "chính phủ", "ex": "The government announced a new plan to improve public transport.", "exVi": "Chính phủ công bố kế hoạch mới nhằm cải thiện giao thông công cộng."}, {"w": "election", "f": ["election"], "pos": "n", "ipa": "ɪˈlekʃn", "vi": "cuộc bầu cử", "ex": "The next election will be held in November.", "exVi": "Cuộc bầu cử tiếp theo sẽ được tổ chức vào tháng Mười Một."}, {"w": "vote", "f": ["vote", "votes", "voting", "voted"], "pos": "v", "ipa": "voʊt", "vi": "bỏ phiếu; lá phiếu", "ex": "The students voted on a name for the school newspaper.", "exVi": "Học sinh bỏ phiếu chọn tên cho tờ báo của trường."}, {"w": "citizen", "f": ["citizen", "citizens"], "pos": "n", "ipa": "ˈsɪtɪzn", "vi": "công dân", "ex": "She became a citizen of Canada in 2020.", "exVi": "Cô ấy trở thành công dân Canada vào năm 2020."}, {"w": "candidate", "f": ["candidate", "candidates"], "pos": "n", "ipa": "ˈkændɪdeɪt", "vi": "ứng viên", "ex": "All the candidates for the job were very qualified.", "exVi": "Tất cả các ứng viên cho vị trí này đều rất đủ năng lực."}, {"w": "law", "f": ["law", "laws"], "pos": "n", "ipa": "lɔː", "vi": "luật; pháp luật", "ex": "It is against the law to drive without a license.", "exVi": "Lái xe không có bằng là trái pháp luật."}, {"w": "tax", "f": ["tax", "taxes"], "pos": "n", "ipa": "tæks", "vi": "thuế", "ex": "You have to pay tax on the money you earn.", "exVi": "Bạn phải đóng thuế trên số tiền bạn kiếm được."}, {"w": "minister", "f": ["minister", "ministers"], "pos": "n", "ipa": "ˈmɪnɪstər", "vi": "bộ trưởng", "ex": "The minister of education visited our school.", "exVi": "Bộ trưởng giáo dục đã đến thăm trường chúng tôi."}, {"w": "campaign", "f": ["campaign"], "pos": "n", "ipa": "kæmˈpeɪn", "vi": "chiến dịch; cuộc vận động", "ex": "The campaign to save the local library was a success.", "exVi": "Chiến dịch cứu thư viện địa phương đã thành công."}, {"w": "court", "f": ["court", "courts"], "pos": "n", "ipa": "kɔːrt", "vi": "tòa án", "ex": "The case will be heard in court next week.", "exVi": "Vụ việc sẽ được xét xử tại tòa vào tuần sau."}, {"w": "parliament", "f": ["parliament"], "pos": "n", "ipa": "ˈpɑːrləmənt", "vi": "quốc hội; nghị viện", "ex": "The parliament building is open to visitors on weekends.", "exVi": "Tòa nhà quốc hội mở cửa cho khách tham quan vào cuối tuần."}, {"w": "responsibility", "f": ["responsibility", "responsibilities"], "pos": "n", "ipa": "rɪˌspɑːnsəˈbɪləti", "vi": "trách nhiệm", "ex": "Taking care of a pet is a big responsibility.", "exVi": "Chăm sóc thú cưng là một trách nhiệm lớn."}], "grammar": [{"title": "Câu bị động ở hiện tại đơn (Passive)", "formula": "S + am / is / are + quá khứ phân từ (V3) (+ by …)", "use": "Dùng khi người hoặc vật chịu tác động quan trọng hơn người thực hiện, hoặc khi không cần/không biết ai làm. Chỉ thêm “by + người làm” khi thông tin đó thật sự cần thiết.", "examples": [{"en": "English is spoken in many countries.", "vi": "Tiếng Anh được nói ở nhiều nước."}, {"en": "The rubbish is collected every Monday.", "vi": "Rác được thu gom vào mỗi thứ Hai."}, {"en": "These shoes are made in Vietnam.", "vi": "Những đôi giày này được làm ở Việt Nam."}]}, {"title": "Mệnh đề quan hệ (who, which, that)", "formula": "danh từ chỉ người + who + …  |  danh từ chỉ vật + which / that + …", "use": "Dùng để thêm thông tin cho danh từ đứng trước. “Who” dùng cho người, “which” cho vật, “that” dùng được cho cả hai trong mệnh đề xác định (không có dấu phẩy). Mệnh đề có dấu phẩy chỉ thêm thông tin phụ và không dùng “that”.", "examples": [{"en": "The woman who lives next door is a nurse.", "vi": "Người phụ nữ sống ở nhà bên là y tá."}, {"en": "This is the book that I told you about.", "vi": "Đây là cuốn sách mà tôi đã kể với bạn."}, {"en": "I bought a new phone, which was on sale.", "vi": "Tôi mua một chiếc điện thoại mới, và nó đang giảm giá."}]}, {"title": "As long as (miễn là)", "formula": "As long as + mệnh đề (hiện tại), mệnh đề chính", "use": "“As long as” nghĩa là “miễn là, với điều kiện là”. Sau nó dùng thì hiện tại đơn dù nói về tương lai. Có thể đứng đầu hoặc giữa câu.", "examples": [{"en": "You can borrow my car as long as you drive carefully.", "vi": "Bạn có thể mượn xe của tôi miễn là bạn lái cẩn thận."}, {"en": "As long as it doesn't rain, we'll have the picnic.", "vi": "Miễn là trời không mưa, chúng ta sẽ đi picnic."}, {"en": "I don't mind waiting as long as you call me.", "vi": "Tôi không ngại chờ miễn là bạn gọi cho tôi."}]}], "phrases": [{"p": "run for office", "vi": "ra ứng cử (vào một chức vụ)", "ex": "She is running for office in the next city election.", "exVi": "Cô ấy sẽ ra ứng cử trong cuộc bầu cử thành phố tới.", "ctx": "Trung tính; dùng khi nói về bầu cử, kể cả ở cấp trường hoặc địa phương."}, {"p": "cast your vote", "vi": "bỏ phiếu", "ex": "Please remember to cast your vote on Sunday.", "exVi": "Nhớ đi bỏ phiếu vào Chủ nhật nhé.", "ctx": "Hơi trang trọng; dùng khi nói về bầu cử."}, {"p": "take part in", "vi": "tham gia vào", "ex": "Everyone is welcome to take part in the discussion.", "exVi": "Mọi người đều được chào đón tham gia buổi thảo luận.", "ctx": "Trung tính; dùng được ở mọi hoàn cảnh."}, {"p": "have a say", "vi": "có tiếng nói, có quyền nêu ý kiến", "ex": "Young people should have a say in these decisions.", "exVi": "Người trẻ nên có tiếng nói trong những quyết định này.", "ctx": "Trung tính; thường dùng khi nói về quyền tham gia quyết định."}, {"p": "public opinion", "vi": "dư luận, ý kiến của công chúng", "ex": "Public opinion changed quickly after the news.", "exVi": "Dư luận thay đổi nhanh sau tin tức đó.", "ctx": "Trang trọng đến trung tính; hay gặp trong báo chí."}, {"p": "pass a law", "vi": "thông qua một đạo luật", "ex": "The parliament passed a law to protect old forests.", "exVi": "Quốc hội đã thông qua luật bảo vệ các khu rừng già.", "ctx": "Trang trọng; hay gặp trong tin tức."}, {"p": "be in favor of", "vi": "ủng hộ", "ex": "Most people are in favor of the new bike lanes.", "exVi": "Hầu hết mọi người ủng hộ các làn đường xe đạp mới.", "ctx": "Trung tính; nói khi bày tỏ quan điểm một cách lịch sự."}, {"p": "come into effect", "vi": "có hiệu lực", "ex": "The new rule comes into effect next month.", "exVi": "Quy định mới sẽ có hiệu lực vào tháng sau.", "ctx": "Trang trọng; dùng với luật, quy định, chính sách."}, {"p": "pay taxes", "vi": "đóng thuế", "ex": "Everyone who earns money has to pay taxes.", "exVi": "Ai có thu nhập đều phải đóng thuế.", "ctx": "Trung tính; nói về nghĩa vụ công dân."}, {"p": "a matter of opinion", "vi": "chuyện của quan điểm (mỗi người nghĩ một kiểu)", "ex": "Whether the film is good is a matter of opinion.", "exVi": "Bộ phim hay hay dở là tùy quan điểm mỗi người.", "ctx": "Thân mật đến trung tính; dùng để nhẹ nhàng khép lại một tranh luận."}, {"p": "keep up with the news", "vi": "cập nhật tin tức", "ex": "I try to keep up with the news every morning.", "exVi": "Sáng nào tôi cũng cố cập nhật tin tức.", "ctx": "Thân mật đến trung tính; nói về thói quen đọc tin."}, {"p": "agree to disagree", "vi": "đồng ý là mỗi người một ý (tôn trọng khác biệt)", "ex": "We see it differently, so let's agree to disagree.", "exVi": "Tụi mình nhìn khác nhau, nên cứ tôn trọng quan điểm của nhau nhé.", "ctx": "Lịch sự; dùng để kết thúc tranh luận một cách hòa nhã."}, {"p": "hold an election", "vi": "tổ chức bầu cử", "ex": "The town holds an election every four years.", "exVi": "Thị trấn tổ chức bầu cử bốn năm một lần.", "ctx": "Trang trọng; dùng khi nói về quy trình bầu cử."}], "quiz": [{"title": "Bầu cử ở thị trấn nhỏ", "sentences": [{"t": "Every four years, a new mayor (1)___ by the people of the town.", "o": ["choose", "is chosen", "chooses"], "a": 1, "why": "Câu bị động: is + quá khứ phân từ (chosen)."}, {"t": "The election (2)___ in the school gym.", "o": ["holds", "is held", "hold"], "a": 1, "why": "Cuộc bầu cử “được tổ chức”, nên dùng bị động: is held."}, {"t": "Voters (3)___ a card with the names of the candidates.", "o": ["give", "are given", "gives"], "a": 1, "why": "Cử tri “được phát” một tấm thẻ: are given (bị động, số nhiều)."}, {"t": "Then they mark their choice and put the card in a box (4)___ is guarded by two officials.", "o": ["who", "which", "whose"], "a": 1, "why": "Danh từ chỉ vật (a box) đi với which."}, {"t": "The votes (5)___ in the evening.", "o": ["count", "are counted", "counting"], "a": 1, "why": "Phiếu “được kiểm”: are counted."}, {"t": "The candidate (6)___ wins the most votes becomes mayor.", "o": ["which", "who", "whose"], "a": 1, "why": "Danh từ chỉ người (the candidate) đi với who."}, {"t": "The new mayor can make changes (7)___ the council agrees.", "o": ["as long as", "because of", "instead of"], "a": 0, "why": "“As long as” nghĩa là miễn là (điều kiện)."}, {"t": "Citizens can (8)___ the mayor's work by reading the local news.", "o": ["follow", "followed", "following"], "a": 0, "why": "Sau “can” dùng động từ nguyên mẫu: follow."}]}, {"title": "Thuế và dịch vụ công", "sentences": [{"t": "Every worker has to pay (1)___ from their salary.", "o": ["taxes", "elections", "campaigns"], "a": 0, "why": "Thuế trừ từ lương gọi là taxes."}, {"t": "This money (2)___ to build roads and hospitals.", "o": ["uses", "is used", "using"], "a": 1, "why": "Tiền “được dùng” để xây đường, nên dùng bị động: is used."}, {"t": "The (3)___ decides how much money each area receives.", "o": ["government", "citizen", "vote"], "a": 0, "why": "Chính phủ (government) quyết định phân bổ tiền."}, {"t": "A (4)___ is a person who is in charge of one area, such as education.", "o": ["minister", "court", "law"], "a": 0, "why": "Bộ trưởng (minister) phụ trách một lĩnh vực."}, {"t": "The parliament discusses the plan, and then its members (5)___ on it.", "o": ["vote", "voting", "votes"], "a": 0, "why": "Chủ ngữ số nhiều “members” nên dùng vote."}, {"t": "People who disagree can say so, (6)___ they respect others.", "o": ["as long as", "as well", "as if"], "a": 0, "why": "“As long as” nghĩa là miễn là."}, {"t": "Laws (7)___ slowly because many people must agree first.", "o": ["change", "are changed", "changing"], "a": 1, "why": "Luật “được thay đổi”: are changed (bị động)."}, {"t": "Everyone has a (8)___ to follow the law.", "o": ["responsibility", "campaign", "minister"], "a": 0, "why": "“Responsibility” là trách nhiệm."}]}, {"title": "Kim theo dõi tin tức", "sentences": [{"t": "Kim is a young (1)___ who wants to understand politics.", "o": ["citizen", "court", "tax"], "a": 0, "why": "Người thì dùng citizen (công dân)."}, {"t": "She tries to (2)___ the news every morning.", "o": ["keep up with", "run for", "give up"], "a": 0, "why": "“Keep up with the news” là cập nhật tin tức."}, {"t": "Last week she went to a public meeting and (3)___ a question about the cost.", "o": ["asks", "asked", "has asked"], "a": 1, "why": "“Last week” là quá khứ nên dùng quá khứ đơn: asked."}, {"t": "Most people at the meeting were (4)___ favor of the new park.", "o": ["in", "on", "at"], "a": 0, "why": "“In favor of” là ủng hộ."}, {"t": "Some others disagreed, but everyone listened politely, (5)___ is important.", "o": ["who", "which", "whose"], "a": 1, "why": "“Which” thay cho cả ý ở mệnh đề trước."}, {"t": "They could not agree on everything, so they decided to agree to (6)___.", "o": ["disagree", "agreement", "disagreed"], "a": 0, "why": "“Agree to disagree” là cụm cố định."}, {"t": "Kim thinks every citizen should (7)___ a say in how public money is spent.", "o": ["have", "has", "having"], "a": 0, "why": "Sau “should” dùng động từ nguyên mẫu: have."}, {"t": "She even wants to (8)___ for a seat on the city council one day.", "o": ["run", "runs", "running"], "a": 0, "why": "Sau “want to” dùng động từ nguyên mẫu: run (for)."}]}], "level": "B1"}, {"id": "B1-PHRASES-001", "topic": "PHRASES", "n": 1, "level": "B1", "type": "phrases", "title": "Common Phrases 1", "titleVi": "Cụm từ bản xứ hay dùng 1", "items": [{"en": "Keep your hair on.", "vi": "Bình tĩnh nào, đừng nóng.", "ctx": "Nói khi ai đó đang bực bội, giận dữ vô cớ."}, {"en": "Watch your mouth.", "vi": "Ăn nói cẩn thận đấy.", "ctx": "Cảnh báo ai đó đang nói năng hỗn láo, thô lỗ."}, {"en": "No muss, no fuss.", "vi": "Đơn giản, gọn gàng, không rắc rối.", "ctx": "Khen một việc được làm nhanh gọn, không phiền phức."}, {"en": "Get to the point.", "vi": "Vào thẳng vấn đề đi.", "ctx": "Giục ai đó đừng vòng vo, nói thẳng luôn."}, {"en": "It is what it is.", "vi": "Sự thể đã vậy rồi, đành chấp nhận thôi.", "ctx": "Dùng khi chuyện không hay đã xảy ra và không thay đổi được."}, {"en": "Give me a break.", "vi": "Thôi tha cho tôi đi / Đừng có mà...", "ctx": "Bày tỏ sự khó chịu, không tin những gì vừa nghe."}, {"en": "That is a piece of cake.", "vi": "Chuyện đó dễ ợt.", "ctx": "Nói việc gì đó rất dễ làm."}, {"en": "Break a leg!", "vi": "Chúc may mắn nhé!", "ctx": "Chúc ai đó trước khi họ biểu diễn, thi cử, phỏng vấn."}]}, {"id": "B1-SCIENCE-001", "topic": "SCIENCE", "n": 1, "level": "B1", "title": "Is There Life on Other Planets?", "titleVi": "Có sự sống trên hành tinh khác không?", "passage": [{"en": "On a clear night, if you look up, you can see thousands of stars in the sky.", "vi": "Vào một đêm trời quang, nếu ngước lên, bạn có thể thấy hàng ngàn ngôi sao trên bầu trời."}, {"en": "Scientists believe that many of those stars have planets moving around them, just like our sun.", "vi": "Các nhà khoa học tin rằng nhiều ngôi sao đó có các hành tinh quay quanh, giống như mặt trời của chúng ta."}, {"en": "That means the universe is home to billions and billions of planets.", "vi": "Điều đó có nghĩa là vũ trụ là nơi có hàng tỷ tỷ hành tinh."}, {"en": "So it is natural for people to ask: are we really alone?", "vi": "Vì vậy con người tự nhiên đặt câu hỏi: liệu chúng ta có thực sự cô đơn?"}, {"en": "For a planet to have life like ours, it usually needs liquid water and the right temperature.", "vi": "Để một hành tinh có sự sống giống chúng ta, nó thường cần có nước ở thể lỏng và nhiệt độ phù hợp."}, {"en": "Astronomers call this area around a star the 'habitable zone'.", "vi": "Các nhà thiên văn gọi khu vực này quanh một ngôi sao là 'vùng có thể sống được'."}, {"en": "Using powerful telescopes, scientists have already found thousands of planets outside our solar system.", "vi": "Dùng những kính thiên văn mạnh, các nhà khoa học đã tìm thấy hàng ngàn hành tinh bên ngoài hệ mặt trời của chúng ta."}, {"en": "A few of them sit right in the habitable zone of their star.", "vi": "Một vài trong số đó nằm ngay trong vùng có thể sống được của ngôi sao của chúng."}, {"en": "However, finding a planet is very different from finding actual life on it.", "vi": "Tuy nhiên, tìm ra một hành tinh rất khác với việc tìm ra sự sống thật sự trên đó."}, {"en": "Some scientists search for simple forms of life, like bacteria, instead of intelligent aliens.", "vi": "Một số nhà khoa học tìm kiếm các dạng sống đơn giản như vi khuẩn, thay vì người ngoài hành tinh thông minh."}, {"en": "Others study strange radio signals from deep space, hoping to find a message.", "vi": "Một số khác nghiên cứu các tín hiệu radio lạ từ không gian sâu thẳm, hy vọng tìm ra một thông điệp."}, {"en": "So far, no signal has ever been proven to come from an alien civilization.", "vi": "Cho đến nay, chưa tín hiệu nào được chứng minh là đến từ một nền văn minh ngoài hành tinh."}, {"en": "Still, the universe is so enormous that many scientists find it hard to believe Earth is unique.", "vi": "Tuy vậy, vũ trụ rộng lớn đến mức nhiều nhà khoa học thấy khó tin rằng Trái Đất là nơi duy nhất."}, {"en": "Movies often show aliens as dangerous monsters, but real scientists are usually more careful and curious than afraid.", "vi": "Phim ảnh thường mô tả người ngoài hành tinh như quái vật nguy hiểm, nhưng các nhà khoa học thật sự thường tò mò và thận trọng hơn là sợ hãi."}, {"en": "New space telescopes are being built right now to study these distant planets more closely.", "vi": "Những kính thiên văn không gian mới đang được chế tạo ngay lúc này để nghiên cứu các hành tinh xa xôi này kỹ hơn."}, {"en": "Maybe in our lifetime, we will finally get an answer to this ancient question.", "vi": "Có lẽ trong đời chúng ta, cuối cùng chúng ta sẽ có được câu trả lời cho câu hỏi ngàn đời này."}], "dialogue": [{"who": "Mia", "g": "f", "en": "Jake, do you actually believe aliens exist somewhere out there?", "vi": "Jake, cậu có thật sự tin là người ngoài hành tinh tồn tại ở đâu đó ngoài kia không?"}, {"who": "Jake", "g": "m", "en": "Honestly? Yeah. The universe is way too big for us to be the only ones.", "vi": "Thành thật thì có. Vũ trụ rộng lớn quá, không thể nào chỉ có mình chúng ta."}, {"who": "Mia", "g": "f", "en": "But we've never actually found any real proof, right?", "vi": "Nhưng chúng ta chưa từng tìm ra bằng chứng thật sự nào cả, đúng không?"}, {"who": "Jake", "g": "m", "en": "Not yet. Scientists have found lots of planets, though, and some look pretty promising.", "vi": "Chưa đâu. Nhưng các nhà khoa học đã tìm thấy nhiều hành tinh, và vài cái trông khá triển vọng."}, {"who": "Lily", "g": "f", "en": "I read that some of them are in the 'habitable zone'. What does that even mean?", "vi": "Mình đọc được là vài hành tinh nằm trong 'vùng có thể sống được'. Vậy đó nghĩa là gì?"}, {"who": "Jake", "g": "m", "en": "It just means the planet isn't too hot or too cold for water to stay liquid.", "vi": "Nghĩa là hành tinh đó không quá nóng cũng không quá lạnh để nước có thể ở thể lỏng."}, {"who": "Mia", "g": "f", "en": "So it could have oceans, like Earth?", "vi": "Vậy là nó có thể có đại dương, giống Trái Đất?"}, {"who": "Jake", "g": "m", "en": "Exactly. And where there's water, there might be life.", "vi": "Chính xác. Và ở đâu có nước, ở đó có thể có sự sống
